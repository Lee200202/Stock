name: daily-review-apply

# 雲端排程把明確錯誤的修正計畫推到分支 daily-review/apply-YYYYMMDD，這裡依序預覽、套用、讀回。
# 只走既有的修正工具（apply_notice_reason_fix／apply_source_review／apply_reviewed_points）：
# 先備份、引句逐字核對原稿、寫完讀回；不改成交事實、不動寄送帳本、不呼叫模型、不寄信。
# 管理者 2026/11/03：試行期提前結束；股名聽錯且身分確定時，排程可自行修正並記別名（pipeline/reviewed_aliases.json），
# 套用成功後這裡把新別名併進 main（只動那一個檔），並在複核紀錄標「已修正」；失敗就標「修正失敗」，郵件不再等。
on:
  push:
    branches: ['daily-review/apply-*']

permissions:
  contents: write   # 只用來把 pipeline/reviewed_aliases.json 的新別名併進 main

concurrency:
  group: regenerate-verified
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 預覽並套用當日修正計畫
        id: apply
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: offline
          BRANCH: ${{ github.ref_name }}
        run: |
          STAMP="${BRANCH#daily-review/apply-}"
          if ! [[ "$STAMP" =~ ^20[0-9]{6}$ ]]; then echo "分支名稱要是 daily-review/apply-YYYYMMDD"; exit 1; fi
          DAY="${STAMP:0:4}/${STAMP:4:2}/${STAMP:6:2}"
          if [[ "$STAMP" < "20261103" ]]; then echo "試行期已於 2026/11/03 結束；更早日期不套用：$DAY"; exit 1; fi
          TODAY=$(TZ=Asia/Taipei date +%Y%m%d)
          if [ "$STAMP" != "$TODAY" ]; then echo "只能修正當天：$DAY"; exit 1; fi
          PLAN="scripts/repairs/${DAY//\//-}-source-review.json"
          POINTS="scripts/repairs/${DAY//\//-}-points-review.json"
          NOTICE="scripts/repairs/${DAY//\//-}-notice-reason.json"
          if [ ! -f "$PLAN" ] && [ ! -f "$POINTS" ] && [ ! -f "$NOTICE" ]; then echo "沒有修正計畫"; exit 1; fi
          if [ -f "$NOTICE" ]; then
            python scripts/apply_notice_reason_fix.py --date "$DAY"
            python scripts/apply_notice_reason_fix.py --date "$DAY" --apply
          fi
          if [ -f "$PLAN" ]; then
            python scripts/apply_source_review.py --date "$DAY"
            python scripts/apply_source_review.py --date "$DAY" --apply
          fi
          if [ -f "$POINTS" ]; then
            python scripts/apply_reviewed_points.py --date "$DAY"
          fi
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - name: 複核紀錄標記已修正
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          REVIEW_LOG_ID: ${{ vars.REVIEW_LOG_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: offline
        run: |
          cd scripts/daily_review && python mark_fixed.py --date "$DAY"
      - name: 檢查並同步複核確認的別名到 main
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: offline
          BRANCH: ${{ github.ref_name }}
        run: |
          python scripts/daily_review/aliases.py check
          git fetch -q origin main
          if git diff --quiet origin/main HEAD -- pipeline/reviewed_aliases.json; then echo "沒有新別名"; exit 0; fi
          cp pipeline/reviewed_aliases.json /tmp/proposed.json
          git checkout -q -B alias-sync origin/main
          python scripts/daily_review/aliases.py merge pipeline/reviewed_aliases.json /tmp/proposed.json
          python scripts/daily_review/aliases.py check
          git config user.name "daily-review-apply"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/reviewed_aliases.json
          git commit -q -m "data(aliases): ${DAY} 複核確認的聽寫別名（來自 ${BRANCH}）"
          git push -q origin HEAD:main
      - name: 套用失敗時標記，郵件不再等
        if: failure() && steps.apply.outcome == 'failure'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          REVIEW_LOG_ID: ${{ vars.REVIEW_LOG_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: offline
          BRANCH: ${{ github.ref_name }}
        run: |
          STAMP="${BRANCH#daily-review/apply-}"
          cd scripts/daily_review && python mark_fixed.py --date "${STAMP:0:4}/${STAMP:4:2}/${STAMP:6:2}" --failed
