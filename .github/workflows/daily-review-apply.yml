name: daily-review-apply

# 雲端排程把明確錯誤的修正計畫推到分支 daily-review/apply-YYYYMMDD，這裡依序預覽、套用、讀回。
# 只走既有的修正工具（apply_notice_reason_fix／apply_source_review／apply_reviewed_points）：
# 先備份、引句逐字核對原稿、寫完讀回；不改成交事實、不動寄送帳本、不呼叫模型、不寄信。
# 管理者 2026/11/03：試行期提前結束；股名聽錯且身分確定時，排程自行修正當天並寫股名學習計畫（<日期>-name-memo.json），
# 套用成功後在複核紀錄標「已修正」、把股名寫進主資料「名稱判定紀錄」（來源＝複核，之後比對直接套用）；失敗就標「修正失敗」，郵件不再等。
on:
  push:
    # 雲端排程的工作階段若只能推 claude/ 開頭的分支，就用第二種名稱
    branches: ['daily-review/apply-*', 'claude/daily-review-apply-*']

permissions:
  contents: read

concurrency:
  group: regenerate-verified
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 預覽並套用當日修正計畫
        id: apply
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: offline
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          STAMP="${BRANCH##*apply-}"
          if ! [[ "$STAMP" =~ ^20[0-9]{6}$ ]]; then echo "分支名稱要是 daily-review/apply-YYYYMMDD 或 claude/daily-review-apply-YYYYMMDD"; exit 1; fi
          DAY="${STAMP:0:4}/${STAMP:4:2}/${STAMP:6:2}"
          if [[ "$STAMP" < "20261103" ]]; then echo "試行期已於 2026/11/03 結束；更早日期不套用：$DAY"; exit 1; fi
          TODAY=$(TZ=Asia/Taipei date +%Y%m%d)
          if [ "$STAMP" != "$TODAY" ]; then echo "只能修正當天：$DAY"; exit 1; fi
          PLAN="scripts/repairs/${DAY//\//-}-source-review.json"
          POINTS="scripts/repairs/${DAY//\//-}-points-review.json"
          NOTICE="scripts/repairs/${DAY//\//-}-notice-reason.json"
          MEMO="scripts/repairs/${DAY//\//-}-name-memo.json"
          if [ ! -f "$PLAN" ] && [ ! -f "$POINTS" ] && [ ! -f "$NOTICE" ] && [ ! -f "$MEMO" ]; then echo "沒有修正計畫"; exit 1; fi
          # 2026/11/06：同一天第二輪推到同一個分支時，只套用這次推送改到的計畫檔。
          # 前一輪已套用的舊計畫（例如上午的章節計畫）不再重套，免得蓋掉之後另外核對過的內容。
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            for F in PLAN POINTS NOTICE; do
              if [ -f "${!F}" ] && ! grep -qxF "${!F}" <<< "$CHANGED"; then echo "這次推送沒有改到 ${!F}，前一輪已套用，不重套"; printf -v "$F" '%s' "/nonexistent/${F}"; fi
            done
          fi
          # 2026/11/06：暫時性錯誤（備份鎖忙碌、網路、Apps Script 逾時）不馬上標修正失敗，150 秒後整組重試一次。
          # 每支工具寫入前都先核對最終狀態，已寫入的不會重寫；預覽沒過就不會套用（每一步都檢查結束代碼）。
          run_plans() {
            if [ -f "$NOTICE" ]; then
              python scripts/apply_notice_reason_fix.py --date "$DAY" || return 1
              python scripts/apply_notice_reason_fix.py --date "$DAY" --apply || return 1
            fi
            if [ -f "$PLAN" ]; then
              python scripts/apply_source_review.py --date "$DAY" || return 1
              python scripts/apply_source_review.py --date "$DAY" --apply || return 1
            fi
            if [ -f "$POINTS" ]; then
              python scripts/apply_reviewed_points.py --date "$DAY" || return 1
            fi
            return 0
          }
          if ! run_plans; then
            echo "第一次套用沒有完成，150 秒後整組重試一次"
            sleep 150
            run_plans
          fi
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - name: 複核紀錄標記已修正
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          REVIEW_LOG_ID: ${{ vars.REVIEW_LOG_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: offline
        run: |
          cd scripts/daily_review && python mark_fixed.py --date "$DAY"
      - name: 股名學習：確認的聽錯股名寫進名稱判定紀錄（來源＝複核）
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: offline
        run: |
          python scripts/daily_review/name_memo.py --date "$DAY"
          python scripts/daily_review/name_memo.py --date "$DAY" --apply
      - name: 套用失敗時標記，郵件不再等
        if: failure() && steps.apply.outcome == 'failure'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          REVIEW_LOG_ID: ${{ vars.REVIEW_LOG_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: offline
          BRANCH: ${{ github.ref_name }}
        run: |
          STAMP="${BRANCH##*apply-}"
          cd scripts/daily_review && python mark_fixed.py --date "${STAMP:0:4}/${STAMP:4:2}/${STAMP:6:2}" --failed
