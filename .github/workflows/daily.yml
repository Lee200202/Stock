name: daily-transcript-pipeline

# ------------------------------------------------------------------ #
# 排程設計：這是「輪詢」，不是「執行一次」。
#
# 11:30 直播還在進行，YouTube 的 VOD 尚未生成，NotebookLM 索引不到。
# 直播約 12:30 到 13:00 結束，YouTube 再花十幾分鐘轉檔，
# 所以逐字稿真正拿得到的時間點落在 13:00 到 14:00 之間，而且每天不一定。
#
# 過去的做法是塞很多個 cron 觸發點，指望每 10 分鐘各觸發一次。
# 但 GitHub 的 cron 是 best-effort，尖峰時段大量漏跑或延遲，
# 實際跑起來的次數遠少於預期（曾出現 12:30 才輪詢 2 次的情況）。
#
# 改法：cron 只需每 30 分鐘觸發一次，進到 pipeline.py 之後，
# 由程式自己每 3 分鐘敲一次門（內部輪詢循環），一個 job 敲約 25 分鐘就收尾，
# 交給下一次觸發接力。這樣輪詢次數由我們自己的程式精準控制，
# 不再受 GitHub 準點與否影響，也不會消耗過多 Actions 額度。
#
# cron 一律 UTC。台灣 = UTC + 8，全年固定，沒有日光節約。
# 台灣 11:30 = UTC 03:30。
#
# 讀工作紀錄時要記得這件事：GitHub 介面與日誌的時間戳全是 UTC，
# 而程式裡印的「台北時間」是 UTC+8。同一件事在兩處會差八小時，
# 例如日誌上的 03:54 就是台灣的 11:54，不是凌晨。
#
# 每個觸發點進來的第一件事是「探測」：只用 YouTube API 與試算表
# 判斷現在有沒有事情要做，不碰 NotebookLM、不呼叫 Gemini、不需要憑證。
# 直播進行中（台灣 12 點以前）或今日影片已處理完成的觸發點，
# 幾秒內就結束，不會再往下走。
# ------------------------------------------------------------------ #
on:
  schedule:
    - cron: '20,35,50 3 * * 1-5'   # 台灣 11:20 11:35 11:50
    - cron: '5,20,35,50 4 * * 1-5' # 台灣 12:05 12:20 12:35 12:50
    - cron: '5,20,35,50 5 * * 1-5' # 台灣 13:05 13:20 13:35 13:50
    - cron: '5,25,45 6 * * 1-5'    # 台灣 14:05 14:25 14:45
    - cron: '3 7 * * 1-5'          # 台灣 15:03　最後一次，此時才判定今日無影片

  workflow_dispatch:
    inputs:
      backfill:
        description: '設為 true 時，一次處理 2026 年起尚未完成的全部影片'
        required: false
        default: 'false'
      final:
        description: '設為 true 時使用長逾時（30 分鐘），適合手動補跑'
        required: false
        default: 'false'
      repair_codes:
        description: '只修代號待確認。不碰逐字稿、不呼叫 Gemini，幾十秒跑完'
        required: false
        default: 'false'
      fill_blanks:
        description: '逐一檢視影片清單，把缺原始或修飾後逐字稿的列補齊'
        required: false
        default: 'false'
      reclassify:
        description: '只讀操作紀錄，依理由摘錄的情緒把觀望類改寫成觀望不碰或觀望注意。不呼叫 Gemini，秒級完成'
        required: false
        default: 'false'
      reconcile:
        description: 'AI 整頓：判定產業並刪除、抽取張震明講的買入價並核對後寫回。用已存逐字稿，不重抓影片'
        required: false
        default: 'false'
      admin_job:
        description: '★後台工單★ 處理管理者從網站後台貼上的逐字稿。由後台按鈕自動觸發，通常不必手動勾'
        required: false
        default: 'false'
      fix_prices:
        description: '價位說明校對：修正方向矛盾（買入卻寫「255以上全部賣掉」）、非股價數字（241億）、概數（1400多）。用已存逐字稿'
        required: false
        default: 'false'
      full_fix:
        description: '★全面重整★ 把過去所有資料套用最新規則（補正代號、稽核與複審、價位校對、補日K、重算追蹤、重寫郵件）。由後台按鈕自動觸發，跑數小時，不碰逐字稿'
        required: false
        default: 'false'
      full_fix_scope:
        description: '全面重整的範圍（week 近一周 / month 近一個月 / all 全部歷史）。由後台的範圍選單自動帶入；真正決定範圍的是下游的狀態，這裡只是讓執行清單上看得出這一輪跑的是哪一種'
        required: false
        default: 'all'
      refresh_from:
        description: '刷新從哪一步開始（purge / gate / codes / fund / dailyk / tracker / perf）。留空＝從頭。由後台的「從這一步重跑」自動帶入'
        required: false
        default: ''
      refresh_site:
        description: '★跑完後立刻刷新網站★ 勾 true 網站馬上更新，不必等下個交易日。可與上面任一模式一起勾，也可單獨勾（只刷新不改資料）'
        required: false
        default: 'false'

# 同一時間只允許一個工作在跑，後來的排隊。內部循環讓單一 job 約 25 分鐘收尾，
# 30 分鐘的觸發間隔足夠讓前一個先結束，不會堆積。
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 內部輪詢循環一個 job 約 25 分鐘（TIME_BUDGET_SEC=1500）。
    # 30 分鐘 job 上限足夠，並避免卡死的工作長時間佔住 concurrency 佇列。
    #
    # 全面重整例外：它要把整段歷史一天一天跑過，一百多個交易日要好幾個小時。
    # 給 30 分鐘的話每次只前進一小段，得手動重按十幾次才跑得完。
    # 全面重整選「近一周」時只跑幾分鐘，選「全部歷史」才需要開到六小時。
    # 一律給六小時的話，卡住的工作也要等六小時才會被砍掉。
    timeout-minutes: ${{ github.event.inputs.full_fix != 'true' && 30 || (github.event.inputs.full_fix_scope == 'all' && 360 || 60) }}

    steps:
      - name: 記錄排程與實際執行時間
        run: |
          echo "排程設定：${{ github.event.schedule || '手動觸發' }} (UTC)"
          echo "實際執行：$(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M:%S') 台北時間"
          echo ""
          echo "若兩者差超過 30 分鐘，是 GitHub 排程佇列延遲，不是設定寫錯。"
          echo "官方文件明講排程是 best effort，尖峰時段延遲屬正常。"
          echo "本專案改用內部輪詢循環，不再依賴 cron 準點觸發很多次。"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          # 最原始、也最穩定的安裝方式：
          #   notebooklm-py 主程式 + browser 支援 + Chromium。
          # 認證走 storage_state（本機 notebooklm login 產生，貼進 Secret）。
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "notebooklm-py[browser]"
          python -m playwright install chromium

      # ------------------------------------------------------------------ #
      # 探測：現在到底有沒有事情要做
      #
      # 只用 YouTube API 與試算表判斷，不碰 NotebookLM、不呼叫 Gemini、
      # 不需要登入憑證，幾秒就跑完。沒事就讓後面所有步驟整批跳過。
      #
      # 為什麼值得多這一步：一天有十幾個觸發點，但直播要到台灣 13:00 過後
      # 才會生出 VOD，之前那些觸發全都是空跑，卻照樣還原憑證、啟動用戶端、
      # 消耗執行時間。憑證失效時，這些空跑還會一路報錯洗版。
      # 先探一次，就只在真的有影片可處理時才付出那些成本。
      # ------------------------------------------------------------------ #
      # 版本守衛。工作流程與 pipeline.py 必須是同一批更新的。
      # 只更新其中一個時，後面的步驟會用一個誤導性的訊息失敗
      # （例如探測步驟報「缺少 GEMINI_API_KEY」，讓人以為要去補 Secret，
      # 但真正的問題是 pipeline.py 還是舊版）。這一步把它講清楚。
      - name: 確認 pipeline.py 版本相符
        run: |
          if ! grep -q 'PIPELINE_FEATURES = "preflight,auth-rotation,lazy-gemini-key"' pipeline.py; then
            echo "::error::pipeline.py 版本過舊，缺少探測、憑證輪換、延後檢查金鑰這幾項功能。"
            echo ""
            echo "這個工作流程需要搭配同一批更新的 pipeline.py 才能運作。"
            echo "目前 repo 裡的 pipeline.py 還是舊版，請把最新版覆蓋上去後再推一次。"
            echo ""
            echo "常見的誤判：舊版會在載入時就硬性要求 GEMINI_API_KEY，"
            echo "而探測步驟刻意不帶那把金鑰（它用不到），於是報「缺少環境變數 GEMINI_API_KEY」。"
            echo "那個訊息會把人引導去補 Secret，但真正要做的是更新 pipeline.py。"
            exit 1
          fi
          echo "pipeline.py 版本相符"

      - name: 探測今天有沒有事情要做
        id: preflight
        env:
          PREFLIGHT: 'true'
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 手動模式的旗標也要帶進來，探測才認得出「這是人手動觸發的」，
          # 進而直接放行而不是套用每日排程那套判斷。
          BACKFILL: ${{ github.event.inputs.backfill }}
          FILL_BLANKS: ${{ github.event.inputs.fill_blanks }}
          FINAL_ATTEMPT: ${{ github.event.inputs.final }}
          REPAIR_CODES: ${{ github.event.inputs.repair_codes }}
          RECLASSIFY: ${{ github.event.inputs.reclassify }}
          RECONCILE: ${{ github.event.inputs.reconcile }}
          FIX_PRICES: ${{ github.event.inputs.fix_prices }}
          ADMIN_JOB: ${{ github.event.inputs.admin_job }}
          FULL_FIX: ${{ github.event.inputs.full_fix }}
          FULL_FIX_SCOPE: ${{ github.event.inputs.full_fix_scope }}
          REFRESH_FROM: ${{ github.event.inputs.refresh_from }}
          REFRESH_SITE: ${{ github.event.inputs.refresh_site }}
          # VOD 最早可能出現的台灣時間。這之前的觸發點一律跳過。
          VOD_EARLIEST_HOUR: '12'
        run: python pipeline.py

      - name: 沒事可做，本輪結束
        if: steps.preflight.outputs.has_work != 'true'
        run: |
          echo "探測結果：${{ steps.preflight.outputs.reason }}"
          echo "本輪不需要動用 NotebookLM 與 Gemini，直接結束。"

      - name: 還原 NotebookLM 登入狀態
        if: steps.preflight.outputs.has_work == 'true' 
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          # 認證只有一種：Google web session cookie，存在 storage_state.json。
          # 在本機執行 notebooklm login 完成一次性授權後，把
          #   ~/.notebooklm/profiles/default/storage_state.json
          # 的完整內容貼到 GitHub Secret NOTEBOOKLM_AUTH_JSON。
          # cookie 會被 Google 輪換，過期時就在本機重新 notebooklm login，再更新 Secret。
          mkdir -p ~/.notebooklm/profiles/default
          if [ -z "$NOTEBOOKLM_AUTH_JSON" ]; then
            echo "NOTEBOOKLM_AUTH_JSON 是空的。請在本機執行 notebooklm login，"
            echo "再把 ~/.notebooklm/profiles/default/storage_state.json 的完整內容"
            echo "貼到 GitHub Secret NOTEBOOKLM_AUTH_JSON。"
            exit 1
          fi
          printf '%s' "$NOTEBOOKLM_AUTH_JSON" > ~/.notebooklm/storage_state.json
          printf '%s' "$NOTEBOOKLM_AUTH_JSON" > ~/.notebooklm/profiles/default/storage_state.json
          echo "已寫入 storage_state"

          # cookie 到期預警。
          #
          # 過期是一定會發生的事，Google 會定期輪換 session cookie。問題在於
          # 現在只有「已經失效」才會知道，而那時當天的排程都已經白跑了。
          # storage_state.json 裡每個 cookie 都帶 expires（Unix 秒），
          # 取最早到期的那一個，就能在還沒壞之前先示警。
          python3 - <<'EOF'
          import json, os, time
          try:
              d = json.load(open(os.path.expanduser("~/.notebooklm/storage_state.json")))
          except Exception as e:
              print(f"::warning::讀不到 storage_state（{e}），略過到期檢查")
              raise SystemExit(0)

          exps = [c.get("expires", -1) for c in d.get("cookies", [])]
          exps = [e for e in exps if isinstance(e, (int, float)) and e > 0]
          if not exps:
              print("cookie 沒有到期資訊（session cookie），無法預警")
              raise SystemExit(0)

          soonest = min(exps)
          days = (soonest - time.time()) / 86400
          when = time.strftime("%Y-%m-%d %H:%M", time.localtime(soonest))
          print(f"最早到期的 cookie：{when}（約 {days:.1f} 天後）")
          if days < 0:
              print(f"::error::cookie 已於 {when} 過期，本次必定失敗。"
                    "請在本機重跑 notebooklm login 並更新 NOTEBOOKLM_AUTH_JSON。")
          elif days < 3:
              print(f"::warning::cookie 只剩 {days:.1f} 天到期（{when}）。"
                    "請盡快在本機重跑 notebooklm login 並更新 NOTEBOOKLM_AUTH_JSON，"
                    "否則接下來的排程會開始失敗。")
          EOF

      - name: 執行每日流程
        if: steps.preflight.outputs.has_work == 'true'
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          FINAL_ATTEMPT: ${{ github.event.inputs.final }}
          REPAIR_CODES: ${{ github.event.inputs.repair_codes }}
          FILL_BLANKS: ${{ github.event.inputs.fill_blanks }}
          RECLASSIFY: ${{ github.event.inputs.reclassify }}
          RECONCILE: ${{ github.event.inputs.reconcile }}
          FIX_PRICES: ${{ github.event.inputs.fix_prices }}
          ADMIN_JOB: ${{ github.event.inputs.admin_job }}
          FULL_FIX: ${{ github.event.inputs.full_fix }}
          FULL_FIX_SCOPE: ${{ github.event.inputs.full_fix_scope }}
          REFRESH_FROM: ${{ github.event.inputs.refresh_from }}
          # 跑完立刻刷新網站，不必等下游排程。需要下面兩個 Secret 才會動作。
          REFRESH_SITE: ${{ github.event.inputs.refresh_site }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: python pipeline.py
