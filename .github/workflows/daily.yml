name: daily-transcript-pipeline
run-name: ${{ inputs.sms_job_id != '' && format('會員簡訊 {0}', inputs.sms_job_id) || (inputs.admin_job == 'true' && '後台逐字稿' || '每日資料流程') }}

# ------------------------------------------------------------------ #
# 排程設計：這是「輪詢」，不是「執行一次」。
#
# 這條流程處理的是「逐字稿已經在試算表裡之後」的每一步：潤飾、擷取、
# 稽核、代號比對、寫入、撰稿、刷新。逐字稿本身由 transcript.yml 負責。
#
# 過去的做法是塞很多個 cron 觸發點，指望每 10 分鐘各觸發一次。
# 但 GitHub 的 cron 是 best-effort，尖峰時段大量漏跑或延遲，
# 實際跑起來的次數遠少於預期（曾出現 12:30 才輪詢 2 次的情況）。
#
# 改法：cron 只需每 30 分鐘觸發一次，進到 pipeline.py 之後，
# 由程式自己每 3 分鐘敲一次門（內部輪詢循環），一個 job 敲約 25 分鐘就收尾，
# 交給下一次觸發接力。這樣輪詢次數由我們自己的程式精準控制，
# 不再受 GitHub 準點與否影響，也不會消耗過多 Actions 額度。
#
# cron 一律 UTC。台灣 = UTC + 8，全年固定，沒有日光節約。
# 台灣 11:30 = UTC 03:30。
#
# 讀工作紀錄時要記得這件事：GitHub 介面與日誌的時間戳全是 UTC，
# 而程式裡印的「台北時間」是 UTC+8。同一件事在兩處會差八小時，
# 例如日誌上的 03:54 就是台灣的 11:54，不是凌晨。
#
# 每個觸發點進來的第一件事是「探測」：只用 YouTube API 與試算表
# 判斷現在有沒有事情要做，不呼叫 Gemini，幾秒就跑完。
# 直播進行中（台灣 12 點以前）或今日影片已處理完成的觸發點，
# 幾秒內就結束，不會再往下走。
# ------------------------------------------------------------------ #
on:
  schedule:
    - cron: '20,35,50 3 * * 1-5'   # 台灣 11:20 11:35 11:50
    - cron: '5,20,35,50 4 * * 1-5' # 台灣 12:05 12:20 12:35 12:50
    - cron: '5,20,35,50 5 * * 1-5' # 台灣 13:05 13:20 13:35 13:50
    # 收盤後補齊日K。這一輪不看影片、不呼叫 Gemini，只把日K快取補到最新。
    # 由 github.event.schedule 認出是這一條，傳 DAILYK_ONLY 給 pipeline。
    - cron: '45 5 * * 1-5'         # 台灣 13:45　收盤後補齊日K
    - cron: '5,25,45 6 * * 1-5'    # 台灣 14:05 14:25 14:45
    - cron: '3 7 * * 1-5'          # 台灣 15:03　最後一次，此時才判定今日無影片

  workflow_dispatch:
    inputs:
      backfill:
        description: '設為 true 時，一次處理 2026 年起尚未完成的全部影片'
        required: false
        default: 'false'
      final:
        description: '設為 true 時使用長逾時（30 分鐘），適合手動補跑'
        required: false
        default: 'false'
      repair_codes:
        description: '重跑代號比對：修代號待確認，也一併清掉查無此股的假代號。不碰逐字稿、不呼叫 Gemini'
        required: false
        default: 'false'
      fill_blanks:
        description: '逐一檢視影片清單，把缺原始或修飾後逐字稿的列補齊'
        required: false
        default: 'false'
      reclassify:
        description: '只讀操作紀錄，依理由摘錄的情緒把觀望類改寫成觀望不碰或觀望注意。不呼叫 Gemini，秒級完成'
        required: false
        default: 'false'
      reconcile:
        description: 'AI 整頓：判定產業並刪除、抽取張震明講的買入價並核對後寫回。用已存逐字稿，不重抓影片'
        required: false
        default: 'false'
      admin_job:
        description: '★後台工單★ 處理管理者從網站後台貼上的逐字稿。由後台按鈕自動觸發，通常不必手動勾'
        required: false
        default: 'false'
      fix_prices:
        description: '價位說明校對：修正方向矛盾（買入卻寫「255以上全部賣掉」）、非股價數字（241億）、概數（1400多）。用已存逐字稿'
        required: false
        default: 'false'
      full_fix:
        description: '★全面重整★ 把過去所有資料套用最新規則（補正代號、稽核與複審、價位校對、補日K、重算追蹤、重寫郵件）。由後台按鈕自動觸發，跑數小時，不碰逐字稿'
        required: false
        default: 'false'
      full_fix_scope:
        description: '全面重整／更新範圍：week (最近七日) / all (全部)'
        required: false
        default: 'week'
        type: choice
        options:
          - 'week'
          - 'all'
      refresh_from:
        description: '刷新從哪一步開始（purge / gate / codes / fund / dailyk / tracker / perf）。留空＝從頭。由後台的「從這一步重跑」自動帶入'
        required: false
        default: ''
      refresh_site:
        description: '★跑完後立刻刷新網站★ 勾 true 網站馬上更新，不必等下個交易日。可與上面任一模式一起勾，也可單獨勾（只刷新不改資料）'
        required: false
        default: 'false'
      sms_priority:
        description: '★簡訊優先重整★ 把「同一天同一檔，會員簡訊蓋過逐字稿」套用到全部歷史，並把「成本之上」換算成實際買入價。不呼叫 Gemini，秒級完成'
        required: false
        default: 'false'
      check_keys:
        description: '★金鑰健檢★ 查模型清單並實際生成短回覆，會消耗少量生成配額；檢查名稱、權限與正式請求格式'
        required: false
        default: 'false'
      parse_sms:
        description: '★解析會員簡訊★ 處理「會員簡訊」分頁中待解析的簡訊。由後台按鈕自動觸發，也可手動勾'
        required: false
        default: 'false'
      sms_since:
        description: '會員簡訊重新解析起始日期（YYYY/MM/DD，留空則只處理待解析）'
        required: false
        default: ''
      sms_mode:
        description: '會員簡訊工作：today（只更新當天）/ blanks（只補過去空白的收錄個股）/ merge（併入過去資料）/ recent / all / ids / reparse（強制重判，最耗配額）'
        required: false
        default: ''
      sms_ids:
        description: '依編號補抓的文章 ID，逗號分隔'
        required: false
        default: ''
      sms_job_id:
        description: '後台產生的會員簡訊工單 ID，用於進度與逐日稽核'
        required: false
        default: ''
      sms_resume:
        description: '配額恢復後續跑：true 時只處理未完成列並沿用逐篇檢查點'
        required: false
        default: 'false'
      sms_member_id:
        description: '公開來源帳號 ID，由 Apps Script 後台自動帶入'
        required: false
        default: ''

# 同一時間只允許一個工作在跑，後來的排隊。內部循環讓單一 job 約 25 分鐘收尾，
# 30 分鐘的觸發間隔足夠讓前一個先結束，不會堆積。
# 13:45 補齊日K那一條另開一組，不跟影片／後台工單排同一條隊。
# GitHub 同一組只留一個「等待中」的執行，後來的會把它取代掉：
# 若 13:45 剛好有工單在跑，補日K會在排隊時被 13:50 那一輪頂掉，當天就沒補。
# 分開之後它立刻開跑；補日K只寫日K快取（Apps Script 端有鎖），與影片流程互不干擾。
concurrency:
  group: ${{ github.event.schedule == '45 5 * * 1-5' && 'daily-dailyk' || 'daily-pipeline' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 內部輪詢循環一個 job 約 25 分鐘（TIME_BUDGET_SEC=1500）。
    # 30 分鐘 job 上限足夠，並避免卡死的工作長時間佔住 concurrency 佇列。
    #
    # 全面重整例外：它要把整段歷史一天一天跑過，一百多個交易日要好幾個小時。
    # 給 30 分鐘的話每次只前進一小段，得手動重按十幾次才跑得完。
    # 全面重整選「近一周」時只跑幾分鐘，選「全部歷史」才需要開到六小時。
    # 一律給六小時的話，卡住的工作也要等六小時才會被砍掉。
    timeout-minutes: ${{ github.event.inputs.full_fix != 'true' && 30 || (github.event.inputs.full_fix_scope == 'all' && 360 || 60) }}

    steps:
      - name: 記錄排程與實際執行時間
        run: |
          echo "排程設定：${{ github.event.schedule || '手動觸發' }} (UTC)"
          echo "實際執行：$(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M:%S') 台北時間"
          echo ""
          echo "若兩者差超過 30 分鐘，是 GitHub 排程佇列延遲，不是設定寫錯。"
          echo "官方文件明講排程是 best effort，尖峰時段延遲屬正常。"
          echo "本專案改用內部輪詢循環，不再依賴 cron 準點觸發很多次。"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          # 只裝 requirements.txt。
          #
          # 這條流程只讀試算表既有的逐字稿，不抓影片、不需要瀏覽器，
          # 所以幾個純 Python 套件就夠，十幾秒裝完。
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "pipeline/requirements.txt" ]; then
            pip install -r pipeline/requirements.txt
          fi

      # ------------------------------------------------------------------ #
      # 探測：現在到底有沒有事情要做
      #
      # 只用 YouTube API 與試算表判斷，不呼叫 Gemini，幾秒就跑完。
      # 沒事就讓後面所有步驟整批跳過。
      #
      # 為什麼值得多這一步：一天有十幾個觸發點，多數時候逐字稿還沒進來，
      # 那些觸發全是空跑。先探一次，就只在真的有資料可處理時才往下走。
      # ------------------------------------------------------------------ #
      # 版本守衛。工作流程與 pipeline.py 必須是同一批更新的。
      # 只更新其中一個時，後面的步驟會用一個誤導性的訊息失敗
      # （例如探測步驟報「缺少 GEMINI_API_KEY」，讓人以為要去補 Secret，
      # 但真正的問題是 pipeline.py 還是舊版）。這一步把它講清楚。
      - name: 確認 pipeline.py 版本相符
        run: |
          if [ -f "pipeline.py" ]; then
            PIPELINE_SCRIPT="pipeline.py"
          elif [ -f "pipeline/pipeline.py" ]; then
            PIPELINE_SCRIPT="pipeline/pipeline.py"
          else
            echo "::error::找不到 pipeline.py！請確認 pipeline.py 位於根目錄或 pipeline/ 目錄下。"
            exit 1
          fi

          if [ -f pipeline.py ] && [ -f pipeline/pipeline.py ] && ! cmp -s pipeline.py pipeline/pipeline.py; then
            echo '::error::兩份 pipeline.py 不一致；請先執行 python scripts/sync_quality.py 並一併提交。'
            exit 1
          fi
          if ! grep -q 'evidence-v2' "$PIPELINE_SCRIPT"; then
            echo "::error::$PIPELINE_SCRIPT 版本過舊，缺少新版會員簡訊範圍控制與配額熔斷功能。"
            echo ""
            echo "這個工作流程需要搭配同一批更新的 pipeline.py 才能運作。"
            echo "目前 checkout 中的 pipeline.py 與 workflow 不是同一版本，請一併提交並推送。"
            echo ""
            echo "常見的誤判：舊版會在載入時就硬性要求 GEMINI_API_KEY，"
            echo "而探測步驟刻意不帶那把金鑰（它用不到），於是報「缺少環境變數 GEMINI_API_KEY」。"
            echo "那個訊息會把人引導去補 Secret，但真正要做的是更新 pipeline.py。"
            exit 1
          fi
          echo "pipeline.py 版本相符：evidence-v2 ($PIPELINE_SCRIPT)"
          echo "PIPELINE_SCRIPT=$PIPELINE_SCRIPT" >> $GITHUB_ENV

      - name: 探測今天有沒有事情要做
        id: preflight
        env:
          PREFLIGHT: 'true'
          # 13:45 那一條排程只補日K；探測要認得它，直接放行。
          DAILYK_ONLY: ${{ github.event.schedule == '45 5 * * 1-5' && 'true' || '' }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID || vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 手動模式的旗標也要帶進來，探測才認得出「這是人手動觸發的」，
          # 進而直接放行而不是套用每日排程那套判斷。
          BACKFILL: ${{ github.event.inputs.backfill }}
          FILL_BLANKS: ${{ github.event.inputs.fill_blanks }}
          FINAL_ATTEMPT: ${{ github.event.inputs.final }}
          REPAIR_CODES: ${{ github.event.inputs.repair_codes }}
          RECLASSIFY: ${{ github.event.inputs.reclassify }}
          RECONCILE: ${{ github.event.inputs.reconcile }}
          FIX_PRICES: ${{ github.event.inputs.fix_prices }}
          ADMIN_JOB: ${{ github.event.inputs.admin_job }}
          FULL_FIX: ${{ github.event.inputs.full_fix }}
          FULL_FIX_SCOPE: ${{ github.event.inputs.full_fix_scope }}
          REFRESH_FROM: ${{ github.event.inputs.refresh_from }}
          REFRESH_SITE: ${{ github.event.inputs.refresh_site }}
          CHECK_KEYS: ${{ github.event.inputs.check_keys }}
          SMS_PRIORITY: ${{ github.event.inputs.sms_priority }}
          PARSE_SMS: ${{ github.event.inputs.parse_sms }}
          SMS_SINCE: ${{ github.event.inputs.sms_since }}
          SMS_MODE: ${{ github.event.inputs.sms_mode }}
          SMS_IDS: ${{ github.event.inputs.sms_ids }}
          SMS_JOB_ID: ${{ github.event.inputs.sms_job_id }}
          SMS_RESUME: ${{ github.event.inputs.sms_resume }}
          CMONEY_MEMBER_ID: ${{ github.event.inputs.sms_member_id || secrets.CMONEY_MEMBER_ID || vars.CMONEY_MEMBER_ID }}
          # VOD 最早可能出現的台灣時間。這之前的觸發點一律跳過。
          VOD_EARLIEST_HOUR: '12'
        run: python "${PIPELINE_SCRIPT:-pipeline.py}"

      - name: 沒事可做，本輪結束
        if: steps.preflight.outputs.has_work != 'true'
        run: |
          echo "探測結果：${{ steps.preflight.outputs.reason }}"
          echo "本輪沒有要處理的資料，直接結束。"

      - name: 執行每日流程
        if: steps.preflight.outputs.has_work == 'true'
        env:
          DAILYK_ONLY: ${{ github.event.schedule == '45 5 * * 1-5' && 'true' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 想換模型時設這個 Variable 就好，不必改程式碼。
          # 用得到的情境：備用金鑰所屬的專案看不到預設的型號（會回 404），
          # 留空就是 gemini-3.5-flash-lite；各把模型覆寫未清除時仍優先採用。
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'medium' }}
          GEMINI_SEMANTIC_AUDIT: ${{ vars.GEMINI_SEMANTIC_AUDIT || 'true' }}
          GEMINI_COMBINED_ASSESSMENT: ${{ vars.GEMINI_COMBINED_ASSESSMENT || 'true' }}
          GEMINI_ASSESSMENT_TOKEN_BUDGET: ${{ vars.GEMINI_ASSESSMENT_TOKEN_BUDGET || '150000' }}
          GEMINI_CONTEXT_TOKENS: ${{ vars.GEMINI_CONTEXT_TOKENS || '1048576' }}
          GEMINI_ARTICLE_ENABLED: ${{ vars.GEMINI_ARTICLE_ENABLED || 'false' }}
          # 換型號後若回 400 INVALID_ARGUMENT，多半是新型號的輸出上限比較低。
          # 用這個把 maxOutputTokens 調小（留空＝65535）。
          GEMINI_MAX_OUT: ${{ vars.GEMINI_MAX_OUT }}
          # 每一把金鑰各自的型號。同一個帳號底下，較早建立的專案還能用
          # gemini-2.5-flash，後來新開的專案已經拿不到，只能用別的世代。
          # 沒設就沿用 GEMINI_MODEL，所以只要替需要的那幾把設定即可。
          GEMINI_MODEL_2: ${{ vars.GEMINI_MODEL_2 }}
          GEMINI_MODEL_3: ${{ vars.GEMINI_MODEL_3 }}
          GEMINI_MODEL_4: ${{ vars.GEMINI_MODEL_4 }}
          GEMINI_MODEL_5: ${{ vars.GEMINI_MODEL_5 }}
          # 每分鐘請求數的自我節流。送出前就把間隔拉開，而不是等 429 才退避——
          # 撞牆的請求照樣計入當日總量，等於用自己的額度確認自己太快。
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '10' }}
          # 潤飾的併發段數。預設 3；發車間隔仍由 GEMINI_RPM 控制，
          # 所以調高它不會撞破每分鐘上限，只是讓各段的等待重疊起來。
          POLISH_WORKERS: ${{ vars.POLISH_WORKERS || '3' }}
          # 資料寫進試算表之後自動讓網站跟上（代號比對→重算追蹤→記錄績效）。
          # 排程觸發沒有 inputs，refresh_site 一定是空的，所以不能靠它。
          # 設成 false 可以關掉，那時就要等 Apps Script 下午的排程。
          AUTO_REFRESH: ${{ vars.AUTO_REFRESH || 'true' }}
          # 備用金鑰。免費層的每日請求數是以 Google 專案為單位計算的，
          # 不同專案各有各的額度：一把用完自動換下一把，全部用完才真的停。
          # 與 Apps Script 的 Aiservice.gs 是同一套命名。沒設就只用第一把，
          # 不影響既有部署。
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID || vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          FINAL_ATTEMPT: ${{ github.event.inputs.final }}
          REPAIR_CODES: ${{ github.event.inputs.repair_codes }}
          FILL_BLANKS: ${{ github.event.inputs.fill_blanks }}
          RECLASSIFY: ${{ github.event.inputs.reclassify }}
          RECONCILE: ${{ github.event.inputs.reconcile }}
          FIX_PRICES: ${{ github.event.inputs.fix_prices }}
          ADMIN_JOB: ${{ github.event.inputs.admin_job }}
          FULL_FIX: ${{ github.event.inputs.full_fix }}
          FULL_FIX_SCOPE: ${{ github.event.inputs.full_fix_scope }}
          REFRESH_FROM: ${{ github.event.inputs.refresh_from }}
          CHECK_KEYS: ${{ github.event.inputs.check_keys }}
          SMS_PRIORITY: ${{ github.event.inputs.sms_priority }}
          PARSE_SMS: ${{ github.event.inputs.parse_sms }}
          SMS_SINCE: ${{ github.event.inputs.sms_since }}
          SMS_MODE: ${{ github.event.inputs.sms_mode }}
          SMS_IDS: ${{ github.event.inputs.sms_ids }}
          SMS_JOB_ID: ${{ github.event.inputs.sms_job_id }}
          SMS_RESUME: ${{ github.event.inputs.sms_resume }}
          CMONEY_MEMBER_ID: ${{ github.event.inputs.sms_member_id || secrets.CMONEY_MEMBER_ID || vars.CMONEY_MEMBER_ID }}
          SMS_AI_GAP_SEC: ${{ vars.SMS_AI_GAP_SEC || '7' }}
          # 會員簡訊的配額節流。這四個值決定「一次執行最多花掉多少 Gemini 額度」。
          # 免費層是每日總量制，一次跑太多就會讓當天的逐字稿擷取拿不到配額，
          # 那正是日誌上「Gemini 配額用盡（extract）：HTTP 429」的來源。
          # 做不完不是失敗：沒輪到的列維持原狀，下一次執行接著做。
          SMS_AI_MAX_CALLS: ${{ vars.SMS_AI_MAX_CALLS || '45' }}
          SMS_MAX_AI_ARTICLES: ${{ vars.SMS_MAX_AI_ARTICLES || '25' }}
          SMS_MAX_QUOTA_STRIKES: ${{ vars.SMS_MAX_QUOTA_STRIKES || '2' }}
          SMS_FLUSH_EVERY: ${{ vars.SMS_FLUSH_EVERY || '5' }}
          # 跑完立刻刷新網站，不必等下游排程。需要下面兩個 Secret 才會動作。
          REFRESH_SITE: ${{ github.event.inputs.refresh_site }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: python "${PIPELINE_SCRIPT:-pipeline.py}"
