name: market-history
run-name: 完整歷史日K · 增量進度與發布核對
on:
  schedule:
    - cron: '40 10 * * 1-5'
  workflow_dispatch:
    inputs:
      years:
        description: '0＝全部可探查範圍；有有效封存就沿用'
        type: number
        default: 0
      minutes:
        description: '抓取總預算分鐘；到時保存並續補'
        type: number
        default: 150
permissions:
  contents: write
  actions: write
concurrency:
  group: market-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      YEARS: ${{ inputs.years || 0 }}
      MINUTES: ${{ inputs.minutes || 150 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: market-history
          path: data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements-market.txt
      - name: 增量、進度、隔離與保存契約
        run: python -m unittest scripts/test_market_history.py scripts/test_history_publication.py
      - name: 記錄起點與目前覆蓋
        run: |
          mkdir -p progress
          git -C data rev-parse HEAD > progress/start-data-sha.txt
          python scripts/history_progress_report.py --data data --logs progress --baseline
      - name: 先保存並發布已有的有效封存
        id: initial
        continue-on-error: true
        run: python scripts/publish_market_history.py --data data --label initial --report progress/publication-0-initial.json
      - name: 起始發布狀態
        if: always() && !cancelled()
        run: python scripts/history_progress_report.py --data data --logs progress
      - name: 交易所官方股數變動事件
        run: python -u scripts/market_history.py fetch-events --archive data/archive
      - name: 第一輪即時進度（上市日／上櫃代號月）
        run: |
          set -o pipefail
          python -u scripts/market_history.py fetch-tpex --archive data/archive --sheets --years "$YEARS" --deadline-min "$((MINUTES / 2))" --progress-file progress/1-tpex-progress.json 2>&1 | tee progress/1-tpex.log &
          tpex=$!
          twse_failed=0
          tpex_failed=0
          python -u scripts/market_history.py fetch-twse --archive data/archive --years "$YEARS" --deadline-min "$((MINUTES / 2))" --progress-file progress/1-twse-progress.json 2>&1 | tee progress/1-twse.log || twse_failed=1
          wait "$tpex" || tpex_failed=1
          test "$twse_failed$tpex_failed" = '00'
      - name: 第一輪先保存封存再驗證發布
        id: checkpoint
        if: always() && !cancelled()
        continue-on-error: true
        run: python scripts/publish_market_history.py --data data --label checkpoint --report progress/publication-1-checkpoint.json
      - name: 第一輪覆蓋與發布摘要
        if: always() && !cancelled()
        run: python scripts/history_progress_report.py --data data --logs progress
      - name: 第二輪即時進度（沿用舊檔、只補缺口）
        if: always() && !cancelled()
        run: |
          set -o pipefail
          python -u scripts/market_history.py fetch-tpex --archive data/archive --sheets --years "$YEARS" --deadline-min "$((MINUTES / 2))" --progress-file progress/2-tpex-progress.json 2>&1 | tee progress/2-tpex.log &
          tpex=$!
          twse_failed=0
          tpex_failed=0
          python -u scripts/market_history.py fetch-twse --archive data/archive --years "$YEARS" --deadline-min "$((MINUTES / 2))" --progress-file progress/2-twse-progress.json 2>&1 | tee progress/2-twse.log || twse_failed=1
          wait "$tpex" || tpex_failed=1
          test "$twse_failed$tpex_failed" = '00'
      - name: 最後保存與品質驗證（失敗不冒充發布）
        id: final
        if: always() && !cancelled()
        run: python scripts/publish_market_history.py --data data --label final --report progress/publication-2-final.json
      - name: 最終進度與覆蓋摘要
        if: always()
        run: python scripts/history_progress_report.py --data data --logs progress
      - name: 保留本輪新增封存與異常證據
        if: always()
        run: python scripts/history_progress_archive.py --data data --logs progress
      - name: 下載進度、品質與未推送封存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-history-progress-${{ github.run_id }}
          path: progress/
          retention-days: 14
