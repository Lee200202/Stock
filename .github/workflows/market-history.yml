name: market-history
# 完整歷史日K歷史（v200）：上市抓證交所每日收盤行情、上櫃抓櫃買個股月資料，存在 market-history 分支，
# 再組成網站追蹤股票的 history/代號.json，由 public-site 一起發佈。不寫試算表、不跑 AI、不寄信。
on:
  schedule:
    - cron: '40 10 * * 1-5' # 台北 18:40，證交所與櫃買收盤資料都已公布
  workflow_dispatch:
    inputs:
      years:
        description: '往回補幾年，0＝來源全部可探查範圍'
        type: number
        default: 0
      minutes:
        description: '這一次最多抓幾分鐘，沒抓完下次續抓'
        type: number
        default: 150
permissions:
  contents: write
  actions: write
concurrency:
  group: market-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: market-history
          path: data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-market.txt
      - run: pip install -r requirements-market.txt
      - name: 增量補齊與來源邊界契約
        run: python scripts/test_market_history.py
      - name: 交易所公告的股數變動（面額變更、減資、ETF 分割／反分割）
        run: python scripts/market_history.py fetch-events --archive data/archive
      - name: 上市與上櫃同時抓（第一輪）
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          YEARS: ${{ inputs.years || 0 }}
          MINUTES: ${{ inputs.minutes || 80 }}
        run: |
          # 證交所與櫃買是兩個主機、各自限速：同時抓，不必排隊各用一半時間（v200r2）
          python scripts/market_history.py fetch-tpex --archive data/archive --sheets --years "$YEARS" --deadline-min "$((MINUTES / 2))" > tpex.log 2>&1 &
          tpex=$!
          python scripts/market_history.py fetch-twse --archive data/archive --years "$YEARS" --deadline-min "$((MINUTES / 2))" || twse_failed=1
          wait "$tpex" || tpex_failed=1
          tail -n 40 tpex.log
          test -z "$twse_failed$tpex_failed"
      - name: 第一輪存檔與發布
        continue-on-error: true
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          save() {   # 先存本輪封存，再併入遠端（另一台機器可能也推了更早的日子），併完重組 history 再推
            git add -A archive
            git diff --cached --quiet || git commit -q -m "market history archive $(TZ=Asia/Taipei date +%F) $1"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin market-history || { git rebase --abort; sleep 5; continue; }
              (cd .. && python scripts/market_history.py build --archive data/archive --out data/history --sheets \
                     && python scripts/market_history.py check --out data/history --archive data/archive) || return 1
              git add -A history
              git diff --cached --quiet || git commit -q -m "market history build $(TZ=Asia/Taipei date +%F) $1"
              git push -q origin HEAD:market-history && return 0
              sleep 5
            done
            return 1
          }
          before=$(git rev-parse origin/market-history)
          save checkpoint && [ "$(git rev-parse HEAD)" != "$before" ] && gh workflow run public-site.yml --ref main || true
      - name: 上市與上櫃同時抓（第二輪）
        if: always() && !cancelled()
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          YEARS: ${{ inputs.years || 0 }}
          MINUTES: ${{ inputs.minutes || 80 }}
        run: |
          # 證交所與櫃買是兩個主機、各自限速：同時抓，不必排隊各用一半時間（v200r2）
          python scripts/market_history.py fetch-tpex --archive data/archive --sheets --years "$YEARS" --deadline-min "$((MINUTES / 2))" > tpex.log 2>&1 &
          tpex=$!
          python scripts/market_history.py fetch-twse --archive data/archive --years "$YEARS" --deadline-min "$((MINUTES / 2))" || twse_failed=1
          wait "$tpex" || tpex_failed=1
          tail -n 40 tpex.log
          test -z "$twse_failed$tpex_failed"
      - name: 存回 market-history 分支
        id: commit
        if: always() && !cancelled()
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
        run: |
          cd data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          save() {   # 先存本輪封存，再併入遠端（另一台機器可能也推了更早的日子），併完重組 history 再推
            git add -A archive
            git diff --cached --quiet || git commit -q -m "market history archive $(TZ=Asia/Taipei date +%F) $1"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin market-history || { git rebase --abort; sleep 5; continue; }
              (cd .. && python scripts/market_history.py build --archive data/archive --out data/history --sheets \
                     && python scripts/market_history.py check --out data/history --archive data/archive) || return 1
              git add -A history
              git diff --cached --quiet || git commit -q -m "market history build $(TZ=Asia/Taipei date +%F) $1"
              git push -q origin HEAD:market-history && return 0
              sleep 5
            done
            return 1
          }
          before=$(git rev-parse origin/market-history)
          save final
          if [ "$(git rev-parse HEAD)" = "$before" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo '沒有新資料'; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: 重新發佈網站（帶上新的 history）
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run public-site.yml --ref main
