name: public-site-pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-site.yml
      - public-site/**
      - scripts/build_original_site.py
      - scripts/check_project_manifest.cjs
      - scripts/check_tech_chapters.py
      - scripts/check_custom_ma.cjs
      - scripts/check_market_history.cjs
      - scripts/check_market_session.cjs
      - scripts/check_gate_audit_tolerance.js
      - scripts/check_line_claim_fast.js
      - scripts/check_line_admin.js
      - scripts/check_review_history.cjs
      - scripts/test_admin_security.mjs
      - scripts/check_admin_security_ui.cjs
      - scripts/check_visitor_guide.cjs
      - scripts/build_secure_admin.py
      - scripts/check_ss_open_once.js
      - scripts/check_tracker_stale_calendar.js
      - scripts/check_quote_flow.js
      - scripts/test_history_memory.cjs
      - site-api/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-site-pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.SITE_API_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 原始介面與 API 方法對齊
        run: python scripts/check_original_parity.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 後台登入、裝置撤銷與安全介面契約（離線，不寄碼）
        run: |
          node --test scripts/test_admin_security.mjs
          node scripts/check_admin_security_ui.cjs
          node scripts/check_visitor_guide.cjs
      - name: 部署版本與畫面檔案標記一致性
        run: node scripts/check_project_manifest.cjs
      - name: 網站 API 快照（持股追蹤、績效走勢由五分鐘快照回覆；報價不重播）
        run: |
          node scripts/check_site_snapshot.mjs
          node scripts/check_site_snapshot_1111.mjs
          node --test scripts/test_snapshot_budget_1113.mjs
          node scripts/check_quote_relay_fresh.mjs
          node scripts/check_quote_cache_first.js
      - name: 公開說明語意保留與紀錄價位隱藏
        run: node scripts/check_source_fidelity.cjs
      - name: 技術說明章節、導覽與原始證據保留
        run: |
          python -m pip install beautifulsoup4==4.14.3
          python -B scripts/check_tech_chapters.py
      - name: 自訂均線記憶與輸入邊界
        run: node scripts/check_custom_ma.cjs
      - name: 完整歷史日K合併、週月K與後端一致、指標核對
        run: node scripts/check_market_history.cjs
      - name: 歷史資料記憶、失敗重試與並發去重
        run: node scripts/test_history_memory.cjs
      - name: 使用紀錄彙整與匿名分析
        run: node scripts/check_usage_tracking.js
      - name: 報價排程模擬（盤中批次、收盤結算、轉送備援）
        run: node scripts/check_quote_flow.js
      - name: 盤中無報價與休市核對安全契約
        run: node scripts/check_market_session.cjs
      - name: 品質關卡稽核容錯（格式錯重送、稽核未完成不擋複審）
        run: node scripts/check_gate_audit_tolerance.js
      - name: LINE 去重快速路徑（首次送達不搶鎖、不讀帳本）
        run: node scripts/check_line_claim_fast.js
      - name: LINE 管理者模式與裁示（身分確認、一般句子裁示、進度回報；離線）
        run: node scripts/check_line_admin.js
      - name: 複核歷程分頁、修訂版本與網站更新契約
        run: node scripts/check_review_history.cjs
      - name: 主資料試算表一次執行只開一次
        run: node scripts/check_ss_open_once.js
      - name: 持股追蹤交易日曆（今天的節目處理完也算一天）
        run: node scripts/check_tracker_stale_calendar.js
      - name: 分批買進與部分賣出的報酬（v227）
        run: node scripts/check_tracker_lots.js
      - name: 後端橋接實測（失敗就保留上一版網站）
        env:
          SITE_API_URL: ${{ vars.SITE_API_URL }}
        run: python scripts/check_site_api.py
      - name: 以原始 Apps Script 畫面檔案組裝網站
        env:
          SITE_API_URL: ${{ vars.SITE_API_URL }}
        run: python scripts/build_original_site.py --output _site
      - name: 附上完整歷史日K歷史（market-history 分支；沒有就照舊只用試算表一年）
        run: |
          if git fetch -q --depth=1 origin market-history 2>/dev/null; then
            git archive FETCH_HEAD history | tar -x -C _site && echo "history：$(ls _site/history | wc -l) 個檔案"
          else
            echo '尚無 market-history 分支，略過'
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
