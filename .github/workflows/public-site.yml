name: public-site-pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-site.yml
      - public-site/**
      - scripts/build_original_site.py
      - site-api/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-site-pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.SITE_API_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 原始介面與 API 方法對齊
        run: python scripts/check_original_parity.py
      - name: 報價排程模擬（盤中批次、收盤結算、轉送備援）
        run: node scripts/check_quote_flow.js
      - name: 後端橋接實測（失敗就保留上一版網站）
        env:
          SITE_API_URL: ${{ vars.SITE_API_URL }}
        run: python scripts/check_site_api.py
      - name: 以原始 Apps Script 畫面檔案組裝網站
        env:
          SITE_API_URL: ${{ vars.SITE_API_URL }}
        run: python scripts/build_original_site.py --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
