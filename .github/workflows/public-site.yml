name: public-site-pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-site.yml
      - public-site/**
      - scripts/build_public_site.py
  workflow_dispatch:
  schedule:
    - cron: '*/15 1-9 * * 1-5' # 台北平日 09:00–17:45；GitHub 排程可能延遲，不宣稱即時
    - cron: '0 0,12 * * *'    # 早晚兜底：涵蓋休市日仍可能出現的會員通知

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-site-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: 匯出已公開紀錄
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
        run: python scripts/build_public_site.py --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
