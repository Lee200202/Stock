name: 單日品質核對與更新
run-name: 單日品質核對 ${{ inputs.date }}（${{ inputs.mode }}）
on:
  workflow_dispatch:
    inputs:
      date:
        description: 已有原稿的日期 YYYY/MM/DD（最近三十天；apply 須有該日人工答案）
        required: true
      mode:
        description: 通過全部品質核對後才更新；不寄送
        type: choice
        options: [preview, apply, raw, sync, priority-check, reviewed-points, reviewed-notes-preview, reviewed-notes, source-audit, reading-preview, reading-apply, notice-preview, notice-apply, backup-status, backup-migrate, verdicts, titles]
        default: preview
permissions:
  contents: read
concurrency:
  group: daily-pipeline
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 品質核對與必要更新
        env:
          TARGET_DATE: ${{ inputs.date }}
          MODE: ${{ inputs.mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'medium' }}
          GEMINI_SEMANTIC_AUDIT: ${{ vars.GEMINI_SEMANTIC_AUDIT || 'true' }}
          GEMINI_COMBINED_ASSESSMENT: ${{ vars.GEMINI_COMBINED_ASSESSMENT || 'true' }}
          GEMINI_ASSESSMENT_TOKEN_BUDGET: ${{ vars.GEMINI_ASSESSMENT_TOKEN_BUDGET || '150000' }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '10' }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          FINAL_ATTEMPT: 'true'
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "$MODE" = notice-preview ]; then
            python scripts/repair_notice_semantics.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = notice-apply ]; then
            python scripts/repair_notice_semantics.py --date "$TARGET_DATE" --apply
            exit 0
          fi
          if [ "$MODE" = reading-preview ]; then
            python scripts/repair_reading_copy.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = reading-apply ]; then
            python scripts/repair_reading_copy.py --date "$TARGET_DATE" --apply
            exit 0
          fi
          if [ "$MODE" = backup-status ]; then
            python scripts/backup_archive.py
            exit 0
          fi
          if [ "$MODE" = backup-migrate ]; then
            python scripts/backup_archive.py --migrate
            exit 0
          fi
          if [ "$MODE" = reviewed-notes-preview ]; then
            python scripts/apply_reviewed_notes.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = reviewed-notes ]; then
            python scripts/apply_reviewed_notes.py --date "$TARGET_DATE" --apply
            exit 0
          fi
          if [ "$MODE" = source-audit ]; then
            python scripts/audit_saved_source.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = reviewed-points ]; then
            python scripts/apply_reviewed_points.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = priority-check ]; then
            python scripts/sync_source_priority.py --date "$TARGET_DATE" --audit-only
            exit 0
          fi
          if [ "$MODE" = verdicts ]; then
            # 唯讀：只把有人工答案的日子送分類問卷，量準確與一致；日期可用逗號分隔
            python scripts/adjudicate_probe.py --dates "$TARGET_DATE" --repeat 3
            exit 0
          fi
          if [ "$MODE" = titles ]; then
            # 唯讀：用現在的標題步驟替已在站上的日子各問一次標題，只印結果；日期可用逗號分隔
            python scripts/title_probe.py --dates "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = sync ]; then
            # 既有資料來源優先：先備份再去重、刷新，不呼叫模型或寄送。
            python scripts/sync_source_priority.py --date "$TARGET_DATE"
            exit 0
          fi
          ARGS=(--date "$TARGET_DATE")
          if [ "$MODE" = apply ]; then ARGS+=(--apply); fi
          if [ "$MODE" = raw ]; then ARGS+=(--raw); fi
          python scripts/regenerate_verified_day.py "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'source-audit'
        with:
          name: source-audit-${{ github.run_id }}
          path: .source-audit/source.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'reading-preview' || inputs.mode == 'reading-apply'
        with:
          name: reading-audit-${{ github.run_id }}
          path: .reading-audit/report.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.mode == 'notice-preview' || inputs.mode == 'notice-apply')
        with:
          name: notice-audit-${{ github.run_id }}
          path: .notice-audit/report.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore
