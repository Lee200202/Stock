name: 單日品質核對與更新
run-name: 單日品質核對 ${{ inputs.date }}（${{ inputs.mode }}）
on:
  workflow_dispatch:
    inputs:
      date:
        description: 已有原稿日期 YYYY/MM/DD（一般重判限三十天；來源修正須有指紋計畫）
        required: true
      mode:
        description: 通過全部品質核對後才更新；不寄送
        type: choice
        options: [preview, direct, apply, apply-rules, raw, sync, priority-check, reviewed-points, reviewed-notes-preview, reviewed-notes, source-audit, reading-preview, reading-apply, notice-preview, notice-apply, backup-status, backup-migrate, row-repair-preview, row-repair-apply, source-review-preview, source-review-apply, source-review-inspect, verdicts, titles]
        default: preview
      candidate_run:
        description: 'apply 必填：同一commit且成功的preview執行ID；原封套用該artifact，不重新生成'
        type: string
        default: ''
      reference:
        description: '推論後才比對的來源參考JSON；不傳入模型'
        type: string
        default: ''
      accept_model:
        description: 'preview 專用：管理者明示以這一次模型結果為準（被擋的單檔照樣不公開、參考差異只記警告；硬傷照擋）'
        type: choice
        options: ['no', 'yes']
        default: 'no'
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-pipeline
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 核對模型候選來源（失敗預覽不能發布）
        if: inputs.mode == 'apply' || inputs.mode == 'apply-rules'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          TARGET_DATE: ${{ inputs.date }}
        run: python scripts/check_candidate_run.py
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'apply' || inputs.mode == 'apply-rules'
        with:
          name: model-candidate-${{ inputs.candidate_run }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: .model-candidate
      - name: 離線發布與AI批次審閱契約（不呼叫模型）
        run: |
          python scripts/check_public_edit_batch.py
          node scripts/check_gate_decision_contract.js
          python scripts/test_model_release_candidate.py
      - name: 品質核對與必要更新
        env:
          TARGET_DATE: ${{ inputs.date }}
          MODE: ${{ inputs.mode }}
          REFERENCE: ${{ inputs.reference }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          ACCEPT_MODEL: ${{ inputs.accept_model }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'medium' }}
          GEMINI_SEMANTIC_AUDIT: ${{ vars.GEMINI_SEMANTIC_AUDIT || 'true' }}
          GEMINI_COMBINED_ASSESSMENT: ${{ vars.GEMINI_COMBINED_ASSESSMENT || 'true' }}
          GEMINI_ASSESSMENT_TOKEN_BUDGET: ${{ vars.GEMINI_ASSESSMENT_TOKEN_BUDGET || '150000' }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '10' }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          FINAL_ATTEMPT: 'true'
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "$MODE" = source-review-inspect ]; then
            IFS=',' read -ra REVIEW_DATES <<< "$TARGET_DATE"
            for REVIEW_DATE in "${REVIEW_DATES[@]}"; do
              python scripts/apply_source_review.py --date "$REVIEW_DATE" --inspect-only
            done
            exit 0
          fi
          if [ "$MODE" = source-review-preview ]; then
            python scripts/apply_source_review.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = source-review-apply ]; then
            python scripts/apply_source_review.py --date "$TARGET_DATE" --apply
            exit 0
          fi
          if [ "$MODE" = row-repair-preview ]; then
            python scripts/repair_verified_rows.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = row-repair-apply ]; then
            python scripts/repair_verified_rows.py --date "$TARGET_DATE" --apply
            exit 0
          fi
          if [ "$MODE" = notice-preview ]; then
            python scripts/repair_notice_semantics.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = notice-apply ]; then
            python scripts/repair_notice_semantics.py --date "$TARGET_DATE" --apply
            exit 0
          fi
          if [ "$MODE" = reading-preview ]; then
            python scripts/repair_reading_copy.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = reading-apply ]; then
            python scripts/repair_reading_copy.py --date "$TARGET_DATE" --apply
            exit 0
          fi
          if [ "$MODE" = backup-status ]; then
            python scripts/backup_archive.py
            exit 0
          fi
          if [ "$MODE" = backup-migrate ]; then
            python scripts/backup_archive.py --migrate
            exit 0
          fi
          if [ "$MODE" = reviewed-notes-preview ]; then
            python scripts/apply_reviewed_notes.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = reviewed-notes ]; then
            python scripts/apply_reviewed_notes.py --date "$TARGET_DATE" --apply
            exit 0
          fi
          if [ "$MODE" = source-audit ]; then
            python scripts/audit_saved_source.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = reviewed-points ]; then
            python scripts/apply_reviewed_points.py --date "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = priority-check ]; then
            python scripts/sync_source_priority.py --date "$TARGET_DATE" --audit-only
            exit 0
          fi
          if [ "$MODE" = verdicts ]; then
            # 唯讀：只把有人工答案的日子送分類問卷，量準確與一致；日期可用逗號分隔
            python scripts/adjudicate_probe.py --dates "$TARGET_DATE" --repeat 3
            exit 0
          fi
          if [ "$MODE" = titles ]; then
            # 唯讀：用現在的標題步驟替已在站上的日子各問一次標題，只印結果；日期可用逗號分隔
            python scripts/title_probe.py --dates "$TARGET_DATE"
            exit 0
          fi
          if [ "$MODE" = sync ]; then
            # 既有資料來源優先：先備份再去重、刷新，不呼叫模型或寄送。
            python scripts/sync_source_priority.py --date "$TARGET_DATE"
            exit 0
          fi
          if [[ "$MODE" != preview && "$MODE" != direct && "$MODE" != apply && "$MODE" != apply-rules && "$MODE" != raw ]]; then
            echo '未處理的模式，停止；不呼叫模型或寫入'
            exit 1
          fi
          ARGS=(--date "$TARGET_DATE")
          if [ -n "$REFERENCE" ]; then
            REF_PATH=$(realpath -e -- "$REFERENCE") || exit 1
            case "$REF_PATH" in "$GITHUB_WORKSPACE"/docs/*.json|"$GITHUB_WORKSPACE"/scripts/*.json) ;;
              *) echo '參考限repo內docs或scripts JSON'; exit 1 ;;
            esac
            ARGS+=(--reference "$REF_PATH")
          fi
          if [[ "$MODE" = apply || "$MODE" = apply-rules ]]; then ARGS+=(--apply --candidate .model-candidate/candidate.json); fi
          if [ "$MODE" = raw ]; then ARGS+=(--raw); fi
          if [[ "$MODE" = preview && "$ACCEPT_MODEL" = yes ]]; then ARGS+=(--accept-model); fi
          if [ "$MODE" = direct ]; then ARGS+=(--direct); fi
          python scripts/regenerate_verified_day.py "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        if: always() && (inputs.mode == 'preview' || inputs.mode == 'raw')
        with:
          name: model-candidate-${{ github.run_id }}
          path: .model-candidate/candidate.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'source-audit'
        with:
          name: source-audit-${{ github.run_id }}
          path: .source-audit/source.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'reading-preview' || inputs.mode == 'reading-apply'
        with:
          name: reading-audit-${{ github.run_id }}
          path: .reading-audit/report.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.mode == 'notice-preview' || inputs.mode == 'notice-apply')
        with:
          name: notice-audit-${{ github.run_id }}
          path: .notice-audit/report.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore
