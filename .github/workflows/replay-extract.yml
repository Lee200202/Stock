name: 擷取分類重播（唯讀）
run-name: 擷取分類重播 ${{ inputs.date }}（${{ github.ref_name }}）

# 手動觸發。用真的模型把某一天存好的原始逐字稿重新跑一次擷取、稽核、代號比對、品質關卡到最終分類，
# 不以網站當答案。可與核定答案／凍結代理草稿在推論後比對；沒有參考即標未評估分類品質。
# 不寫試算表、不寄信、不刷新網站。
# 呼叫數依原稿與重試而變。評估共用串行群組，避免多分支把同模型專案 RPM 疊高。
on:
  workflow_dispatch:
    inputs:
      date:
        description: '要重播哪一天 YYYY/MM/DD'
        required: true
      fresh_verdicts:
        description: '停用人工／模型裁決快取，測量新判讀；仍讀當日通知及歷史部位'
        type: boolean
        default: false
      note_sources_only:
        description: '只重播固定說明的上下文審閱；不分類、不讀通知或部位，跨日原稿須指紋相同'
        type: boolean
        default: false
      independent_review:
        description: '可選：repo內來源審核草稿JSON路徑（非人工金標，同日同原稿SHA；只在推論後比對）'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # 所有分支與日期共用；一次只派一個 run，完成後再派下一個。
  # GitHub 同組僅保留一個 pending，不能一次排多天當作無限佇列。
  group: gemini-readonly-quality-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: 原稿重播與來源評估（唯讀；網站不是答案）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'medium' }}
          GEMINI_SEMANTIC_AUDIT: ${{ vars.GEMINI_SEMANTIC_AUDIT || 'true' }}
          GEMINI_COMBINED_ASSESSMENT: ${{ vars.GEMINI_COMBINED_ASSESSMENT || 'true' }}
          GEMINI_ASSESSMENT_TOKEN_BUDGET: ${{ vars.GEMINI_ASSESSMENT_TOKEN_BUDGET || '150000' }}
          GEMINI_CONTEXT_TOKENS: ${{ vars.GEMINI_CONTEXT_TOKENS || '1048576' }}
          GEMINI_MAX_OUT: ${{ vars.GEMINI_MAX_OUT }}
          GEMINI_RPM: ${{ vars.GEMINI_EVAL_RPM || '15' }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          REPLAY_DATE: ${{ inputs.date }}
          FRESH_VERDICTS: ${{ inputs.fresh_verdicts }}
          NOTE_SOURCES_ONLY: ${{ inputs.note_sources_only }}
          INDEPENDENT_REVIEW: ${{ inputs.independent_review }}
          FINAL_ATTEMPT: 'true'
          PYTHONUNBUFFERED: '1'
        run: |
          if ! printf '%s' "$GEMINI_RPM" | grep -Eq '^([1-9]|1[0-5])$'; then
            echo "::error::GEMINI_EVAL_RPM 須為 1 至 15；重試與多工作合計仍須遵守同模型專案15RPM"; exit 1
          fi
          if ! printf '%s' "$REPLAY_DATE" | grep -Eq '^[0-9]{4}/[0-9]{1,2}/[0-9]{1,2}$'; then
            echo "::error::日期格式錯誤，要寫成 YYYY/MM/DD"; exit 1
          fi
          if [ "$NOTE_SOURCES_ONLY" = true ]; then
            python scripts/replay_note_sources.py --cases docs/1003-review/2026-10-27-pipeline-report/note-context-cases.json --report-json .replay-report/result.json
            exit $?
          fi
          GOLDEN="scripts/golden/$(printf '%s' "$REPLAY_DATE" | awk -F/ '{printf "%04d-%02d-%02d", $1, $2, $3}').json"
          ARGS=(--date "$REPLAY_DATE" --report-json .replay-report/result.json)
          if [ "$FRESH_VERDICTS" = true ]; then ARGS+=(--fresh-verdicts); fi
          if [ -f "$GOLDEN" ]; then ARGS+=(--golden "$GOLDEN"); fi
          if [ -n "$INDEPENDENT_REVIEW" ]; then
            REVIEW_PATH=$(realpath -e -- "$INDEPENDENT_REVIEW") || exit 1
            case "$REVIEW_PATH" in "$GITHUB_WORKSPACE"/docs/*.json|"$GITHUB_WORKSPACE"/scripts/*.json) ;;
              *) echo '::error::來源審核限repo內docs或scripts下的JSON檔'; exit 1 ;;
            esac
            ARGS+=(--independent-review "$REVIEW_PATH")
          fi
          python scripts/replay_extract.py "${ARGS[@]}"
      - name: 診斷摘要（不以網站為答案）
        if: always()
        run: python scripts/summarize_replay.py .replay-report/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-result-${{ github.run_id }}
          path: .replay-report/result.json
          retention-days: 7
          if-no-files-found: warn
