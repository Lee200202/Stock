name: screen-identify
run-name: 直播畫面辨識 ${{ inputs.date || '' }}

# 2026/11/12 管理者：逐字稿只有聲音，「這檔」「你看這個」或聽錯的股名要看當時畫面才知道是哪一檔。
# 回放好之後由 Gemini 直接讀 YouTube 片段（不下載影片），結果寫進複核紀錄「畫面辨識」，11:40 雲端複核核對。
# 原稿就緒才由上游明確派發；不再訂閱每次成功事件或重複備援時點。
on:
  workflow_dispatch:
    inputs:
      source:
        description: '上游就緒影片識別（不含原稿）'
        default: ''
      automatic:
        description: '上游就緒派發；已完成直接略過'
        type: boolean
        default: false
      check_only:
        description: '唯讀核對既有完成狀態，不呼叫模型、不寫表'
        type: boolean
        default: false
      date:
        description: '目標日期 YYYY/MM/DD，留空＝今天'
        required: false
        default: ''
      force:
        description: '已經辨識過也重跑'
        required: false
        default: 'false'
      dry_run:
        description: '只印結果，不寫複核紀錄（驗收用）'
        required: false
        default: 'false'
      schema:
        description: 'on＝用結構化輸出 response_schema；off＝自由 JSON（程式逐筆檢查）'
        required: false
        default: ''

concurrency:
  group: screen-identify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: 工作日期
        id: workday
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: python pipeline/work_completion.py date --date "$TARGET_DATE"
      - uses: actions/cache/restore@v4
        id: completed_cache
        if: inputs.automatic && inputs.force != 'true' && inputs.dry_run != 'true'
        with:
          path: .work-completion/screen.json
          key: work-complete-v1-screen-${{ steps.workday.outputs.day }}-${{ inputs.source }}
      - name: 完成狀態預檢
        id: completion
        env:
          TARGET_DATE: ${{ steps.workday.outputs.day }}
          EXPECTED_SOURCE: ${{ inputs.source }}
        run: python pipeline/work_completion.py check screen --date "$TARGET_DATE" --source "$EXPECTED_SOURCE"
      - uses: actions/setup-python@v6
        if: steps.completion.outputs.complete != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安裝相依套件
        if: steps.completion.outputs.complete != 'true'
        run: |
          python -m pip install -r requirements.txt cryptography cffi
      - name: 看畫面辨識股名
        if: steps.completion.outputs.complete != 'true'
        env:
          WORK_COMPLETION_KIND: screen
          SCREEN_SOURCE: ${{ inputs.source }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          SCREEN_MODEL: ${{ vars.SCREEN_MODEL }}
          SCREEN_BUDGET_SECONDS: '600'
          SCREEN_MAX_REQUESTS: '24'
          SCREEN_FPS: '0.5'
          SCREEN_RESOLUTION: default
          SCREEN_THINKING: low
          SCREEN_PASSES: ${{ vars.SCREEN_PASSES || '2' }}
          SCREEN_SCHEMA: ${{ inputs.schema || vars.SCREEN_SCHEMA || 'off' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          REVIEW_LOG_ID: ${{ vars.REVIEW_LOG_ID }}
          TARGET_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          ARGS=()
          if [ -n "$TARGET_DATE" ]; then ARGS+=(--date "$TARGET_DATE"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$CHECK_ONLY" = "true" ]; then ARGS+=(--check-only); fi
          python scripts/screen_identify.py "${ARGS[@]}"

      - name: 核對完成證據
        id: receipt
        if: success() && inputs.dry_run != 'true'
        env:
          TARGET_DATE: ${{ steps.workday.outputs.day }}
        run: python pipeline/work_completion.py check screen --date "$TARGET_DATE"
      - uses: actions/cache/save@v4
        if: success() && steps.receipt.outputs.complete == 'true' && steps.completed_cache.outputs.cache-hit != 'true'
        with:
          path: .work-completion/screen.json
          key: work-complete-v1-screen-${{ steps.workday.outputs.day }}-${{ steps.receipt.outputs.source }}

      - name: 保存匿名用量（不含逐字稿、觀測列或詞庫）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-metrics-${{ github.run_id }}
          path: scratch/screen-identify/metrics.jsonl
          if-no-files-found: ignore
          retention-days: 7
