name: transcript-gemini
run-name: >-
  ${{ inputs.mode != '' && inputs.mode != 'auto'
      && format('逐字稿 {0}', inputs.mode)
      || '逐字稿自動抓取' }}

# ------------------------------------------------------------------ #
# 這個工作流程只做一件事：把當天那一集的逐字稿放進試算表的「影片清單」。
# 後面的潤飾、擷取、寫網站、寄信全部由 daily.yml 的 pipeline.py 接手。
#
# 逐字稿怎麼來的：
#
#   這個頻道的影片**沒有任何字幕**，連 YouTube 自動產生的都沒有，
#   所以任何靠抓字幕的工具都取不到逐字稿。
#
#   改用 Gemini API 直接讀公開的 YouTube 網址，模型自己「聽」聲音聽打。
#   不需要字幕、不需要下載影片、不需要瀏覽器，也沒有任何會過期的憑證。
#
# 排程是「輪詢」，不是「執行一次」：
#   cron 只負責把程式叫起來，進去之後自己每 3 分鐘敲一次門，
#   一個 job 敲約 25 分鐘就收尾，交給下一次觸發接力。
#   GitHub 的 cron 是 best effort，尖峰時段會大量漏跑或延遲十幾分鐘，
#   靠塞很多個 cron 點指望它準點，實際跑起來的次數遠少於預期。
#
# 時間（實測 2026/09/14～18，五集）：
#   影片是在直播「結束時」才進入頻道清單，不是開播時。
#   進清單的時間：11:15、11:07、11:04、11:24、11:18 —— 範圍 11:04～11:24。
#   回放再花 3～5 分鐘處理好，所以最早 11:10 前後就抓得到。
#
#   起點因此設 11:05 而不是 11:20：早收的那幾天（11:04、11:07）
#   用 11:20 起跑會白等十幾分鐘，而提早的代價幾乎是零——
#   影片還沒出現時只用 YouTube API 問一句（約 2 units），不呼叫 Gemini。
#   撞到直播中也只會回報「直播中」然後等下一輪。
#
#   ※ 程式端的 POLL_START 也必須一起改。只改 cron 的話，
#     提早觸發的那一輪會停在「現在 11:05，還沒到 11:20，不執行」而空轉。
#
# cron 一律 UTC。台灣 = UTC + 8，全年固定。台灣 11:05 = UTC 03:05。
# 讀日誌要記得：GitHub 介面的時間戳是 UTC，程式印的是台北時間，差八小時。
# ------------------------------------------------------------------ #
on:
  schedule:
    # 間隔固定 25 分鐘，剛好接上內部輪詢的時間預算，一棒接一棒不留空隙。
    - cron: '5,30,55 3 * * 1-5'    # 台灣 11:05 11:30 11:55　← 多數日子在這三輪就抓到
    - cron: '20,45 4 * * 1-5'      # 台灣 12:20 12:45
    - cron: '10,35 5 * * 1-5'      # 台灣 13:10 13:35　← 回放異常延遲時的補網

  workflow_dispatch:
    inputs:
      mode:
        description: '要做什麼'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'      # 照常抓取
          - 'status'    # 只看狀態，什麼都不改
          - 'check'     # 確認 Gemini 金鑰與模型可用
          - 'hold'      # 標記手動保留，擋住自動抓取
          - 'release'   # 解除手動保留
      date:
        description: '目標日期 YYYY/MM/DD，留空＝今天'
        required: false
        default: ''
      force:
        description: '無視平日／時段／回放就緒的限制，硬跑一次（補抓過去某一天時用）'
        required: false
        default: 'false'
      once:
        description: '只敲一次就結束，不進 25 分鐘的輪詢迴圈'
        required: false
        default: 'false'

concurrency:
  group: transcript-gemini
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  transcript:
    runs-on: ubuntu-latest
    # 內部輪詢預算 25 分鐘，給 35 分鐘上限：正常結束用不到，
    # 卡死的工作也不會長時間佔住 concurrency 佇列。
    timeout-minutes: 35

    steps:
      - name: 記錄排程與實際執行時間
        run: |
          echo "排程設定：${{ github.event.schedule || '手動觸發' }} (UTC)"
          echo "實際執行：$(date '+%Y/%m/%d %H:%M:%S') UTC"
          echo "　　　　　$(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M:%S') 台北時間"
          echo ""
          echo "兩者差超過 30 分鐘是 GitHub 排程佇列延遲，不是設定寫錯。"
          echo "官方文件明講排程是 best effort，本流程用內部輪詢補這個不準。"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 只要幾個純 Python 套件，十幾秒就裝完。不需要瀏覽器。
      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r pipeline/requirements.txt
          fi

      - name: 執行
        env:
          # Gemini。額度是每把金鑰、每個模型分開算的，所以可以填多把：
          #   逗號分隔，或另外設 GEMINI_API_KEY_2、GEMINI_API_KEY_3。
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}

          # YouTube。判斷「直播結束了沒、回放處理好了沒」一定要它——
          # RSS 拿不到片長與結束時間，沒有金鑰時程式會明確拒絕硬猜。
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}

          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}

          # 排程觸發時一律用預設值；手動觸發才讓上面那些輸入生效。
          MODE: ${{ inputs.mode || 'auto' }}
          TARGET_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
          ONCE: ${{ inputs.once }}
        run: |
          # 注意：GitHub 的 run: 預設是 bash -e。
          # 「[ 條件 ] && 指令」在條件不成立時整句回 1，會讓整個步驟當場結束
          # ——看起來像程式沒跑，其實是 shell 自己退掉了。所以一律用 if。
          ARGS=()
          case "$MODE" in
            status)  ARGS=(status) ;;
            check)   ARGS=(check) ;;
            hold)    ARGS=(hold) ;;
            release) ARGS=(hold --release) ;;
            *)       ARGS=(auto)
                     if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
                     if [ "$ONCE"  = "true" ]; then ARGS+=(--once);  fi ;;
          esac

          if [ -n "$TARGET_DATE" ] && [ "$MODE" != "check" ]; then
            # 這個值會變成命令列參數。手動觸發只有維護者按得到，但仍然先驗格式，
            # 免得打錯字變成別的參數，錯誤訊息會讓人找很久。
            if ! printf '%s' "$TARGET_DATE" | grep -Eq '^[0-9]{4}[/-][0-9]{1,2}[/-][0-9]{1,2}$'; then
              echo "::error::日期格式錯誤「$TARGET_DATE」，要寫成 YYYY/MM/DD"
              exit 1
            fi
            ARGS+=(--date "$TARGET_DATE")
          fi

          echo "執行：python transcript.py ${ARGS[*]}"
          code=0
          python transcript.py "${ARGS[@]}" || code=$?

          # 0  有進展或沒事做（寫入成功、已有稿、手動優先停手、回放還沒好）。
          #    「還沒好」是常態，不該亮紅燈，否則每天中午都在發假告警。
          # 2  Gemini 額度用完。亮紅燈提醒去補金鑰或等重置。
          # 1  其他失敗。
          echo "結束碼：$code"
          exit $code
