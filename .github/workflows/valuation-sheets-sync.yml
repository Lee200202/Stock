name: valuation-sheets-sync
on:
  workflow_run:
    workflows: [valuation-history]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valuation-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install 'gspread>=6,<7'
      - name: 讀取與網站同一份正式估值資料
        run: |
          git fetch --depth=1 origin valuation-history
          git archive FETCH_HEAD valuation | tar -x
      - name: 更新雲端試算表
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/sync_valuation_sheets.py valuation
