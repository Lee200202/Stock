name: valuation-sheets-sync
# 2026/11/25 停用自動觸發：估值歷史 A／B 兩份輪替副本讓主資料試算表超過 Google 檔案上限。
# 預設動作為 delete：清理主試算表的估值歷史 A/B 與索引分頁，恢復試算表正常寫入。
on:
  workflow_dispatch:
    inputs:
      action:
        description: '動作：delete（刪除估值歷史 A/B 及索引分頁，釋放空間）或 sync（同步）'
        type: choice
        options:
          - delete
          - sync
        default: delete

permissions:
  contents: read

concurrency:
  group: valuation-sheets-sync
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install 'gspread>=6,<7'
      - name: 讀取與網站同一份正式估值資料（僅 sync 模式）
        if: inputs.action == 'sync'
        run: |
          git fetch --depth=1 origin valuation-history
          git archive FETCH_HEAD valuation | tar -x
      - name: 執行試算表操作
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ACTION: ${{ inputs.action || 'delete' }}
        run: |
          if [ "$ACTION" = "delete" ]; then
            python scripts/sync_valuation_sheets.py --delete
          else
            python scripts/sync_valuation_sheets.py valuation
          fi
