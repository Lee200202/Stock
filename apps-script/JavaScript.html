  function renderRecordBlock(r) {
    DETAIL.record = r;
    paintTracker();          // 沒有追蹤資料時，上方那一區要靠這份資料才畫得出來

    if (!r || !r.found || !r.trades.length) {
      $('dRecord').innerHTML = emptyBlock('資料庫裡沒有這一檔的紀錄',
        '影片中沒有明確提到，或這一檔的代號還是待確認狀態。');
      return;
    }
    $('dRecord').innerHTML =
      '<p class="notice" style="margin:0 0 10px;">共 ' + r.trades.length + ' 筆' +
        (r.firstBuy ? '\u3000首次提到買入 ' + r.firstBuy : '') +
        (r.lastSell ? '\u3000最近提到賣出 ' + r.lastSell : '') + '</p>' +
      '<div class="card flush scrollx"><table class="tbl-rec">' +
      '<colgroup><col class="c-date"><col class="c-dir"><col class="c-px"><col class="c-reason"></colgroup>' +
      '<thead><tr>' +
      '<th class="sticky">日期</th><th>方向</th>' +
      '<th>價位說明</th><th>說明重點</th></tr></thead><tbody>' +
      r.trades.map(function (x, i) {
        var c = x.direction.indexOf('買') === 0 ? 'dir-buy'
              : x.direction.indexOf('賣') === 0 ? 'dir-sell'
              : x.direction.indexOf('注意') >= 0 ? 'dir-note' : 'dir-watch';
        return '<tr class="rec-r' + (i >= TL_HEAD ? ' is-hid' : '') + '">' +
          '<td class="sticky code">' + esc(x.date) + '</td>' +
          '<td class="' + c + '">' + esc(x.direction) + '</td>' +
          priceCell(x) +
          '<td class="reason">' + esc(publicNarrative_(x.reason,x)) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      (r.trades.length > TL_HEAD
        ? '<button class="moreb" data-more="rec">顯示其餘 ' +
          (r.trades.length - TL_HEAD) + ' 筆</button>'
        : '') + scrollHint();

    collapseList_($('dRecord'), 'tr.rec-r', TL_HEAD, 'rec');
  }

  function closeDetail() {
    ++detailRequest; ++candleRequest;
    $('detail').classList.remove('open');
    document.body.style.overflow = '';
  }
  $('detailClose').addEventListener('click', closeDetail);
  $('detailBg').addEventListener('click', closeDetail);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('detail').classList.contains('open')) { closeDetail(); }
  });

  function kv(k, v, na) {
    return '<div class="kv-cell"><div class="k">' + esc(k) + '</div>' +
      '<div class="v' + (na ? ' na' : '') + '">' + v + '</div></div>';
  }

  /* ---------------- 圖表 ---------------- */
  function chartOptions() {
    return {
      layout: { background: { color: css('--panel') }, textColor: css('--muted'), fontFamily: 'IBM Plex Mono, monospace' },
      grid: { vertLines: { color: css('--rule') }, horzLines: { color: css('--rule') } },
      /* 右側縱軸固定寬度（2026/09/16 v38）。K 線、成交量、MACD、KD 是上下四張圖，
         縱軸刻度字寬不同（102.00、1.2萬、-0.123）會讓每張圖的繪圖區寬度不一樣，
         同一根 K 棒在上下兩張圖的水平位置就對不齊。 */
      rightPriceScale: { borderColor: css('--rule'), minimumWidth: 72 },
      timeScale: {
        borderColor: css('--rule'), timeVisible: period === 'hour',
        // 把可視範圍鎖在資料兩端。少了這兩個，往左往右都能一直拖，
        // 拖出去之後畫面整片空白，看起來像圖表壞掉。
        fixLeftEdge: true,
        fixRightEdge: true,
        // 不要在最右邊預留空白，K 棒直接貼齊右緣。
        rightOffset: 0,
        // 最細的 K 棒間距。「全部」要把一年的日K（約 245 根）放進手機寬度，
        // 1.5 會被夾住而只顯示最近兩百多根，所以放寬到 0.5；要看型態用區間按鈕放大。
        minBarSpacing: 0.5
      },
      // 拖到邊界時不要有彈跳回彈的動畫，那會讓人以為還能繼續拖。
      handleScroll: { horzTouchDrag: true, vertTouchDrag: false },
      crosshair: { mode: 0 }
    };
  }

  function initCharts() {
    if (chart) { return; }
    chart = LightweightCharts.createChart($('chart'), chartOptions());
    volChart = LightweightCharts.createChart($('volChart'), chartOptions());
    macdChart = LightweightCharts.createChart($('macdChart'), chartOptions());

    candleSeries = chart.addCandlestickSeries({
      upColor: css('--rise'), downColor: css('--fall'),
      borderUpColor: css('--rise'), borderDownColor: css('--fall'),
      wickUpColor: css('--rise'), wickDownColor: css('--fall')
    });
    /* 成交量獨立成一張圖（2026/09/16 v38，管理者要求）。
       原本量柱疊在 K 線圖底部、共用同一個畫布，兩者重疊，量柱會蓋到 K 棒下影線，
       右側價格軸也只有價格，量柱的高度讓人誤以為對應某個價位。
       現在 K 線與成交量是上下兩張圖，各自有縱軸，橫軸同步拖曳縮放。 */
    chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.08, bottom: 0.06 } });
    volSeries = volChart.addHistogramSeries({
      priceFormat: { type: 'custom', minMove: 0.001, formatter: fmtLotsAxis },
      priceLineVisible: false, lastValueVisible: false
    });
    volChart.priceScale('right').applyOptions({ scaleMargins: { top: 0.12, bottom: 0 } });

    macdSeries = macdChart.addLineSeries({ color: css('--rise'), lineWidth: 1 });
    signalSeries = macdChart.addLineSeries({ color: css('--wait'), lineWidth: 1 });
    histSeries = macdChart.addHistogramSeries({});

    kdChart = LightweightCharts.createChart($('kdChart'), chartOptions());
    kSeries = kdChart.addLineSeries({ color: css('--rise'), lineWidth: 1, title: 'K' });
    dSeries = kdChart.addLineSeries({ color: css('--fall'), lineWidth: 1, title: 'D' });
    jSeries = kdChart.addLineSeries({ color: css('--muted'), lineWidth: 1, lineStyle: 2, title: 'J' });
    // 20 與 80 是 KD 的傳統超買超賣線
    kSeries.createPriceLine({ price: 80, color: css('--rule'), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '80' });
    kSeries.createPriceLine({ price: 20, color: css('--rule'), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '20' });

    // 橫軸同步。只同步「目前顯示中」的圖：對隱藏容器呼叫 setVisibleLogicalRange
    // 會算出錯誤範圍，反過來把可見的那張拖亂，就是關掉其一時另一張跳掉的原因。
    var syncing = false;
    function chartVisible(c) {
      if (c === chart || c === volChart) { return true; }
      if (c === macdChart) { return paneShown('macd'); }
      if (c === kdChart) { return paneShown('kd'); }
      return false;
    }
    /* 誰可以帶動其他圖（2026/09/16 v41）。

       換股票或換週期時，四張圖各自 setData，各自都會發出一次「範圍改變」事件，而事件是非同步的。
       副圖手上還是上一檔的範圍（例如只有 5 根的那一檔），它的事件晚一步到，就把 K 線圖拉回錯的位置
       ——實測從資料少的股票切回來，3 個月的區間變成只顯示一個多月。
       現在：K 線圖永遠帶動副圖；副圖只有在使用者正在它上面拖曳、滾輪縮放、觸控時（最近 1.5 秒內）才帶動其他圖，
       程式換資料、套區間造成的副圖事件一律不往外傳。 */
    var userInputAt = {};
    [['chart', chart], ['volChart', volChart], ['macdChart', macdChart], ['kdChart', kdChart]].forEach(function (pair) {
      var el = $(pair[0]);
      if (!el) { return; }
      var mark = function (e) {
        if (e.type === 'pointermove' && !e.buttons) { return; }
        userInputAt[pair[0]] = Date.now();
      };
      ['pointerdown', 'pointermove', 'wheel', 'touchstart', 'touchmove'].forEach(function (ev) {
        el.addEventListener(ev, mark, { passive: true });
      });
    });
    function sync(from, id) {
      return function (r) {
        if (!r || syncing || !chartVisible(from)) { return; }
        if (from !== chart && !(Date.now() - (userInputAt[id] || 0) < 1500)) { return; }
        syncing = true;
        [chart, volChart, macdChart, kdChart].forEach(function (c) {
          if (c && c !== from && chartVisible(c)) { c.timeScale().setVisibleLogicalRange(r); }
        });
        syncing = false;
      };
    }
    chart.timeScale().subscribeVisibleLogicalRangeChange(sync(chart, 'chart'));
    volChart.timeScale().subscribeVisibleLogicalRangeChange(sync(volChart, 'volChart'));
    macdChart.timeScale().subscribeVisibleLogicalRangeChange(sync(macdChart, 'macdChart'));
    kdChart.timeScale().subscribeVisibleLogicalRangeChange(sync(kdChart, 'kdChart'));

    /* 十字線同步（2026/09/17 v44，管理者要求）。
       游標停在任何一張圖上，其他顯示中的圖在同一根 K 棒畫出同一條垂直線，上方讀數也換成那一根；
       游標離開就一起收掉。四張圖根數相同（MACD、KD 前段補空白點），同一個時間就是同一根。
       setCrosshairPosition 不會觸發對方的 subscribeCrosshairMove（lightweight-charts 4.1.3 實測），
       所以不會互相帶動成迴圈；仍加一道同步中旗標，函式庫日後改成會觸發時也不會打轉。
       讀數一律用時間去查表：滑在成交量或 MACD 上時，拿不到 K 線圖的 seriesData。 */
    var crossSyncing = false;
    var crossPanes = [
      { chart: chart, series: function () { return candleSeries; },
        price: function (key) { return candleMap[key] ? candleMap[key].close : null; } },
      { chart: volChart, series: function () { return volSeries; },
        price: function (key) { return volMap[key]; } },
      { chart: macdChart, series: function () { return macdSeries; },
        price: function (key) { return macdMap[key]; } },
      { chart: kdChart, series: function () { return kSeries; },
        price: function (key) { return kdMap[key] ? kdMap[key].k : null; } }
    ];
    function crossFrom(src) {
      return function (param) {
        if (crossSyncing) { return; }
        var on = !!(param && param.point && param.time !== undefined && param.time !== null);
        crossSyncing = true;
        try {
          crossPanes.forEach(function (p) {
            if (p.chart === src || !chartVisible(p.chart)) { return; }
            if (!on) { p.chart.clearCrosshairPosition(); return; }
            var price = p.price(String(param.time));
            // 算不出值的前段（KD 前 8 根）仍要畫垂直線，水平線放在任一個合法數值即可
            p.chart.setCrosshairPosition(price == null || !isFinite(price) ? 0 : price, param.time, p.series());
          });
        } finally {
          crossSyncing = false;
        }
        if (on) { showReadout(param.time); }
      };
    }
    crossPanes.forEach(function (p) { p.chart.subscribeCrosshairMove(crossFrom(p.chart)); });

    window.addEventListener('resize', function () {
      if (!$('detail').classList.contains('open')) { return; }
      chart.applyOptions({ width: $('chart').clientWidth });
      volChart.applyOptions({ width: $('volChart').clientWidth });
      macdChart.applyOptions({ width: $('macdChart').clientWidth });
      if (kdChart) { kdChart.applyOptions({ width: $('kdChart').clientWidth }); }
    });
  }

  /** 上方讀數列：某一根 K 棒的開高低收、量、MACD、KD、均線。游標在哪一張圖上都一樣。 */
  function showReadout(time) {
    var key = String(time);
    var c = candleMap[key];
    if (!c) { return; }
    $('rDate').textContent = typeof time === 'number'
      ? new Date(time * 1000).toISOString().slice(0, 16).replace('T', ' ')
      : key;
    $('rOpen').textContent = c.open.toFixed(2);
    $('rHigh').textContent = c.high.toFixed(2);
    $('rLow').textContent = c.low.toFixed(2);
    $('rClose').textContent = c.close.toFixed(2);
    $('rVol').textContent = volText(volMap[key]);
    var m = macdMap[key];
    $('rMacd').textContent = (m || m === 0) ? m.toFixed(3) : '—';
    var kd = kdMap[key];
    if ($('rKD')) { $('rKD').textContent = kd ? (kd.k.toFixed(1) + ' / ' + kd.d.toFixed(1)) : '—'; }
    Object.keys(maSeries).forEach(function (n) {
      var el = $('rMA' + n);
      var v = (maMaps[n] || {})[key];
      if (el) { el.textContent = v == null ? '—' : v.toFixed(2); }
    });
  }

  function restyleCharts() {
    if (!chart) { return; }
    chart.applyOptions(chartOptions());
    volChart.applyOptions(chartOptions());
    macdChart.applyOptions(chartOptions());
    if (kdChart) { kdChart.applyOptions(chartOptions()); }
    candleSeries.applyOptions({
      upColor: css('--rise'), downColor: css('--fall'),
      borderUpColor: css('--rise'), borderDownColor: css('--fall'),
      wickUpColor: css('--rise'), wickDownColor: css('--fall')
    });
    renderChart();
  }

  /** 日期字串轉 lightweight-charts 的時間。60 分 K 用 UNIX 秒，其餘用 yyyy-mm-dd。 */
  function toTime(d) {
    if (d.indexOf(' ') > 0) {
      var p = d.split(' ');
      var ymd = p[0].split('/');
      var hm = p[1].split(':');
      /* 台北時間的「時:分」直接當成圖表時間（2026/09/16 v38 修正）。
         圖表函式庫一律用 UTC 畫時間軸，先前扣 8 小時換成真正的 UTC，
         結果 09:00 那根在軸上顯示成 01:00、十字線讀數也差 8 小時。 */
      return Date.UTC(+ymd[0], +ymd[1] - 1, +ymd[2], +hm[0], +hm[1]) / 1000;
    }
    return d.replace(/\//g, '-');
  }

  /* 成交量（張）的顯示。整張取整數加千分位；不到一張（零股為主的冷門股）保留到股。 */
  function fmtLots(v) {
    if (v == null || !isFinite(v)) { return '\u2014'; }
    if (Math.abs(v) >= 1) { return Math.round(v).toLocaleString(); }
    return String(Math.round(v * 1000) / 1000);
  }
  function fmtLotsAxis(v) {
    if (Math.abs(v) >= 10000) { return (Math.round(v / 1000) / 10) + '萬'; }
    return fmtLots(v);
  }
  /* 十字線讀數。日K／週K 的原始資料是成交股數，另外列出股數，可以直接跟證交所的成交股數對。 */
  function volText(v) {
    if (v == null || !isFinite(v)) { return '\u2014'; }
    if (period === 'hour') { return fmtLots(v) + ' 張'; }
    return fmtLots(v) + ' 張（' + Math.round(v * 1000).toLocaleString() + ' 股）';
  }

  function sma(arr, n) {
    var out = [], sum = 0;
    for (var i = 0; i < arr.length; i++) {
      sum += arr[i].close;
      if (i >= n) { sum -= arr[i - n].close; }
      if (i >= n - 1) { out.push({ time: toTime(arr[i].date), value: sum / n }); }
    }
    return out;
  }

  /* EMA：以第一根的值當起點，之後 EMA＝今天×k＋昨天EMA×(1−k)，k＝2/(n+1)（2026/09/16 v42）。

     v41 改成「前 n 根簡單平均當起點」，DIF 要第 26 根、訊號線與柱狀圖要第 34 根才有值；
     週K 一年只有 53 根，MACD 左半邊整片空白（管理者回報）。改回台股看盤軟體常見的第一根起算，
     每一根都有值；前段尚未收斂，資料不到 26 根時整張 MACD 仍然收起來（見 paneShown）。
     null 的位置跳過不計，起點取第一個不是 null 的值。 */
  function ema(values, n) {
    var k = 2 / (n + 1), out = [], prev = null;
    for (var i = 0; i < values.length; i++) {
      var v = values[i];
      if (v == null) { out.push(null); continue; }
      prev = prev == null ? v : v * k + prev * (1 - k);
      out.push(prev);
    }
    return out;
  }

  function computeMacd(arr) {
    var closes = arr.map(function (r) { return r.close; });
    var e12 = ema(closes, 12), e26 = ema(closes, 26);
    // DIF＝EMA12−EMA26，DEA＝DIF 的 9 日 EMA，柱狀圖＝(DIF−DEA)×2，每一根都有值
    var dif = closes.map(function (_, i) { return (e12[i] == null || e26[i] == null) ? null : e12[i] - e26[i]; });
    var dea = ema(dif, 9);
    macdMap = {};
    var m = [], s = [], h = [];
    arr.forEach(function (r, i) {
      var t = toTime(r.date);
      // 算不出來的前段仍放一個只有時間的空白點，根數與 K 線相同，四張圖才對得齊
      m.push(dif[i] == null ? { time: t } : { time: t, value: dif[i] });
      s.push(dea[i] == null ? { time: t } : { time: t, value: dea[i] });
      if (dif[i] == null || dea[i] == null) {
        h.push({ time: t });
      } else {
        var bar = (dif[i] - dea[i]) * 2;
        h.push({ time: t, value: bar, color: bar >= 0 ? css('--rise') : css('--fall') });
      }
      if (dif[i] != null) { macdMap[String(t)] = dif[i]; }
    });
    return { m: m, s: s, h: h };
  }

  var kdMap = {};

  /**
   * KD 隨機指標。標準參數 9 日 RSV，K 與 D 各取 1/3 平滑。
   * RSV = (收盤 - 期間最低) / (期間最高 - 期間最低) x 100
   * K = 前一日K x 2/3 + RSV x 1/3，D = 前一日D x 2/3 + K x 1/3
   * 首日無前值，慣例以 50 起算。
   */
  function computeKD(arr, n) {
    n = n || 9;
    kdMap = {};
    var kArr = [], dArr = [], jArr = [];
    var k = 50, d = 50;

    for (var i = 0; i < arr.length; i++) {
      /* 前 n-1 根算不出 KD，仍放一個只有時間的空白點（2026/09/16 v38 修正）。
         四張圖是用「第幾根」同步橫軸的；KD 少了前 8 根，第 0 根對到的是 K 線的第 8 根，
         整張 KD 圖會往右錯 8 根，同步時還會把 K 線圖的可視範圍拉成 KD 的長度。 */
      if (i < n - 1) {
        var blank = toTime(arr[i].date);
        kArr.push({ time: blank }); dArr.push({ time: blank }); jArr.push({ time: blank });
        continue;
      }
      var win = arr.slice(i - n + 1, i + 1);
      var hi = Math.max.apply(null, win.map(function (r) { return r.high; }));
      var lo = Math.min.apply(null, win.map(function (r) { return r.low; }));
      var rsv = (hi === lo) ? 50 : (arr[i].close - lo) / (hi - lo) * 100;

      k = k * 2 / 3 + rsv / 3;
      d = d * 2 / 3 + k / 3;
      var j = 3 * k - 2 * d;

      var t = toTime(arr[i].date);
      kArr.push({ time: t, value: k });
      dArr.push({ time: t, value: d });
      jArr.push({ time: t, value: j });
      kdMap[String(t)] = { k: k, d: d, j: j };
    }
    return { k: kArr, d: dArr, j: jArr };
  }

  function computeBoll(arr, n, k) {
    var up = [], mid = [], low = [];
    for (var i = n - 1; i < arr.length; i++) {
      var win = arr.slice(i - n + 1, i + 1).map(function (r) { return r.close; });
      var avg = win.reduce(function (a, b) { return a + b; }, 0) / n;
      var sd = Math.sqrt(win.reduce(function (a, b) { return a + Math.pow(b - avg, 2); }, 0) / n);
      var t = toTime(arr[i].date);
      up.push({ time: t, value: avg + k * sd });
      mid.push({ time: t, value: avg });
      low.push({ time: t, value: avg - k * sd });
    }
    return [up, mid, low];
  }

  function drawMaLegend() {
    var base = $('readout');
    base.querySelectorAll('.ma-legend').forEach(function (e) { e.remove(); });
    var frag = document.createElement('span');
    frag.className = 'ma-legend';
    frag.style.display = 'contents';
    frag.innerHTML = maList.map(function (n) { return '<span><b>MA' + n + '</b><i id="rMA' + n + '">—</i></span>'; }).join('');
    base.appendChild(frag);
  }

  function renderChart() {
    // 圖表元件從 CDN 載入；被擋或斷線時不丟例外，留一句說明（v54，與績效走勢同一種處理）
    if (!window.LightweightCharts) {
      $('chart').innerHTML = '<p class="emptyline">K 線圖元件沒有載入成功，上方持有與基本面仍是完整資料；重新整理後再試一次。</p>';
      return;
    }
    initCharts();
    if (!rawData.length) { return; }

    candleMap = {};
    candleSeries.setData(rawData.map(function (r) {
      var bar = { time: toTime(r.date), open: r.open, high: r.high, low: r.low, close: r.close };
      candleMap[String(bar.time)] = bar;
      return bar;
    }));
    volMap = {};
    volSeries.setData(rawData.map(function (r) {
      var t = toTime(r.date);
      volMap[String(t)] = r.volume;
      return { time: t, value: r.volume, color: r.close >= r.open ? css('--rise') : css('--fall') };
    }));

    Object.keys(maSeries).forEach(function (n) { chart.removeSeries(maSeries[n]); });
    maSeries = {};
    maMaps = {};
    var palette = [css('--wait'), css('--beam'), css('--muted'), '#8E7CC3', '#5B8FF9'];
    maList.forEach(function (n, i) {
      if (rawData.length < n) { return; }
      var s = chart.addLineSeries({ color: palette[i % palette.length], lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
      var line = sma(rawData, n);
      s.setData(line);
      maMaps[n] = {};
      line.forEach(function (pt) { maMaps[n][String(pt.time)] = pt.value; });
      maSeries[n] = s;
    });

    bollSeries.forEach(function (s) { chart.removeSeries(s); });
    bollSeries = [];
    if (showBoll && rawData.length >= 20) {
      computeBoll(rawData, 20, 2).forEach(function (b, i) {
        var s = chart.addLineSeries({
          color: css('--muted'), lineWidth: 1, lineStyle: i === 1 ? 0 : 2,
          priceLineVisible: false, lastValueVisible: false
        });
        s.setData(b);
        bollSeries.push(s);
      });
    }

    var md = computeMacd(rawData);
    macdSeries.setData(md.m); signalSeries.setData(md.s); histSeries.setData(md.h);

    if (rawData.length >= 9) {
      var kd = computeKD(rawData, 9);
      kSeries.setData(kd.k); dSeries.setData(kd.d); jSeries.setData(kd.j);
    } else {
      // 不到 9 根算不出 KD，但仍要與 K 線同樣根數，橫軸才對得齊
      var blanks = rawData.map(function (r) { return { time: toTime(r.date) }; });
      kSeries.setData(blanks); dSeries.setData(blanks.slice()); jSeries.setData(blanks.slice());
      kdMap = {};
    }

    applyPanes();

    chart.applyOptions({ width: $('chart').clientWidth, timeScale: { timeVisible: period === 'hour' } });
    volChart.applyOptions({ width: $('volChart').clientWidth, timeScale: { timeVisible: period === 'hour' } });
    if (paneShown('macd')) { macdChart.applyOptions({ width: $('macdChart').clientWidth, timeScale: { timeVisible: period === 'hour' } }); }
    if (paneShown('kd')) { kdChart.applyOptions({ width: $('kdChart').clientWidth, timeScale: { timeVisible: period === 'hour' } }); }

    applyChartRange();
    drawMaLegend();
  }

  /* 區間起點：最後一根往回 months 個月那一天之後的第一根。
     日期用字串算，不用 Date.setMonth——3/31 往回一個月會溢位成 3/3。 */
  function rangeStartIndex(data, months) {
    var last = String(data[data.length - 1].date).slice(0, 10).split('/');
    var y = Number(last[0]), m = Number(last[1]) - months, d = Number(last[2]);
    while (m < 1) { m += 12; y--; }
    var dim = new Date(y, m, 0).getDate();
    var cut = y + '/' + ('0' + m).slice(-2) + '/' + ('0' + Math.min(d, dim)).slice(-2);
    for (var i = 0; i < data.length; i++) {
      if (String(data[i].date).slice(0, 10) >= cut) { return i; }
    }
    return data.length - 1;
  }

  /* 資料少的股票（2026/09/16 v41、v42 調整）。

     股票是列入觀望或持股之後才開始收錄，剛列入的可能只有幾天 60 分 K。
     資料不夠長的區間按鈕停用，滑過去說明資料從哪天開始；選好的區間記著，換到資料夠長的股票時自動恢復。

     v41 另外做過「每根超過 16 像素就靠右排列、左邊留白、鎖住拖曳縮放」。實際在寬螢幕上，
     一年 53 根週K 就會觸發：左半邊一片空白、滾輪也不能放大（管理者 2026/09/16 回報）。
     v42 拿掉這個模式：不論資料多少，一律填滿整個寬度，滾輪縮放與拖曳隨時可用。 */

  /** 選好的區間在這一檔資料上是否有意義（資料比這個區間長）。 */
  function rangeUsable(r) {
    return r === 'all' || (rawData.length > 0 && rangeStartIndex(rawData, Number(r)) > 0);
  }
  function effectiveRange() { return rangeUsable(chartRange) ? chartRange : 'all'; }

  function updateRangeButtons() {
    var first = rawData.length ? String(rawData[0].date).slice(0, 10) : '';
    var eff = effectiveRange();
    document.querySelectorAll('[data-krange]').forEach(function (b) {
      var r = b.dataset.krange, ok = rangeUsable(r);
      b.disabled = !ok;
      b.title = ok ? '' : ('這一檔的資料從 ' + first + ' 開始，不滿' + (r === '12' ? '一年' : ' ' + r + ' 個月') + '，與「全部」相同');
      b.setAttribute('aria-pressed', r === eff ? 'true' : 'false');
    });
  }

  function applyChartRange() {
    var n = rawData.length;
    if (!n || !chart) { return; }
    var eff = effectiveRange();
    var from = eff === 'all' ? 0 : rangeStartIndex(rawData, Number(eff));
    /* 每一張顯示中的圖直接套同一個範圍，不靠同步事件。
       同步事件是非同步的：換週期時前一個週期留在副圖上的範圍，可能晚一步經由同步蓋回 K 線圖。
       四張圖根數相同（KD 前段補空白點），同一組「第幾根」就是同一段時間。 */
    var range = { from: from - 0.5, to: n - 0.5 };
    [chart, volChart, macdChart, kdChart].forEach(function (c) {
      if (!c || (c === macdChart && !paneShown('macd')) || (c === kdChart && !paneShown('kd'))) { return; }
      // 一律填滿寬度；左右邊界鎖在資料兩端（拖不出空白），滾輪縮放、拖曳、觸控都開著
      c.applyOptions({
        timeScale: { fixLeftEdge: true, fixRightEdge: true },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: true, axisDoubleClickReset: true }
      });
      c.timeScale().setVisibleLogicalRange(range);
    });
    updateRangeButtons();
    updateIndicatorCaps(n);
  }

  /** 副圖標題：根數不夠時說明哪一段算不出來。 */
  function updateIndicatorCaps(n) {
    var mc = document.querySelector('#macdCap span'), kc = document.querySelector('#kdCap span');
    if (mc) {
      mc.textContent = '12 / 26 / 9' + (n && n < 26 ? '　資料 ' + n + ' 根，MACD 至少要 26 根才顯示' : '');
    }
    if (kc) { kc.textContent = '9' + (n && n < 9 ? '　資料 ' + n + ' 根，KD 至少要 9 根才算得出' : ''); }
  }

  /* K 線下方的說明加上資料範圍，一眼分得出「圖只顯示一部分」還是「資料庫本來就只有這麼多」。 */
  function kCoverageNote(data, p) {
    if (!data.length) { return ''; }
    var first = String(data[0].date).slice(0, 10), last = String(data[data.length - 1].date).slice(0, 10);
    var unit = p === 'month' ? '月K' : p === 'week' ? '週K' : p === 'hour' ? '60分K' : '日K';
    var days = {};
    data.forEach(function (r) { days[String(r.date).slice(0, 10)] = 1; });
    var note = '　資料範圍 ' + first + ' ～ ' + last + '，共 ' + data.length + ' 根' + unit +
               (p === 'hour' ? '（' + Object.keys(days).length + ' 個交易日）' : '') + '。';
    // 不滿 11 個月：是資料庫本來就只有這麼多，不是圖沒顯示出來
    if (p !== 'hour' && rangeStartIndex(data, 11) === 0) {
      note += '資料庫目前只有這段期間；列入觀望或持股的股票每天 16:45 會自動往回補，最多補到近一年。';
    }
    if (p === 'hour' && rangeStartIndex(data, 1) === 0) {
      note += '這一檔的 60 分 K 從 ' + first + ' 起才收錄，所以各區間顯示的是同一段。';
    }
    return note;
  }

  /* 副圖算得出值才顯示圖（2026/09/16 v41）。MACD 至少要 26 根、KD 至少要 9 根；
     不夠時只留標題列（上面寫著還差多少），不放一整塊空白圖。 */
  function paneShown(name) {
    if (!panes[name]) { return false; }
    if (name === 'macd') { return rawData.length >= 26; }
    if (name === 'kd') { return rawData.length >= 9; }
    return true;
  }

  function applyPanes() {
    $('macdChart').hidden = !paneShown('macd');
    $('kdChart').hidden = !paneShown('kd');
    var mc = $('macdCap'); if (mc) { mc.hidden = !panes.macd; }
    var kc = $('kdCap'); if (kc) { kc.hidden = !panes.kd; }
    // 最下面那張圖要有底線，中間的不要，才不會出現雙線
    var last = paneShown('kd') ? $('kdChart') : (paneShown('macd') ? $('macdChart') : $('volChart'));
    [$('volChart'), $('macdChart'), $('kdChart')].forEach(function (el) {
      el.style.borderBottom = (el === last) ? '1px solid var(--rule)' : 'none';
    });
    setTimeout(function () {
      var r = chart.timeScale().getVisibleLogicalRange();
      volChart.applyOptions({ width: $('volChart').clientWidth });
      if (r) { volChart.timeScale().setVisibleLogicalRange(r); }
      if (paneShown('macd')) {
        macdChart.applyOptions({ width: $('macdChart').clientWidth });
        if (r) { macdChart.timeScale().setVisibleLogicalRange(r); }
      }
      if (paneShown('kd')) {
        kdChart.applyOptions({ width: $('kdChart').clientWidth });
        if (r) { kdChart.timeScale().setVisibleLogicalRange(r); }
      }
    }, 30);
  }

  document.querySelectorAll('[data-pane]').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.dataset.pane;
      // MACD 與 KD 各自獨立開關，互不牽制，也可以兩張都關掉。
      panes[p] = !panes[p];
      b.setAttribute('aria-pressed', panes[p] ? 'true' : 'false');
      renderChart();
    });
  });

  var candleRequest = 0;
  /* K 線讀取（2026/09/16 v41）：一次取回日K、週K、60 分 K，存在這一頁的記憶體裡 3 分鐘。
     切換日／週／60分直接用暫存，不再每按一次就等一次伺服器；同一檔正在取的時候不重複送出。 */
  var candleMemo = {}, candlePending = {};
  var CANDLE_MEMO_MS = 3 * 60 * 1000;

  function loadCandles(code, p, background) {
    ++candleRequest;
    var memo = candleMemo[code];
    if (memo && Date.now() - memo.at < CANDLE_MEMO_MS && Object.prototype.hasOwnProperty.call(memo, p)) {
      showCandles(p, memo[p]);
      return;
    }
    if(!background){rawData = [];setChartVisible(false);$('periodNote').textContent = 'K 線載入中…';}
    if (candlePending[code]) { return; }   // 回來時會畫當下選的週期
    candlePending[code] = true;
    google.script.run.withSuccessHandler(function (b) {
      delete candlePending[code];
      candleMemo[code] = { at: Date.now(), day: (b && b.day) || [], week: (b && b.week) || [], month:(b && b.month)||[], hour: (b && b.hour) || [], hourCoverage:b&&b.hourCoverage };
      if (code !== currentCode || !$('detail').classList.contains('open')) { return; }
      var viewport=background&&chart&&chart.timeScale().getVisibleLogicalRange?chart.timeScale().getVisibleLogicalRange():null;
      showCandles(period, candleMemo[code][period] || []);
      if(viewport){chart.timeScale().setVisibleLogicalRange(viewport);}
    }).withFailureHandler(function () {
      delete candlePending[code];
      if (code !== currentCode) { return; }
      if(background){$('periodNote').textContent+='　更新暫未成功，保留上次圖表。';return;}
      // 失敗的時候也要收起來，連線斷掉時那一大塊白方塊照樣會留在畫面上。
      setChartVisible(false);
      $('periodNote').textContent = 'K 線載入失敗，請重新整理再試。';
    }).apiGetCandlesBundle(code);
  }

  // 只更新正在看的個股，不開全宇宙輪詢；3分鐘共用快取到期才取新值。
  setInterval(function(){
    if(document.hidden||!currentCode||!$('detail').classList.contains('open')||candlePending[currentCode]){return;}
    var at=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
    var parts={};at.forEach(function(p){parts[p.type]=p.value;});
    var hm=Number(parts.hour)*100+Number(parts.minute);
    if(['Mon','Tue','Wed','Thu','Fri'].indexOf(parts.weekday)<0||hm<900||hm>1405){return;}
    loadCandles(currentCode,period,true);
  },180000);

  function showCandles(p, rows) {
    rawData = rows || [];

    if (!rawData.length) {
      // 資料庫沒有這一檔或這個週期的資料，就直接說明，不再現爬空轉。
      if (p === 'hour') {
        $('periodNote').textContent = '這一檔尚無 60 分 K；歷史補抓在背景進行。請先看日 K，管理者可查分K補抓進度。';
      } else {
        $('periodNote').textContent = '資料庫沒有這一檔的' +
          (p === 'month' ? '月' : p === 'week' ? '週' : '日') + 'K。這一檔還沒有列入觀望或持股，' +
          '所以沒有建立技術快取。';
      }
      /* 沒有 K 棒就把圖表收起來。

         三個圖表容器加起來 600px 高，沒有資料時就是 600px 的白方塊，
         下面才一行小灰字說明為什麼。那個白方塊看起來像壞掉，
         而它其實只是「這一檔他只是口頭提過，沒有進追蹤清單」。 */
      setChartVisible(false);
      renderChart();
      return;
    }

    setChartVisible(true);
    $('periodNote').textContent = (PERIOD_NOTE[p] || '') + kCoverageNote(rawData, p);
    if(p==='hour'&&candleMemo[currentCode]&&candleMemo[currentCode].hourCoverage){var hc=candleMemo[currentCode].hourCoverage;$('periodNote').textContent+='　'+hc.source+'。'+(hc.note||'');}
    var preview = rawData.find(function(r){return r._provisional;});
    if(preview) $('periodNote').textContent += '　盤中預覽（快取更新 '+preview._asOf+'），尚非正式收盤日K，不計入績效。';
    renderChart();
  }

  /* 圖表區的顯示與隱藏。工具列一起收——沒有資料時留著一排均線按鈕，
     按了什麼都不會發生，比直接收起來更讓人困惑。 */
  function setChartVisible(on) {
    ['chart', 'volCap', 'volChart', 'macdChart', 'kdChart', 'macdCap', 'kdCap', 'readout'].forEach(function (id) {
      var el = $(id);
      if (el) { el.hidden = !on; }
    });
    // 圖表工具列在抽屜裡（#detail），不是在個股面板裡。
    // 有「日／週／60分」那一列一律留著：60 分 K 沒資料時整排收起來，就沒有按鈕可以切回日K。
    document.querySelectorAll('#detail .chartbar')
      .forEach(function (el) { el.hidden = !on && !el.querySelector('[data-period]'); });
  }

  document.querySelectorAll('[data-krange]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.disabled) { return; }
      chartRange = b.dataset.krange;
      applyChartRange();   // 會一併更新按鈕的按下狀態
    });
  });

  document.querySelectorAll('[data-period]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-period]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      period = b.dataset.period;
      if (currentCode) { loadCandles(currentCode, period); }
    });
  });

  document.querySelectorAll('[data-ma]').forEach(function (b) {
    b.addEventListener('click', function () {
      var n = Number(b.dataset.ma);
      var on = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', on ? 'false' : 'true');
      if (on) { maList = maList.filter(function (x) { return x !== n; }); }
      else { maList.push(n); maList.sort(function (a, c) { return a - c; }); }
      renderChart();
    });
  });

  $('maAdd').addEventListener('click', function () {
    var n = Number($('maInput').value);
    if (!n || n < 2 || maList.indexOf(n) >= 0) { return; }
    maList.push(n); maList.sort(function (a, b) { return a - b; });
    $('maInput').value = '';
    renderChart();
  });

  $('bollBtn').addEventListener('click', function () {
    showBoll = !showBoll;
    $('bollBtn').setAttribute('aria-pressed', showBoll ? 'true' : 'false');
    renderChart();
  });

  /* ---------------- 個股查詢 ---------------- */
  attachSuggest('stockInput', 'suggestList', function (code) { $('stockInput').value = code; doSearch(code); });
  $('stockBtn').addEventListener('click', function () { doSearch($('stockInput').value.trim()); });
  $('stockInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { $('stockBtn').click(); } });

  function doSearch(kw) {
    if (!kw) { return; }
    USE.act('查股票', kw);
    $('stockRecord').innerHTML = '<p class="notice">查詢中</p>';
    var asked = kw;
    google.script.run.withSuccessHandler(function (r) {
      if ($('stockInput').value.trim() && $('stockInput').value.trim() !== asked) { return; }   // 已經改查別的，舊回應不蓋新畫面
      if (!r.found) {
        // 代號本身合法時照樣打開行情圖：影片沒提過，但使用者仍想看走勢（v54）。
        var target = isCode(kw) ? kw : (r.resolvedCode || '');
        $('stockRecord').innerHTML = emptyBlock('影片中沒有提到這一檔',
          target ? '下方只有行情與基本面，沒有講者的紀錄。' : '請確認名稱或改用代號查詢（例如 2330）。');
        if (target) { openDetail(target); }
        return;
      }
      $('stockRecord').innerHTML =
        (r.aliasOf ? '<p class="notice" style="margin:0 0 10px">「' + esc(kw) + '」是「' + esc(r.aliasOf) + '」的常見聽錯寫法，下面是「' + esc(r.aliasOf) + '」的紀錄。</p>' : '') +
        '<div class="sect-h"><h2>影片中提到的紀錄<small>' + r.trades.length + ' 筆</small></h2></div>' +
        /* 這張表原本沒有 class 也沒有 colgroup，欄寬全交給瀏覽器自動分配。
           中文每個字之間都是合法斷點，於是「台積電」被拆成「台積／電」、
           「會員持股」拆成「會員持／股」。補上 colgroup 就定得住。 */
        '<div class="card flush scrollx"><table class="tbl-find">' +
        '<colgroup><col class="c-date"><col class="c-name"><col class="c-code">' +
        '<col class="c-dir"><col class="c-px"><col class="c-reason"></colgroup>' +
        '<thead><tr>' +
        '<th>日期</th><th>股票名稱</th><th>代號</th><th>方向</th><th>價位說明</th><th>說明重點</th>' +
        '</tr></thead><tbody>' +
        r.trades.map(function (t) {
          var c = t.direction.indexOf('買') === 0 ? 'dir-buy' : t.direction.indexOf('賣') === 0 ? 'dir-sell' : 'dir-watch';
          var can = isCode(t.code);
          return '<tr' + (can ? ' class="clickable" data-code="' + t.code + '"' : '') + '>' +
            '<td class="code">' + esc(t.date) + '</td>' +
            '<td>' + nameCell(t.name, t.code) + '</td>' +
            '<td class="code">' + esc(t.code) + '</td>' +
            '<td class="' + c + '">' + esc(t.direction) + '</td>' +
            '<td class="pxnote">' + esc(t.price) + '</td><td class="reason">' + esc(publicNarrative_(t.reason,t)) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      bindRows($('stockRecord'));
      // 輸入名稱或別名、結果只有一檔時也直接開圖（先前只有輸入代號才開）。
      var code = isCode(kw) ? kw : (r.resolvedCode || '');
      if (code) { openDetail(code); }
    }).apiSearchStock(kw, ($('subEmail') || {}).value || '');
  }

  /* ---------------- 訂閱 ----------------
     「關注股票被明講賣出時提醒」拿掉了（2026/09/16 管理者要求）：訂閱只剩每日總覽與盤中即時通知。 */

  $('subBtn').addEventListener('click', function () {
    var msg = $('subMsg');
    msg.className = 'notice';
    msg.textContent = '送出中';
    $('subBtn').disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      $('subBtn').disabled = false;
      msg.className = 'notice ' + (r.ok ? 'ok' : 'err');
      msg.textContent = r.message;
      if (r.ok) { loadContext($('subEmail').value.trim()); }
    }).withFailureHandler(function () {
      $('subBtn').disabled = false;
      msg.className = 'notice err';
      msg.textContent = '送出失敗，請稍後再試。';
    }).apiSubscribe({
      email: $('subEmail').value.trim(),
      daily: $('subDaily').checked,
      sms: $('subSms') ? $('subSms').checked : false
    });
  });

  function loadContext(email) {
    if (!email) { return; }
    google.script.run.withSuccessHandler(function (c) {
      if (!c.recent.length) { return; }
      $('recentTags').innerHTML = '<span class="notice" style="margin:0 8px 0 0;">常查詢</span>' +
        c.recent.map(function (k) { return '<span class="watchtag" data-k="' + esc(k) + '">' + esc(k) + '</span>'; }).join('');
      $('recentTags').querySelectorAll('[data-k]').forEach(function (el) {
        el.style.cursor = 'pointer';
        el.addEventListener('click', function () { $('stockInput').value = el.dataset.k; doSearch(el.dataset.k); });
      });
    }).apiGetUserContext(email);
  }

  /* ---------------- 助手 ---------------- */
  var sessionId, curModel = '', userKey = '';
  var KEY_STORE = 'gemini_key';

  try {
    sessionId = localStorage.getItem('sid');
    if (!sessionId) {
      sessionId = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('sid', sessionId);
    }
    userKey = localStorage.getItem(KEY_STORE) || '';
  } catch (e) {
    sessionId = 's' + Math.random().toString(36).slice(2, 10);
  }

  var HINTS = [
    '幫我訂閱每日總覽',
    '我想追蹤 2330 和 4916',
    '台積電最近一次被提到是什麼時候',
    '這個網站有哪些功能'
  ];

  function renderHints() {
    $('askHints').innerHTML = HINTS.map(function (h) {
      return '<button data-h="' + esc(h) + '">' + esc(h) + '</button>';
    }).join('');
    $('askHints').querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { $('askInput').value = b.dataset.h; send(); });
    });

  var greeted = false;

  function showChat(models) {
    $('keyBar').hidden = true;
    $('keyBarOk').hidden = false;
    $('chatWin').hidden = false;
    var ht = $('keyHowto'); if (ht) { ht.hidden = true; }
    if (models && models.length) {
      $('modelSel').innerHTML = models.map(function (m) {
        return '<option value="' + esc(m.id) + '" data-note="' + esc(m.note) + '">' + esc(m.label) + '</option>';
      }).join('');
      curModel = models[0].id;
      $('modelNote').textContent = models[0].note;
    }
    renderHints();
    // 進入版面先主動問候一次
    if (!greeted && !$('askLog').children.length) {
      greeted = true;
      push('bot', '嗨，我是你的小助手。需要我為你服務嗎？我可以幫你完成訂閱，或查資料庫裡張震講過的紀錄。直接打字跟我說就行。');
    }
    $('askInput').focus();
  }

  function showGate() {
    $('keyBar').hidden = false;
    $('keyBarOk').hidden = true;
    $('chatWin').hidden = true;
    var ht = $('keyHowto'); if (ht) { ht.hidden = false; }
  }

  $('keySave').addEventListener('click', function () {
    var k = $('keyInput').value.trim();
    if (!k) { $('keyMsg').className = 'notice err'; $('keyMsg').textContent = '請先貼上金鑰。'; return; }

    $('keySave').disabled = true;
    $('keyMsg').className = 'notice';
    $('keyMsg').textContent = '驗證中，正在實測這把金鑰能用哪些模型';

    google.script.run.withSuccessHandler(function (r) {
      $('keySave').disabled = false;
      if (!r.ok) {
        $('keyMsg').className = 'notice err';
        $('keyMsg').textContent = r.message;
        return;
      }
      userKey = k;
      try { localStorage.setItem(KEY_STORE, k); } catch (e) {}
      $('keyMsg').className = 'notice ok';
      $('keyMsg').textContent = r.message;
      $('keyInput').value = '';
      showChat(r.models);
    }).withFailureHandler(function () {
      $('keySave').disabled = false;
      $('keyMsg').className = 'notice err';
      $('keyMsg').textContent = '驗證失敗，請稍後再試。';
    }).apiValidateKey(k);
  });

  $('keyInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { $('keySave').click(); } });

  $('keyClear').addEventListener('click', function () {
    userKey = '';
    try { localStorage.removeItem(KEY_STORE); } catch (e) {}
    $('askLog').innerHTML = '';
    greeted = false;
    renderDraft(null);
    google.script.run.apiResetSession(sessionId);
    showGate();
    $('keyMsg').className = 'notice';
    $('keyMsg').textContent = '金鑰已從這台裝置清除。若擔心外流，記得也到 AI Studio 把那把金鑰刪掉。';
  });

  // 已存過金鑰就直接進聊天。這裡也要實測，不能列出全部模型，
  // 否則使用者會看到他的金鑰其實不能用的選項。
  if (userKey) {
    google.script.run.withSuccessHandler(function (r) {
      if (r.ok) { showChat(r.models); }
      else {
        showGate();
        $('keyMsg').className = 'notice err';
        $('keyMsg').textContent = r.message + '　請重新貼一次金鑰。';
      }
    }).withFailureHandler(function () { showGate(); }).apiValidateKey(userKey);
  }

  $('modelSel').addEventListener('change', function () {

    $('modelNote').textContent = o ? o.dataset.note : '';

  function renderDraft(d) {

    function cell(k, v, ok) {
      return '<span><b>' + k + '</b><span class="' + (ok ? 'ok' : 'no') + '">' + v + '</span></span>';
    }
    $('draftBox').innerHTML =
      cell('Email', d.email || '尚未提供', !!d.email) +

      cell('盤中即時通知', d.sms === null || d.sms === undefined ? '尚未確認' : (d.sms ? '要' : '不要'), d.sms === true);
    $('draftBox').hidden = false;
  }

  // Q 版頭像。男生／女生各一款，可選顏色。存在 localStorage。

  var AVATAR_STORE = 'zc_avatar';
  var avatar = { sex: 'boy', color: AV_COLORS[0] };
  try { var sv = JSON.parse(localStorage.getItem(AVATAR_STORE) || 'null'); if (sv) { avatar = sv; } } catch (e) {}

  function faceSvg(sex, color) {
    // 圓臉 Q 版：男生短瀏海，女生兩側包髮
    var hair = sex === 'girl'
      ? '<path d="M14 6.5c9 0 13 6 13 15 0 2-1 4-2.4 5 .3-3-.6-6-.6-6H4.9s-.9 3-.6 6C2.9 30.5 2 28.5 2 26.5c0-9 4-15 12-20z" fill="' + color + '"/>' +
        '<path d="M4.4 22c0 5 .4 8 .4 8H2.6s-1-9 1.8-8zM24.6 22c0 5-.4 8-.4 8h2.2s1-9-1.8-8z" fill="' + color + '"/>'
      : '<path d="M14 5.5c8 0 12 5.5 12 13H16.5c0-2-1-3.5-2.5-3.5S11.5 16.5 11.5 18.5H2c0-7.5 4-13 12-13z" fill="' + color + '"/>';
    return '<svg viewBox="0 0 28 34" aria-hidden="true">' +
      '<circle cx="14" cy="18.5" r="10.5" fill="#FFE0C2"/>' + hair +
      '<circle cx="10.4" cy="19" r="1.5" fill="#3a2a20"/><circle cx="17.6" cy="19" r="1.5" fill="#3a2a20"/>' +
      '<circle cx="8.2" cy="22" r="1.4" fill="#F7A9A0" opacity=".7"/><circle cx="19.8" cy="22" r="1.4" fill="#F7A9A0" opacity=".7"/>' +

  function userAvatarHtml() {
    return '<span class="av-chat av-user" style="background:' +
      avatar.color + '22;border-color:' + avatar.color + '55">' + faceSvg(avatar.sex, avatar.color) + '</span>';

  var AV_BOT = '<span class="av-chat av-bot"><svg viewBox="0 0 28 34" aria-hidden="true">' +
    '<rect x="5" y="10" width="18" height="14" rx="4" fill="#5BB4D6"/>' +
    '<circle cx="11" cy="17" r="2.1" fill="#fff"/><circle cx="17" cy="17" r="2.1" fill="#fff"/>' +
    '<circle cx="11" cy="17" r="1" fill="#2b3a44"/><circle cx="17" cy="17" r="1" fill="#2b3a44"/>' +
    '<path d="M11 21h6" stroke="#2b3a44" stroke-width="1.4" stroke-linecap="round"/>' +
    '<path d="M14 6v4" stroke="#5BB4D6" stroke-width="1.6"/><circle cx="14" cy="5" r="1.6" fill="#F4A63B"/>' +
    '<rect x="8" y="24" width="12" height="3" rx="1.5" fill="#4a9cbd"/></svg></span>';

  function renderAvatarPicker() {
    var grid = $('apGrid'); if (!grid) { return; }
    var html = '';
    ['boy', 'girl'].forEach(function (sex) {
      AV_COLORS.forEach(function (c) {
        var on = (avatar.sex === sex && avatar.color === c);
        html += '<button class="ap-i' + (on ? ' on' : '') + '" data-sex="' + sex + '" data-color="' + c +
          '" style="background:' + c + '22;border-color:' + (on ? c : 'transparent') + '">' +

    grid.querySelectorAll('.ap-i').forEach(function (b) {
      b.addEventListener('click', function () {
        avatar = { sex: b.dataset.sex, color: b.dataset.color };
        try { localStorage.setItem(AVATAR_STORE, JSON.stringify(avatar)); } catch (e) {}
        renderAvatarPicker();
        // 已顯示的使用者頭像即時換色
        $('askLog').querySelectorAll('.msg.me .av-user').forEach(function (el) {

  (function bindAvatar() {
    var btn = $('avatarBtn'), pick = $('avatarPick');
    if (!btn || !pick) { return; }
    btn.addEventListener('click', function () {
      pick.hidden = !pick.hidden;
      if (!pick.hidden) { renderAvatarPicker(); }
    });
  })();

  function push(role, html, cls) {
    var av = role === 'me' ? userAvatarHtml() : AV_BOT;
    var b = '<div class="bubble' + (cls ? ' ' + cls : '') + '"' +
            (cls === 'thinkbox' ? ' id="pending"' : '') + '>' + html + '</div>';
    $('askLog').insertAdjacentHTML('beforeend',
      '<div class="msg ' + role + '">' + (role === 'me' ? b + av : av + b) + '</div>');
    $('askLog').scrollTop = $('askLog').scrollHeight;
  }

  function send() {
    var q = $('askInput').value.trim();
    if (!q) { return; }

    var log = $('askLog');
    push('me', esc(q));
    push('bot', '<span class="thinking"><i></i><i></i><i></i><i></i></span>翻紀錄中', 'thinkbox');
    $('askInput').value = '';
    $('askBtn').disabled = true;

    google.script.run.withSuccessHandler(function (r) {
      $('askBtn').disabled = false;
      var p = $('pending');
      p.id = '';
      p.className = 'bubble';
      p.textContent = r.reply;
      if (r.done) { p.className = 'bubble done'; }
      else if (r.intent === 'refuse') { p.className = 'bubble refuse'; }
      else if (!r.ok) { p.className = 'bubble refuse'; }
      log.scrollTop = log.scrollHeight;

      if (r.intent === 'subscribe' && r.draft) { renderDraft(r.draft); }
      if (r.done) { renderDraft(null); }
    }).withFailureHandler(function () {
      $('askBtn').disabled = false;
      var p = $('pending');
      p.id = '';
      p.className = 'bubble refuse';
      p.textContent = '目前無法回覆，請稍後再試。';
      log.scrollTop = log.scrollHeight;
    }).apiAsk(q, sessionId, curModel, userKey);
  }

  $('askBtn').addEventListener('click', send);
  $('askInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { send(); } });

  $('askReset').addEventListener('click', function () {
    google.script.run.apiResetSession(sessionId);
    $('askLog').innerHTML = '';
    greeted = false;
    renderDraft(null);
    $('askInput').focus();
  });

  /* ---------------- 管理現有訂閱 ----------------

     直接在這一張卡片裡查看與勾選，不寄信、也不另開頁面。 */
  var MG_EMAIL = '';

  function mgMsg(kind, text) {
    var m = $('mgMsg');
    m.className = 'notice ' + (kind || '');
    m.textContent = text || '';
  }

  function mgRender(r) {
    MG_EMAIL = r.email;
    $('mgWho').textContent = r.email;
    $('mgSince').textContent = r.createdAt ? '訂閱於 ' + r.createdAt : '';
    $('mgDaily').checked = !!r.daily;
    $('mgSms').checked = !!r.sms;
    $('mgPanel').hidden = false;
    mgMsg('', '');
  }

  $('unsubBtn').addEventListener('click', function () {
    var e = $('unsubEmail').value.trim();
    var msg = $('unsubMsg');
    if (!e) { msg.className = 'notice err'; msg.textContent = '請先填 Email。'; return; }

    $('unsubBtn').disabled = true;
    msg.className = 'notice';
    msg.textContent = '查詢中';
    $('mgPanel').hidden = true;

    google.script.run.withSuccessHandler(function (r) {
      $('unsubBtn').disabled = false;
      if (!r || !r.ok) {
        msg.className = 'notice err';
        msg.textContent = r ? r.message : '查詢失敗，請稍後再試。';
        return;
      }
      msg.className = 'notice';
      msg.textContent = '';
      mgRender(r);
    }).withFailureHandler(function () {
      $('unsubBtn').disabled = false;
      msg.className = 'notice err';
      msg.textContent = '查詢失敗，請稍後再試。';
    }).apiLookupSubscription(e);
  });

  $('mgSaveBtn').addEventListener('click', function () {
    var payload = { daily: $('mgDaily').checked, sms: $('mgSms').checked };
    if (!payload.daily && !payload.sms) {
      if (!window.confirm('兩項都沒有勾，等於不會再收到任何信件。要繼續嗎？')) { return; }
    }
    $('mgSaveBtn').disabled = true;
    mgMsg('', '儲存中');
    google.script.run.withSuccessHandler(function (r) {
      $('mgSaveBtn').disabled = false;
      mgMsg(r && r.ok ? 'ok' : 'err', r ? r.message : '儲存失敗，請稍後再試。');
    }).withFailureHandler(function () {
      $('mgSaveBtn').disabled = false;
      mgMsg('err', '儲存失敗，請稍後再試。');
    }).apiUpdateSubscription(MG_EMAIL, payload);
  });

  $('mgStopBtn').addEventListener('click', function () {
    if (!window.confirm('確定要停止接收所有信件嗎？之後可以用上面的表單重新訂閱。')) { return; }
    $('mgStopBtn').disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      $('mgStopBtn').disabled = false;
      mgMsg(r && r.ok ? 'ok' : 'err', r ? r.message : '操作失敗');
      if (r && r.ok) { $('mgSaveBtn').disabled = true; }
    }).withFailureHandler(function () {
      $('mgStopBtn').disabled = false;
      mgMsg('err', '操作失敗，請稍後再試。');
    }).apiStopAllMail(MG_EMAIL);
  });


})();
</script>

<!-- ── 技術說明：折疊區塊的收合按鈕 ──────────────────────────
     刻意放在「另一個 <script> 標籤」裡，不是只換一個 IIFE。 -->
<script>
/* 為什麼一定要另開一個 script 標籤

   同一個 <script> 裡換成兩個 IIFE 是沒有用的——前面丟出未捕捉的例外，
   整個標籤剩下的敘述就不會執行，換幾個 IIFE 都一樣。
   實測過：主程式一報 google is not defined，七顆按鈕全都沒生出來。
   拆成獨立的 <script> 才真的互不影響。

   上面那包有兩千行，中間任何一行出錯（少一個元素、後端回了非預期的東西）
   都會讓它中斷。這顆按鈕跟那些邏輯沒有任何關係，不該被它們拖著一起死。

   為什麼需要這顆按鈕：這幾段展開之後很長（最長的一段實測 5127px）。
   要收起來得先捲回最上面找到那行標題，捲的過程還會再經過整段內容
   ——等於重讀一次。所以在結尾補一顆，按下去關閉並把畫面帶回標題。

   用 JS 補而不是寫進 Tech.html：那份是文件，一段一段手寫七顆按鈕，
   之後新增段落的人一定會漏掉。 */
(function () {
  document.querySelectorAll('details.devzone').forEach(function (dz) {
    var body = dz.querySelector('.devzone-b') || dz;
    if (body.querySelector('.dz-close')) { return; }

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dz-close';
    btn.textContent = '收合這一段';
    btn.addEventListener('click', function () {
      dz.open = false;
      var sm = dz.querySelector('summary');
      if (!sm) { return; }
      // 收合之後畫面會往上跳一大段，把標題帶回視野內才知道自己在哪
      var y = sm.getBoundingClientRect().top + window.pageYOffset - 90;
      window.scrollTo({ top: Math.max(0, y), behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      sm.focus({ preventScroll: true });
    });
    body.appendChild(btn);
  });
})();
</script>
