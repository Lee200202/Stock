<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var css = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function isCode(c) { return /^(?:00981A|\d{4,6})$/.test(String(c || '').trim()); }
  function fmtPx(v) { return (v || v === 0) ? Number(v).toFixed(2) : '—'; }
  function signCls(v) { return v > 0 ? 'up' : v < 0 ? 'down' : 'flat'; }
  function fmtRet(v) { return (v === null || v === undefined) ? '—' : (v > 0 ? '+' : '') + v.toFixed(2) + '%'; }

  /* 報價時間的最後一道保險。

     後端已經統一格式化過（Quoteservice 的 qTime_），這裡只處理一種情況：
     萬一還是收到 ISO 字串，就地補成台北時間，而不是把
     「2026-09-04T05:38:00.000Z」原樣印在畫面上——那既是 UTC 也少了八小時，
     看盤的人會以為這個價是早上抓的。

     不在這裡重寫整套格式：後端才是唯一的來源，兩邊各寫一份規則，
     改了一邊就會開始不一致。 */
  function qTime(v) {
    var t = String(v == null ? '' : v);
    if (!/^\d{4}-\d{2}-\d{2}T/.test(t)) { return t; }
    var d = new Date(t);
    if (isNaN(d.getTime())) { return t; }
    var p = function (n) { return ('0' + n).slice(-2); };
    var tp = new Date(d.getTime() + 8 * 3600 * 1000);   // UTC+8
    return p(tp.getUTCMonth() + 1) + '-' + p(tp.getUTCDate()) + ' ' +
           p(tp.getUTCHours()) + ':' + p(tp.getUTCMinutes()) + ':' + p(tp.getUTCSeconds());
  }

  /* ---------------- 主題與版面 ----------------

     兩者現在都由頂列齒輪裡的 Settings 元件負責：它讀寫 localStorage、
     把 data-theme / data-view 掛到 html 上，而且跑在頁首，
     所以深色模式在第一次繪製之前就套好了，不會先閃一下白底。

     這裡只登記一個掛勾，處理「屬性換了之後這一頁還要做什麼」——
     圖表的顏色是用 JS 讀 CSS 變數畫上去的，不會跟著屬性自己變；
     欄寬變了圖表也要重新量寬度。那些是這一頁的事，共用元件不該知道。 */
  var root = document.documentElement;

  window.__onLayoutChange = function (what) {
    if (what === 'theme') {
      restyleCharts();
      if (perfChart) { renderPerf(); }
      return;
    }
    // 版面與欄寬都會改容器寬度。等一格再重畫，讓瀏覽器先套用新的寬度。
    if (what === 'view' || what === 'w') {
      if (chart) { setTimeout(function () { renderChart(); }, 60); }
      if (perfChart) { setTimeout(function () { renderPerf(); }, 60); }
    }
  };

  /* ---------------- 分頁列拖曳 ---------------- */
  (function () {
    var tabs = document.querySelector('.tabs');
    var bar = document.querySelector('.tabbar');
    var down = false, startX = 0, startL = 0, moved = 0;

    function checkOverflow() {
      bar.classList.toggle('overflowing', tabs.scrollWidth > tabs.clientWidth + 4);
    }
    checkOverflow();
    window.addEventListener('resize', checkOverflow);

    tabs.addEventListener('mousedown', function (e) {
      down = true; moved = 0;
      startX = e.pageX; startL = tabs.scrollLeft;
      tabs.classList.add('dragging');
    });
    window.addEventListener('mouseup', function () {
      down = false; tabs.classList.remove('dragging');
    });
    window.addEventListener('mousemove', function (e) {
      if (!down) { return; }
      e.preventDefault();
      var d = e.pageX - startX;
      moved = Math.abs(d);
      tabs.scrollLeft = startL - d;
    });
    // 拖曳超過 6px 就不當成點擊，避免拖一拖就切了分頁
    tabs.addEventListener('click', function (e) {
      if (moved > 6) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.__scrollTabIntoView = function (btn) {
      var r = btn.getBoundingClientRect(), c = tabs.getBoundingClientRect();
      if (r.left < c.left || r.right > c.right) {
        tabs.scrollLeft += (r.left - c.left) - (c.width - r.width) / 2;
      }
    };
  })();

  /* ---------------- BlurFade ---------------- */
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en, i) {
      if (en.isIntersecting) {
        setTimeout(function () { en.target.classList.add('in'); }, i * 70);
        io.unobserve(en.target);
      }
    });
  }, { threshold: .1 });
  document.querySelectorAll('.mui-blur-fade').forEach(function (el) { io.observe(el); });

  /* ---------------- 長篇文件：右側子目錄、閱讀進度、圖片放大 ----------------
     子目錄收在畫面右緣一條直立的標籤裡，滑鼠靠近右緣或停在標籤上就展開，
     不佔版面、也不會像先前那條頂端導覽一樣壓在分頁列下面（2026/09/16 管理者要求）。

     連結不能靠錨點跳。先前點了沒反應，原因有三個：
       一、Apps Script 送出的頁面帶 <base target="_top">，href="#sec-3" 會去導外框，不會在頁內捲動；
       二、分段之後各段的標題各自從 sec-1 編起，好幾個標題共用同一個 id，跳到的是別段（還是隱藏的）；
       三、標題在收起來的「想深究」裡時量不到位置，而且頂端的分頁列會把它蓋住。
     所以一律攔下點擊、自己算位置捲過去，需要時先把「想深究」打開。 */
  (function () {
    var doc = document.querySelector('.doc');
    if (!doc) { return; }

    var uid = 0, heads = [], links = [], closeTimer = 0;
    var aside = document.createElement('aside');
    aside.className = 'subnav';
    aside.setAttribute('aria-label', '子目錄');
    aside.innerHTML =
      '<button type="button" class="subnav-tab" aria-expanded="false" aria-controls="subnavPanel">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h11M4 17h13"/></svg>' +
        '<span class="subnav-label">子目錄</span>' +
      '</button>' +
      '<div class="subnav-panel" id="subnavPanel"><div class="subnav-in">' +
        '<div class="subnav-h"><b>子目錄</b><span class="subnav-pct">0%</span></div>' +
        '<div class="subnav-bar"><i></i></div>' +
        '<ol class="subnav-list"></ol>' +
      '</div></div>';
    // 放在 body 底下：分頁進場動畫會在面板上掛 transform，fixed 元素放在裡面會跟著跳。
    document.body.appendChild(aside);

    var tab = aside.querySelector('.subnav-tab');
    var list = aside.querySelector('.subnav-list');
    var bar = aside.querySelector('.subnav-bar i');
    var pct = aside.querySelector('.subnav-pct');

    function shown(el) { var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }
    function setOpen(on) {
      aside.classList.toggle('open', !!on);
      tab.setAttribute('aria-expanded', on ? 'true' : 'false');
    }

    // 靠近就展開；離開後留一小段時間才收，免得滑鼠擦過去就閃一下關掉。
    aside.addEventListener('mouseenter', function () { clearTimeout(closeTimer); setOpen(true); });
    aside.addEventListener('mouseleave', function () {
      clearTimeout(closeTimer);
      closeTimer = setTimeout(function () { setOpen(false); }, 320);
    });
    document.addEventListener('mousemove', function (e) {
      if (aside.hidden || aside.classList.contains('open')) { return; }
      var r = tab.getBoundingClientRect();
      if (window.innerWidth - e.clientX <= 40 && e.clientY >= r.top - 80 && e.clientY <= r.bottom + 80) {
        clearTimeout(closeTimer);
        setOpen(true);
      }
    }, { passive: true });
    // 觸控沒有「靠近」這回事：點標籤切換，點外面收起。
    tab.addEventListener('click', function () { setOpen(!aside.classList.contains('open')); });
    document.addEventListener('click', function (e) {
      if (aside.classList.contains('open') && !aside.contains(e.target)) { setOpen(false); }
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { setOpen(false); } });

    /* 捲到指定位置。平滑捲動在某些環境不會動（背景分頁、部分內嵌 WebView，
       本機實測 behavior:'smooth' 完全沒有位移），而且不會報錯——點了子目錄看起來就是壞掉。
       所以先試平滑，一小段時間後量不到任何移動就直接跳過去；使用者關掉動畫時一律直接跳。 */
    function scrollToY(y) {
      var top = Math.max(0, Math.round(y)), start = window.scrollY, reduce = false;
      try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      if (reduce || Math.abs(top - start) < 2) { window.scrollTo(0, top); return; }
      try { window.scrollTo({ top: top, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, top); return; }
      setTimeout(function () {
        if (Math.abs(window.scrollY - start) < 2) { window.scrollTo(0, top); }
      }, 180);
    }
    window.__scrollToY = scrollToY;

    /* 頂端固定住的頁首與分頁列有多高。跳過去時標題要落在它們下面，不能被蓋住。 */
    function stickyOffset() {
      var bottom = 0;
      document.querySelectorAll('.topbar, .tabbar').forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.height && r.top <= 1) { bottom = Math.max(bottom, r.bottom); }
      });
      return bottom + 16;
    }

    function jump(h) {
      // 標題在收起來的「想深究」裡時，一層一層打開，否則量不到位置。
      var d = h.parentElement && h.parentElement.closest('details');
      while (d) {
        d.open = true;
        d = d.parentElement && d.parentElement.closest('details');
      }
      scrollToY(h.getBoundingClientRect().top + window.scrollY - stickyOffset());
      if (!h.hasAttribute('tabindex')) { h.setAttribute('tabindex', '-1'); }
      try { h.focus({ preventScroll: true }); } catch (e) {}
    }

    function mark() {
      aside.hidden = !shown(doc) || !heads.length;
      if (aside.hidden) { setOpen(false); return; }
      var line = stickyOffset() + 8, cur = 0;
      heads.forEach(function (h, i) {
        if (shown(h) && h.getBoundingClientRect().top <= line) { cur = i; }
      });
      links.forEach(function (a, i) { a.classList.toggle('on', i === cur); });
      var rect = doc.getBoundingClientRect(), total = rect.height - window.innerHeight;
      var p = total > 0 ? Math.min(100, Math.max(0, -rect.top / total * 100)) : 0;
      bar.style.width = p + '%';
      pct.textContent = Math.round(p) + '%';
    }

    function build() {
      // 只列「現在這一段」與頁首、頁尾固定區的標題；其他段落的標題雖然還在 DOM 裡但是隱藏的。
      var prevText = '';
      heads = [].slice.call(doc.querySelectorAll('h2, h3')).filter(function (h) {
        var text = (h.textContent || '').trim();
        if (h.closest('.tech-chunk[hidden]') || !text) { return false; }
        // 相鄰兩個標題字一模一樣（大標與它底下的問句同名）就只列一次，否則子目錄會出現兩行一樣的。
        if (text === prevText) { return false; }
        prevText = text;
        return true;
      });
      list.innerHTML = '';

      /* 層級：小標掛在同一個容器裡、前面最近的那個大標底下。
         一個大標底下只有一個小標時，兩層沒有意義——「為什麼美股不會出現在紀錄裡」
         底下只有「為什麼不能靠相似度自然淘汰」，縮排只會讓人以為下面還有別的。
         這種就拉平成同一層；兩個以上的小標才縮排（2026/09/16 管理者要求）。 */
      var parent = [], children = {};
      heads.forEach(function (h, i) {
        if (h.tagName !== 'H3') { return; }
        var box = h.closest('.tech-chunk, .tech-fixed');
        for (var k = i - 1; k >= 0; k--) {
          if (heads[k].closest('.tech-chunk, .tech-fixed') !== box) { break; }
          if (heads[k].tagName === 'H2') {
            parent[i] = k;
            children[k] = (children[k] || 0) + 1;
            break;
          }
        }
      });

      heads.forEach(function (h, i) {
        if (!h.id) { h.id = 'toc-' + (++uid); }       // 全頁唯一，分段之後不會撞號
        var li = document.createElement('li');
        var nested = h.tagName === 'H3' && parent[i] !== undefined && children[parent[i]] > 1;
        li.className = nested ? 'lv3' : 'lv2';
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent.trim();
        if (h.parentElement && h.parentElement.closest('details:not([open])')) {
          a.classList.add('folded');
          a.title = '在「想深究」裡，點了會自動展開';
        }
        a.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          jump(h);
          var hover = false;
          try { hover = window.matchMedia('(hover: hover)').matches; } catch (err) {}
          if (!hover) { setOpen(false); }
        });
        li.appendChild(a);
        list.appendChild(li);
      });
      links = [].slice.call(list.querySelectorAll('a'));
      mark();
    }

    window.__docnavRebuild = build;
    window.addEventListener('scroll', mark, { passive: true });
    window.addEventListener('resize', mark);
    // 「想深究」打開或收起時，標題的可見狀態變了，子目錄上的標記要跟著換。
    doc.addEventListener('toggle', function () { build(); }, true);
    // 切到別的分頁時面板變成隱藏，子目錄也要跟著收掉。
    var panel = doc.closest('.panel');
    if (panel && window.MutationObserver) {
      new MutationObserver(function () { mark(); }).observe(panel, { attributes: true, attributeFilter: ['hidden'] });
    }
    build();

    /* 圖片放大。手機上流程圖本來就可以左右滑，但那會失去「一眼看全局」，
       所以多一個出口：點一下攤在全螢幕，Esc 或按鈕關掉。 */
    doc.querySelectorAll('.viz, .arch').forEach(function (box) {
      var svg = box.querySelector('svg');
      if (!svg) { return; }
      var hint = document.createElement('button');
      hint.type = 'button';
      hint.className = 'zoomhint';
      hint.textContent = '放大';
      hint.addEventListener('click', function () {
        var wrap = document.createElement('div');
        wrap.className = 'zoomwrap';
        var top = document.createElement('div');
        top.className = 'zoomtop';
        var close = document.createElement('button');
        close.type = 'button';
        close.textContent = '關閉';
        top.appendChild(close);
        var body = document.createElement('div');
        body.className = 'zoombody';
        body.appendChild(svg.cloneNode(true));
        wrap.appendChild(top);
        wrap.appendChild(body);
        document.body.appendChild(wrap);
        var shut = function () {
          if (wrap.parentNode) { wrap.parentNode.removeChild(wrap); }
          document.removeEventListener('keydown', onKey);
        };
        var onKey = function (e) { if (e.key === 'Escape') { shut(); } };
        close.addEventListener('click', shut);
        wrap.addEventListener('click', function (e) { if (e.target === wrap) { shut(); } });
        document.addEventListener('keydown', onKey);
        close.focus();
      });
      /* 放在圖說那一行，不疊在圖上。先前是絕對定位在右上角，
         每一張圖的右上角都被這兩個字蓋住（2026/09/16 版面稽核抓到）。 */
      var cap = box.querySelector('figcaption');
      if (cap) { cap.appendChild(hint); } else { box.appendChild(hint); }
    });
  })();
  /* ---------------- NumberTicker ---------------- */
  function tick(el, target, decimals) {
    target = Number(target) || 0;
    /* 初始是「—」（v54，Codex 規格 54）：資料到了直接寫上真值，不再從 0 數上去——
       先顯示「0 檔、0%」再跳成真的數字，看起來像資料先是錯的。之後更新（已有數字）才做短動畫。 */
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !/\d/.test(String(el.textContent))) { el.textContent = target.toFixed(decimals || 0); return; }
    var from = parseFloat(String(el.textContent).replace(/[^\d.\-]/g, '')) || 0;
    var t0 = performance.now(), dur = 900;
    el.classList.add('ticking');
    function step(t) {
      var p = Math.min((t - t0) / dur, 1);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = (from + (target - from) * e).toFixed(decimals || 0);
      if (p < 1) { requestAnimationFrame(step); }
      else { el.textContent = target.toFixed(decimals || 0); el.classList.remove('ticking'); }
    }
    requestAnimationFrame(step);
  }

  /* 骨架載入區塊 */
  function skel(n) {
    var out = '<div class="card flush" style="padding:16px 18px;">';
    for (var i = 0; i < (n || 5); i++) {
      out += '<div class="skel" style="height:14px;margin:11px 0;width:' + (62 + (i * 37 % 30)) + '%;"></div>';
    }
    return out + '</div>';
  }
  function skelKv(n) {
    var out = '';
    for (var i = 0; i < (n || 4); i++) {
      out += '<div class="kv-cell"><div class="skel" style="height:11px;width:52%;margin:2px 0 8px;"></div>' +
             '<div class="skel" style="height:15px;width:72%;"></div></div>';
    }
    return out;
  }

  /* ---------------- 分頁 ---------------- */
  var trackerLoaded = false, perfLoaded = false, mailLoaded = false;
  function setOverviewTop(tab) {
    // 頁首視覺區只在每日總覽顯示，其他分頁收起，不佔空間
    var top = $('overviewTop');
    if (top) { top.hidden = (tab !== 'overview'); }
  }
  /* ==================================================================
     使用紀錄

     記的是「大家在看什麼」：哪一頁、看了哪一檔、查了什麼、停留多久。
     不記「誰在看」——訪客識別是這台瀏覽器本地產生的一串隨機碼，
     不是 Email 也不是 IP，清掉瀏覽器資料就換一個新的。

     為什麼要批次送：每切一次分頁就打一次後端，在 Apps Script 上會排隊，
     而排隊排的是同一條線——使用者真正在等的那幾支請求會被它拖慢。
     所以先收在陣列裡，湊到十筆或離開頁面時才送一次。

     整段用 try 包起來，而且任何一步失敗都只是不記錄。
     這是旁支，不該讓它有機會弄壞任何使用者看得到的東西。
     ================================================================== */
  var USE = (function () {
    var KEY = 'zzVisitor';
    var id = '';
    try {
      id = localStorage.getItem(KEY) || '';
      if (!id) {
        id = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        localStorage.setItem(KEY, id);
      }
    } catch (e) { id = 'anon'; }

    var q = [];
    var page = 'overview';
    var since = Date.now();
    var device = (function () {
      try {
        return matchMedia('(max-width: 620px)').matches ? 'mobile' : 'desktop';
      } catch (e) { return ''; }
    })();

    function flush(sync) {
      if (!q.length) { return; }
      var batch = q.splice(0, 40);
      try {
        google.script.run
          .withFailureHandler(function () { /* 記不下來就算了 */ })
          .apiLogUsage(id, batch);
      } catch (e) { /* 同上 */ }
      if (sync) { q.length = 0; }
    }

    function push(action, target, seconds) {
      try {
        q.push({ page: page, action: action, target: target || '',
                 seconds: seconds || 0, device: device });
        if (q.length >= 10) { flush(false); }
      } catch (e) { /* 記不下來就算了 */ }
    }

    return {
      /* 換頁。先把上一頁停了多久記下來，再開始算新的那一頁。 */
      page: function (name) {
        var sec = Math.round((Date.now() - since) / 1000);
        if (sec > 0 && sec < 86400) { push('停留', page, sec); }
        page = name;
        since = Date.now();
        /* 進入分頁不記錄：它與下一次的「停留」是同一件事的兩半，
           而停留那一筆本來就帶著頁面名稱與秒數。後端也會擋一次。 */
      },
      act: function (action, target) { push(action, target); },
      end: function () {
        var sec = Math.round((Date.now() - since) / 1000);
        if (sec > 0 && sec < 86400) { push('停留', page, sec); }
        flush(true);
      }
    };
  })();

  /* 關掉分頁時把還沒送出去的補送。visibilitychange 比 unload 可靠——
     手機上切到別的 App 常常不會觸發 unload。 */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { USE.end(); }
  });

  /* 切到某一個面板。

     抽成函式而不是寫在點擊處理裡，是因為現在有兩種入口：分頁列的按鈕，
     以及頂列右上角的放大鏡（個股查詢）。兩邊要走完全同一段流程，
     否則其中一邊會漏掉「收起頁首視覺區」或「第一次進來才載入資料」。 */
  function activateTab(name, btn) {
    document.querySelectorAll('button.tab').forEach(function (b) {
      b.setAttribute('aria-selected', 'false');
    });
    if (btn) { btn.setAttribute('aria-selected', 'true'); }

    var escaped=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    text=text.replace(new RegExp(escaped+'\\s*(?:[（(]\\s*(?:00981A|\\d{4,6})\\s*[）)]|(?:00981A|\\d{4,6})(?=為例|這檔|這支|這一檔)|代號\\s*(?:00981A|\\d{4,6})(?!\\d))','g'),name+'（'+code+'）');
    text=text.replace(new RegExp(escaped+'\\s*[（(]'+escaped+'[）)]','g'),name);
    text=text.replace(new RegExp('(?:'+escaped+'){2,}','g'),name);
  }
  var seen={},parts=[];
  text.split(/[。；;]/).forEach(function(part){
    var key=part.replace(/回顧|過往|目前|\s|[，,]/g,'');
    if(key && !seen[key]){seen[key]=true;parts.push(part.trim());}
  });
  return (parts.join('。')+(parts.length?'。':'')).replace(/[*＊]+/g,'');
}
// END PUBLIC NARRATIVE V10

  function priceCell(r) {
    var main = esc(displayPrice_(r.price, r.price_evidence, r.reason));
    var sub = '';
    if (r.refPrice) {
      sub = '<span class="pxsub">參考價位 ' + fmtPx(r.refPrice) +
            (r.refSrc ? '\u3000' + esc(r.refSrc) : '') + '</span>';
    }
    // 「未說明」在手機疊列卡片上不另佔一行（v54）；桌面照樣顯示，欄位才對得齊。
    return '<td class="pxnote' + (main === '未說明' && !sub ? ' pxnone' : '') + '">' + main + sub + '</td>';
  }

  /* 這一類今天沒有東西。

     先前是 emptyBlock，一塊有斜線底紋、上下 20px 內距的完整區塊。
     問題是四張表常常同時是空的——他沒有買賣、只講觀望的日子很常見——
     那時首頁就是四塊一模一樣的「本支影片未說明」灰斜線佔滿整個版面，
     而真正有內容的觀望兩張表被推到很下面。

     改成一行。同樣講清楚「沒有」，但不佔位置。 */
  function emptyLine(text) {
    return '<p class="emptyline">' + esc(text) + '</p>';
  }

  /** 總覽四張表。現價欄先留白，等批次報價回來再填。
      opts.empty：空的時候那一行字；opts.history：翻到某一天時「現價」其實是今天的價，欄名寫「今日價」。 */
  function tradeTable(rows, dirClass, opts) {
    opts = opts || {};
    var watch = dirClass === 'dir-watch' || dirClass === 'dir-note';
    if (!rows || !rows.length) {
      return emptyLine(opts.empty || (watch ? watchEmptyText(false) : '本日未說明：這一類在當天的影片裡沒有被提到。'));
    }
    return '<div class="card flush scrollx"><table class="tbl-daily' + (watch ? ' tbl-watch' : '') + '">' +
      (watch ? WATCH_COLS : DAILY_COLS) +
      '<thead><tr>' +
      '<th class="sticky">股票名稱</th><th>代號</th>' +
      '<th class="r">' + (opts.history ? '今日價' : '現價') + '</th><th class="r">漲跌</th>' +
      (watch ? '' : '<th>價位說明</th>') + '<th>說明重點</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var can = isCode(r.code);
        var rowClass = 'tone-' + String(dirClass || '').replace('dir-', '');
        var px = displayPrice_(r.price, r.price_evidence, r.reason);
        var chipPx = (watch && px && px !== '未說明') ? '<span class="pxchip">價位 ' + esc(px) + '</span>' : '';
        return '<tr class="' + rowClass + (can ? ' clickable" data-code="' + r.code + '"' : '"') + '>' +
          '<td class="sticky ' + dirClass + '">' + nameCell(r.name, r.code) + '</td>' +
          '<td class="code">' + esc(r.code) + '</td>' +
          '<td class="px r" data-px="' + esc(r.code) + '">' + (can ? '&#183;&#183;&#183;' : '—') + '</td>' +
          '<td class="px r" data-chg="' + esc(r.code) + '">' + (can ? '&#183;&#183;&#183;' : '—') + '</td>' +
          (watch ? '' : priceCell(r)) +
          '<td class="reason">' + chipPx + esc(publicNarrative_(r.reason,r)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  /* 「9/22｜…」：說明是哪一天講的（v54）。沒有日期時不加。 */
  function datedNote(note, date) {
    var m = String(date || '').match(/^\d{4}\/(\d{2})\/(\d{2})$/);
    return (m ? Number(m[1]) + '/' + Number(m[2]) + '｜' : '') + (note || '');
  }

  function holdTable(rows) {
    if (!rows || !rows.length) { return emptyLine('本日未說明：當天沒有提到會員目前持股。'); }
    return '<div class="card flush scrollx"><table class="tbl-daily">' + DAILY_COLS +
      '<thead><tr>' +
      '<th class="sticky">股票名稱</th><th>代號</th>' +
      '<th class="r">現價</th><th class="r">漲跌</th>' +
      '<th>目前立場</th><th>說明重點</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var can = isCode(r.code);
        return '<tr class="tone-hold' + (can ? ' clickable" data-code="' + r.code + '"' : '"') + '>' +
          '<td class="sticky dir-hold">' + nameCell(r.name, r.code) + '</td>' +
          '<td class="code">' + esc(r.code) + '</td>' +
          '<td class="px r" data-px="' + esc(r.code) + '">' + (can ? '&#183;&#183;&#183;' : '—') + '</td>' +
          '<td class="px r" data-chg="' + esc(r.code) + '">' + (can ? '&#183;&#183;&#183;' : '—') + '</td>' +
          '<td class="stance">' + esc(r.stance) + '</td>' +
          '<td class="reason">' + esc(datedNote(publicNarrative_(r.note,r), r.noteDate)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  /** 表格畫好之後，把所有代號一次抓完報價回填 */
  function fillQuotes(scope) {
    var cells = (scope || document).querySelectorAll('[data-px]');
    var codes = [];
    cells.forEach(function (c) {
      var v = c.dataset.px;
      if (isCode(v) && codes.indexOf(v) < 0) { codes.push(v); }
    });
    if (!codes.length) { return; }

    google.script.run.withSuccessHandler(function (q) {
      codes.forEach(function (code) {
        var d = q[code];
        document.querySelectorAll('[data-px="' + code + '"]').forEach(function (el) {
          el.textContent = d ? fmtPx(d.last) : '—';
        });
        document.querySelectorAll('[data-chg="' + code + '"]').forEach(function (el) {
          if (!d || !d.prevClose) { el.textContent = '—'; return; }
          var pct = (d.last - d.prevClose) / d.prevClose * 100;
          el.textContent = (pct > 0 ? '+' : '') + pct.toFixed(2) + '%';
          el.className = 'px r ' + signCls(pct);
        });
      });
    }).withFailureHandler(function () {
      document.querySelectorAll('[data-px],[data-chg]').forEach(function (el) {
        if (el.textContent === '\u00b7\u00b7\u00b7') { el.textContent = '—'; }
      });
    }).apiGetQuotesFor(codes);
  }

  /* ------------------------------------------------------------------ *
   * 會員通知
   *
   * 一則簡訊一個區塊：上面是解析出來的表格（欄位與每日總覽完全一樣，
   * 切分頁時欄位不會跳），下面是他實際講的原文。
   *
   * 為什麼原文一定要放：表格是模型讀出來的，原文是他自己寫的。
   * 只給表格的話，讀的人沒有辦法自己核對——而這一份資料會影響
   * 持股追蹤的進出場價，核對得了很重要。
   * ------------------------------------------------------------------ */

  var smsLoaded = false, smsCal = null, smsCurDate = '';

  var SMS_DIR = { '買入': 'dir-buy', '賣出': 'dir-sell',
                  '觀望不碰': 'dir-watch', '觀望注意': 'dir-note', '會員持股': 'dir-hold' };
  var SMS_COLS = '<colgroup><col class="c-name"><col class="c-code"><col class="c-dir">' +
    '<col class="c-px"><col class="c-chg"><col class="c-note"><col class="c-reason"></colgroup>';

  function smsTable(rows, state) {
    if (!rows || !rows.length) {
      var st = String(state || '').trim();
      if (st.indexOf('待解析') === 0 || st === '處理中') {
        return emptyLine('⏳ 正在等待 AI 模型解析中...');
      }
      if (st === '解析失敗') {
        return emptyLine('⚠️ AI 模型解析失敗，可至後台重新解析。');
      }
      if (st === '已解析（未寫入）') {
        return emptyLine('此則已完成解析，但沒有可併入操作紀錄或會員持股的個股指令。');
      }
      return emptyLine('這一則沒有指名個股——多半是大盤看法或持股提醒。');
    }
    return '<div class="card flush scrollx"><table class="tbl-daily tbl-sms">' + SMS_COLS +
      '<thead><tr>' +
      '<th class="sticky">股票名稱</th><th>代號</th><th>方向</th>' +
      '<th class="r">現價</th><th class="r">漲跌</th>' +
      '<th>價位說明</th><th>說明重點</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var can = isCode(r.code);
        var tone = SMS_DIR[r.dir] || '';
        var rowClass = tone ? 'tone-' + tone.replace('dir-', '') : '';
        return '<tr class="' + rowClass + (can ? (rowClass ? ' ' : '') + 'clickable" data-code="' + r.code + '"' : '"') + '>' +
          '<td class="sticky ' + tone + '">' + nameCell(r.name, r.code) + '</td>' +
          '<td class="code">' + esc(r.code) + '</td>' +
          '<td class="smsdir ' + tone + '">' + esc(r.dir || '未說明') + '</td>' +
          '<td class="px r" data-px="' + esc(r.code) + '">' + (can ? '&#183;&#183;&#183;' : '—') + '</td>' +
          '<td class="px r" data-chg="' + esc(r.code) + '">' + (can ? '&#183;&#183;&#183;' : '—') + '</td>' +
          (function (t) { return '<td class="pxnote' + (t === '未說明' ? ' pxnone' : '') + '">' + esc(t) + '</td>'; })(displayPrice_(r.price, r.price_evidence, r.reason)) +
          '<td class="reason">' + esc(publicNarrative_(r.reason,r)) + '</td></tr>';
      }).join('') + '</tbody></table></div>' + scrollHint();
  }

  /* 一則的區塊。標題那一行只放時分秒——日期已經由日曆選定了，
     再寫一次年月日只是佔位置；同一天有好幾則時，看的就是幾點幾分。 */
  function smsBlock(it) {
    var t = String(it.time || '').trim();
    var hhmmss = t;
    if (t.indexOf(' ') > 0) {
      hhmmss = t.slice(t.indexOf(' ') + 1);
    } else if (t.indexOf('T') > 0) {
      hhmmss = t.slice(t.indexOf('T') + 1).split('.')[0];
    }
    var raw = String(it.text || '').split(/\n+/).filter(String)
      .map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('');

    var st = String(it.state || '').trim();
    var stLabel = st;
    var stTitle = '';
    if (st === '已解析（未寫入）' || st === '已解析（待寫入）') {
      stLabel = (it.rows && it.rows.length) ? '已解析（待併入過去資料）' : '尚未收錄個股';
      stTitle = (it.rows && it.rows.length) ?
        '請到後台「會員簡訊」按「併入過去資料（補空白）」' :
        '這一篇還沒有被 AI 判定過，後台按「併入過去資料（補空白）」就會補上';
    } else if (st.indexOf('待解析') === 0) {
      /* 「待解析」與「判定後真的沒有個股」是兩件事，先前在畫面上長得一樣，
         於是「還沒判定」被讀成「判定過、沒東西」，沒有人會去補。 */
      stLabel = '尚未收錄個股';
      stTitle = '這一篇還沒有被 AI 判定過，後台按「併入過去資料（補空白）」就會補上';
    } else if (st.indexOf('無可收錄') >= 0 || st.indexOf('無可收錄個股') >= 0) {
      stLabel = '已判定：無個股指令';
      stTitle = 'AI 已判定過，這一篇是純盤勢或未指名個股，沒有可收錄的買賣';
    } else if (st.indexOf('配額') >= 0) {
      stLabel = '等待配額恢復';
      stTitle = 'Gemini 每日額度用盡，額度恢復後會自動接續，已完成的不會重跑';
    } else if (st.indexOf('已寫入') === 0) {
      stTitle = '已寫入操作紀錄與持股追蹤';
    }

    return '<div class="smsitem">' +
      '<div class="smshead">' +
        '<span class="smstime">' + esc(hhmmss) + '</span>' +
        (stLabel ? '<span class="smsstate" title="' + esc(stTitle) + '">' + esc(stLabel) + '</span>' : '') +
        (it.revisions ? '<span class="smsstate revised">已修訂 ' + Number(it.revisions) + ' 次</span>' : '') +
        (it.url ? '<a class="smslink" href="' + esc(it.url) + '" target="_blank" rel="noopener">看原文</a>' : '') +
      '</div>' +
      smsTable(it.rows, it.state) +
      '<div class="smsraw">' + raw + '</div>' +
    '</div>';
  }

  /* 首頁這一塊永遠顯示「最新的一則」，並且把那一則的日期講出來。

     兩邊的資料來源不一樣，快慢也不一樣：
       總覽讀的是操作紀錄，要等當天的逐字稿整條流程跑完才有；
       這一塊讀的是會員簡訊原文，盤中一發出就有。
     所以兩邊誰先誰後都可能，兩種情況都真的發生過：

       簡訊先到　盤中發了通知，當天的逐字稿還沒處理完。
       逐字稿先到　當天的影片處理完了，但他那天還沒發（或晚發）會員通知。

     先前的作法是「一律對齊總覽那一天」。它解決了第一種情況，卻把第二種
     弄得更糟：總覽已經是今天，這一塊因為今天還沒有簡訊而退回 items[0]，
     於是靜靜地顯示昨天的通知，畫面上沒有任何地方寫著那是昨天的。
     讀的人會把昨天的買賣當成今天的指令，那是會賠錢的誤會。

     現在改成：永遠顯示最新的那一則，日期一律寫在標題上，
     而且明講它與總覽那一天的關係——早一天、晚一天、還是同一天。
     講清楚永遠比對齊安全，因為「對齊」在資料還沒到的時候只能靠退讓，
     而退讓出來的那一筆看起來與正常內容一模一樣。 */
  var OVERVIEW_DAY = '';

  function mergeSmsIntoOverview(day, items) {
    if (!day) { return; }
    OVERVIEW_DAY = day;
    var p = day.split('/');
    if ($('heroDate') && p.length === 3) {
      $('heroDate').innerHTML = p[0] + '<span class="sl">/</span>' + p[1] + '<span class="sl">/</span>' + p[2];
    }
    var dayItems = (items || []).filter(function (x) {
      return String(x.time || '').slice(0, 10) === day;
    });
    var buys = [], sells = [], avoids = [], watches = [];
    dayItems.forEach(function (it) {
      (it.rows || []).forEach(function (r) {
        var dir = String(r.dir || '');
        var rowObj = {
          name: r.name,
          code: r.code || '代號待確認',
          price: r.price || '未說明',
          reason: r.reason || '簡訊通知即時操作'
        };
        if (dir.indexOf('買') === 0) { buys.push(rowObj); }
        else if (dir.indexOf('賣') === 0) { sells.push(rowObj); }
        else if (dir.indexOf('觀望不碰') >= 0 || dir.indexOf('不碰') >= 0) { avoids.push(rowObj); }
        else if (dir.indexOf('觀望注意') >= 0) { watches.push(rowObj); }
      });
    });
    if ($('tblBuy')) { $('tblBuy').innerHTML = tradeTable(buys, 'dir-buy'); }
    if ($('tblSell')) { $('tblSell').innerHTML = tradeTable(sells, 'dir-sell'); }
    // 走到這裡代表首頁資料還停在前一天、當天只有簡訊：影片一定還沒整理完（v54）。
    if ($('tblWatchAvoid')) { $('tblWatchAvoid').innerHTML = tradeTable(avoids, 'dir-watch', { empty: watchEmptyText(true) }); }
    if ($('tblWatchWatch')) { $('tblWatchWatch').innerHTML = tradeTable(watches, 'dir-note', { empty: watchEmptyText(true) }); }
    if (typeof renderBand === 'function') {
      renderBand({ buy: buys, sell: sells, watchAvoid: avoids, watchWatch: watches });
    }
    if ($('p-overview')) {
      bindRows($('p-overview'));
      fillQuotes($('p-overview'));
    }
  }

  function loadLatestSmsHome(silent) {
    var box = $('latestSmsHome');
    if (!box) { return; }
    if (!silent) { box.innerHTML = skel(1); }
    google.script.run.withSuccessHandler(function (d) {
      var items = (d && d.items) || [];
      if (!items.length) {
        box.innerHTML = emptyLine('目前尚無會員通知。');
        return;
      }
      var it = items[0];
      var day = String(it.time || '').slice(0, 10);

      // 最新那一則永遠是主角，日期照實寫。剩下的只是說明它與總覽的關係。
      var note;
      if (!OVERVIEW_DAY || day === OVERVIEW_DAY) {
        note = '最新一則，已即時併入今日總覽。同一篇文章盤中被編輯時，這裡會直接換成最新版。';
      } else if (day > OVERVIEW_DAY) {
        note = '最新一則（' + day + '），已即時併入今日總覽。同一篇文章盤中被編輯時，這裡會直接換成最新版。';
        mergeSmsIntoOverview(day, items);
      } else {
        note = '今日（' + OVERVIEW_DAY + '）尚無會員通知，上方顯示為最近一次的 ' + day + '。請以上面的日期為準。';
      }

      box.innerHTML = '<div class="latest-sms-meta"><b>' + esc(day || '日期待確認') +
        '</b><span>' + esc(note) + '</span></div>' + smsBlock(it);
      bindRows(box);
      fillQuotes(box);
    }).withFailureHandler(function () {
      box.innerHTML = emptyLine('會員通知暫時讀取失敗。');
    }).apiGetMemberSms(12, '');
  }

  function openSms(date) {
    var dStr = String(date || '').trim().replace(/-/g, '/');
    smsCurDate = dStr;
    $('smsList').innerHTML = skel(2);
    google.script.run.withSuccessHandler(function (d) {
      if (smsCurDate !== dStr) { return; }   // 過期回應：使用者已經點了別天
      if (!d || !d.items || !d.items.length) {
        $('smsList').innerHTML = emptyBlock('這一天沒有通知', '換一天看看。');
        return;
      }
      $('smsList').innerHTML =
        '<p class="notice" style="margin:0 0 10px;">' + esc(dStr) + '　共 ' +
        d.items.length + ' 則，由早到晚。</p>' +
        d.items.slice().reverse().map(smsBlock).join('');
      bindRows($('p-sms'));
      fillQuotes($('p-sms'));
    }).withFailureHandler(function () {
      if (smsCurDate !== dStr) { return; }   // 已經換到別天，舊的失敗不蓋新畫面
      $('smsList').innerHTML = smsRetryBox(dStr + ' 的通知讀取失敗。');
      bindSmsRetry(function () { openSms(dStr); });
    }).apiGetMemberSms(50, dStr);
  }

  /* 會員通知分頁（v54，Codex 規格 55）：先前一進來就把 smsLoaded 設 true，日期清單讀失敗之後
     再切回來也不會重讀，只能整頁重新整理。改成讀成功才算載入；失敗時就地放一顆「重試」。 */
  function smsRetryBox(msg) {
    return '<div class="empty"><span class="hatch"></span><span><strong>' + esc(msg) + '</strong>' +
      '<span><button type="button" class="pill sms-retry">重試</button></span></span></div>';
  }
  function bindSmsRetry(fn) {
    var b = $('smsList').querySelector('.sms-retry');
    if (b) { b.addEventListener('click', fn); }
  }
  function loadSms() {
    smsLoaded = true;
    if (smsCal) { $('smsList').innerHTML = skel(2); }
    else smsCal = makeCalendar({
      grid: 'smsCalGrid', title: 'smsCalTitle', prev: 'smsCalPrev', next: 'smsCalNext',
      onPick: function (d) { openSms(d); }
    });
    google.script.run.withSuccessHandler(function (list) {
      smsCal.setDates(list || []);
      if (list && list.length) {
        // 預設打開最新那一天，不必再點一次
        var first = list[0];
        var d = (typeof first === 'string') ? first : (first && (first.date || first.Date || first.日期 || first.d));
        if (d) {
          openSms(d);
        } else {
          $('smsList').innerHTML = emptyBlock('這一天沒有通知', '換一天看看。');
        }
      } else {
        $('smsList').innerHTML = emptyBlock('還沒有收到通知',

  function bindRows(scope) {

  /* ---------------- 訊號帶 ---------------- */
  function chip(kind, label, r) {
    var can = isCode(r.code);
    return '<div class="chip ' + kind + '"' + (can ? ' data-code="' + r.code + '"' : '') + '>' +
      '<span class="tag">' + label + '</span>' +
      '<span class="nm">' + esc(cleanName(r.name)) + '</span>' +
      '<span class="cd">' + esc(r.code) + '</span>' +

      '</div>';

  function absentChip(label) {
    return '<div class="chip absent"><span class="tag">' + label + '</span>' +
      '<span class="nm">本支影片未說明</span></div>';
  }
  function renderBand(d) {
    var parts = [];
    if (d.buy.length) { d.buy.forEach(function (r) { parts.push(chip('buy', '買入', r)); }); }
    else { parts.push(absentChip('買入')); }
    if (d.sell.length) { d.sell.forEach(function (r) { parts.push(chip('sell', '賣出', r)); }); }
    else { parts.push(absentChip('賣出')); }
    if (wAvoid(d).length) { wAvoid(d).forEach(function (r) { parts.push(chip('watch', '觀望不碰', r)); }); }
    else { parts.push(absentChip('觀望不碰')); }
    if (wWatch(d).length) { wWatch(d).forEach(function (r) { parts.push(chip('note', '觀望注意', r)); }); }
    else { parts.push(absentChip('觀望注意')); }
    var html = parts.join('');
    $('band').innerHTML = '<span class="band-copy">' + html + '</span>' +
      '<span class="band-copy" aria-hidden="true">' + html + '</span>';
    $('band').querySelectorAll('.chip[data-code]').forEach(function (c) {
      c.addEventListener('click', function () { openDetail(c.dataset.code); });
    });
    fillBandQuotes(d);
  }

  /** 訊號帶的現價與漲跌幅。讀即時快取，不對外請求。 */
  function fillBandQuotes(d) {
    var codes = [];
    [].concat(d.buy, d.sell, wAvoid(d), wWatch(d)).forEach(function (r) {
      if (isCode(r.code) && codes.indexOf(r.code) < 0) { codes.push(r.code); }
    });
    if (!codes.length) { return; }

    google.script.run.withSuccessHandler(function (q) {
      codes.forEach(function (code) {
        var v = q[code];
        document.querySelectorAll('[data-bandpx="' + code + '"]').forEach(function (el) {
          if (!v || v.last == null) { el.textContent = '\u2014'; el.className = 'px flat'; return; }
          var pct = v.changePct;
          if (pct == null && v.prevClose) { pct = (v.last - v.prevClose) / v.prevClose * 100; }
          var arrow = pct > 0 ? '\u25B2' : pct < 0 ? '\u25BC' : '';
          el.textContent = fmtPx(v.last) + (pct != null ? '\u3000' + arrow + Math.abs(pct).toFixed(2) + '%' : '');
          el.className = 'px ' + signCls(pct);
        });
      });
    }).withFailureHandler(function () {
      document.querySelectorAll('[data-bandpx]').forEach(function (el) {
        el.textContent = '\u2014'; el.className = 'px flat';
      });
    }).apiGetQuotesFor(codes);
  }

  /* ---------------- 持股追蹤分頁 ---------------- */
  /* 持有中與已出場改成互斥兩區，不再混在同一張表。
     兩者的報酬意義不同：持有中是未實現、會變動；已出場是已實現、不再變動。 */
  var trackerView = 'held';

  function renderTracker(t) {
    var held = t.held || (t.items || []).filter(function (i) { return i.stillHeld; });
    var exited = t.exited || (t.items || []).filter(function (i) { return !i.stillHeld; });
    var showing = trackerView === 'held' ? held : exited;

    $('trackerToggle').innerHTML =
      '<button class="pill" data-tk="held" aria-pressed="' + (trackerView === 'held') +

        '">已出場（' + exited.length + '）</button>';
    $('trackerToggle').querySelectorAll('[data-tk]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (trackerView === b.dataset.tk) { return; }
        trackerView = b.dataset.tk;
        renderTracker(t);
      });
    });

    var sum = trackerView === 'held' ? t.heldSummary : t.exitedSummary;
    var box = $('trackerSummary');
    if (box) {
      if (sum && sum.priced) {
        box.innerHTML =
          '<div class="tsum">' +
          '<div class="tsum-i"><div class="k">' + (trackerView === 'held' ? '持有檔數' : '出場檔數') +
            '</div><div class="v">' + sum.total + '</div></div>' +
          '<div class="tsum-i"><div class="k">' + (trackerView === 'held' ? '平均未實現報酬' : '平均已實現報酬') +
            '</div><div class="v ' + signCls(sum.avgReturn) + '">' + fmtRet(sum.avgReturn) + '</div></div>' +
          '<div class="tsum-i"><div class="k">正報酬比例</div><div class="v">' +
            (sum.positiveRatio == null ? '\u2014' : sum.positiveRatio.toFixed(1) + '%') + '</div></div>' +
          '</div>';
      } else {
        box.innerHTML = '';
      }
    }

    /* 規則說明改成一行 + 問號。

       先前是把兩段完整的規則全文接起來，加起來兩百多字，就掛在表格下面。
       那些字是對的，但沒有人會在看報酬的時候停下來讀兩百字；
       它的實際作用只是把表格往下推。

       現在留一行「怎麼算的」，細節收進問號裡——真的想核對計算方式的人
       會去點，其他人不必先滑過兩百字。 */
    var basisFull = ((trackerView === 'held' ? (t.heldBasis || '') : (t.exitedBasis || '')) +
                     '　' + (t.basis || '')).trim();
    $('trackerBasis').innerHTML =
      '<span>' + esc(trackerView === 'held'
        ? '未實現損益以明講價或當日收盤計，觀望不碰視為出場。'
        : '已實現損益以出場日收盤計。') + '</span>' +

                   'aria-expanded="false" aria-label="計算方式的完整說明">?</button>' +
                   '<span class="whytext" id="basisWhyText" hidden>' + esc(basisFull) + '</span>'

    var wb = $('basisWhy');

    if (!showing.length) {
      $('trackerTable').innerHTML = trackerView === 'held'
        ? emptyBlock('目前沒有還在手上的標的', exited.length ? '有 ' + exited.length + ' 檔已經出場，切換上方即可看到。' : (t.note || ''))
        : emptyBlock('還沒有已出場的標的', '所有講過買入的標的都還在追蹤中。');

  function renderTrackerRows(t, items) {
    var isHeld = trackerView === 'held';
    $('trackerTable').innerHTML = '<div class="card flush scrollx"><table class="tbl-trk">' +

      '<th class="sticky">股票名稱</th><th>代號</th><th>狀態</th>' +

      '<th class="r">持有天數</th>' +
      '<th class="r">進場價</th><th class="r">' + (isHeld ? '目前價' : '出場價') + '</th>' +
      '<th class="r">' + (isHeld ? '未實現報酬' : '已實現報酬') + '</th>' +

      '</tr></thead><tbody>' +
      items.map(function (i) {
        /* 狀態欄：買了又賣、賣了又買的標的標出目前是第幾回合，
           滑過去可以看到完整的回合明細，才不會以為只有一段。 */
        var rounds = i.rounds || 1;
        /* 「第 N 回合」放在「持有中」下面，兩行（v54，管理者要求）。
           並排時狀態欄要 128px 才放得下，下面那一欄的空間就被吃掉。 */
        var stateTxt = '<span class="state-stack"><span class="pillstate ' + (i.stillHeld ? 'held' : 'out') + '">' +
          (i.stillHeld ? '持有中' : '已出場') + '</span>' +

           成本是哪一天、怎麼來的仍然完整保留：滑鼠停在進場價上看得到，個股面板的「成本來源」也有。 */
        var entryTitle = (i.entrySrc || '') +
          (i.refPrice ? '　參考價位 ' + fmtPx(i.refPrice) + (i.refSrc ? '（' + i.refSrc + '）' : '') : '');
        /* 最新說明：最近一句有意義的說明，附上是哪一天講的（v54）。已出場列顯示出場原因。 */
        var lastCol = i.stillHeld ? datedNote(i.latestReason || i.firstReason, i.latestReasonDate)
                                  : (i.exitReason || datedNote(i.latestReason || i.firstReason, i.latestReasonDate));
        /* 多回合的標的，報酬欄除了本回合，另外用小字標出累積報酬。
           兩者意義不同：本回合是現在這一段，累積是同一筆錢滾過每一段的結果。 */
        /* 累積報酬的時間點（v54，Codex 規格 27）：本回合報酬用即時價，累積與各回合用重算當天的收盤，
           數字對不上時讀的人要看得出是時間點不同，不是算錯。 */
        var asOf = String(i.roundsAsOf || '').match(/^\d{4}\/(\d{2})\/(\d{2})$/);
        var asOfTxt = asOf ? Number(asOf[1]) + '/' + Number(asOf[2]) : '';
        var cumTag = (rounds > 1 && i.cumRet !== null && i.cumRet !== undefined)

            esc(i.roundRets || '') + '">累積 ' + fmtRet(i.cumRet) + (asOfTxt ? '（至 ' + asOfTxt + '）' : '') + '</span>' : '';
        return '<tr' + (i.valid ? ' class="clickable" data-code="' + i.code + '"' : '') + '>' +
          '<td class="sticky">' + nameCell(i.name, i.valid ? i.code : '') + '</td>' +
          '<td class="code' + (i.valid ? '' : ' flat') + '">' + esc(i.code) + '</td>' +
          '<td class="state" title="' + esc(i.roundDetail || '') + '">' + stateTxt + '</td>' +
          '<td class="code tdate" data-label="' + (isHeld ? '進場日' : '出場日') + '">' + esc(isHeld ? (i.roundStart || i.firstBuy) : (i.lastSell || i.firstBuy)) + '</td>' +
          '<td class="px r tdays" data-label="天數">' + i.days + '</td>' +
          '<td class="px r tentry" data-label="進場價" title="' + esc(entryTitle) + '">' + fmtPx(i.entry) + '</td>' +
          '<td class="px r tcur" data-label="' + (isHeld ? '目前價' : '出場價') + '" title="' + esc(i.curSrc || '') + '">' + fmtPx(i.current) + '</td>' +
          '<td class="px r tret ' + signCls(i.ret) + '" data-label="' + (isHeld ? '未實現報酬' : '已實現報酬') + '" title="' + esc(i.why) + '">' +
            (i.ret === null && i.why ? '<span class="flat" style="font-size:calc(11.5px * var(--rd-fs))">' + esc(i.why) + '</span>' : fmtRet(i.ret)) +
            cumTag + '</td>' +
          '<td class="px r tment" data-label="提及">' + i.mentions + '</td>' +
          '<td class="reason" data-label="' + (isHeld ? '最新說明' : '出場原因') + '">' + esc(lastCol) + '</td></tr>';
      }).join('') + '</tbody></table></div>';

    bindRows($('p-tracker'));

  /* 管理功能已全部移到後台（?page=admin），這裡不再有立即刷新的處理器。
     原本那段綁的是技術說明頁的密鑰輸入框與按鈕，那兩個元素已經移除，
     留著只會是一段永遠不會執行到的死碼。 */

  /* 預設只顯示前幾筆，其餘收起來。
     個股面板的逐日說明與紀錄表都可能有幾十筆，全部攤開會長到捲不完，
     而使用者九成只想看最近幾天。 */
  var TL_HEAD = 5;

  function collapseList_(root, sel, keep, tag) {
    if (!root) { return; }
    var items = root.querySelectorAll(sel);
    if (items.length <= keep) { return; }
    for (var i = keep; i < items.length; i++) { items[i].classList.add('is-hid'); }

    var btn = root.querySelector('[data-more="' + tag + '"]');
    if (!btn) { return; }
    btn.addEventListener('click', function () {
      var hidden = root.querySelectorAll(sel + '.is-hid');
      if (hidden.length) {
        hidden.forEach(function (el) { el.classList.remove('is-hid'); });
        btn.textContent = '收合，只看最近 ' + keep + ' 筆';
      } else {
        var all = root.querySelectorAll(sel);
        for (var j = keep; j < all.length; j++) { all[j].classList.add('is-hid'); }
        btn.textContent = '顯示其餘 ' + (all.length - keep) + ' 筆';
        root.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
      }
    });
  }

  /* ---------------- 共用日曆元件 ---------------- *
     郵件查詢與「翻到某一天」用的是同一份程式與同一組樣式，
     所以兩邊的外觀與操作方式必然一致，不會各自長歪。

     opts：
       grid / title / prev / next  各元素的 id
       onPick(dateStr)             點下有資料的日期時呼叫
       dates                       { 'YYYY/MM/DD': 任意真值 }，決定哪幾天點得下去
  */
  function makeCalendar(opts) {
    var nowInit = new Date();
    var state = { year: nowInit.getFullYear(), month: nowInit.getMonth(), dates: {}, sel: '' };
    var g = function () { return document.getElementById(opts.grid); };
    var today = (function () {
      var n = new Date();
      return n.getFullYear() + '/' + ('0' + (n.getMonth() + 1)).slice(-2) +
             '/' + ('0' + n.getDate()).slice(-2);
    })();

    function parseDateKey(raw) {
      if (!raw) { return ''; }
      var str = (typeof raw === 'string') ? raw : (raw.date || raw.Date || raw.日期 || raw.d || '');
      str = String(str).trim();
      var match = str.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
      if (match) {
        var y = parseInt(match[1], 10);
        var m = parseInt(match[2], 10);
        var d = parseInt(match[3], 10);
        if (y >= 1970 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31) {
          return y + '/' + ('0' + m).slice(-2) + '/' + ('0' + d).slice(-2);
        }
      }
      return '';
    }

    function render() {
      var grid = g();
      if (!grid) { return; }
      var now = new Date();
      if (isNaN(state.year) || isNaN(state.month) || state.year < 1970 || state.year > 2100 || state.month < 0 || state.month > 11) {
        state.year = now.getFullYear();
        state.month = now.getMonth();
      }
      var title = document.getElementById(opts.title);
      if (title) { title.textContent = state.year + ' 年 ' + (state.month + 1) + ' 月'; }

      var startDow = new Date(state.year, state.month, 1).getDay();   // 0 週日
      var daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
      var weekhdr = ['日', '一', '二', '三', '四', '五', '六'];

      var html = weekhdr.map(function (w) { return '<div class="cal-w">' + w + '</div>'; }).join('');
      for (var i = 0; i < startDow; i++) { html += '<div class="cal-c empty"></div>'; }
      for (var d = 1; d <= daysInMonth; d++) {
        var mm = ('0' + (state.month + 1)).slice(-2), dd = ('0' + d).slice(-2);
        var key = state.year + '/' + mm + '/' + dd;
        var has = !!state.dates[key];
        var cls = 'cal-c day' + (has ? ' has' : ' none') +
                  (key === today ? ' today' : '') +
                  (key === state.sel ? ' sel' : '');
        html += '<button type="button" class="' + cls + '"' +
          (has ? ' data-date="' + key + '"' : ' disabled') + '>' +
          '<span class="cal-n">' + d + '</span>' +
          (has ? '<span class="cal-dot"></span>' : '') + '</button>';
      }
      grid.innerHTML = html;

      grid.querySelectorAll('.cal-c.has').forEach(function (b) {
        b.addEventListener('click', function () {
          grid.querySelectorAll('.cal-c').forEach(function (x) { x.classList.remove('sel'); });
          b.classList.add('sel');
          state.sel = b.dataset.date;
          opts.onPick(b.dataset.date);
        });
      });
    }

    function shift(n) {
      if (isNaN(state.year) || isNaN(state.month)) {
        var now = new Date();
        state.year = now.getFullYear();
        state.month = now.getMonth();
      }
      state.month += n;
      while (state.month < 0) { state.month += 12; state.year--; }
      while (state.month > 11) { state.month -= 12; state.year++; }
      render();
    }
    var pv = document.getElementById(opts.prev), nx = document.getElementById(opts.next);
    if (pv) { pv.addEventListener('click', function () { shift(-1); }); }
    if (nx) { nx.addEventListener('click', function () { shift(1); }); }

    // 初始化時即做一次乾淨渲染，避免載入前空白或版面跳動
    render();

    return {
      /** list：[{date:'YYYY/MM/DD', ...}] 或 ['YYYY/MM/DD', ...]，新到舊。預設翻到最新一筆所在的月份。 */
      setDates: function (list) {
        state.dates = {};
        var validDates = [];
        (list || []).forEach(function (m) {
          var k = parseDateKey(m);
          if (k) {
            state.dates[k] = 1;
            validDates.push(k);
          }
        });
        validDates.sort();
        if (validDates.length) {
          var p = validDates[validDates.length - 1].split('/');
          var y = parseInt(p[0], 10), mon = parseInt(p[1], 10) - 1;
          if (!isNaN(y) && !isNaN(mon) && y >= 1970 && y <= 2100 && mon >= 0 && mon <= 11) {
            state.year = y;
            state.month = mon;
          } else {
            var now = new Date();
            state.year = now.getFullYear();
            state.month = now.getMonth();
          }
        } else {
          var now2 = new Date();
          state.year = now2.getFullYear();
          state.month = now2.getMonth();
        }
        render();
      },
      fail: function (msg) {
        var grid = g();
        if (grid) { grid.innerHTML = '<p class="notice" style="padding:12px;grid-column:1/-1;">' + msg + '</p>'; }
      }
    };
  }

  /* ---------------- 績效走勢 ---------------- */
  var perfChart, perfSeries, perfData = null, perfField = 'avgReturn', perfRange = 10;
  var PERF_LABEL = { avgReturn: '平均報酬 %', positiveRatio: '正報酬比例 %', holding: '持有檔數' };

  function perfSlice() {
    var arr = perfData.series;
    return (perfRange === 'all' || arr.length <= perfRange) ? arr : arr.slice(arr.length - perfRange);
  }

  function renderPerf() {
    if (!perfData || !perfData.series.length) { return; }

    if (!perfChart) {
      perfChart = LightweightCharts.createChart($('perfChart'), chartOptions());
      perfSeries = perfChart.addLineSeries({ lineWidth: 2 });
    }
    perfChart.applyOptions(chartOptions());

    /* 算不出來的那幾天要整個略過，不能畫成 0。
       Number(null) 與 Number('') 都是 0，直接丟進圖裡就會變成一條平在 0 的線，
       看起來像那段期間績效掛零，實際上是沒有資料。
       後端已經改成回 null，這裡再擋一次：舊資料還沒重算過時也不會畫錯。 */
    var pts = perfSlice().map(function (r) {
      var v = r[perfField];
      if (v === null || v === undefined || v === '') { return null; }
      var n = Number(v);
      return isFinite(n) ? { time: r.date.replace(/\//g, '-'), value: n } : null;
    }).filter(function (p) { return p; });
    var last = pts.length ? pts[pts.length - 1].value : 0;

    /* 線的顏色。

       紅綠只對「平均報酬」有意義——那是有正負的數字，紅賺綠賠是台股語彙。
       正報酬比例永遠大於 0，用同一條規則的話它永遠是紅的：勝率只有三成
       也畫一條代表上漲的紅線，那是反過來誤導。
       它要比的是五成，所以改用中性色，並在 50% 拉一條基準線讓人自己看高低。 */
    perfSeries.applyOptions({
      color: perfField === 'avgReturn'
               ? (last >= 0 ? css('--rise') : css('--fall'))
               : css('--note'),
      priceFormat: { type: 'price', precision: perfField === 'holding' ? 0 : 2, minMove: perfField === 'holding' ? 1 : 0.01 }
    });
    perfSeries.setData(pts);
    perfChart.applyOptions({ width: $('perfChart').clientWidth });
    perfChart.timeScale().fitContent();

    /* 基準線。平均報酬看零軸，正報酬比例看五成——
       沒有這條線的話，35% 與 65% 在圖上長得一樣，看不出是好是壞。 */
    if (perfField === 'avgReturn') {
      perfSeries.createPriceLine({ price: 0, color: css('--rule'), lineWidth: 1,
                                   lineStyle: 2, axisLabelVisible: false });
    } else if (perfField === 'positiveRatio') {
      perfSeries.createPriceLine({ price: 50, color: css('--muted'), lineWidth: 1,
                                   lineStyle: 2, axisLabelVisible: true, title: '五成' });
    }
  }

  function renderPerfTable() {
    var s = perfSlice().slice().reverse();
    $('perfTable').innerHTML = '<div class="card flush"><table><thead><tr>' +
      '<th>日期</th><th class="r">追蹤檔數</th><th class="r">持有檔數</th>' +

          '<td class="px r">' + (r.positiveRatio == null ? '\u2014' : r.positiveRatio.toFixed(1) + '%') + '</td></tr>';

    hour: '60 分 K 使用歷史補抓及日內快取，Yahoo 僅作空缺備援；量統一為張，來源差異可能使日內加總與官方全日成交量不同。',
    month: '由日線聚合為月K，開收取當月首末日，高低取極值，成交股數先加總再換算為張。',
    day: '來自證交所與富果的每日收盤資料。成交量＝當日成交股數 ÷ 1000（張），含零股、盤後定價與鉅額交易。',
    week: '由日線聚合：開盤取當週第一天、收盤取最後一天、高低取當週極值，成交量為當週成交股數加總後 ÷ 1000（張）。'
  };

  var detailRequest = 0;
  function openDetail(code) {
    var request = ++detailRequest;
    if (!isCode(code)) { return; }
    currentCode = code;
    USE.act('看個股', code);
    DETAIL = { code: code, tracker: undefined, record: undefined };
    $('detail').classList.add('open');
    document.body.style.overflow = 'hidden';

    $('dCode').textContent = code;
    $('dName').textContent = '\u00b7\u00b7\u00b7';
    $('dPrice').textContent = '\u00b7\u00b7\u00b7';
    $('dChange').textContent = '';
    $('dTracker').innerHTML = skelKv(4);
    $('dFund').innerHTML = skelKv(4);
    $('dRecord').innerHTML = skel(4);
    $('dFundNote').textContent = '';

    /* 名稱與報價、持有回合、提到的紀錄合成一個請求（v54，Codex 規格 68）：後端共用同一份試算表快照，
       三塊各自成敗；基本面冷快取慢，仍然另外請求、到了再顯示，不拖住首屏。
       舊版是四個請求各自讀表（操作紀錄、會員持股、持股追蹤各讀兩三次）。 */
    google.script.run.withSuccessHandler(function (s) {
      if (request !== detailRequest) { return; }
      s = s || {};
      if (s.header) { renderHeader(s.header); } else { $('dName').textContent = code; $('dPrice').textContent = '\u2014'; }
      renderTrackerBlock(s.tracker || null);
      if (s.record) { renderRecordBlock(s.record); }
      else { $('dRecord').innerHTML = emptyBlock('讀取失敗', '請關閉重開再試一次。'); }
    }).withFailureHandler(function () {
      if (request !== detailRequest) { return; }
      $('dName').textContent = code; $('dPrice').textContent = '\u2014';
      renderTrackerBlock(null);
      $('dRecord').innerHTML = emptyBlock('讀取失敗', '請關閉重開再試一次。');
    }).apiGetStockSummary(code);

    google.script.run.withSuccessHandler(function(data){if(request === detailRequest) renderFundBlock(data);})
      .withFailureHandler(function () { if(request !== detailRequest) return; renderFundBlock(null); })
      .apiGetStockFundamentals(code);

    loadCandles(code, period);
  }

  function renderHeader(d) {
    // 名稱來自對照表，就算報價掛掉也一定有中文名
    $('dName').textContent = d.name || d.code;
    $('dCode').textContent = d.code + (d.market ? '\u3000' + d.market : '');

    var q = d.quote;
    if (!q || !q.ok || q.last == null) {
      $('dPrice').textContent = '\u2014';
      $('dPrice').className = 'p flat';
      $('dChange').textContent = '目前取不到報價';
      $('dChange').className = 'd flat';
      return;
    }
    $('dPrice').textContent = fmtPx(q.last);
    $('dPrice').className = 'p ' + signCls(q.change);
    $('dChange').className = 'd ' + signCls(q.change);
    var sign = q.change > 0 ? '\u25B2' : q.change < 0 ? '\u25BC' : '';
    $('dChange').textContent = q.change != null
      ? (sign + ' ' + Math.abs(q.change).toFixed(2) + '\u3000' + (q.changePct || 0).toFixed(2) + '%'
         + (q.time ? '\u3000' + qTime(q.time) : ''))
      : '\u2014';
  }

  /* 抽屜這一次開的是哪一檔、兩支請求各自回了什麼。

     追蹤資料與逐日紀錄是兩支獨立的請求，誰先回不一定。要在「沒有追蹤資料」
     的時候改為顯示他最近怎麼說，就得等兩邊都到齊——所以先收起來，
     由 paintTracker 一起決定要畫什麼。 */
  var DETAIL = { code: '', tracker: undefined, record: undefined };

  function renderTrackerBlock(t) {
    DETAIL.tracker = t;
    paintTracker();
  }

  /* 沒有追蹤資料時要顯示什麼。

     先前是一句「影片中沒有明講買入過這一檔」，佔著整個抽屜最上方最大的位置。
     但會點進來的人多半就是因為今天他講了這一檔——當天沒有買賣、全部都是
     觀望的日子更是如此。畫面卻用最大的篇幅告訴你「他沒買過」，
     真正想看的那句話被推到最下面的小表格裡。

     現在改成把最近一次的立場與那句話擺到最上面。 */
  function paintTracker() {
    var t = DETAIL.tracker;
    if (t === undefined) { return; }           // 還沒回來，維持骨架

    if (!t) {
      var r = DETAIL.record;
      if (r === undefined) { return; }         // 等逐日紀錄一起到

      var last = (r && r.found && r.trades && r.trades.length) ? r.trades[0] : null;
      if (last) {
        var cls = last.direction.indexOf('買') === 0 ? 'dir-buy'
                : last.direction.indexOf('賣') === 0 ? 'dir-sell'
                : last.direction.indexOf('注意') >= 0 ? 'dir-note' : 'dir-watch';
        $('dTracker').innerHTML =
          '<div class="kv-cell wide"><div class="k">張震最近一次的說法</div>' +
            '<div class="v"><span class="stance ' + cls + '">' + esc(last.direction) +
            '</span><span class="srcnote">' + esc(last.date) + '</span></div></div>' +
          '<div class="kv-cell wide"><div class="k">說明重點</div>' +
            '<div class="v na">' + esc(last.reason || '未說明') + '</div></div>' +
          '<div class="kv-cell wide"><div class="k">追蹤狀態</div>' +
            '<div class="v na">沒有明講過買入，所以不列入持股追蹤與報酬計算</div></div>';
      } else {
        $('dTracker').innerHTML = '<div class="kv-cell wide"><div class="k">追蹤狀態</div>' +
          '<div class="v na">影片中沒有提到過這一檔</div></div>';
      }
      return;
    }

    var rounds = t.rounds || 1;
    $('dTracker').innerHTML =
      kv('狀態', (t.stillHeld ? '<span class="up">持有中</span>' : '<span class="flat">已出場</span>') +
        (rounds > 1 ? '<span class="srcnote">第 ' + rounds + ' 回合</span>' : '')) +
      kv(t.firstOpenBy === '會員持股聲明' ? '首次明講會員持有' : '首次提到買入',
         t.firstBuy || '\u2014') +
      (rounds > 1 ? kv('本回合進場', t.roundStart || '\u2014') : '') +
      kv('持有天數', t.days + ' 天' + (rounds > 1 ? '（本回合）' : '')) +
      kv('進場價', fmtPx(t.entry) + (t.entrySrc ? '<span class="srcnote">' + esc(t.entrySrc) + '</span>' : '')) +
      (t.openBy === '會員持股聲明'
        ? kv('進場依據', '影片中明講「會員目前持有」，非當日成交'
             + '<span class="srcnote">沒有對應的買入紀錄，進場價取當日收盤</span>') : '') +
      (t.refPrice ? kv('參考價位', fmtPx(t.refPrice) +
        '<span class="srcnote">' + esc(t.refSrc || '') + '　僅供參考，未用於報酬計算</span>') : '') +
      kv(t.stillHeld ? '目前價' : '出場價', fmtPx(t.current)) +
      kv(t.stillHeld ? '未實現報酬' : '已實現報酬', '<span class="' + signCls(t.ret) + '">' + fmtRet(t.ret) + '</span>') +
      (t.rounds > 1 && t.cumRet !== null && t.cumRet !== undefined
        ? kv('累積報酬', '<span class="' + signCls(t.cumRet) + '">' + fmtRet(t.cumRet) + '</span>' +
             '<span class="srcnote">各回合連乘　' + esc(t.roundRets || '') + '</span>') : '') +
      /* 出場原因可能有兩句（例如「持有聲明還在確認期」加上「期間轉過觀望不碰」）。
         兩句擠成一行會變成一整片沒有斷點的文字牆，實際看到的就是那個樣子。
         後端用換行分隔，這裡拆成兩行呈現。 */
      (t.exitReason
        ? kv('出場原因', String(t.exitReason).split('\n').filter(String)
             .map(function (line) { return '<span class="exl">' + esc(line) + '</span>'; })
             .join(''))
        : '') +
      kv('影片提及', t.mentions != null ? t.mentions + ' 次' : '—') +
      (t.why ? kv('說明', t.why, true) : '');

    /* 回合明細：買了又賣、賣了又買時，把每一段都列出來。
       只有一個回合時不顯示，避免佔版面講一件已經看得到的事。 */
    var rd = $('dRounds');
    if (rd) {
      if (rounds > 1 && t.roundDetail) {
        rd.innerHTML = '<div class="roundbox"><div class="roundbox-h">持有回合</div>' +
          t.roundDetail.split('\n').filter(String).map(function (line) {
            return '<div class="roundbox-i">' + esc(line) + '</div>';
          }).join('') + '</div>';
        rd.hidden = false;
      } else {
        rd.innerHTML = ''; rd.hidden = true;
      }
    }

    /* 逐日手風琴拿掉了。

       它與下面「影片中提到的每一次」是同一份資料的兩種樣子——一個是日期
       手風琴、一個是日期表格。同一個抽屜裡把同一件事講兩遍，而且兩邊的
       排版、展開規則、折疊筆數都不一樣，看起來像兩份不同的資料，
       筆數對不上時還會讓人以為有一邊漏了。

       留表格那一份：它多了方向與價位兩欄，是嚴格比較完整的那一個。
       t.timeline 仍然留在後端與試算表裡，郵件與稽核都還在用。 */
  }

  function renderFundBlock(f) {

      kv('殖利率', f.yld ? f.yld.toFixed(2) + '%' : '未提供', !f.yld) +
