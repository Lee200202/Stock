<div class="market-board" id="marketBoard">
  <div class="market-heading">
    <div>
      <h2>市場總覽</h2>
      <p>點選市場，展開當日走勢與歷史 K 線。</p>
    </div>
    <button type="button" class="market-btn market-refresh-btn" id="marketRefresh">更新資料</button>
  </div>
  <p id="marketStatus" class="notice" role="status" aria-live="polite">開啟分頁後載入資料。</p>
  <div id="marketCards" class="market-cards"></div>
  <section class="market-sector card">
    <div class="market-heading">
      <div>
        <h3>產業成交比重</h3>
        <p id="marketSectorDate"></p>
      </div>
      <span class="market-tag">集中市場 · 盤後</span>
    </div>
    <p id="marketSectorBasis" class="notice"></p>
    <div id="marketSectors"></div>
    <button type="button" id="marketSectorToggle" class="market-btn market-toggle-btn" aria-expanded="false" aria-controls="marketSectors" hidden>展開其餘產業</button>
  </section>
  <details class="market-source-details"><summary>資料來源與更新方式</summary><p>加權指數使用 Fugle 與 Yahoo；台指期折線只繪期交所實際報價快照，歷史日 K 來自 FinMind；國際指標使用 Yahoo。開啟此頁時每五分鐘查一次；來源未更新時保留時間標記，不補造走勢。</p></details>
</div>
<style>
.market-board { width:100%; min-width:0; }
.market-empty { grid-column:1/-1; padding:32px; border:1px solid var(--rule); border-radius:18px; background:var(--panel); line-height:1.9; width:auto; max-width:none; min-width:0; word-break:normal; }
.market-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:12px; }
.market-heading h2 { margin:0 0 6px; font-size:calc(23px * var(--rd-fs)); font-weight:700; letter-spacing:.02em; }
.market-heading p { color:var(--muted); line-height:1.6; margin:0; font-size:calc(14px * var(--rd-fs)); }

/* 卡片網格：大盤長寬度與其他 chunk 對齊，並保留充裕留白 */
.market-cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin:18px 0 24px; }

/* 點選卡片即可開啟互動圖表，微懸浮與陰影轉場反饋 */
.market-card {
  padding:20px 22px; border:1px solid var(--rule); border-radius:14px;
  background:var(--panel); min-width:0; box-shadow:0 1px 4px rgba(0,0,0,.035);
  cursor:pointer; user-select:none; position:relative;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  display:flex; flex-direction:column; justify-content:space-between;
}
.market-card:hover {
  transform:translateY(-2px); border-color:var(--beam);
  box-shadow:0 6px 20px rgba(0,0,0,.07);
}
.market-card:active { transform:translateY(1px); }
.market-card:focus-visible { outline:2px solid var(--beam); outline-offset:2px; }

/* 加權指數（大盤）拉到全版，折線圖長寬維持一致且置中，保有充裕留白 */
.market-card:first-child { grid-column:1/-1; }
.market-card:first-child .market-card-info { flex:0 0 210px; min-width:180px; max-width:260px; }
.market-card:first-child .market-card-chart { flex:1 1 0; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.market-card:first-child .market-chart-wrap { width:100%; max-width:none; margin:0 auto; }

/* 左右分欄：左文字資訊、右折線圖，留出適當呼吸空白 */
.market-card-layout { display:flex; align-items:stretch; justify-content:space-between; gap:20px; width:100%; }
.market-card-info { display:flex; flex-direction:column; justify-content:space-between; flex:0 0 210px; min-width:180px; max-width:260px; }

.market-card-head { margin-bottom:8px; }
.market-card-title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
.market-card h3 {
  margin:0; font-size:calc(16.5px * var(--rd-fs)); font-weight:600;
  color:var(--ink); display:flex; align-items:center; gap:6px;
}
.market-card-arrow { font-size:calc(16px * var(--rd-fs)); color:var(--muted); opacity:.6; transition:transform .2s ease, opacity .2s ease, color .2s ease; }
.market-card:hover .market-card-arrow { transform:translateX(3px); opacity:1; color:var(--beam); }

.market-price-wrap { display:flex; align-items:baseline; gap:6px; margin:2px 0 4px; }
.market-value { font-variant-numeric:tabular-nums; font-size:calc(clamp(24px,2.2vw,32px) * var(--rd-fs)); font-weight:700; line-height:1.15; white-space:nowrap; overflow-wrap:normal; color:var(--ink); }
.market-unit { font-size:calc(12px * var(--rd-fs)); color:var(--muted); font-weight:normal; }

.market-delta { display:block; margin:0 0 6px; font-size:calc(14.5px * var(--rd-fs)); font-weight:600; font-variant-numeric:tabular-nums; }

/* 60分K 背離狀態徽章（<= 6字極簡標籤） */
.market-div-wrap { margin:4px 0 6px; display:inline-flex; align-items:center; }
.market-div-badge {
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px;
  border-radius:6px; font-size:calc(11.5px * var(--rd-fs)); font-weight:600; width:fit-content; line-height:1.3;
}
.market-div-badge.div-bearish { background:rgba(255,112,123,.12); color:var(--rise); border:1px solid rgba(255,112,123,.3); }
.market-div-badge.div-bullish { background:rgba(74,209,176,.12); color:var(--fall); border:1px solid rgba(74,209,176,.3); }
.market-div-badge.div-neutral { background:var(--panel-2); color:var(--muted); border:1px solid var(--rule); }
.div-dot { font-size:8px; line-height:1; }
.market-div-basis { font-size:calc(12px * var(--rd-fs)); color:var(--muted); margin-left:6px; font-weight:500; }

/* 右側折線圖區塊 */
.market-card-chart { flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:center; }
.market-chart-wrap { width:100%; display:flex; flex-direction:column; }
.market-spark { width:100%; height:150px; display:block; }
.market-line-labels { display:flex; justify-content:space-between; gap:15px; font-size:calc(11px * var(--rd-fs)); color:var(--muted); margin-top:4px; padding:0 2px; }
.market-chart-empty { padding:28px 16px; text-align:center; background:var(--panel-2); border-radius:12px; }

/* 附註與來源資訊 */
.market-turnover { display:flex; flex-direction:column; gap:4px; padding:8px 0; margin:6px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); font-size:calc(12px * var(--rd-fs)); color:var(--muted); line-height:1.5; }
.market-turnover span b { color:var(--ink); font-weight:600; }
.market-source { font-size:calc(11px * var(--rd-fs)); color:var(--muted); margin-top:6px; line-height:1.5; overflow-wrap:anywhere; }

/* 產業成交比重 */
.market-sector { box-sizing:border-box; padding:22px; border-radius:14px; margin-bottom:20px; width:100%; }
.market-source-details { padding:12px 16px; border:1px solid var(--rule); border-radius:12px; color:var(--muted); font-size:calc(13px * var(--rd-fs)); line-height:1.65; }
.market-source-details summary { cursor:pointer; color:var(--ink); font-weight:600; }
.market-source-details p { margin:10px 0 0; }
.market-sector-row { display:grid; grid-template-columns:minmax(110px,180px) minmax(0,1fr) 64px; align-items:center; gap:15px; margin:16px 0; font-size:calc(14px * var(--rd-fs)); }
.market-sector-row[hidden] { display:none!important; }
.market-sector-row span { overflow-wrap:anywhere; text-wrap:balance; }
.market-meter { height:16px; background:var(--panel-2); border-radius:6px; overflow:hidden; }
.market-meter i { display:block; height:100%; background:var(--beam); min-width:1px; border-radius:6px; }
.market-sector-row b { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.market-tag { border:1px solid var(--rule); border-radius:30px; padding:7px 12px; font-size:calc(12px * var(--rd-fs)); white-space:nowrap; }

/* 圓弧按鈕（無 icon） */
.market-btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:9px 20px; border-radius:999px; font-size:calc(13.5px * var(--rd-fs));
  font-weight:600; line-height:1.2; cursor:pointer; border:1px solid var(--rule);
  background:var(--panel); color:var(--ink); text-decoration:none;
  box-shadow:0 2px 6px rgba(0,0,0,.04);
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.market-btn:hover:not(:disabled) {
  background:var(--panel-2); border-color:var(--beam); color:var(--beam);
  transform:translateY(-1px); box-shadow:0 4px 12px rgba(4,121,92,.12);
}
.market-btn:active:not(:disabled) { transform:translateY(1px); }
.market-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
.market-refresh-btn { font-size:calc(14px * var(--rd-fs)); padding:10px 24px; }
.market-toggle-btn { width:100%; margin-top:18px; padding:12px 24px; font-size:calc(14px * var(--rd-fs)); }

@media(max-width:860px) {
  .market-cards { grid-template-columns:1fr; gap:18px; margin:20px 0 28px; }
  .market-card, .market-card:first-child { padding:20px 22px; grid-column:auto; }
  .market-card-layout, .market-card:first-child .market-card-layout { display:flex; flex-direction:row; align-items:stretch; justify-content:space-between; gap:18px; width:100%; }
  .market-card-info, .market-card:first-child .market-card-info { flex:0 0 190px; min-width:160px; max-width:220px; display:flex; flex-direction:column; justify-content:space-between; }
  .market-card-chart, .market-card:first-child .market-card-chart { flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:center; align-items:stretch; }
  .market-chart-wrap, .market-card:first-child .market-chart-wrap { width:100%; max-width:none; margin:0; display:flex; flex-direction:column; }
  .market-spark, .market-card:first-child .market-spark { width:100%; height:135px; }
  .market-turnover { display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; gap:4px 12px; padding:6px 0; margin:4px 0 2px; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); font-size:calc(11.5px * var(--rd-fs)); color:var(--muted); line-height:1.4; }
  .market-source { font-size:calc(11px * var(--rd-fs)); color:var(--muted); margin-top:2px; line-height:1.4; }
}
@media(max-width:520px) {
  .market-card, .market-card:first-child { padding:17px 16px; }
  .market-card-layout, .market-card:first-child .market-card-layout { flex-direction:column; gap:12px; }
  .market-card-info, .market-card:first-child .market-card-info { flex:none; min-width:0; max-width:none; }
  .market-card-chart, .market-card:first-child .market-card-chart { width:100%; }
  .market-spark, .market-card:first-child .market-spark { height:138px; }
  .market-turnover { font-size:calc(11px * var(--rd-fs)); gap:3px 8px; padding:4px 0; margin:3px 0 2px; }
  .market-sector { padding:18px 14px; }
  .market-sector-row { grid-template-columns:minmax(88px,110px) minmax(0,1fr) 58px; gap:8px; font-size:calc(13px * var(--rd-fs)); }
}
@media(prefers-reduced-motion:reduce) {
  .market-card,.market-btn,.market-card-arrow { transition:none!important; transform:none!important; }
}

/* v53：所有市場同寬同高；價格與圖上下分層，避免大盤橫向拉伸。 */
.market-card:first-child { grid-column:auto; }
.market-card-layout,.market-card:first-child .market-card-layout { flex-direction:column; gap:12px; }
.market-card-info,.market-card:first-child .market-card-info { flex:none; min-width:0; max-width:none; }
.market-card-chart,.market-card:first-child .market-card-chart { width:100%; }
.market-spark,.market-card:first-child .market-spark { height:160px; }
.market-card h3 { flex-wrap:wrap; gap:8px; letter-spacing:0; }
.market-contract { white-space:nowrap; font:500 calc(12px * var(--rd-fs)) system-ui; color:var(--muted); }
.market-card-head { position:relative; }
.market-price-wrap { display:inline-flex; margin-right:12px; }
.market-delta { display:inline-block; font-size:calc(14px * var(--rd-fs)); }
.market-chart-empty { min-height:160px; display:grid; place-items:center; box-sizing:border-box; }
.market-source { font-size:calc(11.5px * var(--rd-fs)); margin-top:2px; }
.market-baseline { font-size:calc(11px * var(--rd-fs)); opacity:.75; }
/* v54：卡片等高、折線圖一律貼底（D7）。台指期多一行合約與成交量，原本那張圖會比旁邊低一截。 */
.market-card-layout { flex:1 1 auto; }
.market-card-chart { margin-top:auto; }
.market-card { border-radius:var(--r-lg, 18px); }
.market-window { color:var(--muted); }
@media(max-width:520px) { .market-heading { gap:12px; } .market-refresh-btn { width:100%; } }
.market-turnover { flex-direction:row; flex-wrap:wrap; border:0; margin:0; padding:0; gap:10px; }
/* 卡片本身的可用寬度比視窗寬度更可靠：側欄、放大字級時也不拆開指數。 */
.market-card { container-type:inline-size; }
.market-price-wrap { max-width:100%; min-width:0; flex-wrap:wrap; }
.market-value { max-width:100%; font-size:calc(clamp(19px, 5.6cqw, 32px) * var(--rd-fs)); }
@container (max-width: 350px) {
  .market-value { font-size:calc(clamp(18px, 7cqw, 27px) * var(--rd-fs)); }
}
@media (max-width: 720px) {
  .market-cards { grid-template-columns:minmax(0,1fr); }
  .market-card { padding:20px; }
  .market-card-layout, .market-card:first-child .market-card-layout { flex-direction:column; }
  .market-card-info, .market-card:first-child .market-card-info { flex:none; max-width:none; min-width:0; }
}
html[data-view="mobile"] .market-cards { grid-template-columns:minmax(0,1fr); }
html[data-view="mobile"] .market-card-layout,
html[data-view="mobile"] .market-card:first-child .market-card-layout { flex-direction:column; }
html[data-view="mobile"] .market-card-info,
html[data-view="mobile"] .market-card:first-child .market-card-info { flex:none; max-width:none; min-width:0; }
</style>
<script>
(function(){
  var pending=false,last=0,serial=0,sectorExpanded=false;
  var cardViewModes={}; // 記錄各卡片當前顯示模式：'intraday' | '60m'
  function el(id){return document.getElementById(id);}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function num(v,d){return v!=null&&isFinite(Number(v))?Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d==null?2:d}):'未取得';}

  // 折線圖：以 0 軸（昨收基準價）為界，上方正值區域紅色，下方負值區域綠色
  function line(rows,label,key,curValue,curChange,basePrice,session,quoteTime,win){
    var day=String(quoteTime||'').slice(0,10).replace(/\//g,'-');
    var parsed=(rows||[]).filter(function(r){return r.value!=null&&isFinite(Number(r.value))&&/T|\d{2}:\d{2}/.test(String(r.time||''));}).map(function(r){
      var t=String(r.time).replace(/\//g,'-').replace(' ','T');
      if(/^\d{2}:\d{2}$/.test(t)){t=day+'T'+t+':00+08:00';}
      if(t.indexOf('T')>=0&&!/Z$|[+-]\d{2}:\d{2}$/.test(t)){t+='+08:00';}
      return {ms:Date.parse(t),value:Number(r.value),time:t};
    }).filter(function(r){return isFinite(r.ms);}).sort(function(a,b){return a.ms-b.ms;});
    if(!parsed.length){return '<div class="market-chart-empty">等待本盤資料</div>';}
    var bounds=window.marketSessionBounds(key,session,parsed[parsed.length-1].time)||
      window.marketRollingBounds(key,parsed.map(function(r){return r.ms;}),win);
    if(bounds){var from=bounds.rolling?bounds.dataStart:bounds.start;parsed=parsed.filter(function(r){return r.ms>=from&&r.ms<=bounds.end;});}
    if(!parsed.length){return '<div class="market-chart-empty">等待本盤資料</div>';}
    var vals=parsed.map(function(r){return r.value;});
    /* 平盤基準（v54，Codex 規格 94）：沒有已驗證的昨收就不拿第一筆冒充，整條用中性色、不畫平盤虛線。 */
    var baseKnown=isFinite(basePrice)&&basePrice>0;
    var ref=baseKnown?basePrice:vals[0];
    var lo=Math.min.apply(null,vals.concat(baseKnown?[basePrice]:[])),hi=Math.max.apply(null,vals.concat(baseKnown?[basePrice]:[]));
    var pad=(hi-lo)*.12||Math.max(1,ref*.001);lo-=pad;hi+=pad;
    var start=bounds?bounds.start:parsed[0].ms,end=bounds?bounds.end:parsed[parsed.length-1].ms;
    var span=Math.max(300000,end-start),lastPoint=null;
    var X=function(ms){return 8+(ms-start)/span*484;},Y=function(v){return 140-(v-lo)/(hi-lo)*128;};
    /* 每一段依它在平盤上方或下方上色（v54，Codex 規格 94、95）：上紅、下綠、貼著平盤用中性色；
       跨過平盤的那一段在交點切開——交點只是作圖用的幾何點，不是成交資料。缺口（相隔超過 15 分鐘）不連線。 */
    var segs={up:'',down:'',flat:''};
    var put=function(cls,x1,y1,x2,y2){segs[cls]+='M'+x1.toFixed(1)+','+y1.toFixed(1)+'L'+x2.toFixed(1)+','+y2.toFixed(1)+' ';};
    parsed.forEach(function(r,i){
      lastPoint={x:X(r.ms),y:Y(r.value),v:r.value};
      if(i===0||r.ms-parsed[i-1].ms>15*60000){return;}
      var a=parsed[i-1],xa=X(a.ms),ya=Y(a.value),xb=X(r.ms),yb=Y(r.value);
      if(!baseKnown){put('flat',xa,ya,xb,yb);return;}
      var da=a.value-basePrice,db=r.value-basePrice;
      if((da>=0&&db>=0)||(da<=0&&db<=0)){put(da+db>0?'up':da+db<0?'down':'flat',xa,ya,xb,yb);return;}
      var t=da/(da-db),xc=xa+(xb-xa)*t,yc=Y(basePrice);
      put(da>0?'up':'down',xa,ya,xc,yc);put(db>0?'up':'down',xc,yc,xb,yb);
    });
    // 只有一個點或全是孤立點時，至少把點畫出來
    var dots=parsed.filter(function(r,i){var p=parsed[i-1],n=parsed[i+1];
      return (!p||r.ms-p.ms>15*60000)&&(!n||n.ms-r.ms>15*60000);}).map(function(r){
      var c=!baseKnown?'var(--muted)':r.value>basePrice?'var(--rise)':r.value<basePrice?'var(--fall)':'var(--muted)';
      return '<circle cx="'+X(r.ms).toFixed(1)+'" cy="'+Y(r.value).toFixed(1)+'" r="1.8" fill="'+c+'"/>';}).join('');
    var yBase=baseKnown?Y(basePrice):null;
    var color=!baseKnown?'var(--muted)':lastPoint.v>basePrice?'var(--rise)':lastPoint.v<basePrice?'var(--fall)':'var(--muted)';
    var hm=function(ms){return new Date(ms+28800000).toISOString().slice(11,16);};
    return '<div class="market-chart-wrap"><svg class="market-spark" viewBox="0 0 500 155" preserveAspectRatio="none" role="img" aria-label="'+esc(label)+'當盤走勢">'+
      (yBase!==null?'<line x1="8" x2="492" y1="'+yBase+'" y2="'+yBase+'" stroke="var(--muted)" stroke-opacity=".35" stroke-dasharray="4 4"/>':'')+
      (segs.up?'<path class="seg-up" d="'+segs.up+'" fill="none" stroke="var(--rise)" stroke-width="2" vector-effect="non-scaling-stroke"/>':'')+
      (segs.down?'<path class="seg-down" d="'+segs.down+'" fill="none" stroke="var(--fall)" stroke-width="2" vector-effect="non-scaling-stroke"/>':'')+
      (segs.flat?'<path class="seg-flat" d="'+segs.flat+'" fill="none" stroke="var(--muted)" stroke-width="2" vector-effect="non-scaling-stroke"/>':'')+
      dots+'<circle cx="'+lastPoint.x+'" cy="'+lastPoint.y+'" r="2.5" fill="'+color+'"/></svg>'+
      '<div class="market-line-labels"><span>'+(bounds?bounds.startLabel:hm(start))+'</span><span class="market-baseline">'+(bounds&&bounds.rolling?esc(bounds.title)+' · ':'')+(baseKnown?'平盤 '+window.marketNum(basePrice,key):'平盤未取得')+'</span><span>'+(bounds?bounds.endLabel:hm(end))+'</span></div></div>';
  }

  // 60分K走勢圖（含最新均線與走勢）
  function line60m(bars, label, key){
    bars = (bars || []).filter(function(b){
      return Array.isArray(b) && b.length >= 5 && isFinite(Number(b[4])) && Number(b[4]) > 0;
    });
    if(bars.length < 5){
      return '<div class="market-chart-empty"><p class="notice">尚無充足 60 分鐘歷史分 K，請參考當日走勢</p></div>';
    }
    var recent = bars.slice(-30);
    var closes = recent.map(function(b){ return Number(b[4]); });
    var minVal = Math.min.apply(null, closes);
    var maxVal = Math.max.apply(null, closes);
    var pad = (maxVal - minVal) * 0.08 || (closes[0] * 0.01) || 1;
    var lo = minVal - pad, hi = maxVal + pad, rng = hi - lo;

    var yTop = 12, yBottom = 132, hSpan = yBottom - yTop;
    var xLeft = 10, xRight = 490, wSpan = xRight - xLeft;
    var step = wSpan / Math.max(1, recent.length - 1);

    var pts = [];
    var points = recent.map(function(b, i){
      var x = xLeft + i * step;
      var y = yBottom - (Number(b[4]) - lo) / rng * hSpan;
      pts.push([x, y]);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');

    var strokeId = 'k60-stroke-' + esc(key) + '-' + Math.floor(Math.random()*100000);
    var firstPt = pts[0], lastPt = pts[pts.length - 1];
    var areaPoly = points + ' ' + lastPt[0].toFixed(1) + ',' + yBottom + ' ' + firstPt[0].toFixed(1) + ',' + yBottom;
    var isUp = Number(recent[recent.length - 1][4]) >= Number(recent[0][4]);
    var themeColor = isUp ? 'var(--rise)' : 'var(--fall)';

    var defs = '<defs>' +
      '<linearGradient id="' + strokeId + '" x1="0" y1="' + yTop + '" x2="0" y2="' + yBottom + '" gradientUnits="userSpaceOnUse">' +
        '<stop offset="0" stop-color="' + themeColor + '" stop-opacity="0.25"/>' +
        '<stop offset="1" stop-color="' + themeColor + '" stop-opacity="0.02"/>' +
      '</linearGradient>' +
    '</defs>';

    var startLbl = String(recent[0][0]).slice(5, 16);
    var endLbl = String(recent[recent.length - 1][0]).slice(5, 16);

    return '<div class="market-chart-wrap">' +
      '<svg class="market-spark" viewBox="0 0 500 145" preserveAspectRatio="none" role="img" aria-label="' + esc(label) + ' 60分K走勢">' +
        defs +
        '<polygon points="' + areaPoly + '" fill="url(#' + strokeId + ')"/>' +
        '<polyline points="' + points + '" fill="none" stroke="' + themeColor + '" stroke-width="2" vector-effect="non-scaling-stroke"/>' +
      '</svg>' +
      '<div class="market-line-labels"><span>' + startLbl + '</span><span>' + endLbl + ' (60分K)</span></div>' +
    '</div>';
  }

  var cardData={};

  // 點選卡片開啟完整互動圖表（含 60分K、日K、指標分析）
  el('marketCards').addEventListener('click',function(e){
    var card=e.target.closest('[data-open-market]');
    if(card&&cardData[card.dataset.openMarket]){
      window.openMarketDetail(cardData[card.dataset.openMarket]);
    }
  });

  el('marketCards').addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){
      var card=e.target.closest('[data-open-market]');
      if(card&&cardData[card.dataset.openMarket]){
        e.preventDefault();
        window.openMarketDetail(cardData[card.dataset.openMarket]);
      }
    }
  });

  function render(data){
    cardData={};(data.cards||[]).forEach(function(c){cardData[c.key]=c;});
    el('marketCards').innerHTML=(data.cards||[]).map(function(c){
      var value=Number(c.change),color=value>0?'var(--rise)':value<0?'var(--fall)':'var(--muted)';
      var delta=c.change==null?'漲跌未取得':(value>0?'+':'')+window.marketNum(value,c.key)+'（'+(value>0?'+':'')+window.marketNum(c.percent,c.key,2)+'%）';
      var amount=c.turnover?'<div class="market-turnover"><span>累計成交金額 <b>'+num(c.turnover/1e8)+' 億元</b></span>'+(c.estimatedTurnover?'<span>線性預估 <b>'+num(c.estimatedTurnover/1e8)+' 億元</b></span>':'')+'</div>':'';
      var tradeVol=c.tradeVolume?'<div class="market-turnover"><span>成交總量 <b>'+num(c.tradeVolume)+'</b> '+esc(c.volumeUnit||'口')+'</span></div>':'';
      var estVol=c.estimatedVolume?'<div class="market-turnover"><span>線性預估成交量 <b>'+num(c.estimatedVolume)+'</b> '+esc(c.volumeUnit||'来源單位')+'</span></div>':'';

      // 計算平盤基準價
      var numVal=Number(c.value), numChg=Number(c.change);
      var hasChange=c.change!=null&&isFinite(numChg)&&c.value!=null&&isFinite(numVal);
      // 沒有漲跌就沒有已驗證的平盤，不拿第一筆冒充（v54）。
      var basePrice=hasChange?(numVal-numChg):NaN;

      return '<article class="market-card" data-open-market="'+esc(c.key)+'" tabindex="0" role="button" aria-label="查看 '+esc(c.label)+' 互動圖表">' +
        '<div class="market-card-layout">' +
          '<div class="market-card-info">' +
            '<div class="market-card-head">' +
              '<div class="market-card-title-row">' +
                '<h3>'+esc(c.key==='tx'?'台指期':c.label)+(c.key==='tx'?'<small class="market-contract">'+esc(c.contract||'')+' · '+(c.session==='AFTERHOURS'?'夜盤':'日盤')+'</small>':'')+'<span class="market-card-arrow" aria-hidden="true">›</span></h3>' +
              '</div>' +
              '<div class="market-price-wrap"><span class="market-value">'+window.marketNum(c.value,c.key)+'</span><span class="market-unit">'+esc(c.unit)+'</span></div>' +
              '<span class="market-delta" style="color:'+color+'">'+delta+'</span>' +
            '</div>' +
            '</div>' +
            amount + tradeVol + estVol +
            '<div class="market-source" title="'+esc(c.source)+'">資料 '+esc(c.time)+' · '+(/Yahoo/.test(c.source||'')?'可能延遲':'來源時間')+'</div>' +
          '</div>' +
          '<div class="market-card-chart">' +
            line(c.line,c.label,c.key,c.value,c.change,basePrice,c.session,c.time,{start:c.windowStart,end:c.windowEnd}) +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('')||'<div class="market-empty"><strong>市場資料正在準備</strong><p>尚未收到市場資料。資料更新後會顯示最近交易日行情，休市日仍可查閱；請稍後再更新。</p></div>';

    var sectors=data.sectors||{};
    el('marketSectorDate').textContent=sectors.date?'資料日期：'+sectors.date:'尚無產業資料';
    el('marketSectorBasis').textContent=(sectors.basis||'')+(sectors.total?'；合計 '+num(sectors.total/1e8)+' 億元':'');
    el('marketSectors').innerHTML=(sectors.rows||[]).map(function(r,i){var pct=Math.max(0,Math.min(100,Number(r.percent)||0));return '<div class="market-sector-row"'+(i>=5?' data-sector-extra'+(!sectorExpanded?' hidden':''):'')+'><span>'+esc(r.name)+'</span><div class="market-meter" role="meter" aria-label="'+esc(r.name)+'成交金額占比" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct.toFixed(2)+'"><i style="width:'+pct+'%"></i></div><b>'+pct.toFixed(2)+'%</b></div>';}).join('')||'<p class="notice">尚無已驗證的產業成交金額；更新完成後顯示盤後占比。</p>';
    el('marketSectorToggle').hidden=(sectors.rows||[]).length<=5;el('marketSectorToggle').setAttribute('aria-expanded',String(sectorExpanded));el('marketSectorToggle').textContent=sectorExpanded?'收合為前五大':'展開其餘 '+Math.max(0,(sectors.rows||[]).length-5)+' 個產業';
    el('marketStatus').textContent='查詢時間：'+data.at+((data.warnings||[]).length?' · 部分來源未就緒，保留可用資料':' · 各來源更新時間如下');
  }

  function load(force){
    var now=Date.now();
    if(pending){return;}
    if(!force&&now-last<300000){return;}
    if(force&&now-last<3000){
      el('marketStatus').textContent='剛剛已更新，請稍候 3 秒後再試。';
      return;
    }
    pending=true;var request=++serial;el('marketRefresh').disabled=true;el('marketBoard').setAttribute('aria-busy','true');el('marketStatus').textContent='載入市場資料中…';
    if(typeof google==='undefined'||!google.script||!google.script.run){
      setTimeout(function(){
        pending=false;last=Date.now();el('marketRefresh').disabled=false;el('marketBoard').setAttribute('aria-busy','false');
        el('marketStatus').textContent='預覽模式：尚未連接 GAS 後端。';
      },500);
      return;
    }
    google.script.run.withSuccessHandler(function(data){if(request!==serial){return;}pending=false;last=Date.now();el('marketRefresh').disabled=false;el('marketBoard').setAttribute('aria-busy','false');render(data||{});})
      .withFailureHandler(function(err){if(request!==serial){return;}pending=false;last=Date.now();el('marketRefresh').disabled=false;el('marketBoard').setAttribute('aria-busy','false');el('marketStatus').textContent='暫時無法更新（'+(err&&err.message?err.message:'連線逾時')+'），已保留畫面上的資料。';}).apiGetMarketOverview(Boolean(force));
  }

  el('marketSectorToggle').onclick=function(){sectorExpanded=!sectorExpanded;el('marketSectors').querySelectorAll('[data-sector-extra]').forEach(function(r){r.hidden=!sectorExpanded;});this.setAttribute('aria-expanded',String(sectorExpanded));this.textContent=sectorExpanded?'收合為前五大':'展開其餘產業';};
  el('marketRefresh').onclick=function(){load(true);};
  window.loadMarketBoard=function(){load(false);};
  setInterval(function(){var p=el('p-market');if(p&&!p.hidden&&!document.hidden){load(false);}},300000);
})();
</script>
