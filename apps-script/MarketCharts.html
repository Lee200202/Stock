<script>
/* 日內時間軸用交易時段，不能把最後一筆早盤資料當成收盤。回傳真實 UTC 毫秒。 */
/* 國際行情最近 6 小時（v54）。規則與 Marketservice.gs 的 marketRollingWindow_ 相同：
   取最新一筆 T 往前 6 小時；其間若有休市（相鄰有效報價隔 30 分鐘以上），從重新開盤那一筆畫起，
   時間軸仍是 6 小時、右邊留白。後端有給 windowStart／windowEnd 時以後端為準。 */
window.MARKET_ROLLING_KEYS = { dxy: 1, usdtwd: 1, wti: 1, brent: 1 };
window.marketRollingBounds = function(key, msList, given) {
  if (!window.MARKET_ROLLING_KEYS[key]) { return null; }
  var ms = (msList || []).filter(function(t) { return isFinite(t); }).sort(function(a, b) { return a - b; });
  if (!ms.length) { return null; }
  var H = 21600000, GAP = 1800000, STEP = 300000, T = ms[ms.length - 1], S = T - H, dataStart = null, prev = null;
  ms.forEach(function(t) {
    if (t < S) { return; }
    if (dataStart === null || (prev !== null && t - prev > GAP)) { dataStart = t; }
    prev = t;
  });
  var resumed = dataStart - S > GAP, start, end;
  if (given && isFinite(given.start) && isFinite(given.end) && given.end > given.start) { start = Number(given.start); end = Number(given.end); }
  else if (resumed) { start = Math.floor(dataStart / STEP) * STEP; end = start + H; }
  else { end = Math.ceil(T / STEP) * STEP; start = end - H; }
  function md(t) { var d = new Date(t + 28800000); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
  function hm(t) { return new Date(t + 28800000).toISOString().slice(11, 16); }
  var today = md(Date.now()), closed = Date.now() - T > GAP;
  /* 休市與資料延遲分開（v54，Codex 規格 93）：隔 30 分鐘沒有新資料不一定是休市，也可能是來源延遲。
     週末（台北週六 05:00 到週一 06:00）與每日休息時段（台北 05:00–07:30，CME／ICE 的日間休息）才叫休市；
     其他時間停住就照實寫「資料延遲或暫停」。 */
  var tw = new Date(Date.now() + 28800000), dow = tw.getUTCDay(), nowHm = tw.getUTCHours() * 100 + tw.getUTCMinutes();
  var weekend = (dow === 6 && nowHm >= 500) || dow === 0 || (dow === 1 && nowHm < 600);
  var dailyBreak = nowHm >= 500 && nowHm < 730;
  var a = (md(start) !== md(end) || md(start) !== today ? md(start) + ' ' : '') + hm(start);
  var b = (md(end) !== today ? md(end) + ' ' : '') + hm(end);
  return { start: start, end: end, dataStart: Math.max(dataStart, start), last: T, resumed: resumed, closed: closed,
           startLabel: a, endLabel: b, rolling: true,
           stale: closed, weekend: weekend,
           title: (!closed ? '近 6 小時' : weekend ? '週末休市，顯示最後 6 小時' : dailyBreak ? '每日休息時段，顯示最後 6 小時'
                   : '資料延遲或暫停，最後 ' + hm(T)) + (resumed && !closed ? '（從開盤畫起）' : '') };
};
/* 小數位數（v54）：同一個市場的現價、漲跌、高低一律同樣位數，不再有 100.6 與 100.61 混在一起。 */
window.MARKET_DIGITS = { taiex: 2, tx: 0, dxy: 2, usdtwd: 3, wti: 2, brent: 2 };
window.marketNum = function(v, key, digits) {
  if (v == null || !isFinite(Number(v))) { return '未取得'; }
  var d = digits != null ? digits : (window.MARKET_DIGITS[key] != null ? window.MARKET_DIGITS[key] : 2);
  return Number(v).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
};
window.marketSessionBounds = function(key, session, time) {
  if(key!=='taiex'&&key!=='tx'){return null;}
  var str=String(time||'').replace(/\//g,'-').replace(' ','T');
  if(/^\d{2}:\d{2}/.test(str)){str=new Date().toISOString().slice(0,10)+'T'+str+':00+08:00';}
  if(str.indexOf('T')>=0&&!/Z$|[+-]\d{2}:\d{2}$/.test(str)){str+='+08:00';}
  var t=new Date(str);if(!isFinite(t.getTime())){return null;}
  var local=new Date(t.getTime()+28800000),ymd=local.toISOString().slice(0,10);
  var midnight=Date.parse(ymd+'T00:00:00+08:00'),start,end,a,b;
  if(key==='taiex'){start=midnight+9*3600000;end=midnight+13.5*3600000;a='09:00';b='13:30';}
  else if(session==='AFTERHOURS'||session==='afterhours'){
    if(local.getUTCHours()<8){midnight-=86400000;}
    start=midnight+15*3600000;end=midnight+29*3600000;a='15:00';b='次日 05:00';
  }else{start=midnight+8.75*3600000;end=midnight+13.75*3600000;a='08:45';b='13:45';}
  return {start:start,end:end,startLabel:a,endLabel:b};
};
/* 歷史K與指標只用同一組可驗證數據；根數不足顯示原因，不補造零值。 */
window.marketAggregate = function(rows, period) {
  if (period === 'day' || period === '60m' || period === 'intraday') { return rows; }
  var groups = {};
  (rows || []).forEach(function(r) {
    var d = new Date(r[0].replace(/\//g, '-').replace(' ', 'T') + (r[0].indexOf('T') < 0 && r[0].indexOf(' ') < 0 ? 'T00:00:00Z' : ''));
    var key = r[0].slice(0, 7);
    if (period === 'week') {
      d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
      key = d.toISOString().slice(0, 10);
    }
    if (!groups[key]) {
      groups[key] = r.slice();
    } else {
      var b = groups[key];
      b[2] = Math.max(b[2], r[2]);
      b[3] = Math.min(b[3], r[3]);
      b[4] = r[4];
      b[5] = (b[5] || 0) + (r[5] || 0);
    }
  });
  return Object.keys(groups).sort().map(function(k) { return groups[k]; });
};

window.marketIndicators = function(rows) {
  rows = rows || [];
  var e12 = null, e26 = null, dea = null, out = [];
  var kVal = 50, dVal = 50;
  var avgGain = null, avgLoss = null;

  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var close = Number(r[4]);

    // 1. MACD (12, 26, 9)
    e12 = e12 == null ? close : e12 + (close - e12) * 2 / 13;
    e26 = e26 == null ? close : e26 + (close - e26) * 2 / 27;
    var dif = e12 - e26;
    dea = dea == null ? dif : dea + (dif - dea) * 2 / 10;
    var hist = 2 * (dif - dea);

    // 2. 布林通道 & 均線 (MA5, MA10, MA20, Upper, Lower)
    var ma5 = null, ma10 = null, ma20 = null, upper = null, lower = null;
    if (i >= 4) {
      var v5 = rows.slice(i - 4, i + 1).map(function(b) { return Number(b[4]); });
      ma5 = v5.reduce(function(a, b) { return a + b; }, 0) / 5;
    }
    if (i >= 9) {
      var v10 = rows.slice(i - 9, i + 1).map(function(b) { return Number(b[4]); });
      ma10 = v10.reduce(function(a, b) { return a + b; }, 0) / 10;
    }
    if (i >= 19) {
      var v20 = rows.slice(i - 19, i + 1).map(function(b) { return Number(b[4]); });
      ma20 = v20.reduce(function(a, b) { return a + b; }, 0) / 20;
      var sd = Math.sqrt(v20.reduce(function(a, b) { return a + Math.pow(b - ma20, 2); }, 0) / 20);
      upper = ma20 + 2 * sd;
      lower = ma20 - 2 * sd;
    }

    // 3. KD (9, 3, 3)
    var window9 = rows.slice(Math.max(0, i - 8), i + 1);
    var h9 = Math.max.apply(null, window9.map(function(b) { return Number(b[2]); }));
    var l9 = Math.min.apply(null, window9.map(function(b) { return Number(b[3]); }));
    var rsv = (h9 === l9) ? 50 : ((close - l9) / (h9 - l9)) * 100;
    kVal = (2 / 3) * kVal + (1 / 3) * rsv;
    dVal = (2 / 3) * dVal + (1 / 3) * kVal;

    // 4. RSI (14)
    var rsi = null;
    if (i > 0) {
      var change = close - Number(rows[i - 1][4]);
      var gain = change > 0 ? change : 0;
      var loss = change < 0 ? -change : 0;
      if (avgGain == null) {
        avgGain = gain;
        avgLoss = loss;
      } else {
        avgGain = (avgGain * 13 + gain) / 14;
        avgLoss = (avgLoss * 13 + loss) / 14;
      }
      if (i >= 13) {
        if (avgLoss === 0) {
          rsi = 100;
        } else {
          var rs = avgGain / avgLoss;
          rsi = 100 - (100 / (1 + rs));
        }
      }
    }

    out.push({
      ma: ma20,
      ma5: ma5,
      ma10: ma10,
      ma20: ma20,
      upper: upper,
      lower: lower,
      dif: i >= 25 ? dif : null,
      dea: i >= 33 ? dea : null,
      hist: i >= 33 ? hist : (i >= 25 ? 2 * (dif - dea) : null),
      k: kVal,
      d: dVal,
      rsi: rsi
    });
  }
  return out;
};

/**
 * 嚴謹 60分K 背離判斷演算法 (KD, MACD, RSI)
 * 頂背離 (Bearish Divergence)：股價創新高，但技術指標高點低於前次 (動能衰竭、潛在回檔壓力)
 * 底背離 (Bullish Divergence)：股價創新低，但技術指標低點高於前次 (拋壓竭盡、潛在反彈契機)
 */
window.detectDivergence = function(bars, options) {
  bars = (bars || []).filter(function(b) {
    return Array.isArray(b) && b.length >= 5 && isFinite(Number(b[4])) && Number(b[4]) > 0;
  });
  if (bars.length < 15) {
    return {
      status: 'neutral',
      strength: 'none',
      badgeText: '資料不足',
      badgeClass: 'div-neutral',
      summary: '60分K 樣本不足（需至少 15 根），尚無顯著背離訊號。',
      details: []
    };
  }

  var ind = window.marketIndicators(bars);
  var radius = (options && options.radius) || 2;
  var n = bars.length;

  // 1. 偵測價格波峰 (Swing High) 與波谷 (Swing Low)
  var swingHighs = [];
  var swingLows = [];

  for (var i = radius; i < n - radius; i++) {
    var high = Number(bars[i][2]);
    var low = Number(bars[i][3]);
    var isHigh = true;
    var isLow = true;

    for (var d = 1; d <= radius; d++) {
      if (Number(bars[i - d][2]) > high || Number(bars[i + d][2]) > high) { isHigh = false; }
      if (Number(bars[i - d][3]) < low || Number(bars[i + d][3]) < low) { isLow = false; }
    }

    if (isHigh) {
      swingHighs.push({
        index: i,
        time: String(bars[i][0]),
        price: high,
        close: Number(bars[i][4]),
        k: ind[i].k,
        d: ind[i].d,
        hist: ind[i].hist != null ? ind[i].hist : 0,
        dif: ind[i].dif != null ? ind[i].dif : 0,
        rsi: ind[i].rsi != null ? ind[i].rsi : 50
      });
    }
    if (isLow) {
      swingLows.push({
        index: i,
        time: String(bars[i][0]),
        price: low,
        close: Number(bars[i][4]),
        k: ind[i].k,
        d: ind[i].d,
        hist: ind[i].hist != null ? ind[i].hist : 0,
        dif: ind[i].dif != null ? ind[i].dif : 0,
        rsi: ind[i].rsi != null ? ind[i].rsi : 50
      });
    }
  }

  // 納入最新一根若其為近期極值
  var lastBar = bars[n - 1];
  var lastHigh = Number(lastBar[2]);
  var lastLow = Number(lastBar[3]);
  var lastInd = ind[n - 1];

  var lastHighCandidate = {
    index: n - 1,
    time: String(lastBar[0]),
    price: lastHigh,
    close: Number(lastBar[4]),
    k: lastInd.k,
    d: lastInd.d,
    hist: lastInd.hist != null ? lastInd.hist : 0,
    dif: lastInd.dif != null ? lastInd.dif : 0,
    rsi: lastInd.rsi != null ? lastInd.rsi : 50
  };

  var lastLowCandidate = {
    index: n - 1,
    time: String(lastBar[0]),
    price: lastLow,
    close: Number(lastBar[4]),
    k: lastInd.k,
    d: lastInd.d,
    hist: lastInd.hist != null ? lastInd.hist : 0,
    dif: lastInd.dif != null ? lastInd.dif : 0,
    rsi: lastInd.rsi != null ? lastInd.rsi : 50
  };

  if (swingHighs.length === 0 || swingHighs[swingHighs.length - 1].index < n - 3) {
    if (lastHighCandidate.price >= Math.max.apply(null, bars.slice(Math.max(0, n - 4)).map(function(b) { return Number(b[2]); }))) {
      swingHighs.push(lastHighCandidate);
    }
  }
  if (swingLows.length === 0 || swingLows[swingLows.length - 1].index < n - 3) {
    if (lastLowCandidate.price <= Math.min.apply(null, bars.slice(Math.max(0, n - 4)).map(function(b) { return Number(b[3]); }))) {
      swingLows.push(lastLowCandidate);
    }
  }

  var bearishDetails = [];
  var bullishDetails = [];

  // 2. 檢驗頂背離 (高檔背離)：Price 2 > Price 1, Indicator 2 < Indicator 1
  if (swingHighs.length >= 2) {
    var p2 = swingHighs[swingHighs.length - 1];
    for (var h = swingHighs.length - 2; h >= 0 && h >= swingHighs.length - 4; h--) {
      var p1 = swingHighs[h];
      var span = p2.index - p1.index;
      if (span >= 3 && span <= 35) {
        // 價格創高 (高點更高或收盤更高)
        if (p2.price > p1.price || p2.close > p1.close) {
          // KD 背離：K 值明顯較低
          if (p2.k < p1.k - 2) {
            bearishDetails.push({
              indicator: 'KD (9,3,3)',
              reason: '價格創高（' + p1.price.toFixed(1) + ' → ' + p2.price.toFixed(1) + '），但 K 值由 ' + p1.k.toFixed(1) + ' 降至 ' + p2.k.toFixed(1),
              p1: p1, p2: p2
            });
          }
          // MACD 柱狀體或 DIF 背離
          if (p2.hist < p1.hist - 0.5 || p2.dif < p1.dif - 0.5) {
            bearishDetails.push({
              indicator: 'MACD (12,26,9)',
              reason: '價格創高但 MACD 柱狀體紅柱動能收縮（' + p1.hist.toFixed(2) + ' → ' + p2.hist.toFixed(2) + '）',
              p1: p1, p2: p2
            });
          }
          // RSI 背離
          if (p1.rsi != null && p2.rsi != null && p2.rsi < p1.rsi - 2) {
            bearishDetails.push({
              indicator: 'RSI (14)',
              reason: '價格創高但 RSI 強度減弱（' + p1.rsi.toFixed(1) + ' → ' + p2.rsi.toFixed(1) + '）',
              p1: p1, p2: p2
            });
          }
          if (bearishDetails.length > 0) { break; }
        }
      }
    }
  }

  // 3. 檢驗底背離 (低檔背離)：Price 2 < Price 1, Indicator 2 > Indicator 1
  if (swingLows.length >= 2) {
    var t2 = swingLows[swingLows.length - 1];
    for (var l = swingLows.length - 2; l >= 0 && l >= swingLows.length - 4; l--) {
      var t1 = swingLows[l];
      var spanL = t2.index - t1.index;
      if (spanL >= 3 && spanL <= 35) {
        // 價格破底 (低點更低或收盤更低)
        if (t2.price < t1.price || t2.close < t1.close) {
          // KD 底背離：K 值低點墊高
          if (t2.k > t1.k + 2) {
            bullishDetails.push({
              indicator: 'KD (9,3,3)',
              reason: '價格破底（' + t1.price.toFixed(1) + ' → ' + t2.price.toFixed(1) + '），但 K 值由 ' + t1.k.toFixed(1) + ' 墊高至 ' + t2.k.toFixed(1),
              p1: t1, p2: t2
            });
          }
          // MACD 柱狀體底背離：綠柱縮小
          if (t2.hist > t1.hist + 0.5 || t2.dif > t1.dif + 0.5) {
            bullishDetails.push({
              indicator: 'MACD (12,26,9)',
              reason: '價格破底但 MACD 綠柱動能衰竭收斂（' + t1.hist.toFixed(2) + ' → ' + t2.hist.toFixed(2) + '）',
              p1: t1, p2: t2
            });
          }
          // RSI 底背離
          if (t1.rsi != null && t2.rsi != null && t2.rsi > t1.rsi + 2) {
            bullishDetails.push({
              indicator: 'RSI (14)',
              reason: '價格破底但 RSI 低點墊高（' + t1.rsi.toFixed(1) + ' → ' + t2.rsi.toFixed(1) + '）',
              p1: t1, p2: t2
            });
          }
          if (bullishDetails.length > 0) { break; }
        }
      }
    }
  }

  // 4. 判定綜合結論（以最近發生且強度高者優先）
  var hasBearish = bearishDetails.length > 0;
  var hasBullish = bullishDetails.length > 0;

  if (hasBearish && hasBullish) {
    // 若同時符合，以波峰/波谷較靠近當下者為準
    var lastBearishIdx = bearishDetails[0].p2.index;
    var lastBullishIdx = bullishDetails[0].p2.index;
    if (lastBearishIdx > lastBullishIdx) { hasBullish = false; }
    else { hasBearish = false; }
  }

  if (hasBearish) {
    var bInds = bearishDetails.map(function(d) { return d.indicator; }).join('、');
    var isStrong = bearishDetails.length >= 2;
    return {
      status: 'bearish',
      strength: isStrong ? 'strong' : 'moderate',
      badgeText: isStrong ? '強烈頂背離' : '出現頂背離',
      badgeClass: 'div-bearish',
      summary: '60分K ' + bInds + ' 出現頂背離現象；價格推升但動能未過前高，多頭上攻無力，潛在回檔壓力大。',
      details: bearishDetails
    };
  }

  if (hasBullish) {
    var uInds = bullishDetails.map(function(d) { return d.indicator; }).join('、');
    var isStrongB = bullishDetails.length >= 2;
    return {
      status: 'bullish',
      strength: isStrongB ? 'strong' : 'moderate',
      badgeText: isStrongB ? '強烈底背離' : '出現底背離',
      badgeClass: 'div-bullish',
      summary: '60分K ' + uInds + ' 出現底背離現象；價格續跌但指標低點墊高，空頭拋壓衰竭，暗示短線底部浮現有反彈契機。',
      details: bullishDetails
    };
  }

  return {
    status: 'neutral',
    strength: 'none',
    badgeText: '無背離',
    badgeClass: 'div-neutral',
    summary: '60分K 價格與技術指標走勢方向一致，無顯著背離矛盾現象。',
    details: []
  };
};
</script>
