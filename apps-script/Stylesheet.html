.scen-g .g-soft { fill: color-mix(in srgb, var(--beam) 7%, transparent);
                  stroke: color-mix(in srgb, var(--beam) 25%, transparent); }
.scen-g .g-ok { fill: color-mix(in srgb, var(--fall) 10%, transparent);
                stroke: color-mix(in srgb, var(--fall) 40%, transparent); }
.scen-g .g-badbox { fill: color-mix(in srgb, var(--rise) 8%, transparent);
                    stroke: color-mix(in srgb, var(--rise) 35%, transparent); }
.scen-g .g-arr { stroke: var(--muted); stroke-width: 1.2; fill: none;
                 marker-end: url(#scenArrow); }
.scen-g .g-axis { stroke: var(--rule); stroke-width: 1; }
.scen-g .g-line { stroke: var(--rule); stroke-width: 2; }
.scen-g .g-ok2 { stroke: color-mix(in srgb, var(--fall) 55%, transparent); }
.scen-g .g-dot { fill: var(--ink); }
.scen-g .g-bad { fill: var(--rise); }
.scen-g .g-soft2 { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; }
.scen-g .g-badt { fill: var(--rise); }
/* 箭頭標記共用一份 defs（放在這一節開頭的隱藏 SVG 裡）。
   marker 裡的 currentColor 解析的是 marker 自己的顏色不是引用者的，
   所以直接指定填色，不要靠繼承。 */
#scenArrow path { fill: var(--muted); }

/* ---------------- 持有回合 ---------------- */
/* 買了又賣、賣了又買的標的，狀態旁邊標出目前是第幾回合。 */
.roundtag {
  display: inline-block; margin-left: 6px; padding: 1px 6px;
  font-size: calc(10.5px * var(--rd-fs)); border: 1px solid var(--rule); border-radius: 10px;
  color: var(--muted); font-weight: 500; vertical-align: middle;
}
.roundbox { border: 1px solid var(--rule); background: var(--panel-2); margin-top: 14px; }
.roundbox-h {
  padding: 9px 14px; border-bottom: 1px solid var(--rule);
  font-size: calc(12.5px * var(--rd-fs)); font-weight: 600; color: var(--ink);
  font-family: "Noto Sans TC", sans-serif;
}
.roundbox-i {
  padding: 9px 14px; font-size: calc(12.5px * var(--rd-fs)); color: var(--muted);
  font-family: "IBM Plex Mono", monospace; line-height: 1.6;
  border-bottom: 1px solid var(--rule); overflow-wrap: anywhere;
}
.roundbox-i:last-child { border-bottom: none; }

/* 進場價旁的來源標記。「明」＝影片明講的成交價，「參」＝後續觀望時提到的參考價。
   兩者意義不同，顏色也要分開，不能讓人以為參考價就是進場價。 */
sup.src { font-size: calc(9.5px * var(--rd-fs)); margin-left: 3px; color: var(--beam); font-weight: 600; }
sup.src.ref { color: var(--muted); font-weight: 500; }
/* 「持」＝由影片中明講會員持有而開倉，進場價是當日收盤而非成交價。
   用另一個顏色與「明」區隔，避免被讀成張震在這個價位買進。 */
sup.src.hold { color: var(--wait); font-weight: 600; }

/* 郵件內容區：獨立於日曆下方，不擋捲動 */
.mail-hint { color: var(--muted); font-size: calc(14px * var(--rd-fs)); padding: 30px 0; text-align: center; }
.mail-body { border: 1px solid var(--rule); background: var(--panel); width: 100%; }
.mail-head { padding: 16px 20px; border-bottom: 1px solid var(--rule); }
.mail-subj { font-size: calc(16px * var(--rd-fs)); font-weight: 600; color: var(--ink); font-family: "Noto Sans TC", sans-serif; }
.mail-meta { font-size: calc(12px * var(--rd-fs)); color: var(--muted); margin-top: 4px; }
.mail-content { padding: 20px 22px; line-height: 1.8; }
.mail-content h1, .mail-content h2, .mail-content h3 { font-family: "Noto Sans TC", sans-serif; margin: 20px 0 10px; }
.mail-content p { margin: 10px 0; }
/* 郵件表格。

   框線、底色、斑馬紋現在都由 mdToHtml_ 寫成 inline style——收件匣會把
   <style> 整段丟掉，只有 inline 活得下來，而網站與信必須長得一樣。
   所以這裡刻意不再設 border 與 background：CSS 的 border 簡寫會把
   inline 沒指定的那三邊補回去，結果是整張表又變回滿格的格線。 */
.mail-content table { border-collapse: collapse; width: 100%; margin: 16px 0;
  /* 字級是 mdToHtml_ 寫在 inline style 裡的（收件匣會把 style 標籤整段丟掉，
     只有 inline 活得下來）。inline 的優先度比 class 高，網站這邊要 !important
     才蓋得過去，否則字體大小調了郵件查詢那張表完全不動。 */
  font-size: calc(13.5px * var(--rd-fs)) !important; }
.mail-content th, .mail-content td { padding: 9px 12px; text-align: left; vertical-align: top; }
.mail-content th { font-weight: 600; white-space: nowrap; }
/* 表格比畫面寬時，讓它在自己的框裡橫向捲，不要把整頁撐開 */
.mail-content { overflow-x: auto; }

/* 深色模式。

   inline style 的優先度比 class 高，所以只有 !important 蓋得過去。
   淺色模式一行都不寫——那組顏色本來就是照淺色底調的，
   網站與收件匣看到的會是同一個東西。

   色相沿用 mdToHtml_ 的 MAIL_TONES_，只是改成跟深色底混色，
   否則淺綠淺紅直接放在深色底上會亮到看不了字。 */
[data-theme="dark"] .mail-content td[class*="tn-"],
[data-theme="dark"] .mail-content th[class*="tn-"] {
  color: var(--ink) !important;
  border-top-color: var(--rule) !important;
  border-bottom-color: var(--rule) !important;
}
[data-theme="dark"] .mail-content td.tn-buy   { background: color-mix(in srgb, #C41E28 26%, var(--panel)) !important; }
[data-theme="dark"] .mail-content td.tn-sell  { background: color-mix(in srgb, #04795C 26%, var(--panel)) !important; }
[data-theme="dark"] .mail-content td.tn-hold  { background: color-mix(in srgb, #1F5296 28%, var(--panel)) !important; }
[data-theme="dark"] .mail-content td.tn-watch { background: color-mix(in srgb, #9C6A0F 30%, var(--panel)) !important; }
[data-theme="dark"] .mail-content td.tn-avoid { background: color-mix(in srgb, var(--muted) 18%, var(--panel)) !important; }
[data-theme="dark"] .mail-content td.tn-none  { background: var(--panel) !important; }
/* 表頭再深一階，整張表才會讀成一個色塊而不是一堆分開的列 */
[data-theme="dark"] .mail-content th.tn-buy   { background: color-mix(in srgb, #C41E28 42%, var(--panel)) !important; }
[data-theme="dark"] .mail-content th.tn-sell  { background: color-mix(in srgb, #04795C 42%, var(--panel)) !important; }
[data-theme="dark"] .mail-content th.tn-hold  { background: color-mix(in srgb, #1F5296 44%, var(--panel)) !important; }
[data-theme="dark"] .mail-content th.tn-watch { background: color-mix(in srgb, #9C6A0F 46%, var(--panel)) !important; }
[data-theme="dark"] .mail-content th.tn-avoid { background: color-mix(in srgb, var(--muted) 30%, var(--panel)) !important; }
[data-theme="dark"] .mail-content th.tn-none  { background: color-mix(in srgb, var(--ink) 12%, var(--panel)) !important; }
[data-theme="dark"] .mail-content table     { border-color: var(--rule) !important; }
.mail-content hr { border: none; border-top: 1px solid var(--rule); margin: 20px 0; }
.mail-content a { color: var(--beam); }

/* 沒有自己尺寸的段落——也就是從 body 繼承 15px 的那些。

   :not([class]) 是必要的：有 class 的段落（notice、hint、tip⋯）都在
   各自的規則裡乘倍率，而這一條的權重（0,1,1）比它們（0,1,0）高，
   不排除的話會把 13px 的說明撐成 15px。倍率是 1 的時候也一樣——
   那不是「還沒調整」，那是改壞了。 */
.sect > p:not([class]), .card > p:not([class]), .panel > p:not([class]),
.mail-content p, .mail-content li,
.tl-t, td.reason, .rec-r td.reason { font-size: calc(15px * var(--rd-fs)); }

/* ==================================================================
   AI 助手：右下角的浮動面板

   它不是分頁。分頁是「看今天有什麼、看這段期間有什麼」，助手是
   「我現在有個問題」——而問題通常是在看資料的過程中冒出來的。
   做成分頁的話，想問就得離開現在這一頁，問完又要自己走回來。

   桌機上是一張靠右下的卡片，手機上鋪滿整個畫面（那個尺寸放不下
   一張浮動卡片，硬放只會兩邊都難用）。
   ================================================================== */
.asstfab {
  position: fixed; right: 22px; bottom: 22px; z-index: 90;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px 11px 15px; border-radius: 999px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  font-family: inherit; font-size: calc(14px * var(--rd-fs)); font-weight: 600;
  cursor: pointer; box-shadow: 0 6px 20px rgba(0, 0, 0, .16);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.asstfab svg {
  width: calc(18px * var(--rd-fs)); height: calc(18px * var(--rd-fs));
  fill: none; stroke: var(--beam); stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
.asstfab:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0, 0, 0, .22); }
.asstfab[aria-expanded="true"] { border-color: var(--beam); }
.asstfab:focus-visible { outline: 2px solid var(--beam); outline-offset: 3px; }

.asstdock {
  position: fixed; right: 22px; bottom: 84px; z-index: 91;
  /* 460px 太窄：對話一段就換三四行，貼一段逐字稿更是整片。
     拉到約兩倍寬，但留 320px 給左邊——那是「浮動面板」與「整頁蓋掉」的差別，
     旁邊那一欄要看得到，才知道自己還在原本那一頁上。 */
  width: min(900px, calc(100vw - 320px));
  max-height: min(760px, calc(100vh - 120px));
  overflow-y: auto;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 14px;
  box-shadow: 0 16px 44px rgba(0, 0, 0, .26);
  animation: dockIn .18s ease-out both;
}
@keyframes dockIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.asstdock .sect { padding: 16px 18px 18px; }
/* 浮動面板裡不需要分頁那種大留白，金鑰列也不必再撐滿一整排 */
.asstdock .card { padding: 0; border: none; background: transparent; }
.asstdock .keybar { grid-template-columns: 1fr; gap: 8px; }
.asstdock .keybar-l { display: none; }
.asstdock-h { display: flex; align-items: baseline; gap: 10px; }
.asstdock-h h2 { flex: 1 1 auto; }
.asstdock-x {
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  cursor: pointer; width: 28px; height: 28px; border-radius: 8px;
  font-size: calc(16px * var(--rd-fs)); line-height: 1; flex: 0 0 auto; padding: 0;
}
.asstdock-x:hover { background: var(--panel-2); }
/* 對話區在浮動面板裡要收斂，不能再用整個視窗高度去撐 */
.asstdock .chatwin { border: none; padding: 0; }
.asstdock .chatwin .ask-log { min-height: 340px; max-height: 480px; }

/* 手機：鋪滿整個畫面。460px 的浮動卡片在那個尺寸上兩邊都難用。 */
/* 中等寬度：留不到 320px 的話那條「還在原本頁面上」的邊界就沒意義了，
   改成貼齊兩側留一點邊。 */
@media (max-width: 1100px) {
  .asstdock { width: calc(100vw - 44px); }
}
@media (max-width: 620px) {
  .asstfab { right: 14px; bottom: 14px; padding: 10px 16px 10px 13px; }
  .asstdock {
    right: 0; left: 0; bottom: 0; width: auto; border-radius: 14px 14px 0 0;
    max-height: 82vh;
  }
}
html[data-view="mobile"] .asstdock {
  right: 0; left: 0; bottom: 0; width: auto; border-radius: 14px 14px 0 0;
  max-height: 82vh;
}

/* ==================================================================
   技術說明的三層結構

   這一頁的讀者多半是投資人，不是維護的人。他想知道「這裡的資料能不能信」，
   不是我的 Python 怎麼寫。所以第一眼給承諾與對話，工程細節收進折疊區。
   ================================================================== */
.tech-lede {
  font-size: calc(16px * var(--rd-fs)); line-height: 1.85; color: var(--muted);
  margin: 6px 0 26px;
}
.tech-note {
  margin: 26px 0 0; padding: 12px 14px;
  border-left: 3px solid var(--rule); background: var(--panel-2);
  color: var(--muted); font-size: calc(12.5px * var(--rd-fs)); line-height: 1.8;
}

/* 三個承諾 */
/* 固定三欄，不用 auto-fit。auto-fit 在某些寬度會排成兩欄，
   第三格空著——而格線是靠容器底色透出來的，空格子就變成一塊灰色方塊。 */
.vow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px;
  background: var(--rule); border: 1px solid var(--rule); margin-bottom: 34px; }
@media (max-width: 720px) { .vow { grid-template-columns: 1fr; } }
html[data-view="mobile"] .vow { grid-template-columns: 1fr; }
.vow-i { background: var(--panel); padding: 18px 18px 20px; display: flex; gap: 13px; align-items: flex-start; }
.vow-ic { flex: 0 0 auto; width: 34px; height: 34px; border: 1px solid var(--rule);
  display: grid; place-items: center; border-radius: 9px; background: var(--panel-2); }
.vow-ic svg { width: 18px; height: 18px; fill: none; stroke: var(--beam);
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.vow-i b { display: block; font-size: calc(14.5px * var(--rd-fs)); margin-bottom: 5px; }
.vow-i span { color: var(--muted); font-size: calc(13px * var(--rd-fs)); line-height: 1.75; }

/* 對話 */
.chat { display: flex; flex-direction: column; gap: 16px; margin: 18px 0 8px; }
/* 對話跟著欄寬走，不再自己設上限。

   行長已經由 --doc-col 管住了，這裡再收一次只會讓泡泡比隔壁的圖窄一截，
   左右邊界各對各的，看起來就是亂。 */
.chat-q, .chat-a { display: flex; gap: 12px; align-items: flex-start; }

/* 一問一答排成左右兩邊，像訊息軟體。
   原本兩邊都靠左、頭像也都在左邊，一眼看過去是兩段長得一樣的文字，
   得讀到名字才知道換人講話了。 */
.chat-a { flex-direction: row-reverse; }
.ava { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; border: 1px solid var(--rule); background: var(--panel-2); }
.ava svg { width: 21px; height: 21px; fill: none; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }
.ava-a svg { stroke: var(--muted); }
.ava-b svg { stroke: var(--beam); }
.ava-c svg { stroke: var(--note); }
/* 泡泡不再撐滿整列——撐滿的話左右兩邊一樣寬，還是看不出誰在講。
   留給對面的那段空白，本身就是「這句話是誰說的」。 */
.bub { border: 1px solid var(--rule); background: var(--panel); border-radius: 4px 14px 14px 14px;
  padding: 12px 16px 13px; flex: 0 1 auto; max-width: min(76%, 52em);
  display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
/* 右邊那顆的尖角要換到右上，不然兩顆的缺口都朝左，看起來像沒換邊。
   底色也要跟左邊那顆分開——窄螢幕上兩邊都會頂到寬度上限，
   那時候「靠左還是靠右」看不出來，只剩底色跟頭像在區分誰在講。 */
.chat-a .bub { border-radius: 14px 4px 14px 14px; background: var(--panel); }
.chat-q .bub { background: var(--panel-2); }
.bub .who { font-size: calc(11.5px * var(--rd-fs)); color: var(--muted);
  letter-spacing: .06em; font-weight: 600; flex: 0 0 auto;
  min-width: 4.6em; }
.bub p { flex: 1 1 16em; }
.bub p { margin: 0 0 8px; font-size: calc(14px * var(--rd-fs)); line-height: 1.85; }
.bub p:last-child { margin-bottom: 0; }

/* 一天的三步 */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; margin: 4px 0 12px; }
.flow-i { border: 1px solid var(--rule); background: var(--panel-2); padding: 11px 13px; border-radius: 9px; }
.flow-i b { display: block; font-family: "IBM Plex Mono", monospace;
  font-size: calc(14px * var(--rd-fs)); color: var(--beam); margin-bottom: 4px; }
.flow-i span { color: var(--muted); font-size: calc(12.5px * var(--rd-fs)); line-height: 1.7; }

/* 工程細節折疊區 */
.devzone { margin-top: 34px; border-top: 1px solid var(--rule); padding-top: 20px; }
.devzone > summary {
  cursor: pointer; list-style: none; font-weight: 600;
  font-size: calc(14.5px * var(--rd-fs)); color: var(--muted);
  padding: 12px 14px; border: 1px solid var(--rule); background: var(--panel-2);
  border-radius: 10px; transition: color .15s ease, border-color .15s ease;
}
.devzone > summary::-webkit-details-marker { display: none; }
.devzone > summary::before {
  content: "▸"; display: inline-block; margin-right: 9px;
  transition: transform .18s ease; color: var(--beam);
}
.devzone[open] > summary::before { transform: rotate(90deg); }
.devzone > summary:hover { color: var(--ink); border-color: var(--muted); }
.devzone-b { padding-top: 22px; }

/* ==================================================================
   可視思考模型

   每一段對話配一張圖，而且是「這一段的邏輯關係決定用哪一種圖」：
     交集   → 維恩圖      條件分支 → 決策流程圖
     時間   → 雙軌時間軸  根因     → 魚骨圖    步驟 → 故事板

   全部是內嵌 SVG，顏色吃 CSS 變數，深淺色不必準備兩份，
   也不多一次網路請求。viewBox 讓它跟著容器縮放，手機上不必另外處理。
   ================================================================== */
/* 圖不放大超過原尺寸。

   SVG 設 width:100% 會跟著容器等比例放大，圖上的字也一起放大——
   460 單位寬的維恩圖被拉到 1525px，等於放大 3.3 倍，
   本來 13px 的標籤變成 43px，比內文還大一號，整頁的字級秩序就毀了。
   以各自的 viewBox 寬度（--vzw）為上限之後，圖上的字永遠是宣告的那個大小，
   而且七張圖的字都一樣大。圖比欄窄，就置中放在一張卡片裡。 */
/* --vzw 是這張圖「設計時的」寬度（viewBox 幾個單位就是幾 px）。
   原本 svg 的 max-width 直接吃它，於是圖永遠只畫到 460 或 700px——
   技術說明拉成全版之後，一張 700px 的圖擺在 1325px 的欄位裡，
   兩邊各空一大片，而圖裡的字仍然只有 10.5～14px。

   改成可以長大，但要有上限：放到兩倍以上，1.3 單位的線條會細得看不見，
   字則會大到跟內文比例失衡。1.55 倍是實測後看起來還像同一份文件的上限。

   再乘 --rd-fs 是為了讓圖跟著字級設定一起長——使用者把字調大，
   通常就是因為看不清楚，這時候只放大內文、圖維持原樣沒有道理。 */
.viz {
  --vzw: 460px;
  --vz-max: min(100%, calc(var(--vzw) * 1.55 * var(--rd-fs)));
  margin: 18px 0 16px; padding: 16px 18px 12px;
  border: 1px solid var(--rule); background: var(--panel-2); border-radius: 12px;
  /* 配合下面 svg 的 overflow: visible。
     只給 svg 放行、外面不接住的話，超出的字會一路撐到頁面外，
     整個網站多一條橫向捲軸——實測就是這樣（一行字外溢 189px）。
     在這裡接住，超出的部分就變成「這張圖自己可以左右滑」。 */
  overflow-x: auto;
}
.viz svg {
  width: 100%; max-width: var(--vz-max); height: auto;
  display: block; margin-inline: auto;
  /* SVG 預設會把超出 viewBox 的東西裁掉，而且是硬裁——
     一句話畫到一半就不見了，看的人只會以為資料壞了。
     寧可讓它畫出邊界（外圍還有 16～18px 內距接得住），也不要無聲截斷。 */
  overflow: visible;
}

/* 窄螢幕：欄寬比圖還窄時，圖會被壓到看不清楚（700 單位的心智圖擠進 380px
   等於縮到 0.54 倍，字剩下 7px）。這時改成可以左右滑，字才留得住。 */
@media (max-width: 760px) {
  /* overflow-x 已經在 .viz 本體設好，這裡只處理最小寬度 */
  .viz svg { min-width: min(var(--vzw), 560px); }
}
html[data-view="mobile"] .viz svg { min-width: min(var(--vzw), 560px); }

/* 共用的字級。SVG 裡的字不吃 --rd-fs：它跟著 viewBox 一起縮放，
   再乘一次倍率會與線條的比例對不上。 */
.viz text { font-family: "Noto Sans TC", sans-serif; }

/* --- 維恩圖 --- */
.v-l, .v-r { fill: var(--beam); fill-opacity: .12; stroke: var(--beam); stroke-width: 1.4; }
.v-t { font-size: 13px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.v-s { font-size: 11.5px; fill: var(--muted); text-anchor: middle; }
.v-c { font-size: 14px; font-weight: 700; fill: var(--beam); text-anchor: middle; }
.v-c2 { font-size: 14px; font-weight: 700; fill: var(--beam); text-anchor: middle; }

/* --- 決策流程圖 --- */
.f-box { fill: var(--panel-2); stroke: var(--rule); stroke-width: 1.3; }
.f-box.ok { stroke: var(--beam); }
.f-box.no { stroke: var(--rise); }
.f-dia { fill: var(--panel-2); stroke: var(--rule); stroke-width: 1.3; }
.f-t { font-size: 12.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.f-s { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.f-ln { stroke: var(--muted); stroke-width: 1.3; fill: none; }
.f-ar { fill: var(--muted); }
.f-lb { font-size: 11px; font-weight: 600; text-anchor: middle; }
.f-lb.ok { fill: var(--beam); }
.f-lb.no { fill: var(--rise); }

/* --- 雙軌時間軸 --- */
.t-ln { stroke: var(--rule); stroke-width: 2; }
.t-dot { stroke: var(--panel); stroke-width: 2.5; }
.t-dot.buy { fill: var(--beam); }
.t-dot.warn { fill: var(--wait); }
.t-d { font-size: 11px; font-family: "IBM Plex Mono", monospace; fill: var(--muted); text-anchor: middle; }
.t-l { font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.t-br { stroke: var(--muted); stroke-width: 1.3; fill: none; stroke-dasharray: 3 3; }
.t-box { fill: var(--panel-2); stroke-width: 1.4; }
.t-box.ok { stroke: var(--beam); }
.t-box.no { stroke: var(--muted); }
.t-h { font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.t-b { font-size: 11px; fill: var(--muted); text-anchor: middle; }
.t-r { font-size: 12.5px; font-weight: 700; text-anchor: middle; }
.t-r.ok { fill: var(--beam); }
.t-r.no { fill: var(--muted); }
.t-n { font-size: 11px; fill: var(--muted); text-anchor: middle; }

/* --- 魚骨圖 --- */
.k-spine { stroke: var(--muted); stroke-width: 2; }
.k-head { fill: var(--rise); fill-opacity: .18; stroke: var(--rise); stroke-width: 1.4; }
.k-ht { font-size: 12.5px; font-weight: 700; fill: var(--rise); text-anchor: middle; }
.k-bone { stroke: var(--rule); stroke-width: 1.4; }
.k-c { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.k-i { font-size: 11px; fill: var(--muted); }

/* --- 故事板 --- */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px; margin: 6px 0 4px; }
.board-i { border: 1px solid var(--rule); background: var(--panel-2);
  border-radius: 10px; padding: 12px 13px 14px; }
.board-i svg { width: 100%; height: auto; max-height: 66px; display: block; margin-bottom: 8px; }
.board-i b { display: block; font-family: "IBM Plex Mono", monospace;
  font-size: calc(14px * var(--rd-fs)); color: var(--beam); margin-bottom: 4px; }
.board-i span { color: var(--muted); font-size: calc(12px * var(--rd-fs)); line-height: 1.7; }
.b-scr, .b-doc, .b-ml { fill: var(--panel); stroke: var(--rule); stroke-width: 1.6; }
.b-pl { fill: var(--beam); }
.b-wv, .b-ln2, .b-hl2, .b-ck { fill: none; stroke: var(--beam); stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }
.b-ln2 { stroke: var(--muted); stroke-width: 1.5; }
.b-hl { fill: none; stroke: var(--beam); stroke-width: 1.8; }
.b-sh { fill: var(--beam); fill-opacity: .14; stroke: var(--beam); stroke-width: 1.6; }

/* ==================================================================
   技術說明：問題區塊、故事線、逐句浮現

   每一個問題是一個 .qa-b：編號＋標題、兩句對話、一張圖、幾步故事線，
   最後跟著一個只屬於這個問題的「想深究」。
   工程細節跟著它在回答的問題走，不再堆在頁尾同一坨。
   ================================================================== */
.sec-lede { color: var(--muted); font-size: calc(13.5px * var(--rd-fs));
  line-height: 1.85; margin: 0 0 14px; }

.qa-b { border-top: 1px solid var(--rule); padding: 26px 0 8px; }
.qa-b:first-of-type { border-top: none; }
.qa-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.qa-n { font-family: "IBM Plex Mono", monospace; font-size: calc(13px * var(--rd-fs));
  color: var(--beam); font-weight: 600; flex: 0 0 auto; }
.qa-h h3 { margin: 0; font-size: calc(17px * var(--rd-fs)); line-height: 1.5; }

/* 故事線。圖講「規則長什麼樣子」，故事線講「真的發生時是怎麼走的」。 */
.story { list-style: none; counter-reset: st; margin: 14px 0 4px; padding: 0; }
.story li { counter-increment: st; position: relative; padding: 7px 0 7px 34px;
  font-size: calc(13.5px * var(--rd-fs)); line-height: 1.8; color: var(--muted); }
.story li::before {
  content: counter(st); position: absolute; left: 0; top: 8px;
  width: 21px; height: 21px; border-radius: 50%; text-align: center;
  font-family: "IBM Plex Mono", monospace; font-size: 11px; line-height: 21px;
  color: var(--beam); border: 1px solid color-mix(in srgb, var(--beam) 45%, transparent);
}
.story li::after {
  content: ""; position: absolute; left: 10px; top: 30px; bottom: -1px;
  width: 1px; background: var(--rule);
}
.story li:last-child::after { display: none; }
.story b { color: var(--ink); font-weight: 600; }

/* 圖說跟著圖走：圖是置中的，圖說也置中，兩者才像同一件東西。 */
/* 圖說跟著「圖實際畫出來的寬度」走，不是跟著設計寬度走。
   吃 --vzw 的話，圖已經放大到 1085px、圖說卻還鎖在 700px，
   一句長一點的說明就被擠成兩三行，看起來像另一段文字。 */
.viz figcaption { color: var(--muted); font-size: calc(12px * var(--rd-fs));
  line-height: 1.7; margin: 10px auto 0; max-width: var(--vz-max); text-align: center; }
/* 概念圖與心智圖的 viewBox 是 700 單位寬，其餘六張是 460 */
.viz-wide { --vzw: 700px; }

/* 每個問題自己的折疊區，比頁尾那種收斂一點 */
/* 展開之後一定要有邊界。
   實測「持有回合是怎麼算的」展開有 5127px 高，而它與下一個問題之間
   只隔 10px、沒有任何分隔線——讀完五千像素之後，根本分不出深究段落
   在哪裡結束、下一個問題從哪裡開始。那就是「跟下一問題重疊」的感覺來源。

   收起來的時候維持原樣（只是一行標題，不需要框）；
   展開才變成一個看得出範圍的區塊。 */
.devzone.sub { margin-top: 18px; border-top: none; padding-top: 0; }
.devzone[open] {
  border-left: 3px solid var(--beam);
  border-bottom: 1px solid var(--rule);
  background: color-mix(in srgb, var(--panel) 55%, transparent);
  padding-left: 18px; padding-right: 18px; padding-bottom: 4px;
  margin-bottom: 34px;
}
.devzone[open] > summary { margin-left: -18px; margin-right: -18px; }

/* 收合按鈕。這段可能有五千像素長，讀完要人捲回最上面才關得掉
   是不合理的——在結尾再給一顆。 */
.dz-close {
  display: block; width: 100%; margin: 18px 0 14px;
  font-family: inherit; font-size: calc(13px * var(--rd-fs));
  color: var(--muted); background: none; cursor: pointer;
  border: 1px dashed var(--rule); border-radius: 0; padding: 10px;
}
.dz-close:hover { color: var(--ink); border-color: var(--muted); }
.dz-close:focus-visible { outline: 2px solid var(--beam); outline-offset: 2px; }
/* 想深究的收合列（2026/09/16 加厚）。原本是一行 10px 內距的細條，
   在長頁面裡像分隔線一樣被略過。現在是一張卡片：左邊小標籤、中間標題、
   右邊圓形箭頭，上下左右一起加厚，看得出「這裡還有東西可以點開」。 */
.devzone.sub > summary {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 18px 20px 18px 22px; min-height: 68px; box-sizing: border-box;
  border-radius: 14px; background: var(--panel); color: var(--ink);
  font-size: calc(15px * var(--rd-fs));
  box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 4%, transparent);
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.devzone.sub > summary::before { content: none; }
.devzone.sub > summary::after {
  content: "›"; margin-left: auto; display: inline-grid; place-items: center;
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  border: 1px solid var(--rule); background: var(--panel-2); color: var(--beam);
  font-size: 18px; line-height: 1; transition: transform .18s ease;
}
.devzone.sub[open] > summary::after { transform: rotate(90deg); }
.devzone.sub > summary:hover {
  border-color: color-mix(in srgb, var(--beam) 45%, var(--rule));
  box-shadow: 0 6px 18px color-mix(in srgb, var(--ink) 8%, transparent);
  transform: translateY(-1px);
}
.dz-k {
  flex: none; padding: 3px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--beam) 12%, transparent); color: var(--beam);
  font-size: calc(11.5px * var(--rd-fs)); font-weight: 600; letter-spacing: .08em;
}
.dz-t { font-weight: 600; }
.dz-hint { color: var(--muted); font-size: calc(12px * var(--rd-fs)); font-weight: 400; }
.devzone.sub[open] .dz-hint { display: none; }
@media (max-width: 560px) {
  .devzone.sub > summary { padding: 15px 16px; gap: 10px; }
  .dz-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .devzone.sub > summary, .devzone.sub > summary::after { transition: none; }
  .devzone.sub > summary:hover { transform: none; }
}
.devzone.sub .devzone-b { padding-top: 16px; }

/* ---------- 逐句浮現 ----------
   .reveal 由 JS 加上去，不是寫在 HTML 裡——JS 沒跑的時候內容必須完整顯示。 */
.chat.reveal > *, .story.reveal > *, .board.reveal > * {
  opacity: 0; transform: translateY(8px);
  transition: opacity .5s ease-out, transform .5s cubic-bezier(.22, 1, .36, 1);
  /* 每句 .12 秒、最多排到第六句：原本一句 .5 秒，第八句要等四秒才浮現，
     快速往下滑的人先看到一整片空白，再看著字一個一個追上來（2026/09/16）。 */
  transition-delay: calc(min(var(--i, 0), 6) * .12s);
}
.chat.reveal.is-in > *, .story.reveal.is-in > *, .board.reveal.is-in > * {
  opacity: 1; transform: none;
}
@media (prefers-reduced-motion: reduce) {
  .chat.reveal > *, .story.reveal > *, .board.reveal > * {
    opacity: 1; transform: none; transition: none;
  }
}

/* ==================================================================
   長篇文件的導覽：目錄、閱讀進度、圖片放大（2026/09/16）

   技術說明是長文件。先前進到這一頁只有一條捲軸：想查「14 道檢查
   是哪幾道」「平倉的 10 日規則」的人，只能一路滑或按 Ctrl+F。
   子目錄收在右緣，捲到哪一節就亮哪一節；進度條是「還剩多少」的體感。
   一開始是固定在頂端的一整條，壓在分頁列下面又佔掉一行版面，
   2026/09/16 改成右側抽屜。只在技術說明這種長文件出現，一般分頁不需要。
   ================================================================== */
/* 右側子目錄：收在畫面右緣的直立標籤，滑鼠靠近或停在上面就展開。
   標籤在右、面板往左長出來（row-reverse），面板寬度變化時內容不重排——
   內層固定寬，外層只負責裁切，展開的過程文字不會被擠成一格一格。 */
.subnav {
  position: fixed; right: 0; top: 150px; z-index: 45;
  display: flex; flex-direction: row-reverse; align-items: flex-start;
}
.subnav[hidden] { display: none; }
.subnav-tab {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 12px 8px 14px; border: 1px solid var(--rule); border-right: none;
  border-radius: 12px 0 0 12px; background: var(--panel); color: var(--muted); cursor: pointer;
  font-family: inherit; box-shadow: -3px 4px 16px color-mix(in srgb, var(--ink) 8%, transparent);
}
.subnav-tab:hover, .subnav.open .subnav-tab { color: var(--beam); }
.subnav-tab svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.subnav-label {
  writing-mode: vertical-rl; letter-spacing: .22em; font-weight: 600;
  font-size: calc(12.5px * var(--rd-fs)); line-height: 1;
}
.subnav-panel {
  width: 0; overflow: hidden; visibility: hidden; opacity: 0;
  border: 1px solid var(--rule); border-right: none; border-radius: 12px 0 0 12px;
  background: var(--panel); box-shadow: -6px 10px 28px color-mix(in srgb, var(--ink) 12%, transparent);
  transition: width .22s ease, opacity .18s ease, visibility 0s linear .22s;
}
.subnav.open .subnav-panel {
  width: min(300px, calc(100vw - 64px)); visibility: visible; opacity: 1;
  transition: width .22s ease, opacity .18s ease;
}
.subnav-in { width: min(300px, calc(100vw - 64px)); box-sizing: border-box; padding: 14px 14px 10px; }
.subnav-h { display: flex; justify-content: space-between; align-items: baseline; }
.subnav-h b { font-size: calc(13.5px * var(--rd-fs)); }
.subnav-pct { font-family: "IBM Plex Mono", monospace; font-size: calc(11.5px * var(--rd-fs)); color: var(--muted); }
.subnav-bar { height: 2px; margin: 9px 0 10px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.subnav-bar i { display: block; height: 100%; width: 0; background: var(--beam); transition: width .12s linear; }
.subnav-list {
  list-style: none; margin: 0; padding: 0;
  max-height: min(62vh, 480px); overflow-y: auto; overscroll-behavior: contain;
}
.subnav-list a {
  display: block; padding: 6px 10px; border-left: 2px solid transparent; border-radius: 0 8px 8px 0;
  color: var(--muted); text-decoration: none; font-size: calc(13px * var(--rd-fs)); line-height: 1.55;
}
.subnav-list .lv3 a { padding-left: 22px; font-size: calc(12.5px * var(--rd-fs)); }
.subnav-list a:hover { background: var(--panel-2); color: var(--ink); }
.subnav-list a.on {
  color: var(--beam); border-left-color: var(--beam); font-weight: 600;
  background: color-mix(in srgb, var(--beam) 8%, transparent);
}
.subnav-list a.folded::after {
  content: "想深究"; margin-left: 6px; padding: 0 6px; border: 1px solid var(--rule); border-radius: 999px;
  font-size: calc(10.5px * var(--rd-fs)); font-weight: 400; color: var(--muted); vertical-align: 1px;
}
@media (prefers-reduced-motion: reduce) {
  .subnav-panel, .subnav.open .subnav-panel { transition: none; }
}
/* 手機：放在畫面中段，避開右下角的「問問題」按鈕。 */
@media (max-width: 760px) {
  .subnav { top: 38vh; }
  .subnav-tab { padding: 10px 6px 12px; }
}

/* 規格速查卡：一節的門檻數字集中在開頭，不必讀完整節才找得到。 */
.spec {
  margin: 16px 0 18px; border: 1px solid var(--rule); border-left: 3px solid var(--beam);
  background: var(--panel-2); border-radius: 10px; padding: 13px 16px 11px;
}
.spec b { display: block; font-size: calc(12px * var(--rd-fs)); letter-spacing: .1em;
  color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.spec dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
.spec dt { font-size: calc(13px * var(--rd-fs)); color: var(--muted); }
.spec dd { margin: 0; font-size: calc(13.5px * var(--rd-fs)); line-height: 1.7; }
.spec dd em { font-style: normal; font-family: "IBM Plex Mono", monospace; color: var(--beam); }

/* 逐字稿原句。是語音轉文字的原始輸出，錯字照留，讀的人才看得出判讀難在哪裡。 */
.quote-src {
  margin: 14px 0; padding: 12px 16px; border-left: 3px solid var(--rule);
  background: var(--panel-2); color: var(--muted); border-radius: 0 8px 8px 0;
  font-size: calc(13.5px * var(--rd-fs)); line-height: 1.9; letter-spacing: var(--rd-ls);
}
@media (max-width: 560px) { .spec dl { grid-template-columns: 1fr; gap: 2px 0; } .spec dt { margin-top: 8px; } }

/* 圖片放大。手機上流程圖仍然維持最小寬度（縮到滿版字會剩 7px），
   但多一個出口：點一下就整張攤在全螢幕，可以自由拖曳。 */
.zoomhint {
  display: inline-block; margin-left: 10px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--muted);
  font-family: inherit; font-size: calc(11px * var(--rd-fs)); cursor: zoom-in; vertical-align: middle;
}
.zoomhint:hover { color: var(--ink); }
/* 沒有圖說的圖（.arch）：按鈕自成一行靠右，一樣不壓到圖。 */
.arch > .zoomhint { display: block; margin: 8px 0 2px auto; }
.zoomwrap {
  position: fixed; inset: 0; z-index: 200; background: color-mix(in srgb, var(--bg) 96%, transparent);
  display: flex; flex-direction: column;
}
.zoomwrap .zoomtop { display: flex; justify-content: flex-end; padding: 10px 14px; }
.zoomwrap .zoombody { flex: 1; overflow: auto; padding: 0 14px 18px; }
.zoomwrap .zoombody svg { width: auto; min-width: 100%; height: auto; }
.zoomwrap button {
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 7px 14px; font-family: inherit; font-size: calc(13px * var(--rd-fs)); cursor: pointer;
}

/* ==================================================================
   技術說明的六段式閱讀（2026/09/16）

   先前是一條七萬多字的捲軸。想查「十四道檢查是哪幾道」的人只能一路滑，
   而且滑到一半會忘記自己在哪一題。改成一次看一段：頂部步進器選段，
   段落結束有上一段／下一段，網址記得你停在第幾段（#tech/chunk-2）。

   純前端切換，不向後端要資料——六段本來就都在同一份 HTML 裡。
   ================================================================== */
.tech-steps {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px; margin: 6px 0 18px;
  border-bottom: 1px solid var(--rule); scrollbar-width: none;
}
.tech-steps::-webkit-scrollbar { display: none; }
.step-b {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--panel-2); color: var(--muted);
  font-family: inherit; font-size: calc(13px * var(--rd-fs)); white-space: nowrap;
}
.step-b:hover { color: var(--ink); }
.step-b .step-n {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  background: var(--panel); border: 1px solid var(--rule);
  font-family: "IBM Plex Mono", monospace; font-size: calc(11px * var(--rd-fs));
}
.step-b.on { background: var(--beam); border-color: var(--beam); color: #fff; font-weight: 600; }
.step-b.on .step-n { background: color-mix(in srgb, #fff 22%, transparent); border-color: transparent; color: #fff; }
.step-b.seen .step-n { border-color: var(--beam); color: var(--beam); }

.tech-chunk[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .tech-chunk.is-active { animation: chunkIn .28s ease-out both; }
}
@keyframes chunkIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.chunk-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin: 28px 0 6px; padding-top: 16px; border-top: 1px solid var(--rule);
}
/* 段落切換按鈕加厚：兩行（方向＋段名），寬高一起拉開，跟想深究卡片同一個份量。 */
.chunk-foot button {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  min-width: 220px; min-height: 70px; box-sizing: border-box; padding: 14px 22px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer;
  border-radius: 14px; font-family: inherit; text-align: left;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.chunk-foot button:hover {
  box-shadow: 0 6px 18px color-mix(in srgb, var(--ink) 8%, transparent); transform: translateY(-1px);
}
.chunk-foot .chunk-next { align-items: flex-end; text-align: right; border-color: var(--beam); }
.chunk-foot .cf-k { font-size: calc(12px * var(--rd-fs)); color: var(--muted); letter-spacing: .04em; }
.chunk-foot .cf-t { font-size: calc(15.5px * var(--rd-fs)); font-weight: 600; }
.chunk-foot .chunk-next .cf-t, .chunk-foot .chunk-next .cf-k { color: var(--beam); }
@media (prefers-reduced-motion: reduce) {
  .chunk-foot button, .chunk-foot button:hover { transition: none; transform: none; }
}
.chunk-foot .chunk-at, .chunk-foot .chunk-end { color: var(--muted); font-size: calc(12.5px * var(--rd-fs)); }
@media (max-width: 560px) {
  .chunk-foot { flex-direction: column-reverse; align-items: stretch; }
  .chunk-foot button { width: 100%; }
  .chunk-foot .chunk-at, .chunk-foot .chunk-end { text-align: center; }
}

/* 每一段開頭的三個重點（2026/09/16）。
   刻意固定三個：重點一多就等於沒有重點，讀的人會整段跳過。
   規格數字留在 .spec 速查卡，這裡只講「這一段在說什麼」。 */
.keypoints {
  margin: 14px 0 20px; padding: 14px 18px 12px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--rule); border-left: 3px solid var(--beam);
}
.keypoints .kp-h {
  font-size: calc(11.5px * var(--rd-fs)); letter-spacing: .12em; color: var(--muted);
  font-weight: 600; margin-bottom: 8px;
}
.keypoints ul { margin: 0; padding-left: 18px; }
.keypoints li {
  margin: 5px 0; font-size: calc(13.5px * var(--rd-fs)); line-height: 1.75;
  color: var(--muted); letter-spacing: var(--rd-ls);
}
.keypoints li b { color: var(--ink); font-weight: 600; }

/* 三個場景（2026/09/16）：對話框講的是「我們怎麼做」，場景講的是「你什麼時候會需要它」。
   先讓人認出自己遇過的處境，後面那些規則才有人想讀。 */
.scenes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 16px 0 24px; }
.scene { border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); padding: 14px 16px 16px; }
.scene-i { width: 100%; height: auto; max-width: 128px; display: block; margin-bottom: 10px; }
.sc-panel { fill: var(--panel-2); stroke: var(--rule); stroke-width: 1; }
.sc-line { fill: none; stroke: var(--beam); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sc-dot { fill: var(--beam); }
.sc-ghost { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 3 3; }
.sc-row { fill: var(--muted); opacity: .55; }
.sc-blank { fill: none; stroke: var(--rule); stroke-width: 1.2; stroke-dasharray: 3 2; }
.sc-t { font-size: 13px; font-weight: 700; fill: var(--muted); text-anchor: middle; }
.sc-clock { fill: none; stroke: var(--beam); stroke-width: 2; }
.sc-hand { stroke: var(--beam); stroke-width: 2; stroke-linecap: round; fill: none; }
.scene-q { font-weight: 600; font-size: calc(14px * var(--rd-fs)); line-height: 1.7; margin-bottom: 6px; }
.scene-a { color: var(--muted); font-size: calc(13px * var(--rd-fs)); line-height: 1.8; }
@media (max-width: 760px) { .scenes { grid-template-columns: 1fr; } .scene-i { max-width: 96px; } }

/* 逐字稿卡片（2026/09/16）：與信件同一種版式。
   一萬五到兩萬五千字的連續散文沒有人讀得完，切成一段一張卡片之後，
   要找某一檔講了什麼可以用掃的。小標是排版時一起產生的，用原文出現過的詞。 */
.txcard {
  border: 1px solid var(--rule); background: var(--panel); border-radius: 14px;
  padding: 0 0 4px; margin: 0 0 14px; overflow: hidden;
}
.txcard-h {
  display: flex; align-items: center; gap: 10px; padding: 11px 16px;
  background: var(--panel-2); border-bottom: 1px solid var(--rule);
}
.txcard-n {
  display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 7px;
  border-radius: 999px; background: var(--panel); border: 1px solid var(--rule);
  font-family: "IBM Plex Mono", monospace; font-size: calc(11.5px * var(--rd-fs)); color: var(--muted);
}
.txcard-h b { font-size: calc(14px * var(--rd-fs)); font-family: "Noto Sans TC", sans-serif; }
.txcard .txsec { padding: 4px 16px 0; }
@media (max-width: 560px) {
  .txcard-h { padding: 10px 13px; }
  .txcard .txsec { padding: 4px 13px 0; }
}

/* 常見問題與作者欄固定在最下面（2026/09/16）。
   上面六段會隨著步進器換內容，這兩塊不換——讀者要找「誰做的」「常見問題」時，
   不必先猜它被分在哪一段。 */
.tech-fixed { margin-top: 34px; padding-top: 22px; border-top: 2px solid var(--rule); }
.tech-fixed .fixed-note { color: var(--muted); font-size: calc(12.5px * var(--rd-fs)); margin: 0 0 14px; }

/* 對照矩陣：左邊是讓模型直接分析會發生什麼，右邊是這裡的做法。
   兩欄同高、逐列對齊，讀的人一眼看得出每一條痛點對到哪一條原則。 */
.cmatrix { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0 22px; }
.cm-col { border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px 6px; background: var(--panel); }
.cm-bad { border-top: 3px solid var(--rise); }
.cm-good { border-top: 3px solid var(--beam); }
.cm-h { font-weight: 600; font-size: calc(13.5px * var(--rd-fs)); margin-bottom: 10px; }
.cm-bad .cm-h { color: var(--rise); }
.cm-good .cm-h { color: var(--beam); }
.cm-i { padding: 9px 0; border-top: 1px solid var(--rule); }
.cm-i:first-of-type { border-top: none; }
.cm-i b { display: block; font-size: calc(13.5px * var(--rd-fs)); margin-bottom: 3px; }
.cm-i span { color: var(--muted); font-size: calc(13px * var(--rd-fs)); line-height: 1.75; }
@media (max-width: 640px) { .cmatrix { grid-template-columns: 1fr; } }

/* ---------- 概念圖 ---------- */
.c-zone { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 4 4; }
.c-zt { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: .06em; }
.c-n { fill: var(--panel-2); stroke: var(--rule); stroke-width: 1.3; }
.c-n.hot { stroke: var(--beam); }
.c-hub { fill: color-mix(in srgb, var(--beam) 12%, var(--panel)); stroke: var(--beam); stroke-width: 1.5; }
.c-t { font-size: 12.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.c-s { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.c-e { stroke: var(--muted); stroke-width: 1.3; fill: none; }
.c-l { font-size: 10.5px; fill: var(--muted); }

/* ---------- 金字塔圖 ---------- */
.p-1 { fill: color-mix(in srgb, var(--beam) 30%, var(--panel)); stroke: var(--beam); stroke-width: 1.3; }
.p-2 { fill: color-mix(in srgb, var(--beam) 18%, var(--panel)); stroke: var(--beam); stroke-width: 1.3; }
.p-3 { fill: var(--panel-2); stroke: var(--rule); stroke-width: 1.3; }
.p-t { font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.p-l { font-size: 10.5px; fill: var(--muted); }

/* ---------- 心智圖 ---------- */
.m-core { fill: color-mix(in srgb, var(--beam) 14%, var(--panel)); stroke: var(--beam); stroke-width: 1.5; }
.m-ct { font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
.m-e { stroke: var(--rule); stroke-width: 1.6; fill: none; }
.m-b { font-size: 12.5px; font-weight: 600; fill: var(--beam); }
.m-i { font-size: 10.5px; fill: var(--muted); }
.m-n { font-size: 11px; fill: var(--muted); text-anchor: middle; }

/* 後台維護工具裡的子區塊。一個工具底下有好幾個獨立的動作時，
   每一個各自框起來，才不會看起來像一長串按鈕分不出誰配誰。 */
.mt-sub { border-top: 1px solid var(--rule); margin-top: 16px; padding-top: 14px; }
.mt-sub > b { display: block; font-size: calc(13.5px * var(--rd-fs)); margin-bottom: 6px; }
.mt-sub > p { margin: 0 0 10px; }
.mt-sub textarea { width: 100%; min-height: 84px; padding: 10px 12px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  font-family: "IBM Plex Mono", monospace; font-size: calc(12.5px * var(--rd-fs));
  line-height: 1.7; border-radius: 8px; resize: vertical; }

/* ==================================================================
   會員通知

   一則簡訊一個區塊：上面是表格（欄位與每日總覽完全一樣），
   下面是他實際寫的原文。

   原文用等寬的引用樣式，與表格明顯分開——那是兩種東西：
   表格是模型讀出來的，原文是他自己寫的。讀的人要分得出來才核對得了。
   ================================================================== */
.smsitem { border-top: 1px solid var(--rule); padding: 22px 0 6px; }
.smsitem:first-child { border-top: none; padding-top: 0; }
.smshead { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
.smstime { font-family: "IBM Plex Mono", monospace; font-size: calc(13px * var(--rd-fs));
  color: var(--beam); font-weight: 600; }
/* 解析狀態。放在時間旁邊，一眼看得出這一則有沒有進到買賣紀錄——
   「已寫入」與「已解析（未寫入）」是兩件事，讀的人要分得出來。 */
.smsstate { font-size: calc(11.5px * var(--rd-fs)); color: var(--muted);
  border: 1px solid var(--rule); border-radius: 999px; padding: 2px 9px; }
.smsstate.revised { color: var(--note); border-color: color-mix(in srgb, var(--note) 45%, var(--rule));
  background: color-mix(in srgb, var(--note) 8%, transparent); }
.smslink { font-size: calc(12.5px * var(--rd-fs)); color: var(--muted);
  text-underline-offset: 3px; margin-left: auto; }
.smslink:hover { color: var(--ink); }
.smsraw { margin-top: 12px; padding: 14px 16px; border-left: 3px solid var(--rule);
  background: var(--panel-2); }
.smsraw p { margin: 0 0 10px; font-size: calc(13.5px * var(--rd-fs)); line-height: 1.9;
  color: var(--muted); text-align: justify; text-justify: inter-ideograph; }
.smsraw p:last-child { margin-bottom: 0; }


/* ---- 管理現有訂閱：卡片內直接勾選 ---- */
#mgPanel { margin-top:22px; padding-top:20px; border-top:1px solid var(--rd-line); }
.mg-head { display:flex; align-items:baseline; justify-content:space-between;
           gap:12px; flex-wrap:wrap; margin-bottom:6px; }
.mg-who { font-weight:600; font-size:calc(15px * var(--rd-fs)); }
.mg-since { color:var(--muted); font-size:calc(12px * var(--rd-fs)); }
.mg-row { display:flex; gap:12px; align-items:flex-start; padding:16px 0;
          border-bottom:1px solid var(--rd-line); }
.mg-row:last-of-type { border-bottom:0; }
.mg-row > input[type=checkbox] { width:18px; height:18px; margin-top:3px;
                                 accent-color:var(--beam); cursor:pointer; flex:0 0 auto; }
.mg-row label { cursor:pointer; line-height:1.7; }
.mg-row .sub { display:block; color:var(--muted); font-size:calc(13px * var(--rd-fs));
               margin-top:2px; }
.mg-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
.mg-actions .act { flex:0 0 auto; }
@media (max-width:600px) { .mg-actions .act { flex:1 1 100%; } }

/* ================================================================== *
 * 版面呼吸感與轉場
 *
 * 這一段刻意放在最後，而且只用既有的變數（--rule、--muted、--rd-fs…），
 * 不新增顏色也不改任何既有規則的選擇器。理由是這份樣式表已經一百多 KB，
 * 直接去動散落各處的 padding 與 margin，很難確定改到了誰；
 * 疊在最後、只調節奏與轉場，出問題時整段拿掉就回到原狀。
 * ================================================================== */

/* ---- 一、行高 ----

   這裡原本還有一條 max-width: 68ch，已經拿掉了，而且不要再加回來。

   ch 是數字「0」的寬度，而一個中文字大約等於 2ch。所以 68ch 在中文版面上
   只有三十四個字就換行——整頁的說明文字都在螢幕左半邊擠成窄長條，
   右邊一大片空白。那條規則在英文版面上是對的（英文一個字元約 1ch，
   68ch 就是舒服的 68 字元），套到中文就完全走樣。

   中文本來就比英文緊湊，同樣的字數佔的視覺寬度小得多，
   讓它用滿容器寬度是對的。行高放寬到 1.85 已經足夠讓長段落好讀。 */
.sect > p, .card > p, .notice, .hint, .lede, .ver-b {
  line-height: 1.85;
}

/* ---- 二、垂直節奏 ----
   原本卡片之間、段落之間的間距偏緊，資訊密度高的頁面會顯得擁擠。
   統一放大一級，並讓標題與內文之間的距離大於內文彼此之間的距離——
   這樣視覺上才會自動分組，不必靠線條去切。 */
.card { padding: 26px 28px; }
.card + .card { margin-top: 22px; }
.sect { margin-bottom: 42px; }
.sect-h { margin-bottom: 18px; }
.sect-h + p, .sect-h + .notice { margin-top: 0; }
.field { margin-bottom: 18px; }
.field label { margin-bottom: 7px; display: block; }
/* 上面那條會連勾選框的標籤一起改成 block：手機上「盤中即時通知（他一發簡訊就寄給你）」
   勾選框自己一行、字掉到下一行，看起來像壞掉。勾選標籤維持框與字同一列，字太長就在框的右邊換行。 */
.field .checks label { display: inline-flex; align-items: flex-start; margin-bottom: 0; line-height: 1.5; }
.field .checks input { margin-top: 3px; flex: none; }
.btnrow { gap: 12px; margin-top: 18px; }

/* ---- 三、轉場 ----
   分頁切換、hover、展開收合原本是瞬間跳的，畫面會「閃」一下。
   一律用同一組時間與曲線，讓整站的動態語彙一致。
   時間刻意壓在 .18s 以內：再長就會讓人覺得介面在拖。 */
.panel, .card, .act, .pill, .step, .mg-row,
button, a, input, select, textarea {
  transition: background-color .16s ease, border-color .16s ease,
              color .16s ease, box-shadow .16s ease, opacity .16s ease,
              transform .16s ease;
}
.panel[hidden] { display: none; }
.panel:not([hidden]) { animation: rd-fade .32s cubic-bezier(.22,1,.36,1) both; }
@keyframes rd-fade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

/* 可按的東西要看得出可按。位移只有 1px，夠明顯又不會讓版面跳動。 */
.act:hover:not(:disabled), .pill:hover { transform: translateY(-1px); }
.act:active:not(:disabled) { transform: translateY(0); }
.act:disabled { opacity: .55; cursor: not-allowed; transform: none; }

/* 鍵盤操作要看得到焦點。用 --beam 而不是瀏覽器預設的藍框，
   才不會在深色主題下刺眼。 */
:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--beam);
  outline-offset: 2px;
  border-radius: 3px;
}

/* ---- 四、把線變輕 ----
   全站用同一個 --rule 畫線，密集的表格看起來會像網格紙。
   分隔線降到六成濃度，該強調的邊框維持原樣。 */
.mg-row, .ledger .led-r, .sms-manage-table td {
  border-color: color-mix(in srgb, var(--rule) 60%, transparent);
}

/* ---- 五、尊重使用者的動態偏好 ----
   系統設定「減少動態效果」時全部關掉。這不是加分項，
   對前庭敏感的人來說，會動的介面是真的會不舒服。 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
  .panel:not([hidden]) { animation: none; }
  .act:hover:not(:disabled), .pill:hover { transform: none; }
}

/* ---- 六、窄螢幕 ----
   手機上卡片內距要收回來，不然內容區只剩一半。 */
@media (max-width: 640px) {
  .card { padding: 20px 18px; }
  .sect { margin-bottom: 30px; }
}
/* 2026-09-12: article reading area. Keep the existing width/font preference controls. */
.mail-content {
  width: 100%; min-width: 0; max-width: 100%; overflow-x: visible;
  padding: clamp(20px, 3vw, 40px); font-size: calc(16px * var(--rd-fs));
  line-height: 1.95; letter-spacing: .025em; overflow-wrap: anywhere;
}
.mail-content p, .mail-content li { margin-block: 14px; }
.mail-content h1, .mail-content h2, .mail-content h3 { margin: 32px 0 16px; line-height: 1.5; }
.mail-table-scroll { max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
.mail-content table { font-size: calc(15px * var(--rd-fs)) !important; line-height: 1.9; }
.mail-content th, .mail-content td { padding: 14px 18px !important; }
.mail-content td:last-child { min-width: 260px; }
.mail-content td:first-child { min-width: 82px; }
.mail-content td:nth-child(2) { min-width: 64px; }
@media (max-width: 640px) {
  .mail-content { padding: 20px 16px; }
  .mail-content .mail-table-scroll table { min-width: 600px; }
  .mail-content th, .mail-content td { padding: 12px 14px !important; }
}
.mail-content > div, .mail-content .mail-shell {
  color: var(--ink) !important; font-size: inherit !important;
  line-height: inherit !important; letter-spacing: inherit !important;
}
.mail-content th:first-child, .mail-content td:first-child,
.mail-content th:nth-child(2), .mail-content td:nth-child(2) { white-space: nowrap; }
.mail-content th:first-child, .mail-content td:first-child { position: sticky; left: 0; z-index: 1; }
.mail-table-hint { display: none; }
.step.wait { border-style: dashed; opacity: .85; }
@media (max-width: 640px) {
  .mail-table-hint { display: block !important; margin: 0 0 20px; color: var(--muted) !important; font-size: 12px !important; }
}
/* 2026-09-15：每日總覽的股票名稱欄是固定欄寬，「主動統一台股增長」這種長名稱
   在 nowrap 之下會壓到右邊的代號。名稱欄改成可換行（中文逐字斷、英數在任意處斷），
   短名稱仍是一行；代號、價格欄照舊不換行。 */
.tbl-daily td.sticky { white-space: normal; overflow-wrap: anywhere; word-break: break-word; line-height: 1.45; }
.tbl-daily td.sticky .namecell { display: flex; align-items: flex-start; min-width: 0; }
.tbl-daily td.sticky .namecell .arrow { flex: none; margin-top: .2em; }

/* 2026-09-15：郵件查詢分頁套用新版信件（疊列表格＋圓角章節卡）。
   信件的 inline 樣式是給收件匣看的淺色版；網站這裡把外框底色拿掉、交給主題變數，
   並解除舊版四欄表格用的最小寬度與凍結首欄，否則疊列表格又會被撐出橫向捲動。 */
.mail-content .mail-shell, .mail-content .mail-shell > table, .mail-content .mail-shell td[align="center"] {
  background: transparent !important; padding: 0 !important;
}
/* 舊版四欄表格的規則（首欄不換行、凍結、最小寬度）是用 td:first-child 寫的，
   信件外框的 td 也是 first-child，不解除的話整封信的文字都不換行、被撐出版面。
   這幾條不用 !important，才不會蓋掉價位格 inline 的 nowrap。 */
.mail-content .mail-shell td { white-space: normal; position: static; min-width: 0; }
.mail-content .mail-shell td.mail-col { padding: 0 !important; }
.mail-content .mail-col { font-size: calc(14px * var(--rd-fs)) !important; line-height: 1.75 !important; color: var(--ink) !important; }
.mail-content .mc-sec { background: var(--panel) !important; border-color: var(--rule) !important; }
.mail-content .mc-h2, .mail-content .mc-h3 { color: var(--ink) !important; margin-top: 0; }
.mail-content .mc-h3 { margin-top: 14px !important; }
.mail-content .mc-sec p, .mail-content .mc-sec .mail-bullet, .mail-content .mc-desc { color: var(--ink) !important; }
.mail-content .mail-bullet b { color: var(--ink) !important; }
.mail-content table.mc-table { min-width: 0 !important; font-size: calc(13.5px * var(--rd-fs)) !important; }
.mail-content table.mc-table td, .mail-content table.mc-table th {
  position: static !important; min-width: 0 !important; padding: 8px 12px !important;
}
.mail-content table.mc-table td { white-space: normal; }
.mail-content table.mc-table td.mc-desc { padding-top: 0 !important; padding-bottom: 12px !important; }
.mail-content .mc-hero h1 { font-size: calc(19px * var(--rd-fs)) !important; }
[data-theme="dark"] .mail-content .mc-hero { background: color-mix(in srgb, #04795C 30%, var(--panel)) !important; }
[data-theme="dark"] .mail-content .mc-chip { filter: brightness(1.05); }
.mail-content .mc-brand { color: var(--muted) !important; }

/* 2026-09-15 v22：郵件查詢的每個字都跟著「版面設定」走（字體大小／字距／行距）。
   信件的字級寫在 inline style（有些收件匣或轉寄會拿掉 <style>），inline 權重高於一般規則，
   所以股票名稱、代號、價位／狀態標籤、表頭、說明先前都是固定 px，只有外框跟著變。
   這裡逐一用 !important 蓋回去：px 數與信件相同、乘上 --rd-fs，標準字級時與信件一模一樣。
   字距用 --rd-ls；行距只給長文字（段落、條列、說明列）用 --rd-lh，
   名稱、代號、標籤、章名維持緊湊行高（無單位倍數，本來就隨字級等比放大）。 */
.mail-content .mc-hero-k { font-size: calc(11px * var(--rd-fs)) !important; }
.mail-content .mc-hero h1 { letter-spacing: var(--rd-ls) !important; }
.mail-content .mc-h2 { font-size: calc(16px * var(--rd-fs)) !important; letter-spacing: var(--rd-ls) !important; }
.mail-content .mc-h2 > span { height: calc(15px * var(--rd-fs)) !important; }
.mail-content .mc-h3 { font-size: calc(14.5px * var(--rd-fs)) !important; letter-spacing: var(--rd-ls) !important; }
.mail-content .mc-p, .mail-content .mail-bullet {
  font-size: calc(14px * var(--rd-fs)) !important; line-height: var(--rd-lh) !important; letter-spacing: var(--rd-ls) !important;
}
.mail-content table.mc-table th.mc-th { font-size: calc(12px * var(--rd-fs)) !important; letter-spacing: var(--rd-ls) !important; }
.mail-content table.mc-table td.mc-name { font-size: calc(15px * var(--rd-fs)) !important; letter-spacing: var(--rd-ls) !important; }
/* 信件把名稱、代號、價位的文字顏色寫在 inline style（收件匣深色模式需要它寫明），
   網站這邊要交還給主題變數，否則深色主題會變成深底配深字。 */
.mail-content table.mc-table td.mc-name, .mail-content table.mc-table td.mc-mid { color: var(--ink) !important; }
.mail-content table.mc-table td.mc-code { color: var(--muted) !important; }
.mail-content table.mc-table td.mc-code { font-size: calc(13.5px * var(--rd-fs)) !important; letter-spacing: var(--rd-ls) !important; }
/* v54 觀望表：代號放在名稱下面一行（span），顏色與字級同代號欄 */
.mail-content table.mc-table span.mc-code { font-size: calc(13.5px * var(--rd-fs)) !important; letter-spacing: var(--rd-ls) !important; color: var(--muted) !important; }
.mail-content table.mc-table td.mc-desc .mc-chip { margin-right: 4px; }
.mail-content table.mc-table td.mc-desc.mc-side { padding-top: 10px !important; padding-bottom: 11px !important; }
.mail-content table.mc-table td.mc-mid { font-size: calc(13.5px * var(--rd-fs)) !important; letter-spacing: var(--rd-ls) !important; }
.mail-content table.mc-table td.mc-desc {
  font-size: calc(13.5px * var(--rd-fs)) !important; line-height: var(--rd-lh) !important; letter-spacing: var(--rd-ls) !important;
}
.mail-content .mc-chip {
  font-size: calc(12px * var(--rd-fs)) !important; line-height: calc(20px * var(--rd-fs)) !important;
  padding: 0 calc(8px * var(--rd-fs)) !important; letter-spacing: var(--rd-ls) !important;
}
.mail-content .mc-tone-k { font-size: calc(12px * var(--rd-fs)) !important; letter-spacing: var(--rd-ls) !important; }

/* 短價位已正規化，不拆開「未說明」與以上／以下；長說明仍自然換行。 */
.tbl-daily td.pxnote, .tbl-rec td.pxnote, .tbl-find td.pxnote {
  white-space: nowrap; word-break: normal; overflow-wrap: normal;
}
.pxnote .pxsub { white-space: normal; overflow-wrap: anywhere; }

/* v45：說明改成可縮排的路線圖；短標籤不拆字，長說明自然換行。 */
.tech-v45 { max-width: 1180px; margin-inline: auto; }
.tech-v45 h2, .tech-v45 h3 { text-wrap: balance; }
.tech-v45 p, .tech-v45 .flow-note { text-wrap: pretty; overflow-wrap: anywhere; }
.tech-v45 .tech-steps { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); }
.tech-v45 .step-b { white-space:nowrap; justify-content:center; padding:14px 10px; }
.flow-kicker { color:var(--muted); font-size:12px; letter-spacing:.12em; margin-top:28px; }
.flow-map { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; list-style:none; padding:0; margin:28px 0; counter-reset:none; }
.flow-map li { min-width:0; padding:24px; border:1px solid var(--rule); border-radius:18px; background:var(--panel,transparent); position:relative; }
.flow-map .flow-index { display:inline-grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--ink); color:var(--bg); font:600 14px sans-serif; }
.flow-map h3 { margin:16px 0 10px; font-size:calc(18px * var(--rd-fs)); }
.flow-map p { margin:0; line-height:1.85; }
.flow-note { border-left:3px solid var(--ink); padding:18px 22px; background:var(--surface,transparent); line-height:1.9; margin-bottom:24px; }
.tech-v45 .chunk-foot { display:flex; justify-content:space-between; gap:12px; }
.tech-v45 .chunk-foot button { min-width:0; white-space:normal; text-wrap:balance; }
.tech-v45 .table-scroll { max-width:100%; overflow-x:auto; }
.tech-v45 { letter-spacing:.01em; }
.tech-figure { margin:28px 0; padding:24px; border:1px solid var(--rule); border-radius:20px; background:var(--panel); min-width:0; }
.tech-figure figcaption { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:22px; }
.tech-figure figcaption>span:last-child:not(.tech-tag) { flex-basis:100%; font-size:13px; color:var(--muted); }
.tech-tag { font:600 11px/1.5 system-ui; text-transform:uppercase; color:var(--beam); border:1px solid var(--rule); border-radius:6px; padding:4px 8px; }
.tech-options { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:16px 0; }
.tech-options button,.tech-erd button { font:inherit; letter-spacing:0; color:var(--ink); background:var(--bg); border:1px solid var(--rule); border-radius:10px; padding:10px 14px; cursor:pointer; }
.tech-options button[aria-pressed=true],.tech-erd button[aria-pressed=true] { border-color:var(--beam); box-shadow:inset 0 -3px var(--beam); }
.tech-options button:focus-visible,.tech-erd button:focus-visible { outline:2px solid var(--beam); outline-offset:3px; }
.tech-options button:disabled { opacity:.45; cursor:default; }
.tech-route { display:flex; align-items:stretch; gap:20px; list-style:none; padding:0; margin:24px 0; }
.tech-route li { flex:1; min-width:0; position:relative; padding:18px 10px; border:1px solid var(--rule); border-radius:12px; text-align:center; font-weight:600; transition:background .25s,border-color .25s; }
.tech-route li+li:before { content:'→'; position:absolute; left:-19px; color:var(--muted); }
.tech-route li.active { border-color:var(--beam); background:color-mix(in srgb,var(--beam) 14%,var(--panel)); }
.tech-route li.done { color:var(--beam); }
.tech-demo-message { padding:16px 18px; border-left:3px solid var(--beam); border-radius:0 12px 12px 0; background:var(--bg); line-height:1.75; min-height:64px; }
.tech-demo-message p { margin:6px 0 0; }
.tech-figure mark { color:inherit; background:linear-gradient(transparent 65%,rgba(246,189,77,.45) 65%); }
.decision-start { border:1px solid var(--beam); border-radius:12px; text-align:center; padding:16px; font-weight:600; }
.tech-arrow { display:block; text-align:center; padding:10px; color:var(--muted); align-self:center; }
.decision-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.decision-grid>div { padding:16px; border:1px solid var(--rule); border-radius:12px; }
.decision-grid b,.decision-grid span,.ownership b,.ownership span { display:block; }
.decision-grid span,.ownership span { margin-top:6px; color:var(--muted); font-size:14px; }
.ownership { align-items:center; gap:10px; }
.ownership>div { flex:1; min-width:0; padding:16px; border:1px solid var(--rule); border-radius:12px; }
.tech-timeline { list-style:none; padding:0; margin:0; }
.tech-timeline li { display:grid; grid-template-columns:88px minmax(0,1fr); gap:18px; padding:0 0 24px; position:relative; }
.tech-timeline time { color:var(--beam); font-weight:700; text-align:right; padding-top:4px; }
.tech-timeline li>div { border-left:2px solid var(--rule); padding:4px 0 4px 22px; }
.tech-timeline .timeline-focus>div { border-left-color:var(--beam); }
.tech-timeline p { margin:6px 0 0; }
.tech-erd { display:grid; grid-template-columns:minmax(0,1fr) 68px minmax(0,1fr); gap:14px; align-items:center; margin-bottom:20px; }
.tech-erd button { text-align:left; padding:20px; display:grid; gap:8px; }
.tech-erd code { white-space:normal; overflow-wrap:anywhere; font-size:13px; color:var(--beam); }
.tech-erd button>span { font-size:13px; color:var(--muted); }
.tech-erd>.tech-arrow:nth-child(4) { grid-column:1/-1; padding:0; }
.tech-swim { display:grid; gap:12px; }
.tech-swim>div { display:grid; grid-template-columns:175px minmax(0,1fr); gap:18px; padding:16px; border:1px solid var(--rule); border-radius:12px; }
.tech-swim b { color:var(--beam); }
.tech-swim p { margin:0; }
@media(max-width:600px) {
 .tech-figure { padding:16px; margin:20px 0; }
 .tech-route { flex-direction:column; gap:18px; }
 .tech-route li+li:before { content:'↓'; left:calc(50% - 6px); top:-22px; }
 .decision-grid,.tech-erd { grid-template-columns:1fr; }
 .tech-erd>.tech-arrow:nth-child(4) { grid-column:auto; }
 .tech-erd>.tech-arrow { transform:rotate(0); }
 .ownership>.tech-arrow { transform:rotate(90deg); }
 .ownership>div { width:100%; box-sizing:border-box; }
 .tech-swim>div { grid-template-columns:1fr; gap:8px; }
 .tech-timeline li { grid-template-columns:64px minmax(0,1fr); gap:10px; }
}
@media(prefers-reduced-motion:reduce) { .tech-route li { transition:none; } }
.tech-dialog { display:grid; grid-template-columns:minmax(90px,118px) minmax(0,1fr); gap:10px 18px; margin:24px 0; padding:20px 22px; border:1px solid var(--rule); border-radius:16px; background:var(--panel); }
.tech-dialog p { margin:0; line-height:1.75; }
.tech-speaker { align-self:start; font-weight:700; color:var(--ink); }
.tech-dialog mark { color:inherit; background:linear-gradient(transparent 65%,rgba(246,189,77,.46) 65%); padding:0 2px; }
.tech-compare { width:100%; border-collapse:collapse; min-width:560px; margin:4px 0 24px; }
.tech-compare th,.tech-compare td { text-align:left; vertical-align:top; padding:13px 16px; border-bottom:1px solid var(--rule); line-height:1.65; }
.tech-compare th { font-weight:700; background:var(--panel); }
@media(max-width:760px) {
 .tech-v45 .tech-steps { grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
 .tech-v45 .step-b { flex-wrap:wrap; font-size:13px; padding:12px 6px; }
 .flow-map { grid-template-columns:1fr; gap:12px; }
 .flow-map li { padding:20px; }
 .flow-note { padding:16px; }
 .tech-dialog { grid-template-columns:1fr; gap:5px; padding:16px; }
 .tech-speaker:not(:first-child) { margin-top:8px; }
}
@media(prefers-reduced-motion:no-preference) {
 .tech-v45 .tech-chunk.is-active { animation:flow-appear .24s cubic-bezier(.2,.7,.2,1); }
 @keyframes flow-appear { from {opacity:0;transform:translateY(6px)} to {opacity:1;transform:none} }
}


@media(max-width:760px) {
 body:has(#p-tech:not([hidden])) .subnav { display:none; }
}

/* ====== v54 樣式層 ====== */
/* 2026/09/23 管理者語音筆記與三份檢查報告的版面改版。改動集中在這一段，方便日後對照：
   一、圓角：設計變數＋按鈕、輸入框、卡片、表格外框、膠囊全面圓角（原本全站 border-radius: 0）。
   二、每日總覽表：名稱欄四個字寬、代號欄放得下 00981A、觀望表拿掉價位說明欄；
       桌面不再要求 1000px 最小寬度（900px 以上不橫向捲動），窄螢幕改疊列卡片。
   三、持股追蹤：中間那一大片空白的原因是進場價／目前價兩欄各 152px（當初為了塞「持／明／參」小標），
       加上整表至少 1280px。小標拿掉之後兩欄收成 88px、取消最小寬度，空間全部給「最新說明」。
   四、新元件：數字膠囊、價位膠囊、狀態兩行、分段控制、選項卡片、績效落後提示。 */
:root {
  --r-xs: 6px;      /* 小標籤、上標 */
  --r-sm: 10px;     /* 輸入框、下拉、小按鈕 */
  --r-md: 14px;     /* 表格外框、通知條 */
  --r-lg: 18px;     /* 卡片、面板 */
  --r-pill: 999px;  /* 分段控制、膠囊、主要按鈕 */
  --ctl-h: 44px;    /* 按鈕與輸入框最小高度（觸控） */
}

/* ---------- 一、圓角 ---------- */
.card { border-radius: var(--r-lg); }
.card.flush, .card.scrollx { border-radius: var(--r-md); }
.card.flush { overflow: hidden; }
input[type="text"], input[type="email"], input[type="date"], input[type="number"], select, textarea {
  border-radius: var(--r-sm); min-height: var(--ctl-h);
}
button.act { border-radius: var(--r-pill); min-height: var(--ctl-h); padding: 10px 24px; }
.pill { border-radius: var(--r-pill); }
.checks label { border-radius: var(--r-sm); }
.emptyline { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.empty { border-radius: var(--r-md); }
.suggest-list { border-radius: 0 0 var(--r-sm) var(--r-sm); }
.mailcal { border-radius: var(--r-lg); }
.mailcal-nav { border-radius: var(--r-sm); }
.chips-hint button { border-radius: var(--r-pill); }
.pillstate { border-radius: var(--r-pill); }
.roundbox { border-radius: var(--r-md); overflow: hidden; }
.tsum { border-radius: var(--r-md); overflow: hidden; }
.latest-sms { border-radius: var(--r-lg); }
.whytext { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.detail-panel .card, .detail-panel .roundbox { border-radius: var(--r-md); }

/* 焦點框：圓角元素上也要看得清楚（G3） */
button:focus-visible, .pill:focus-visible, a:focus-visible, .tab:focus-visible,
.led-pill:focus-visible, .optcard:focus-within {
  outline: 2px solid var(--beam); outline-offset: 2px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--beam); outline-offset: 1px; }

/* 觸控裝置：按得到的東西至少 44px 高（G2） */
@media (pointer: coarse) {
  .pill, .led-pill, .tab, .chips-hint button { min-height: 44px; }
  .mailcal-nav { width: 44px; height: 44px; }
}

/* 分段控制（目前持有／已出場、績效指標與區間）：一條圓角底，選中那一格主色底 */
.chartbar.seg {
  display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px;
  background: var(--panel-2); border: 1px solid var(--rule); border-radius: var(--r-pill);
  margin-right: 8px;
}
.chartbar.seg .pill {
  border: 0; background: transparent; color: var(--muted);
  font-family: "Noto Sans TC", sans-serif; font-size: calc(13px * var(--rd-fs)); padding: 7px 16px;
}
.chartbar.seg .pill:hover { color: var(--ink); }
.chartbar.seg .pill[aria-pressed="true"] { background: var(--beam); color: var(--panel); font-weight: 600; }
#p-perf .chartbar.seg { display: flex; width: fit-content; max-width: 100%; }

/* ---------- 區塊標題 ---------- */
/* 區塊前的灰色英文小字已全部拿掉（v54）；觀望兩區把分類名放在標題裡，副標用小字接在後面 */
.sect-h h2 small {
  font-family: "Noto Sans TC", sans-serif; font-weight: 400; color: var(--muted);
  font-size: calc(13px * var(--rd-fs)); margin-left: 10px; letter-spacing: 0;
}
h3.day-h small { font-weight: 400; color: var(--muted); font-size: .78em; margin-left: 8px; font-family: "Noto Sans TC", sans-serif; }

/* ---------- 首屏：計數改膠囊（B8） ---------- */
.hero { padding: 30px 0 20px; }
.ledger { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; border-top: 0; }
.led-pill {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 7px 14px; border-radius: var(--r-pill); font-family: inherit;
  border: 1px solid color-mix(in srgb, currentColor 32%, transparent);
  background: color-mix(in srgb, currentColor 8%, var(--panel));
  font-size: calc(13.5px * var(--rd-fs)); line-height: 1.3;
}
.led-pill .led-k { color: inherit; font-size: inherit; }
.led-pill .led-n { font-family: "IBM Plex Mono", monospace; font-size: calc(15px * var(--rd-fs)); font-weight: 600; color: inherit; text-align: left; }
.led-pill.buy { color: var(--rise); } .led-pill.sell { color: var(--fall); }
.led-pill.watch { color: var(--wait); } .led-pill.note { color: var(--note); }
.led-pill.hold { color: var(--beam); }
.led-pill.absent { color: var(--muted); }
.led-pill:hover { background: color-mix(in srgb, currentColor 14%, var(--panel)); }

/* ---------- 表格與數字不做進場動畫（B12） ---------- */
.tbl-daily tbody tr, .tbl-trk tbody tr, .tbl-rec tbody tr, .tbl-find tbody tr { animation: none; }
.stat, .tsum-i { animation: none; }

/* ---------- 二、每日總覽表欄寬（B3 B4 B5） ---------- */
/* 名稱四個字寬：14px 字 × 4 ＋ 左右內距 28 ＋ 箭頭 ≈ 100。
   超過四個字（元大台灣50、世芯-KY）在欄內換行，不再把代號欄擠窄。
   代號 80：等寬字六碼（00981A）加內距剛好。現價 88、漲跌 80。 */
.tbl-daily col.c-name   { width: calc(100px * var(--rd-fs)); }
.tbl-daily col.c-code   { width: calc( 80px * var(--rd-fs)); }
.tbl-daily col.c-px     { width: calc( 88px * var(--rd-fs)); }
.tbl-daily col.c-chg    { width: calc( 80px * var(--rd-fs)); }
.tbl-daily col.c-note   { width: calc(120px * var(--rd-fs)); }
.tbl-sms col.c-dir      { width: calc( 96px * var(--rd-fs)); }
.tbl-daily td.sticky { white-space: normal; word-break: keep-all; overflow-wrap: anywhere; }
/* 900px 以上不橫向捲動：固定欄加起來 468（買賣表）／348（觀望表），其餘全給說明重點。 */
.card.scrollx table, .card.scrollx table.tbl-sms { min-width: 0; }
.card.scrollx table.tbl-daily { width: 100%; }
/* 觀望表：有已證實價位時，放在說明前面的小膠囊 */
.pxchip {
  display: inline-block; margin: 0 8px 2px 0; padding: 0 9px; vertical-align: 1px;
  border-radius: var(--r-pill); white-space: nowrap;
  font-family: "IBM Plex Mono", monospace; font-size: calc(12px * var(--rd-fs)); line-height: 1.7;
  background: color-mix(in srgb, var(--wait) 13%, var(--panel)); color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--wait) 30%, transparent);
}

/* ---------- 三、持股追蹤（C1 C2 C4） ---------- */
.tbl-trk col.c-name   { width: calc(100px * var(--rd-fs)); }
.tbl-trk col.c-code   { width: calc( 80px * var(--rd-fs)); }
.tbl-trk col.c-state  { width: calc( 88px * var(--rd-fs)); }
.tbl-trk col.c-date   { width: calc(112px * var(--rd-fs)); }
.tbl-trk col.c-num    { width: calc( 64px * var(--rd-fs)); }
.tbl-trk col.c-px     { width: calc( 88px * var(--rd-fs)); }
.tbl-trk col.c-ret    { width: calc(100px * var(--rd-fs)); }
.tbl-trk col.c-reason { width: auto; }
.card.scrollx table.tbl-trk { min-width: 0; width: 100%; }
.tbl-trk td.sticky { white-space: normal; word-break: keep-all; overflow-wrap: anywhere; }
/* 「持有中」與「第 N 回合」上下兩行 */
.state-stack { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.state-stack .pillstate { font-family: "Noto Sans TC", sans-serif; font-size: calc(12px * var(--rd-fs)); padding: 1px 9px; }
.state-stack .pillstate.held { background: color-mix(in srgb, var(--rise) 8%, transparent); }
.state-stack .roundtag { margin-left: 0; font-size: calc(11px * var(--rd-fs)); white-space: nowrap; }

/* 持股追蹤摘要的短標籤（C10，Codex 50）：「平均未實現報酬」窄的時候平均折成兩行，不讓「酬」單獨掉下去。 */
.tsum-i .k { white-space: normal; text-wrap: balance; }

/* 會員通知讀取失敗時的就地重試（F5） */
.sms-retry { margin-top: 8px; }

/* ---------- 四、其他新元件 ---------- */
/* 績效走勢：最後一點落後最近交易日時的提示（E2）與計算方式（E4） */
.stale-note {
  margin: 0 0 14px; padding: 9px 14px; border-radius: var(--r-md);
  background: color-mix(in srgb, var(--wait) 12%, var(--panel)); color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--wait) 30%, transparent);
  font-size: calc(13px * var(--rd-fs));
}
.stale-note[hidden] { display: none; }
.perf-how { margin: 10px 0 0; font-size: calc(12.5px * var(--rd-fs)); color: var(--muted); line-height: 1.7; }

/* 訂閱：通知項目改成可點的選項卡片（F2） */
.optcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.optcard {
  display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "box t" "box d";
  column-gap: 12px; row-gap: 2px; align-items: start; margin: 0; cursor: pointer;
  padding: 14px 16px; min-height: var(--ctl-h); color: var(--ink);
  border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--panel);
  transition: border-color .15s ease, background .15s ease;
}
.optcard input { grid-area: box; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--beam); }
.optcard-t { grid-area: t; font-weight: 600; font-size: calc(15px * var(--rd-fs)); }
.optcard-d { grid-area: d; color: var(--muted); font-size: calc(12.5px * var(--rd-fs)); line-height: 1.6; }
.optcard:hover { border-color: color-mix(in srgb, var(--beam) 45%, var(--rule)); }
.optcard:has(input:checked) { border-color: var(--beam); background: color-mix(in srgb, var(--beam) 7%, var(--panel)); }

/* ---------- 技術說明（H1–H8）---------- */
/* 報告摘要：動機／目的／痛點／解法／價值，每一列三、四行 */
.rpt { display: grid; gap: 10px; margin: 18px 0 24px; }
.rpt-row { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 14px; align-items: start;
  padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--panel); }
.rpt-row p { margin: 0; line-height: 1.75; }
.rpt-k { display: inline-flex; justify-content: center; padding: 4px 0; border-radius: var(--r-pill); font-size: calc(13px * var(--rd-fs)); color: var(--panel); }
.rpt-k.k-why { background: var(--note); } .rpt-k.k-goal { background: var(--beam); } .rpt-k.k-pain { background: var(--rise); }
.rpt-k.k-fix { background: var(--wait); } .rpt-k.k-val { background: var(--ink); }
.num-hl { font-weight: 700; color: var(--beam); }
.live-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(130px, calc((100% - 28px) / 3)), 1fr));
  gap: 14px; margin: 14px 0 6px; }
.live-stats > div { padding: 14px 16px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--beam) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--beam) 25%, var(--rule)); }
.live-stats b { display: block; font-family: "IBM Plex Mono", monospace; font-size: calc(22px * var(--rd-fs)); color: var(--beam); letter-spacing: 0; line-height: 1.2; }
.live-stats span { font-size: calc(12px * var(--rd-fs)); color: var(--muted); }
.live-note { font-size: calc(12px * var(--rd-fs)); color: var(--muted); margin: 6px 0 0 !important; }
.rpt-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rpt-compare > div { padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--rule); }
.rpt-compare .rc-old { background: color-mix(in srgb, var(--rise) 5%, var(--panel)); }
.rpt-compare .rc-new { background: color-mix(in srgb, var(--beam) 7%, var(--panel)); border-color: color-mix(in srgb, var(--beam) 35%, var(--rule)); }
.rpt-compare ol { margin: 8px 0 0; padding-left: 1.3em; line-height: 1.75; }
/* 左右對話：讀者在左、系統在右，上方標「示範」 */
.tech-dialog.chat { display: flex; flex-direction: column; gap: 6px; padding: 30px 16px 16px; position: relative; }
.tech-dialog.chat::before { content: "示範對話"; position: absolute; top: 9px; left: 16px; font-size: calc(11px * var(--rd-fs)); color: var(--muted); letter-spacing: .08em; }
.tech-dialog.chat .tech-speaker { font-size: calc(12px * var(--rd-fs)); color: var(--muted); font-weight: 600; }
.tech-dialog.chat .tech-speaker:nth-of-type(even) { align-self: flex-end; }
.tech-dialog.chat p { max-width: 86%; padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: var(--panel-2); }
.tech-dialog.chat .tech-speaker:nth-of-type(even) + p, .tech-dialog.chat .tech-speaker:nth-of-type(even) + p + p {
  align-self: flex-end; border-radius: 16px 16px 4px 16px; background: color-mix(in srgb, var(--beam) 11%, var(--panel)); }
/* 色筆：主體、行為、時間、條件（附文字圖例，不只靠顏色） */
mark.m-who, mark.m-act, mark.m-when, mark.m-cond { color: inherit; padding: 0 2px; border-radius: 3px; }
mark.m-who { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--beam) 38%, transparent) 55%); }
mark.m-act { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--rise) 32%, transparent) 55%); }
mark.m-when { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--note) 38%, transparent) 55%); }
mark.m-cond { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--wait) 40%, transparent) 55%); }
.mark-legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: calc(12.5px * var(--rd-fs)); color: var(--muted); margin: -10px 0 18px; }
/* 點數字看歸屬 */
.own-sent { line-height: 2.1; }
.own-num { font: inherit; font-weight: 700; font-family: "IBM Plex Mono", monospace; padding: 1px 8px; margin: 0 2px; cursor: pointer;
  border-radius: var(--r-sm); border: 1px dashed var(--beam); background: var(--panel); color: var(--ink); min-height: 32px; }
.own-num.on { background: var(--beam); color: var(--panel); border-style: solid; }
/* 持股時間軸滑桿 */
.tl-lab { margin: 14px 0 0; }
.tl-lab input[type="range"] { width: 100%; accent-color: var(--beam); min-height: 32px; }
/* 失敗恢復沙盒 */
.sb-steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 12px 0; }
.sb-steps li { padding: 6px 12px; border-radius: var(--r-pill); border: 1px solid var(--rule); font-size: calc(13px * var(--rd-fs)); }
.sb-steps li.done { color: var(--beam); border-color: color-mix(in srgb, var(--beam) 45%, var(--rule)); }
.sb-steps li.on { background: var(--beam); color: var(--panel); border-color: var(--beam); }
.sb-log { margin: 8px 0 0; padding-left: 1.4em; font-size: calc(13.5px * var(--rd-fs)); line-height: 1.75; max-height: 220px; overflow: auto; }
/* 一天泳道 */
.day-lane { list-style: none; margin: 10px 0 14px; padding: 0; border-left: 2px solid var(--rule); }
.day-lane li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 10px; padding: 6px 0 6px 14px; position: relative; line-height: 1.7; }
.day-lane li::before { content: ""; position: absolute; left: -6px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--beam); }
.day-lane time { font-family: "IBM Plex Mono", monospace; color: var(--muted); }
@media (max-width: 640px) {
  .rpt-row { grid-template-columns: 1fr; gap: 8px; }
  .rpt-k { width: 5.2em; }
  .rpt-compare { grid-template-columns: 1fr; }
  .tech-dialog.chat p { max-width: 100%; }
}

/* ---------- 寬鬆格線（2026/09/24 管理者：「一排放六格太過擠，本網站理念是寬鬆、排版舒適」） ----------
   原則：資訊卡一排最多三格、每格至少一百多 px；放不下就自動少排一格，不靠逐一寫斷點。
   寫法是 auto-fill 的最小寬度取「固定下限」與「三分之一欄寬」較大的那一個，所以螢幕再寬也不會塞回六格。
   一、技術說明六段步進器：一排六顆 → 三顆兩排（手機原本就是三顆）。
   二、技術說明即時數字：六格 → 一排三格（上面 .live-stats）。
   三、個股面板的持有與基本面：一排最多三格（原本 auto-fit 120px，寬螢幕一排四、五格），改成分開的圓角小卡。
   四、首頁四格大數字：每格不到約 300px 時改 2×2（1180px 以下；大字級更早）。 */
.tech-v45 .tech-steps { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-bottom: 16px; }
.tech-v45 .step-b { padding: 13px 12px; min-height: 48px; }
/* 原本是 1px 格線（整片灰底＋格子蓋上去），一排三格後最後一排沒排滿會露出灰色空格；改成分開的圓角小卡。 */
.kv-grid { grid-template-columns: repeat(auto-fill, minmax(max(150px, calc((100% - 24px) / 3)), 1fr));
  gap: 12px; background: none; border: 0; }
.kv-cell { padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--r-md); }
/* 版本沿革：被後來版本改掉的舊條目標一個琥珀色小標（I26） */
.ver-sup { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: var(--r-pill); line-height: 1.6;
  font-size: calc(12px * var(--rd-fs)); color: var(--wait); border: 1px solid color-mix(in srgb, var(--wait) 45%, transparent);
  background: color-mix(in srgb, var(--wait) 8%, var(--panel)); }
/* 小標籤不讓最後一個字單獨一行（C10：「平均未實現報酬」的「酬」） */
.tsum-i .k, .stat .k, .kv-cell .k, .live-stats span { text-wrap: balance; }
@media (max-width: 1180px) { .stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 1400px) { html[data-fs="l"] .stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 1700px) { html[data-fs="x"] .stats { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) {
  .led-pill, .optcard, .chartbar.seg .pill { transition: none; }
}
/* ---------- v58 持股追蹤取價（2026/09/24）：明講灰字與取價區間圖 ----------
   進場價＝進場日當日最低、出場價＝出場日當日最高；張震明講的價位放在價格下方一行灰字。
   區間圖：每一列一條「當日最低～最高」的淡色帶，實心點是採用的價，空心圈是明講價，進場與出場共用刻度。
   不加分隔線，列與列之間只靠留白分開。 */
.stated { display: block; margin-top: 3px; font-family: "Noto Sans TC", sans-serif; font-weight: 400;
  font-size: calc(11.5px * var(--rd-fs)); line-height: 1.45; letter-spacing: 0; color: var(--muted); white-space: normal; }
table.tbl-trk td.tentry .stated, table.tbl-trk td.tcur .stated { text-align: right; word-break: keep-all; overflow-wrap: normal; }
/* 價格欄多了一行灰字：88px 會把「明講 255 以上賣出」切成「以／上賣出」，放寬到 120px，灰字只在空格處斷行 */
.tbl-trk col.c-px { width: calc(120px * var(--rd-fs)); }
.pxrange { margin: 14px 0 2px; padding: 16px 20px 14px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--panel); }
.pxrange[hidden] { display: none; }
.pxr-h { font-size: calc(12px * var(--rd-fs)); font-weight: 600; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.pxr-row { display: grid; grid-template-columns: 4.4em minmax(0, 1fr) 9.5em; gap: 18px; align-items: center; padding: 10px 0; }
.pxr-k b { display: block; font-size: calc(13.5px * var(--rd-fs)); font-weight: 600; }
.pxr-k small, .pxr-v small { display: block; font-size: calc(11.5px * var(--rd-fs)); color: var(--muted); line-height: 1.5; }
.pxr-track { position: relative; height: 24px; }
.pxr-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px;
  border-radius: 2px; background: color-mix(in srgb, var(--muted) 16%, transparent); }
.pxr-band { position: absolute; top: 50%; height: 10px; margin-top: -5px; min-width: 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--beam) 24%, transparent); }
.pxr-dot, .pxr-ring { position: absolute; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; box-sizing: border-box; }
.pxr-dot { background: var(--beam); box-shadow: 0 0 0 3px var(--panel); }
.pxr-dot.pxr-now { background: var(--ink); }
.pxr-ring { border: 2px solid var(--muted); background: var(--panel); }
.pxr-v { text-align: right; min-width: 0; }
.pxr-v b { font-family: "IBM Plex Mono", monospace; font-size: calc(15px * var(--rd-fs)); font-weight: 600; }
.pxr-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 8px; font-size: calc(11.5px * var(--rd-fs)); color: var(--muted); }
.pxr-legend span { display: inline-flex; align-items: center; gap: 7px; }
.pxr-legend i { display: inline-block; flex: none; box-sizing: border-box; }
.pxr-dot-l { width: 10px; height: 10px; border-radius: 50%; background: var(--beam); }
.pxr-ring-l { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); }
.pxr-band-l { width: 22px; height: 7px; border-radius: 999px; background: color-mix(in srgb, var(--beam) 24%, transparent); }
@media (max-width: 560px) {
