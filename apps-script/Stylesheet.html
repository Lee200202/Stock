<style>
/* ==================================================================
   逐日檔案

   主角是日期與「他說了什麼」，不是行情。全站最重要的一句話是
   「本支影片未說明」，所以缺席不做成空白，做成被登記的事實。

   Signature：未說明帳。四類紀錄並排，講了是填滿方塊，沒講是斜線影線帶。

   紅漲綠跌沿用台股語彙。紅取印章紅、綠取帳簿綠，避開螢光。
   圖示一律用 Unicode 或內嵌 SVG，不載任何圖示庫。
   ================================================================== */

:root {
  --bg:       #E8EAE7;
  --panel:    #FDFDFC;
  --panel-2:  #F2F4F1;
  --ink:      #12161A;
  --muted:    #667069;
  --rule:     #CBD1CC;
  --rise:     #C41E28;
  --fall:     #04795C;
  --wait:     #8A6410;
  --note:     #1F6F8B;
  --beam:     #04795C;
  --shadow:   0 1px 0 rgba(18,22,26,.04);
  /* 內容欄寬拆成兩個變數：上限與左右留白。
     版面設定只動上限，手機版與窄螢幕只動留白，兩者互不干擾。
     合成一條 min() 寫死的話，任何一邊改了另一邊就整個被蓋掉。 */
  /* 前台的內容上限。加寬過一次：分頁列少了兩格（後台移到頂列、
     AI 助手做成浮動面板）之後，頂上不再擠，內容就可以吃多一點寬度——
     表格欄位少換行、逐日說明一行放得下更多字。
     後台的 --acolmax 不跟著動：那邊是表單，一行輸入框拉寬只會更難讀。 */
  --wrapmax:  1600px;
  --doc-col:   820px;   /* 長篇文件的欄寬，見「版面設定」那一段 */
  --wrappad:  4rem;
  --wrap:     min(var(--wrapmax), 100% - var(--wrappad));
  --gut:      2rem;
}

[data-theme="dark"] {
  --bg:       #0E1211;
  --panel:    #161C1A;
  --panel-2:  #1B2320;
  --ink:      #E3EAE6;
  --muted:    #86958D;
  --rule:     #232E29;
  --rise:     #FF5259;
  --fall:     #21C68C;
  --wait:     #DBA544;
  --note:     #6FC2D6;
  --beam:     #21C68C;
  --shadow:   none;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  background: var(--bg); color: var(--ink);
  font-family: "Noto Sans TC", -apple-system, "PingFang TC", sans-serif;
  font-size: calc(15px * var(--rd-fs)); line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  transition: background .4s ease, color .4s ease;
}

h1, h2, h3 { font-family: "Noto Serif TC", serif; font-weight: 700; margin: 0; letter-spacing: .01em; }
a { color: inherit; }
.mono, .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-feature-settings: "tnum" 1; }

.wrap { width: var(--wrap); margin-inline: auto; }
.bleed { width: 100%; }

/* ---------- 頂列 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--rule);
}
.topbar-in { display: flex; align-items: center; justify-content: space-between; height: 58px; }
.brand { display: flex; align-items: baseline; gap: 11px; min-width: 0; }
.brand-mark {
  font-family: "IBM Plex Mono", monospace; font-size: calc(10.5px * var(--rd-fs)); letter-spacing: .24em;
  color: var(--muted); text-transform: uppercase; white-space: nowrap;
}
.brand-name {
  font-family: "Noto Serif TC", serif; font-weight: 700; font-size: calc(16.5px * var(--rd-fs));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar-right { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
.stamp { font-family: "IBM Plex Mono", monospace; font-size: calc(11.5px * var(--rd-fs)); color: var(--muted); }

/* 窄螢幕的頂列。

   右邊現在是四組控制項（放大鏡、版面切換、齒輪、深淺色），
   加起來 198px，再配 12px 的間距就會把左邊的站名擠掉。
   先縮間距，再不夠就把「更新於 ⋯」收起來——那是最不影響操作的一個。

   但讀取失敗的訊息一定要留著：那是唯一會告訴人「你現在看到的數字不能信」
   的地方，把它跟時間戳一起藏掉，畫面就會安靜地顯示錯的東西。 */
@media (max-width: 720px) { .topbar-right { gap: 8px; } }
@media (max-width: 560px) { .topbar-right { gap: 6px; } .stamp { display: none; } }
html[data-view="mobile"] .topbar-right { gap: 6px; }
html[data-view="mobile"] .stamp { display: none; }
.stamp.err { display: inline !important; color: var(--rise); }

/* 頂列圖示按鈕的共用尺寸。

   高度、圓角、圖示大小寫成變數，因為頂列的每一顆都是同一組東西——
   改一個地方全部一起動。先前每顆各長各的（28、34、28 高，圖示
   15/17/13px 三種），排在一起像三個不同時期硬塞進去的按鈕。

   深淺色切換與手機／電腦切換的樣式已經拿掉：那兩顆收進齒輪的面板裡了，
   在那裡它們是兩列一般的分段控制項，不需要自己的一套外觀。 */
:root { --ctl-h: 34px; --ctl-r: 8px; --ctl-i: 17px; }

/* ---------- 主視覺 ---------- */
.hero { padding: 44px 0 26px; position: relative; overflow: hidden; }
.mui-dot-pattern {
  position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(var(--rule) 1px, transparent 1px);
  background-size: 24px 24px;
  mask-image: radial-gradient(ellipse 55% 75% at 10% 0%, #000 8%, transparent 72%);
  -webkit-mask-image: radial-gradient(ellipse 55% 75% at 10% 0%, #000 8%, transparent 72%);
}
.hero-grid {
  position: relative; display: grid; grid-template-columns: minmax(0,.85fr) minmax(0,1.15fr);
  gap: 44px; align-items: end;
}
.eyebrow {
  font-family: "IBM Plex Mono", monospace; font-size: calc(11px * var(--rd-fs)); letter-spacing: .2em;
  color: var(--muted); text-transform: uppercase;
}
/* 日期縮小。原本 116px 太搶戲，把它壓到跟標題同一個量級。 */
.bigdate {
  font-family: "IBM Plex Mono", monospace; font-weight: 500;
  font-size: calc(clamp(30px, 3.6vw, 48px) * var(--rd-fs)); line-height: 1; letter-spacing: -.03em;
  margin: 8px 0 0; display: block;
}
.bigdate .sl { color: var(--rule); margin: 0 2px; }
.hero h1 { font-size: calc(clamp(20px, 2vw, 26px) * var(--rd-fs)); line-height: 1.45; }
.hero .lede { color: var(--muted); margin: 8px 0 0; font-size: calc(14.5px * var(--rd-fs)); max-width: 40ch; }

/* ---------- Signature：未說明帳 ---------- */
.ledger { margin-top: 26px; border-top: 1px solid var(--rule); }
.led-row {
  display: grid; grid-template-columns: 70px 1fr 72px; align-items: center;
  gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule);
}
.led-k { font-size: calc(13px * var(--rd-fs)); color: var(--muted); }
.led-bar { height: 14px; display: flex; gap: 3px; overflow: hidden; }
.led-cell { flex: 0 0 auto; width: 24px; height: 100%; background: currentColor; }
.led-row.buy { color: var(--rise); } .led-row.sell { color: var(--fall); }
.led-row.watch { color: var(--wait); } .led-row.note { color: var(--note); }
.led-row.hold { color: var(--muted); }
.led-absent {
  flex: 1 1 auto; height: 100%; color: var(--muted);
  background: repeating-linear-gradient(45deg, transparent 0 5px, var(--rule) 5px 6px);
}
.led-n { font-family: "IBM Plex Mono", monospace; font-size: calc(12px * var(--rd-fs)); text-align: right; color: var(--muted); }
.led-bar > * { transform-origin: left center; animation: drawIn .5s cubic-bezier(.22,1,.36,1) both; }
.led-row:nth-child(1) .led-bar > * { animation-delay: .05s; }
.led-row:nth-child(2) .led-bar > * { animation-delay: .13s; }
.led-row:nth-child(3) .led-bar > * { animation-delay: .21s; }
.led-row:nth-child(4) .led-bar > * { animation-delay: .29s; }
.led-row:nth-child(5) .led-bar > * { animation-delay: .37s; }
.led-row:nth-child(4) .led-bar > * { animation-delay: .29s; }
@keyframes drawIn { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- 訊號帶 ---------- */
.signalband {
  position: relative; margin-top: 32px; background: var(--panel);
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  overflow: hidden;
}
.signalband::before, .signalband::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 100px; z-index: 2; pointer-events: none;
}
.signalband::before { left: 0; background: linear-gradient(90deg, var(--panel), transparent); }
.signalband::after { right: 0; background: linear-gradient(270deg, var(--panel), transparent); }
/* 訊號帶。一直往左捲，滑鼠移上去暫停。

   中間試過「預設不動、移上去才捲」，實際用起來不對：那條帶子是當天
   點名的所有個股，一眼掃過去就是它的用途，停著不動反而只看得到前幾檔。
   會動才知道後面還有東西。要細看時把滑鼠移上去就停住。 */
.mui-marquee { display: flex; width: max-content; animation: marquee 46s linear infinite; }
.band-copy { display: inline-flex; flex-shrink: 0; }
/* 滑鼠移上去停、手指按下去也停。

   只有 hover 的話，手機上那一排永遠在動，點的當下位置已經跑掉了，
   點不中或點到隔壁那一檔——而點錯一檔比點不到更糟。
   .is-held 由 pointerdown 掛上去，放開再拿掉。 */
.signalband:hover .mui-marquee,
.signalband.is-held .mui-marquee { animation-play-state: paused; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.chip {
  display: inline-flex; align-items: center; gap: 9px; padding: 11px 18px;
  border-right: 1px solid var(--rule); white-space: nowrap; cursor: pointer;
}
.chip:hover { background: var(--panel-2); }
.chip .tag {
  font-family: "IBM Plex Mono", monospace; font-size: calc(10px * var(--rd-fs)); letter-spacing: .1em;
  padding: 2px 6px; border: 1px solid currentColor;
}
.chip .nm { font-weight: 500; font-size: calc(14px * var(--rd-fs)); }
.chip .cd { font-family: "IBM Plex Mono", monospace; font-size: calc(12px * var(--rd-fs)); color: var(--muted); }
.chip .px { font-family: "IBM Plex Mono", monospace; font-size: calc(12.5px * var(--rd-fs)); }
.chip.buy .tag { color: var(--rise); } .chip.sell .tag { color: var(--fall); }
.chip.watch .tag { color: var(--wait); }
.chip.note .tag { color: var(--note); }
.chip.absent { color: var(--muted); cursor: default; }
.chip.absent:hover { background: none; }
.chip.absent .nm { text-decoration: line-through; text-decoration-thickness: 1px; }

/* ---------- 統計 ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule); }
.stat { background: var(--panel); padding: 18px var(--gut) 20px; }

/* 首頁四個數字（追蹤標的、目前持有、平均報酬、正報酬比例）。
   這是整個網站第一眼會看的東西，字級要撐得住。
   原本標題 12px、數字 26px，四欄並排時每格很窄，數字看起來偏小。

   數字用 clamp 做流體字級：視窗越寬字越大，但鎖在上下限之間。
   之所以不用固定值，是因為這一列從桌機的四欄到手機的兩欄，
   每格可用寬度差了三倍以上，固定字級不是在桌機顯得小就是在手機被擠爆。 */
.stat .k {
  font-size: calc(13px * var(--rd-fs)); color: var(--muted); font-weight: 600;
  letter-spacing: .04em; white-space: nowrap;
}
/* 數字本身包在 <span class="num"> 裡，所以選擇器要連 span 一起指定。
   只寫在外層的 .v 上，理論上 span 會繼承，但只要有任何一條規則
   （不論來自哪裡）碰到 .num 或 span 的 font-size，繼承就被切斷，
   而外層看起來仍然「有設定」，很難察覺。直接指定到底最保險。 */
.stats .stat .v,
.stats .stat .v .num {
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(clamp(28px, 3.4vw, 38px) * var(--rd-fs));
  font-weight: 500; line-height: 1.15;
  font-feature-settings: "tnum" 1;
  white-space: nowrap;
}
.stats .stat .v { margin-top: 5px; }
.stats .stat .u { font-size: calc(15px * var(--rd-fs)); color: var(--muted); margin-left: 4px; }

/* 樣式表版本標記。
   排查「改了為什麼沒生效」時，在瀏覽器主控台輸入：
     getComputedStyle(document.documentElement).getPropertyValue('--css-build')
   回傳這個字串就代表線上跑的是新版；回傳空白就是還沒重新部署，
   或瀏覽器拿的是快取。這比反覆猜測快得多。 */
:root { --css-build: "2026-08-15-reading-settings"; }

/* 收合清單。個股面板的逐日說明與紀錄表可能有幾十筆，
   全部攤開會長到捲不完，而使用者九成只想看最近幾天。 */
.is-hid { display: none !important; }
.moreb {
  display: block; width: 100%; margin-top: 10px; padding: 10px;
  border: 1px dashed var(--rule); background: transparent; color: var(--muted);
  font-family: inherit; font-size: calc(12.5px * var(--rd-fs)); cursor: pointer; border-radius: 6px;
  transition: background .15s ease, color .15s ease;
}
.moreb:hover { background: var(--panel-2); color: var(--ink); }
.basis { font-size: calc(12px * var(--rd-fs)); color: var(--muted); padding: 10px 0 0; }

/* ---------- 分頁 ---------- */
.tabbar { position: sticky; top: 58px; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--rule); }
.tabs { display: flex; }
.tab {
  appearance: none; border: none; background: transparent; cursor: pointer; font-family: inherit;
  font-size: calc(14.5px * var(--rd-fs)); color: var(--muted); padding: 13px 18px 12px; position: relative; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 7px;
}
.tab-i {
  width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  opacity: .8; transition: transform .2s ease, opacity .2s ease;
}
.tab:hover .tab-i { transform: translateY(-1px); opacity: 1; }
.tab[aria-selected="true"] .tab-i { opacity: 1; }
.tbl-daily tbody tr, .tbl-trk tbody tr, .tbl-rec tbody tr {
  animation: rowIn .32s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rowIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 500; }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--ink); animation: tabIn .3s cubic-bezier(.22,1,.36,1);
}
@keyframes tabIn { from { transform: scaleX(0); } to { transform: none; } }
.tab:focus-visible { outline: 2px solid var(--beam); outline-offset: -3px; }

.panel { padding: 36px 0 80px; }
/* hidden 要真的藏得住。

   瀏覽器內建的 [hidden] { display: none } 權重極低，任何一條作者寫的
   display 都蓋得過它——.readout 是 flex、.chartbar 是 flex，
   對它們設 el.hidden = true 完全沒有反應，元素照樣顯示。
   踩過一次：沒有日K時把圖表區藏起來，結果只藏掉圖，
   工具列與讀數列還留在原地。 */
[hidden] { display: none !important; }
.panel[hidden] { display: none; }
/* 切分頁的進場。

   先前是 .44s 的彈簧曲線加上 scale(.992)：整個畫面會先縮一點點再彈回來，
   每切一次分頁就晃一下。那個效果用在一顆按鈕上是活潑，用在整頁內容上
   只是讓人暈——而且切分頁是高頻動作，一天要看好幾次。

   改成單純的淡入加極小的上移，時間也砍到 .18s。 */
.panel:not([hidden]) { animation: panelIn .18s ease-out both; }
@keyframes panelIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 區塊 ---------- */
.sect { margin-bottom: 34px; }
.sect-h { display: flex; align-items: baseline; gap: 11px; margin-bottom: 12px; }
.sect-h h2 { font-size: calc(18px * var(--rd-fs)); }
.sect-h .n { font-family: "IBM Plex Mono", monospace; font-size: calc(11px * var(--rd-fs)); color: var(--muted); letter-spacing: .1em; }
.card { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 20px; }
.card:not(.flush):not(.scrollx) { transition: transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s ease; }
.card:not(.flush):not(.scrollx):hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.10); }

/* 逐日說明時間軸：最新在最上面，點一下展開 */
.tl { border-left: 2px solid var(--rule); margin-left: 6px; padding-left: 14px; }
.tl-i { position: relative; animation: tlIn .4s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes tlIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.tl-i::before {
  content: ""; position: absolute; left: -20px; top: 17px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--rule);
  transition: background .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
}
.tl-i.open::before { background: var(--ink); transform: scale(1.45); }
.tl-i:not(:last-child) { border-bottom: 1px solid var(--rule); }
.tl-h {
  appearance: none; border: none; background: transparent; cursor: pointer; font-family: inherit;
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 0; text-align: left;
  color: var(--ink);
}
.tl-h:hover .tl-tag { color: var(--ink); }
.tl-d { font-family: "IBM Plex Mono", monospace; font-size: calc(12.5px * var(--rd-fs)); color: var(--muted); flex: none; }
.tl-tag { font-size: calc(13.5px * var(--rd-fs)); color: var(--muted); transition: color .2s ease; }
.tl-new { font-size: calc(10.5px * var(--rd-fs)); color: var(--rise); border: 1px solid var(--rise);
          border-radius: 999px; padding: 1px 7px; letter-spacing: .04em; }
.tl-chev {
  margin-left: auto; width: 8px; height: 8px; flex: none;
  border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted);
  transform: rotate(45deg); transition: transform .28s cubic-bezier(.34,1.56,.64,1);
}
.tl-i.open .tl-chev { transform: rotate(-135deg); }
.tl-b {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows .32s cubic-bezier(.22,1,.36,1);
}
.tl-i.open .tl-b { grid-template-rows: 1fr; }
.tl-t {
  overflow: hidden; font-size: calc(14px * var(--rd-fs)); overflow-wrap: anywhere; color: var(--muted);
  opacity: 0; transition: opacity .25s ease .06s;
}
.tl-i.open .tl-t { opacity: 1; padding-bottom: 12px; }

/* 持股追蹤摘要 */
.tsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule);
        border: 1px solid var(--rule); margin: 12px 0 14px; }
.tsum-i { background: var(--panel); padding: 13px 16px; animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
.tsum-i:nth-child(2) { animation-delay: .07s; }
.tsum-i:nth-child(3) { animation-delay: .14s; }
/* 持股追蹤頁上方的三個數字。與首頁那四個是同一類東西，
   字級一起放大才不會一頁大一頁小。原本 21px 比首頁的還小一截。 */
.tsum-i .k { font-size: calc(13px * var(--rd-fs)); color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.tsum-i .v, .tsum-i .v .num {
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(clamp(26px, 2.6vw, 32px) * var(--rd-fs)); font-weight: 500;
  line-height: 1.15; font-feature-settings: "tnum" 1; white-space: nowrap; }
.tsum-i .v { margin-top: 4px; }
html[data-view="mobile"] .tsum { grid-template-columns: 1fr; }

/* 分頁切換時內容依序浮現 */
.panel:not([hidden]) .sect { animation: sectIn .45s cubic-bezier(.22,1,.36,1) both; }
.panel:not([hidden]) .sect:nth-child(1) { animation-delay: .02s; }
.panel:not([hidden]) .sect:nth-child(2) { animation-delay: .08s; }
.panel:not([hidden]) .sect:nth-child(3) { animation-delay: .14s; }
.panel:not([hidden]) .sect:nth-child(4) { animation-delay: .2s; }
.panel:not([hidden]) .sect:nth-child(n+5) { animation-delay: .26s; }
@keyframes sectIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* 切換鈕按下的回饋 */
.pill { transition: transform .14s cubic-bezier(.34,1.56,.64,1), background .2s ease, color .2s ease, border-color .2s ease; }
.pill[aria-pressed="true"] { transform: translateY(-1px); }

/* 骨架載入 */
.skel {
  background: linear-gradient(90deg, var(--panel-2) 25%, var(--rule) 37%, var(--panel-2) 63%);
  background-size: 400% 100%; animation: skelShine 1.4s ease infinite; border-radius: 3px;
}
@keyframes skelShine { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* 數字滾動收尾脈衝 */
.num { display: inline-block; transition: transform .18s ease; }
.num.ticking { transform: scale(1.07); }

/* 按壓回饋：點下去微微下沉，符合手感 */
button, .btn, .chip, .tab { transition: transform .12s cubic-bezier(.34,1.56,.64,1), background .2s ease, border-color .2s ease, color .2s ease; }
button:active, .btn:active, .chip:active, .tab:active { transform: translateY(1px) scale(.982); }

/* 統計卡：進場帶輕微過衝回彈，依序彈出 */
.stat { animation: popIn .52s cubic-bezier(.34,1.56,.64,1) both; }
.stat:nth-child(1) { animation-delay: .02s; }
.stat:nth-child(2) { animation-delay: .09s; }
.stat:nth-child(3) { animation-delay: .16s; }
.stat:nth-child(4) { animation-delay: .23s; }
@keyframes popIn {
  0%   { opacity: 0; transform: translateY(9px) scale(.96); }
  62%  { opacity: 1; transform: translateY(-3px) scale(1.012); }
  100% { transform: none; }
}

/* 買賣觀望晶片：彈出 */
.chip { animation: chipPop .42s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes chipPop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
.card.flush { padding: 0; }

.mui-border-beam { position: relative; overflow: hidden; }
.mui-border-beam::before {
  content: ""; position: absolute; inset: -1px; padding: 1px;
  background: conic-gradient(from var(--ang, 0deg), transparent 0 76%, var(--beam) 88%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 7s linear infinite; pointer-events: none;
}
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes spin { to { --ang: 360deg; } }

/* ---------- 表格 ---------- */
table { width: 100%; border-collapse: collapse; font-size: calc(14px * var(--rd-fs)); }
/* 內距跟著字級走。固定 10/14 的話，字級拉到最大時字變大、
   格子沒變，整張表就會擠成一團——這是「表格內容有點擠」的來源。 */
th, td {
  text-align: left;
  padding: calc(10px * var(--rd-fs)) calc(14px * var(--rd-fs));
  border-bottom: 1px solid var(--rule); vertical-align: top;
}
th { font-size: calc(11.5px * var(--rd-fs)); color: var(--muted); font-weight: 500; letter-spacing: .05em; background: var(--panel-2); white-space: nowrap; }
th.r, td.r { text-align: right; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable { cursor: pointer; transition: background .15s ease; }
tbody tr.clickable:hover { background: var(--panel-2); }
/* 點選後整列加深，不是只有股票名稱那一格。搭配 sticky 欄的規則，
   整列與 sticky 欄會一起變色。 */
tbody tr.clickable.active { background: var(--panel-2); }
tbody tr.clickable:active { background: var(--rule); }
td.code, td.px { font-family: "IBM Plex Mono", monospace; font-feature-settings: "tnum" 1; white-space: nowrap; }
.dir-buy { color: var(--rise); } .dir-sell { color: var(--fall); }
.dir-watch { color: var(--wait); } .dir-note { color: var(--note); }
.dir-hold { color: var(--beam); }
/* 方向色要能一眼掃過整格，而不是只染幾個字。色量刻意壓低，
   仍保留表格文字的對比與長時間閱讀舒適度。 */
td.dir-buy  { background: color-mix(in srgb, var(--rise) 10%, var(--panel)); }
td.dir-sell { background: color-mix(in srgb, var(--fall) 10%, var(--panel)); }
td.dir-watch{ background: color-mix(in srgb, var(--wait) 11%, var(--panel)); }
td.dir-note { background: color-mix(in srgb, var(--note) 11%, var(--panel)); }
td.dir-hold { background: color-mix(in srgb, var(--beam) 10%, var(--panel)); }
tr.tone-buy  { background: color-mix(in srgb, var(--rise) 4%, transparent); }
tr.tone-sell { background: color-mix(in srgb, var(--fall) 4%, transparent); }
tr.tone-watch{ background: color-mix(in srgb, var(--wait) 5%, transparent); }
tr.tone-note { background: color-mix(in srgb, var(--note) 5%, transparent); }
tr.tone-hold { background: color-mix(in srgb, var(--beam) 4%, transparent); }
.latest-sms { border: 1px solid color-mix(in srgb, var(--beam) 38%, var(--rule));
  background: color-mix(in srgb, var(--beam) 4%, transparent); padding: 18px; }
.latest-sms-meta { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  margin:0 0 10px; color:var(--muted); font-size:calc(12px * var(--rd-fs)); }
.latest-sms-meta b { color:var(--beam); font-family:"IBM Plex Mono", monospace;
  font-size:calc(13px * var(--rd-fs)); }
.latest-sms .smsitem { padding-bottom:0; }
.up { color: var(--rise); } .down { color: var(--fall); } .flat { color: var(--muted); }

.namecell { display: flex; align-items: center; gap: 7px; }
.namecell .arrow { color: var(--muted); font-size: calc(11px * var(--rd-fs)); opacity: 0; transition: opacity .2s, transform .2s; }
tr.clickable:hover .namecell .arrow { opacity: 1; transform: translateX(2px); }

.pillstate {
  font-size: calc(11px * var(--rd-fs)); padding: 2px 7px; border: 1px solid currentColor;
  font-family: "IBM Plex Mono", monospace; white-space: nowrap;
}
.pillstate.held { color: var(--rise); }
.pillstate.out { color: var(--muted); }

.empty {
  border: 1px solid var(--rule); background: var(--panel); padding: 20px;
  display: grid; grid-template-columns: 40px 1fr; gap: 16px; align-items: center;
}
.empty .hatch { height: 40px; background: repeating-linear-gradient(45deg, transparent 0 5px, var(--rule) 5px 6px); }
/* 「這一類今天沒有」的一行版本。用在每日總覽的四張表上——
   四張同時是空的很常見，四塊完整的空區塊會把整個首頁佔滿。 */
.emptyline {
  margin: 0; padding: 10px 14px; color: var(--muted);
  font-size: calc(13.5px * var(--rd-fs));
  border-left: 3px solid var(--rule); background: var(--panel-2);
}
.empty strong { display: block; font-weight: 500; font-size: calc(15px * var(--rd-fs)); }
.empty span { color: var(--muted); font-size: calc(13.5px * var(--rd-fs)); }

/* ---------- 表單 ---------- */
input[type="text"], input[type="email"], input[type="date"], input[type="number"], select {
  font-family: inherit; font-size: calc(14.5px * var(--rd-fs)); color: var(--ink); background: var(--panel);
  border: 1px solid var(--rule); border-radius: 0; padding: 10px 12px; width: 100%;
}
input:focus, select:focus { outline: 2px solid var(--beam); outline-offset: -1px; }
label { font-size: calc(13px * var(--rd-fs)); color: var(--muted); display: block; margin-bottom: 6px; }
.field { margin-bottom: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row > .grow { flex: 1 1 220px; }

button.act {
  font-family: inherit; font-size: calc(14.5px * var(--rd-fs)); cursor: pointer; border-radius: 0;
  background: var(--ink); color: var(--bg); border: 1px solid var(--ink); padding: 11px 22px;
}
button.act:focus-visible { outline: 2px solid var(--beam); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }

.mui-shimmer { position: relative; overflow: hidden; }
.mui-shimmer::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 38%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.26), transparent);
  transform: translateX(-160%); animation: shimmer 3s ease-in-out infinite;
}
@keyframes shimmer { 0% { transform: translateX(-160%);} 55%,100% { transform: translateX(330%);} }

.suggest { position: relative; }
.suggest-list {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 30;
  background: var(--panel); border: 1px solid var(--rule); border-top: none;
  max-height: 250px; overflow: auto;
}
.suggest-list div { padding: 9px 12px; cursor: pointer; font-size: calc(14px * var(--rd-fs)); display: flex; justify-content: space-between; gap: 12px; }
.suggest-list div:hover { background: var(--panel-2); }
.suggest-list .c { font-family: "IBM Plex Mono", monospace; color: var(--muted); }

.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label {
  display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 9px 13px;
  border: 1px solid var(--rule); background: var(--panel); cursor: pointer; color: var(--ink); font-size: calc(13.5px * var(--rd-fs));
}
.checks input { accent-color: var(--beam); }

.watchtags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.watchtag {
  font-size: calc(12.5px * var(--rd-fs)); border: 1px solid var(--rule); padding: 5px 9px;
  font-family: "IBM Plex Mono", monospace; display: inline-flex; gap: 8px; align-items: center;
}
.watchtag button { border: none; background: none; cursor: pointer; color: var(--muted); font-size: calc(14px * var(--rd-fs)); padding: 0; line-height: 1; }

.notice { font-size: calc(13px * var(--rd-fs)); color: var(--muted); margin-top: 10px; }
.notice.ok { color: var(--fall); } .notice.err { color: var(--rise); }

/* ---------- 個股詳情 ---------- */
.detail { position: fixed; inset: 0; z-index: 100; display: none; }
.detail.open { display: block; }
.detail-bg { position: absolute; inset: 0; background: rgba(10,14,12,.42); backdrop-filter: blur(3px); animation: fade .25s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
/* 個股抽屜。整片打開。

   走過兩版都不對：一開始是 inset: 0 0 0 max(0px, calc(50% - 720px))，
   寬螢幕左邊留下一大片什麼都沒有的遮罩；改成固定 760px 靠右之後遮罩沒了，
   但那一片內容——K 線、三張副圖、逐日說明、基本面——擠在螢幕右邊三分之一，
   圖表被壓扁，表格每一欄都要換行。

   這一頁的內容量本來就不是側邊欄裝得下的。改成整片打開，
   裡面再用 .wrap 把行長收在讀得完的範圍（那是內容欄該做的事，不是抽屜）。 */
.detail-panel {
  position: absolute; inset: 0;
  width: 100%;
  background: var(--bg); overflow-y: auto;
  animation: slideIn .24s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.detail-head {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--rule); padding: 16px var(--gut);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.detail-close {
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  cursor: pointer; width: 30px; height: 30px; font-size: calc(15px * var(--rd-fs)); line-height: 1; flex: 0 0 auto;
}
.detail-close:hover { background: var(--panel-2); }
.detail-body { padding: 24px var(--gut) 60px; }

.quotehead { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; margin-bottom: 16px; }
.quotehead .p { font-family: "IBM Plex Mono", monospace; font-size: calc(34px * var(--rd-fs)); font-weight: 500; line-height: 1; }
.quotehead .d { font-family: "IBM Plex Mono", monospace; font-size: calc(14.5px * var(--rd-fs)); }

.kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.kv-cell { background: var(--panel); padding: 12px 14px; }
.kv-cell .k { font-size: calc(11.5px * var(--rd-fs)); color: var(--muted); }
.kv-cell .v { font-family: "IBM Plex Mono", monospace; font-size: calc(17px * var(--rd-fs)); margin-top: 2px; }
.kv-cell .v.na { color: var(--muted); font-size: calc(14px * var(--rd-fs)); font-family: inherit; }
/* 跨整列的格子。抽屜上方要放一整句說明重點時用，
   不跨列的話那句話會被擠進一個窄格裡逐字換行。 */
.kv-cell.wide { grid-column: 1 / -1; }
/* 立場膠囊。顏色沿用表格裡的 dir-* 那一組，同一件事同一個顏色。 */
.stance {
  display: inline-block; padding: 3px 12px; border-radius: 999px;
  font-family: "Noto Sans TC", sans-serif; font-size: calc(14px * var(--rd-fs));
  font-weight: 600; border: 1px solid currentColor;
  background: color-mix(in srgb, currentColor 10%, transparent);
}

.chartbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.pill {
  font-size: calc(12.5px * var(--rd-fs)); padding: 6px 12px; border: 1px solid var(--rule); border-radius: 0;
  background: var(--panel); color: var(--ink); cursor: pointer; font-family: "IBM Plex Mono", monospace;
}
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* 資料不夠長的區間按鈕（v41）：看得到但按不了，滑過去有說明 */
.pill:disabled { opacity: .38; cursor: not-allowed; }
.pill:disabled[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--rule); }
.pill:focus-visible { outline: 2px solid var(--beam); outline-offset: 1px; }
#chart, #volChart, #macdChart, #kdChart { width: 100%; border: 1px solid var(--rule); background: var(--panel); }
/* 圖表高度（v38 拉高、v42 再拉高）：K 線 440→520、成交量 160→220、MACD／KD 170→220。
   成交量是 K 線下方獨立的一張（見 initCharts），中間隔一條「成交量　張」標題列。
   圖表函式庫在建立當下讀容器高度，之後不會自己跟著變，所以寫固定值、手機另給一組。 */
#chart { height: 520px; }
#volChart { height: 220px; border-top: none; }
#macdChart, #kdChart { height: 220px; border-top: none; }
@media (max-width: 600px) {
  #chart { height: 420px; }
  #volChart { height: 180px; }
  #macdChart, #kdChart { height: 180px; }
}
.subcap { font-size: calc(11.5px * var(--rd-fs)); color: var(--muted); letter-spacing: .04em; padding: 10px 2px 6px;
  border-top: 1px solid var(--rule); margin-top: 2px; }
.subcap span { color: var(--muted); opacity: .7; }
.subcap[hidden] { display: none; }
#volChart[hidden], #macdChart[hidden], #kdChart[hidden] { display: none; }
.paneslabel { font-size: calc(12px * var(--rd-fs)); color: var(--muted); margin-right: 2px; }
.panetag {
  position: absolute; font-family: "IBM Plex Mono", monospace; font-size: calc(11px * var(--rd-fs));
  color: var(--muted); pointer-events: none;
}
.readout {
  display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 14px;
  border: 1px solid var(--rule); border-top: none; background: var(--panel-2);
  font-family: "IBM Plex Mono", monospace; font-size: calc(12.5px * var(--rd-fs));
}
.readout span b { font-weight: 500; color: var(--muted); margin-right: 6px; }
.readout span i { font-style: normal; }

/* ---------- 技術說明 ---------- */
/* 技術說明：整塊置中，兩側留白。文字拉滿到欄寬，不再靠左擠成一條。 */
/* 技術說明改成滿版。原本鎖在 1080px，寬螢幕上左右各留一大片空白，
   而這一頁有不少表格與流程圖，寬度給足才看得清楚。
   內文段落另外用 max-width 控制行長，不會因為滿版而變得難讀。 */
/* 一份文件只有一個欄寬。

   之前是滿版，寬螢幕上一行會排到六十幾個字，而且頁面上同時存在五種寬度
   （滿版的標題與圖、94ch 的對話、62ch 的故事線、860px 的概念圖），
   左右邊界對不齊，看起來就是亂。現在全部對齊 --doc-col 這一組邊界。 */
/* 技術說明拉到整個版面寬。

   原本整份文件鎖在 --doc-col（760～980px），理由是「中文一行超過六十個字
   就讀不下去」——那個理由對「字」成立，對圖和表不成立。
   而這一頁有一半是圖：架構圖、魚骨圖、時間軸、對照表，
   它們被壓在 980px 裡，該看清楚的細節全糊在一起。

   所以拆開處理：容器吃滿整個版面，圖與表跟著吃滿；
   一段一段的文字仍然收在 --doc-col 的行寬內。
   兩者都靠左對齊，左邊界是同一條線，不會看起來像兩欄。 */
.doc { width: 100%; max-width: 100%; margin-inline: 0; }

/* 文字也吃滿整個版面。

   原本這裡把段落收在 --doc-col（760～980px），理由是「中文一行超過六十個字
   就讀不下去」。但實際看下來，這一頁的段落大多短，而被壓窄的代價是：
   摺疊區塊（想深究：後台怎麼用／其他）裡的內容縮在左邊一小塊，
   右邊一大片空白，與同一頁滿版的圖表左右邊界對不齊，反而更亂。

   改成滿版，可讀性交給行高（1.85）與左右對齊（justify）處理。 */
.doc p, .doc li, .doc h2, .doc h3, .doc h4,
.doc .eyebrow, .doc .tech-lede, .doc .sec-lede, .doc .tech-note,
.doc .qa p { max-width: 100%; }

/* 圖、表、卡片、折疊區塊吃滿整個版面——它們正是需要空間的那些 */
.doc figure, .doc .viz, .doc .arch, .doc .keytab, .doc table,
.doc .vow, .doc .ver, .doc details.devzone { max-width: 100%; }
.arch { border: 1px solid var(--rule); background: var(--panel); padding: 12px; margin: 18px 0 6px; overflow-x: auto; }
.arch svg { width: 100%; min-width: 720px; height: auto; display: block; overflow: visible; }
.keytab { overflow-x: auto; margin: 14px 0; border: 1px solid var(--rule); }
.keytab table { width: 100%; min-width: 560px; border-collapse: collapse; }
.keytab th { background: var(--panel-2); font-size: calc(12px * var(--rd-fs)); color: var(--muted); text-align: left; padding: 9px 12px; }
.keytab td { padding: 9px 12px; border-top: 1px solid var(--rule); font-size: calc(13.5px * var(--rd-fs)); vertical-align: top; }
.keytab code { font-size: calc(12px * var(--rd-fs)); }
.ver { display: grid; gap: 0; margin: 16px 0; border-left: 2px solid var(--rule); padding-left: 18px; }
.ver-i { position: relative; padding: 12px 0; }
.ver-i:not(:last-child) { border-bottom: 1px solid var(--rule); }
.ver-i::before { content: ""; position: absolute; left: -25px; top: 17px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--panel); border: 2px solid var(--beam); }
.ver-t { font-weight: 600; font-size: calc(14.5px * var(--rd-fs)); font-family: "Noto Sans TC", sans-serif; }
.ver-b { font-size: calc(13.5px * var(--rd-fs)); color: var(--muted); margin-top: 4px; text-align: justify; }
@media (prefers-reduced-motion: no-preference) {
  .ver-i { animation: verIn .5s cubic-bezier(.22,1,.36,1) both; }
  .ver-i:nth-child(2) { animation-delay: .05s; } .ver-i:nth-child(3) { animation-delay: .1s; }
  .ver-i:nth-child(4) { animation-delay: .15s; } .ver-i:nth-child(5) { animation-delay: .2s; }
  .ver-i:nth-child(6) { animation-delay: .25s; } .ver-i:nth-child(7) { animation-delay: .3s; }
  .ver-i:nth-child(8) { animation-delay: .35s; }
  @keyframes verIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
}
.doc > * { max-width: 100%; }
.doc p, .doc li { text-align: justify; text-justify: inter-ideograph; }
.doc h2 { border-top: 1px solid var(--rule); padding-top: 26px; }
.doc h2:first-of-type { border-top: none; padding-top: 0; }
.doc .author { width: 100%; }
.doc a { color: var(--beam); text-underline-offset: 3px; }
.doc h2 { font-size: calc(22px * var(--rd-fs)); margin: 44px 0 12px; }
.doc h3 { font-size: calc(16px * var(--rd-fs)); margin: 26px 0 8px; font-family: "Noto Sans TC", sans-serif; font-weight: 600; }
/* 技術說明頁的第四層標題。h3 之下還要再分小節時用（例如兩個 Secret 各自的取得步驟）。
   刻意做得比 h3 小一階、加一條左邊細線，讓層級一眼看得出來，
   不然三層標題字級太接近，讀者分不清誰包含誰。 */
.doc h4 {
  font-size: calc(14px * var(--rd-fs)); margin: 20px 0 8px; font-weight: 600;
  font-family: "Noto Sans TC", sans-serif; color: var(--ink);
  border-left: 3px solid var(--beam); padding-left: 10px;
}
.doc p { margin: 10px 0; }
.doc ul { padding-left: 20px; margin: 10px 0; }
.doc li { margin: 5px 0; }
.doc code {
  font-family: "IBM Plex Mono", monospace; font-size: calc(13px * var(--rd-fs));
  background: var(--panel-2); border: 1px solid var(--rule); padding: 1px 5px;
}
.doc .kv { border-left: 2px solid var(--rule); padding-left: 16px; color: var(--muted); font-size: calc(14px * var(--rd-fs)); }
.doc table { margin: 14px 0; border: 1px solid var(--rule); }

.flow { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 20px 0; }
.flow-step { background: var(--panel); padding: 16px 18px; display: grid; grid-template-columns: 40px 1fr; gap: 14px; }
.flow-step .i { font-family: "IBM Plex Mono", monospace; font-size: calc(12px * var(--rd-fs)); color: var(--muted); padding-top: 3px; }
.flow-step h4 { margin: 0 0 4px; font-size: calc(14.5px * var(--rd-fs)); font-weight: 600; }
.flow-step p { margin: 0; font-size: calc(13.5px * var(--rd-fs)); color: var(--muted); }

.qa { border-top: 1px solid var(--rule); }
.qa details { border-bottom: 1px solid var(--rule); }
/* summary 一定要吃滿整列。上一版把它一起收進 --doc-col 的可讀行寬，
   結果分隔線畫到 1328、加號卻停在 980，右邊空一大塊像沒對齊。
   問題本身都是一行短句，撐滿一列不會有讀不下去的問題。 */
.qa summary { cursor: pointer; list-style: none; padding: 16px 44px 16px 0; position: relative;
  width: 100%; max-width: none; font-size: calc(15px * var(--rd-fs)); font-weight: 500; }
.qa summary::-webkit-details-marker { display: none; }
.qa summary::after {
  content: "+"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  font-family: "IBM Plex Mono", monospace; font-size: calc(18px * var(--rd-fs)); color: var(--muted);
}
.qa details[open] summary::after { content: "\2212"; }
.qa summary:focus-visible { outline: 2px solid var(--beam); }
.qa .a { padding: 0 0 18px; color: var(--muted); font-size: calc(14px * var(--rd-fs)); animation: fadeDown .3s ease; }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.author { display: grid; grid-template-columns: 60px 1fr; gap: 18px; align-items: center; }
.author .av {
  width: 60px; height: 60px; border: 1px solid var(--rule); display: grid; place-items: center;
  font-family: "Noto Serif TC", serif; font-size: calc(23px * var(--rd-fs)); background: var(--panel-2);
}
.author .r { font-size: calc(13.5px * var(--rd-fs)); color: var(--muted); }

/* ---------- 聊天室 ---------- */
.chatwrap { width: 100%; }
.ask-log {
  min-height: 320px; max-height: 52vh; overflow-y: auto;
  padding: 18px; background: var(--panel-2);
  border: 1px solid var(--rule); margin-bottom: 12px;
}
.ask-log:empty::before {
  content: "說一聲就行，例如「幫我訂閱每日總覽」";
  color: var(--muted); font-size: calc(13.5px * var(--rd-fs));
}

.msg { display: grid; grid-template-columns: 46px 1fr; gap: 12px; margin-bottom: 16px; align-items: start; }
.msg.me { grid-template-columns: 1fr 46px; }
.msg.me .av-chat { grid-column: 2; }
.msg.me .bubble { grid-column: 1; grid-row: 1; }

.av-chat {
  width: 46px; height: 46px; border: 2px solid var(--rule); border-radius: 50%;
  background: var(--panel); display: grid; place-items: center; flex: 0 0 auto; overflow: hidden;
  animation: avPop .4s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes avPop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
.av-chat svg { width: 34px; height: 34px; }
.av-chat.av-bot { border-color: var(--beam); background: #EAF6FB; }
html[data-theme="dark"] .av-chat.av-bot { background: #12303c; }

.bubble {
  padding: 10px 13px; border: 1px solid var(--rule); background: var(--panel);
  font-size: calc(14px * var(--rd-fs)); line-height: 1.65; max-width: 46ch; word-break: break-word;
}
.msg.me .bubble { background: var(--ink); color: var(--bg); border-color: var(--ink); justify-self: end; }
.bubble.done { border-color: var(--fall); border-left-width: 2px; }
.bubble.refuse { border-style: dashed; color: var(--muted); }

.chatbar { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
@media (max-width: 620px) { .bubble { max-width: 100%; } }

/* 訂閱與管理改上下排。左右並排時兩張卡高度不一，右邊會浮在半空中。 */
.subgrid { display: grid; grid-template-columns: 1fr; gap: 20px; }
#perfChart { width: 100%; height: 380px; border: 1px solid var(--rule); background: var(--panel); }
/* 載入中的骨架屏。會掃光的橫紋至少講清楚「還在等，不是死了」——
   一個不動的空框加一行「載入中」，跟壞掉長得一模一樣。 */
#perfChart.is-loading {
  background:
    linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 6%, transparent), transparent)
      0 0 / 40% 100% no-repeat,
    repeating-linear-gradient(180deg, transparent 0 46px,
      color-mix(in srgb, var(--rule) 60%, transparent) 46px 47px) var(--panel);
  animation: shimmer 1.25s ease-in-out infinite;
}
@keyframes shimmer { from { background-position: -40% 0, 0 0; } to { background-position: 140% 0, 0 0; } }

/* 一行規則說明旁邊的問號。點開才顯示完整計算方式。 */
.whyb {
  border: 1px solid var(--rule); background: var(--panel); color: var(--muted);
  width: calc(17px * var(--rd-fs)); height: calc(17px * var(--rd-fs));
  border-radius: 50%; padding: 0; cursor: pointer; line-height: 1;
  font-size: calc(11px * var(--rd-fs)); font-family: inherit; vertical-align: middle;
}
.whyb:hover, .whyb[aria-expanded="true"] { color: var(--ink); border-color: var(--beam); }
.whytext {
  display: block; margin-top: 8px; padding: 10px 12px;
  border-left: 3px solid var(--rule); background: var(--panel-2);
  color: var(--muted); font-size: calc(12.5px * var(--rd-fs)); line-height: 1.75;
}

/* 手機電腦切換 */

/* 強制手機版：把版面寬度鎖在手機尺寸並置中，方便在電腦上預覽 */
/* 手機版的欄寬是固定的。這一條放在版面設定的欄寬規則之後，
   權重相同時後面的贏——選了手機版就以手機版為準，不受欄寬設定影響。 */
html[data-view="mobile"] { --wrapmax: 420px; --wrappad: 2rem; --gut: 1rem; }
html[data-view="mobile"] .hero-grid { grid-template-columns: 1fr; gap: 20px; align-items: start; }
html[data-view="mobile"] .stats { grid-template-columns: repeat(2, 1fr); }
html[data-view="mobile"] .stats .stat .v,
html[data-view="mobile"] .stats .stat .v .num { font-size: calc(30px * var(--rd-fs)); }
html[data-view="mobile"] .subgrid { grid-template-columns: 1fr; }
html[data-view="mobile"] .author { grid-template-columns: 1fr; }
html[data-view="mobile"] .brand-mark { display: none; }
html[data-view="mobile"] .tabs { overflow-x: auto; scrollbar-width: none; }
html[data-view="mobile"] .detail-panel { width: 100%; }
html[data-view="mobile"] .bigdate { font-size: calc(32px * var(--rd-fs)); }
html[data-view="mobile"] .led-cell { width: 17px; }
html[data-view="mobile"] body { background: var(--bg); }
html[data-view="mobile"] .bleed, html[data-view="mobile"] .signalband,
html[data-view="mobile"] .stats, html[data-view="mobile"] .tabbar {
  width: min(420px, 100% - 2rem); margin-inline: auto;
}

/* 助手 */
.askbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.askbar select { width: auto; min-width: 180px; padding: 7px 10px; font-size: calc(13px * var(--rd-fs)); }
.modelnote { font-size: calc(12px * var(--rd-fs)); color: var(--muted); flex: 1 1 auto; }
.draftbox {
  border: 1px solid var(--rule); background: var(--panel-2); padding: 10px 12px;
  margin-bottom: 12px; font-size: calc(12.5px * var(--rd-fs)); display: flex; flex-wrap: wrap; gap: 14px;
}
.draftbox b { color: var(--muted); font-weight: 500; margin-right: 5px; }
.draftbox .ok { color: var(--fall); }
.draftbox .no { color: var(--muted); }
.chips-hint { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips-hint button {
  font-size: calc(12.5px * var(--rd-fs)); padding: 5px 10px; border: 1px solid var(--rule);
  background: transparent; color: var(--muted); cursor: pointer;
}
.chips-hint button:hover { background: var(--panel-2); color: var(--ink); }
.bubble.done { border-color: var(--fall); }
.bubble.refuse { border-style: dashed; }

/* ---------- 表格橫向捲動，首欄固定 ---------- */
/* 手機上欄位塞不下。與其硬擠到每一欄都看不清楚，
   不如固定「股票名稱」，其餘右拉查看。 */
.card.scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }
/* 92 + 62 + 78 + 78 + 200（價位說明放寬後）= 510，
   再留給說明重點至少 360，所以整表最小 870。原本 780 是照舊欄寬算的，
   價位說明放寬後若不跟著調，說明重點就會被壓到只剩兩三個字寬。 */
/* min-width 一樣要跟著字級。不跟的話，字放大之後欄位總和已經超過
   這個下限，瀏覽器只好去壓那些 auto 欄，長文字欄就被擠到剩幾個字寬。 */
.card.scrollx table { min-width: calc(1000px * var(--rd-fs)); table-layout: fixed; }
.card.scrollx table.tbl-sms { min-width: calc(1080px * var(--rd-fs)); }

/* 四張總覽表用同一組欄寬，切換分頁時欄位不會跳來跳去 */
/* 2026/09/10 調整：把窄欄再收緊一點，並把整表的下限拉寬。

   說明重點與理由那兩欄是 auto，吃的是「整表下限扣掉所有固定欄」的剩餘。
   先前固定欄加起來吃掉五百多，剩給長文字欄的只有三百出頭，
   於是在手機上一行只放得下十三、四個中文字，一句話被切成五六行。

   窄欄本來就有餘裕可以收：代號永遠是四到六位數、漲跌幅永遠是
   正負兩位數加百分號、價位說明多半是「775 元以上」這種短句。
   收下來的寬度全部流向長文字欄，一行多放五到八個字，
   段落的行數就少三分之一。 */
/* 窄欄用固定 px（名稱、代號、價格就那麼寬，給再多也是浪費），
   兩個長文字欄改用百分比，這樣螢幕變寬時兩欄會一起變寬。
   先前價位說明鎖死在 200px、說明重點吃掉所有剩餘空間，
   結果是螢幕越寬右邊空白越多，而價位說明該換行的還是換行。 */
/* ⚠️ 這幾個寬度一定要乘上 --rd-fs。
   固定 px 的話，字級拉到最大（1.26 倍）時文字撐大了、欄位卻沒有，
   於是「觀望不碰」被拆成「觀望不／碰」、「2026/09/04」變成三行。
   名稱欄放寬至 132px，足額容納五個中文字（如「京元電子」「元大台灣50」）不換行。 */
.tbl-daily col.c-name   { width: calc(132px * var(--rd-fs)); }
.tbl-daily col.c-code   { width: calc( 62px * var(--rd-fs)); }
.tbl-sms col.c-dir      { width: calc(104px * var(--rd-fs)); }
.tbl-daily col.c-px     { width: calc(128px * var(--rd-fs)); }
.tbl-daily col.c-chg    { width: calc( 76px * var(--rd-fs)); }
.tbl-daily col.c-note   { width: calc(168px * var(--rd-fs)); }
.tbl-daily col.c-reason { width: auto; }
/* 只有「說明重點」「理由」這種長文字欄才允許任意斷行；
   股票名稱、代號、價格欄一律不換行，否則會被逐字擠成直排。 */
.tbl-daily td, .tbl-daily th { white-space: nowrap; }
.tbl-sms td.smsdir { font-weight: 700; }
.tbl-daily td.reason { white-space: normal; overflow-wrap: anywhere; }

/* ---------- 價位說明欄溢位修正 ---------- */
/* 症狀：「張震發訊息給會員，告知 255 以上鴻海全部賣掉」這種長敘述，
   會整段壓過去蓋住右邊的說明重點，兩欄的字疊在一起。

   成因有三個，缺一不可，所以三個都要處理：
     1. 這一欄原本套用 .px，而 td.px 是 white-space: nowrap，長句不換行。
     2. table-layout: fixed 之下，內容超出欄寬並不會把欄位撐開，
        而是直接溢出到相鄰欄的位置上。
     3. 沒有 overflow 限制，溢出的部分就這樣畫在隔壁欄的文字上面。

   所以價位說明改用專屬的 .pxnote，不再沿用 .px：允許換行、允許任意斷點
   （「255以上鴻海全部賣掉」中間沒有空格，不設 anywhere 斷不開），
   欄寬由 110px 放寬到 200px，並補一道 overflow: hidden 當最後一層保險。 */
.tbl-daily td.pxnote, .tbl-rec td.pxnote {
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
  overflow: hidden;
  font-size: calc(12.5px * var(--rd-fs));
  line-height: 1.55;
  vertical-align: top;
}
/* reason 欄同樣補上 overflow 保險。它本來就會換行，
   但萬一出現一長串沒有斷點的字元，仍可能溢到表格外。 */
.tbl-daily td.reason, .tbl-trk td.reason, .tbl-rec td.reason {
  overflow: hidden; vertical-align: top;
}
/* 兩欄之間補一條細分隔線。就算未來又有東西溢出，
   至少看得出來是兩欄，不會誤以為是同一段話。 */
.tbl-daily td.pxnote { border-right: 1px solid var(--rule); }

/* 價位說明裡的補充標註（例如「參考價位」）縮小另起一行，
   不與價格本身擠在同一行。 */
.pxnote .pxsub {
  display: block; font-size: calc(11px * var(--rd-fs)); color: var(--muted); margin-top: 3px;
}

.tbl-trk col.c-name   { width: calc(132px * var(--rd-fs)); }
.tbl-trk col.c-code   { width: calc( 62px * var(--rd-fs)); }
/* 狀態欄要放得下「已出場 第 2 回合」，76px 會把回合標籤擠掉，改 132px */
.tbl-trk col.c-state  { width: calc(128px * var(--rd-fs)); }
.tbl-trk col.c-date   { width: calc(104px * var(--rd-fs)); }
.tbl-trk col.c-num    { width: calc( 64px * var(--rd-fs)); }
/* 進場價欄要放得下「168.00 參 1420.00」這種帶參考價的標註。
   實測那串在預設字級下需要 142px，原本卻只給 104——
   也就是說它在預設字級就已經在換行了，不用等到把字放大。 */
.tbl-trk col.c-px     { width: calc(152px * var(--rd-fs)); }
.tbl-trk col.c-ret    { width: calc( 92px * var(--rd-fs)); }
/* 最後一欄改 auto，讓它吃掉剩餘寬度，而不是固定 300 後由瀏覽器
   把多出來的空間平均塞給每一欄（那會讓代號欄莫名其妙變得很寬）。 */
.tbl-trk col.c-reason { width: auto; }
.tbl-trk td, .tbl-trk th { white-space: nowrap; }
.tbl-trk td.reason { white-space: normal; overflow-wrap: anywhere; }
/* 96+66+132+104+62+104+104+96+62+300 = 1126，取 1140 留一點餘裕。
   整表寬度超過手機視窗，由 .scrollx 提供水平滾動，欄位不會被擠成一團。 */
.card.scrollx table.tbl-trk { min-width: calc(1280px * var(--rd-fs)); }

/* 個股詳情的「影片中提到的每一次」。抽屜最寬可到 1440px，
   若價位說明維持固定 210px，寬螢幕下它照樣換行、而說明重點右邊空一大片。
   改成百分比，兩個文字欄一起隨寬度成長。 */
.tbl-rec col.c-date   { width: calc(112px * var(--rd-fs)); }
.tbl-rec col.c-dir    { width: calc( 96px * var(--rd-fs)); }
.tbl-rec col.c-px     { width: calc(168px * var(--rd-fs)); }
.tbl-rec col.c-reason { width: auto; }
/* anywhere 只給長文字欄。原本整張表都吃 anywhere，
   於是日期與方向欄一旦塞不下就從中間斷開——
   「觀望不／碰」「2026/／09/04」都是這樣來的。
   短欄位寧可讓它撐出去（外層 .scrollx 會給水平捲軸），也不要斷在字中間。 */
.tbl-rec td.pxnote, .tbl-rec td.reason { overflow-wrap: anywhere; }
.tbl-rec th, .tbl-rec td.code, .tbl-rec td[class^="dir-"] { white-space: nowrap; }
/* 108 + 92 = 200 固定，其餘由兩個文字欄分。最小 720 時
   價位說明約 245、說明重點約 275，都還讀得下去。 */
.card.scrollx table.tbl-rec { min-width: calc(840px * var(--rd-fs)); }

/* 個股查詢的結果表。六欄，比 tbl-rec 多了股票名稱與代號。
   它原本連 class 都沒有，欄寬完全交給瀏覽器——名稱與方向欄一被壓縮
   就從字中間斷開。跟其他表用同一套：窄欄固定並跟著字級縮放，
   長文字欄吃剩下的寬度。 */
.tbl-find col.c-date   { width: calc(112px * var(--rd-fs)); }
.tbl-find col.c-name   { width: calc(132px * var(--rd-fs)); }
.tbl-find col.c-code   { width: calc( 62px * var(--rd-fs)); }
.tbl-find col.c-dir    { width: calc( 96px * var(--rd-fs)); }
.tbl-find col.c-px     { width: calc(112px * var(--rd-fs)); }
.tbl-find col.c-reason { width: auto; }
.tbl-find th, .tbl-find td.code, .tbl-find td[class^="dir-"] { white-space: nowrap; }
.tbl-find td.pxnote, .tbl-find td.reason { white-space: normal; overflow-wrap: anywhere; vertical-align: top; }
.card.scrollx table.tbl-find { min-width: calc(940px * var(--rd-fs)); }
.card.scrollx th.sticky, .card.scrollx td.sticky {
  position: sticky; left: 0; z-index: 2;
  border-right: 1px solid var(--rule);
}
/* sticky 欄的底色必須跟同一列其他欄完全一致，否則它會永遠深一階，
   看起來就像跑版。平常用 panel，hover 與點選中改用 panel-2。
   因為 sticky 欄是不透明的（要蓋住捲動的內容），所以每一個狀態
   都得明確指定，不能靠透明讓底下的 tr 背景透出來。 */
.card.scrollx tbody td.sticky { background: var(--panel); }
.card.scrollx th.sticky { background: var(--panel-2); z-index: 3; }
.card.scrollx tbody td.sticky.dir-buy  { background: color-mix(in srgb, var(--rise) 10%, var(--panel)); }
.card.scrollx tbody td.sticky.dir-sell { background: color-mix(in srgb, var(--fall) 10%, var(--panel)); }
.card.scrollx tbody td.sticky.dir-watch{ background: color-mix(in srgb, var(--wait) 11%, var(--panel)); }
.card.scrollx tbody td.sticky.dir-note { background: color-mix(in srgb, var(--note) 11%, var(--panel)); }
.card.scrollx tbody td.sticky.dir-hold { background: color-mix(in srgb, var(--beam) 10%, var(--panel)); }
.card.scrollx tbody tr.clickable:hover td.sticky,
.card.scrollx tbody tr.active td.sticky { background: var(--panel-2); }
.card.scrollx::-webkit-scrollbar { height: 8px; }
.card.scrollx::-webkit-scrollbar-thumb { background: var(--rule); }
.card.scrollx::-webkit-scrollbar-track { background: transparent; }

/* 數字欄越窄越好，一律不換行 */
/* 說明重點的最小寬度不在這裡設。三張表都是 table-layout: fixed，
   欄寬由 colgroup 的百分比決定，在 td 上加 min-width 只會在窄螢幕
   把欄位撐出容器、蓋掉水平捲動的效果。要調寬度請改上面的 col 規則。 */
td.px, th.px, td.code, th.code { white-space: nowrap; }
th.w-narrow, td.w-narrow { width: 1%; white-space: nowrap; }

.scroll-hint {
  font-size: calc(11.5px * var(--rd-fs)); color: var(--muted); margin: 6px 0 0;
  display: none; align-items: center; gap: 5px;
}
@media (max-width: 900px) { .scroll-hint { display: flex; } }
html[data-view="mobile"] .scroll-hint { display: flex; }

/* ---------- 分頁列可拖曳 ---------- */
.tabs {
  overflow-x: auto; scrollbar-width: none; cursor: grab;
  scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs.dragging { cursor: grabbing; scroll-behavior: auto; }
.tabbar { position: sticky; top: 58px; z-index: 50; background: var(--bg);
  border-bottom: 1px solid var(--rule); }
.tabbar::after {
  content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 36px;
  background: linear-gradient(270deg, var(--bg), transparent); pointer-events: none;
  opacity: 0; transition: opacity .2s;
}
.tabbar.overflowing::after { opacity: 1; }

/* 金鑰閘門 */
.keygate { }
.howto { border-top: 1px solid var(--rule); margin-top: 18px; }
.howto summary {
  cursor: pointer; list-style: none; padding: 14px 30px 14px 0;
  position: relative; font-size: calc(14px * var(--rd-fs)); font-weight: 500;
}
.howto summary::-webkit-details-marker { display: none; }
.howto summary::after {
  content: "+"; position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  font-family: "IBM Plex Mono", monospace; font-size: calc(17px * var(--rd-fs)); color: var(--muted);
}
.howto details[open] summary::after, .howto[open] summary::after { content: "\2212"; }
.howto .a { padding: 0 0 16px; color: var(--muted); font-size: calc(13.5px * var(--rd-fs)); }
.howto ol, .howto ul { padding-left: 20px; margin: 8px 0; }
.howto li { margin: 5px 0; }
.howto a { color: var(--beam); }
.howto b { color: var(--ink); }

/* ---------- 主視覺母題 ---------- */
/* 一支聲波打進來，變成 K 線，最後成為一張紀錄卡。
   這是這個網站在做的事，用抽象圖形講，不畫任何人。 */
.motif { width: 240px; max-width: 100%; height: auto; margin-bottom: 14px; overflow: visible; }
.motif g { fill: none; stroke-linecap: round; }
.m-wave path { stroke: var(--muted); stroke-width: 1.6; }
.m-wave path:nth-child(1) { animation: waveP 2.4s ease-in-out infinite; }
.m-wave path:nth-child(2) { animation: waveP 2.4s ease-in-out .2s infinite; }
.m-wave path:nth-child(3) { animation: waveP 2.4s ease-in-out .4s infinite; }
@keyframes waveP { 0%,100% { opacity:.3; transform: scaleY(.6); } 50% { opacity:1; transform: scaleY(1.3); } }
.m-wave path { transform-origin: center 48px; }

.m-bars rect:nth-child(1), .m-bars line:nth-child(2) { stroke: var(--rise); fill: var(--rise); }
.m-bars rect:nth-child(3), .m-bars line:nth-child(4) { stroke: var(--rise); fill: var(--rise); }
.m-bars rect:nth-child(5), .m-bars line:nth-child(6) { stroke: var(--fall); fill: var(--fall); }
.m-bars rect:nth-child(7), .m-bars line:nth-child(8) { stroke: var(--rise); fill: var(--rise); }
.m-bars line { stroke-width: 1.2; }
.m-bars > * { transform-origin: center 48px; animation: barIn .5s cubic-bezier(.22,1,.36,1) both; }
.m-bars > *:nth-child(1), .m-bars > *:nth-child(2) { animation-delay: .3s; }
.m-bars > *:nth-child(3), .m-bars > *:nth-child(4) { animation-delay: .42s; }
.m-bars > *:nth-child(5), .m-bars > *:nth-child(6) { animation-delay: .54s; }
.m-bars > *:nth-child(7), .m-bars > *:nth-child(8) { animation-delay: .66s; }
@keyframes barIn { from { transform: scaleY(0); opacity: 0; } to { transform: none; opacity: 1; } }

.m-card rect { stroke: var(--ink); stroke-width: 1.4; }
.m-card line { stroke: var(--muted); stroke-width: 1.4; }
.m-card { animation: cardIn .6s cubic-bezier(.22,1,.36,1) .8s both; transform-origin: 204px 48px; }
@keyframes cardIn { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.m-card line:nth-child(4) { stroke-dasharray: 22; animation: draw 1.2s ease 1.2s both; }
@keyframes draw { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }

.m-dash line { stroke: var(--rule); stroke-width: 1.2; stroke-dasharray: 3 3; }
.m-dash line { animation: flow 1.4s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -12; } }

/* ---------- 頂列橫條的呼吸 ---------- */
.brand-mark { position: relative; }
.brand-mark::after {
  content: ""; position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 4px; background: var(--fall);
  animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

/* ---------- 助手 ---------- */
/* 金鑰欄位：等寬字、明顯的輸入框，貼上時看得出來有沒有貼全 */
#keyInput {
  font-family: "IBM Plex Mono", monospace; font-size: calc(13px * var(--rd-fs)); letter-spacing: .02em;
  background: var(--panel-2); border: 1px solid var(--rule); padding: 12px 14px;
}
#keyInput:focus { background: var(--panel); }
#keyInput::placeholder { color: var(--rule); letter-spacing: 0; }
.keyrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
@media (max-width: 700px) { .keyrow { grid-template-columns: 1fr; } }
.keygate { width: 100%; }
#p-assistant .sect { width: 100%; }
.keycard { }

/* 思考動畫：三根 K 棒此起彼落，跟主視覺母題同一套語彙 */
.thinking { display: inline-flex; align-items: flex-end; gap: 3px; height: 14px; }
.thinking i {
  width: 3px; background: var(--muted); display: block;
  animation: think 1s ease-in-out infinite;
}
.thinking i:nth-child(1) { height: 6px;  animation-delay: 0s; }
.thinking i:nth-child(2) { height: 12px; animation-delay: .12s; }
.thinking i:nth-child(3) { height: 8px;  animation-delay: .24s; }
.thinking i:nth-child(4) { height: 14px; animation-delay: .36s; }
@keyframes think { 0%,100% { transform: scaleY(.4); opacity: .4; } 50% { transform: scaleY(1); opacity: 1; } }
.thinking i { transform-origin: bottom; }
.bubble.thinkbox { display: flex; align-items: center; gap: 10px; color: var(--muted); }

sup.src {
  font-size: calc(9px * var(--rd-fs)); color: var(--wait); margin-left: 2px; vertical-align: super;
  border: 1px solid currentColor; padding: 0 2px; font-family: "Noto Sans TC", sans-serif;
}
.srcnote { font-size: calc(11px * var(--rd-fs)); color: var(--muted); margin-left: 6px; font-family: "Noto Sans TC", sans-serif; }

footer { border-top: 1px solid var(--rule); padding: 26px 0 52px; color: var(--muted); font-size: calc(12.5px * var(--rd-fs)); }

.mui-blur-fade { opacity: 0; filter: blur(6px); transform: translateY(10px); }
.mui-blur-fade.in { opacity: 1; filter: none; transform: none; transition: all .55s cubic-bezier(.22,1,.36,1); }

/* ---- 更多頁面轉場 ---- */
/* 個股查詢、訂閱、AI 助手等區塊卡片，載入時依序浮現 */
.sect .card { animation: cardRise .5s cubic-bezier(.22,1,.36,1) both; }
@keyframes cardRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* 詳情抽屜內各區塊依序滑入，讓開啟更有層次 */
.detail-body .sect { animation: drawerSect .5s cubic-bezier(.22,1,.36,1) both; }
.detail-body .sect:nth-child(1) { animation-delay: .04s; }
.detail-body .sect:nth-child(2) { animation-delay: .11s; }
.detail-body .sect:nth-child(3) { animation-delay: .18s; }
.detail-body .sect:nth-child(4) { animation-delay: .25s; }
.detail-body .sect:nth-child(n+5) { animation-delay: .32s; }
@keyframes drawerSect { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* 鍵值格逐一淡入 */
.kv-grid .kv-cell { animation: kvIn .42s cubic-bezier(.22,1,.36,1) both; }
.kv-grid .kv-cell:nth-child(2) { animation-delay: .05s; }
.kv-grid .kv-cell:nth-child(3) { animation-delay: .1s; }
.kv-grid .kv-cell:nth-child(4) { animation-delay: .15s; }
.kv-grid .kv-cell:nth-child(n+5) { animation-delay: .2s; }
@keyframes kvIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 分頁底線滑動：切換時底線從舊位置滑到新位置的感覺（用內容淡入強化） */
.chartbar .pill, .tabbar-sub .pill { transition: transform .16s cubic-bezier(.34,1.56,.64,1), background .2s, color .2s, border-color .2s; }

/* 輸入框聚焦時邊框柔和放大 */
input, textarea, select { transition: border-color .2s ease, box-shadow .2s ease; }
input:focus, textarea:focus, select:focus { border-color: var(--beam); box-shadow: 0 0 0 3px color-mix(in srgb, var(--beam) 18%, transparent); }

/* 建議清單項目依序滑入 */
.suggest-list div { animation: suggIn .26s ease both; }
.suggest-list div:nth-child(2) { animation-delay: .03s; }
.suggest-list div:nth-child(3) { animation-delay: .06s; }
.suggest-list div:nth-child(4) { animation-delay: .09s; }
.suggest-list div:nth-child(n+5) { animation-delay: .12s; }
@keyframes suggIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .mui-marquee, .mui-shimmer::after, .mui-border-beam::before { animation: none; }
  .m-wave path, .m-bars > *, .m-card, .m-card line, .m-dash line,
  .brand-mark::after, .thinking i { animation: none; }
  .mui-blur-fade { opacity: 1; filter: none; transform: none; }
  .led-bar > *, .panel:not([hidden]), .tab[aria-selected="true"]::after,
  .detail-panel, .detail-bg { animation: none; }
  .tbl-daily tbody tr, .tbl-trk tbody tr, .tbl-rec tbody tr { animation: none; }
  .skel { animation: none; }
  .card:not(.flush):not(.scrollx):hover { transform: none; }
  .num.ticking { transform: none; }
  .stat, .chip, .tsum-i, .tl-i { animation: none; }
  .panel:not([hidden]) .sect { animation: none; }
  .tl-b { transition: none; }
  .panel:not([hidden]), .hero .motif, .hero .bigdate, .hero .eyebrow,
  .tab[aria-selected="true"] .tab-i { animation: none; }
  .stat:hover::after { animation: none; }
  tbody tr.clickable td.sticky::before { transition: none; }
  .sect .card, .detail-body .sect, .kv-grid .kv-cell, .suggest-list div { animation: none; }
  .pill[aria-pressed="true"] { transform: none; }
  button:active, .btn:active, .chip:active, .tab:active { transform: none; }
  * { transition: none !important; }
}

@media (max-width: 900px) {
  /* 窄螢幕只縮留白，不碰上限——上限由使用者的欄寬設定決定，
     而 min() 本來就會讓「100% - 留白」在小螢幕上勝出。 */
  :root { --wrapmax: 100%; --wrappad: 2rem; --gut: 1rem; }
  .hero-grid { grid-template-columns: 1fr; gap: 22px; align-items: start; }
  .hero { padding: 30px 0 20px; }
  /* 兩欄之後每格變寬，數字可以再放大一級。 */
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat { padding: 16px var(--gut) 18px; }
  .stats .stat .v, .stats .stat .v .num { font-size: calc(clamp(30px, 7.5vw, 40px) * var(--rd-fs)); }
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .author { grid-template-columns: 1fr; }
  .led-row { grid-template-columns: 58px 1fr 60px; gap: 12px; }
  .led-cell { width: 17px; }
  .brand-mark { display: none; }
  .detail-panel { width: 100%; }
}

/* AI 助手：金鑰列滿版、與聊天同一視窗 */
.asst { display: flex; flex-direction: column; gap: 14px; }
.keybar { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; width: 100%; }
.keybar-l { font-size: calc(12.5px * var(--rd-fs)); color: var(--muted); white-space: nowrap; }
.keybar input { width: 100%; }
.keybar-help { font-size: calc(12.5px * var(--rd-fs)); white-space: nowrap; }
.keybar-ok { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%;
  padding: 8px 10px; border: 1px solid var(--rule); background: var(--panel-2); }
.keybar-ok .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rise); flex: none;
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--rise) 60%, transparent); animation: dotPulse 2s infinite; }
@keyframes dotPulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rise) 55%, transparent); }
  70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.keybar-ok .spacer { flex: 1; }
.keybar-msg { margin: 2px 0 0; }
@media (max-width: 620px) {
  .keybar { grid-template-columns: 1fr; }
  .keybar-l { display: none; }
}

.chatwin { border: 1px solid var(--rule); background: var(--panel); padding: 14px; }
/* 對話區高度。
   原本 220px 起跳、上限 52vh，在桌機上對話框只佔螢幕一半不到，
   下方留一大片空白，訊息一多就要在小框裡捲。
   改成以視窗高度為基準，讓它撐滿可用空間。 */
.chatwin .ask-log {
  min-height: min(58vh, 560px);
  max-height: 72vh;
  overflow-y: auto; padding-right: 4px;
}
@media (max-width: 720px) {
  /* 手機上鍵盤會吃掉不少高度，留少一點給對話區才不會被擠壓。 */
  .chatwin .ask-log { min-height: 46vh; max-height: 62vh; }
}

/* 頭像選擇器 */
.avatar-pick { border: 1px solid var(--rule); background: var(--panel-2); padding: 12px 14px;
  animation: kvIn .3s ease both; }
.ap-label { font-size: calc(12.5px * var(--rd-fs)); color: var(--muted); }
.ap-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
.ap-i { border: 2px solid transparent; border-radius: 12px; padding: 6px; cursor: pointer;
  display: grid; place-items: center; transition: transform .15s cubic-bezier(.34,1.56,.64,1); }
.ap-i:hover { transform: translateY(-2px) scale(1.05); }
.ap-i.on { transform: scale(1.06); }
.ap-i svg { width: 34px; height: 40px; }
@media (max-width: 620px) { .ap-grid { grid-template-columns: repeat(4, 1fr); } }
@media (prefers-reduced-motion: reduce) {
  .av-chat, .avatar-pick { animation: none; }
  .keybar-ok .dot { animation: none; }
  .ap-i:hover, .ap-i.on { transform: none; }
}

/* 頁首視覺區只在每日總覽顯示 */
#overviewTop[hidden] { display: none; }
#overviewTop { animation: topIn .5s cubic-bezier(.22,1,.36,1) both; }
@keyframes topIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }


/* ---- 追加轉場（第三輪）---- */
/* 面板切換：內容從右側輕滑入 */
.panel:not([hidden]) { animation: panelSlide .42s cubic-bezier(.22,1,.36,1) both; }
@keyframes panelSlide { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

/* hero 母題與大日期進場 */
.hero .motif { animation: heroFloat .7s cubic-bezier(.34,1.56,.64,1) both; }
.hero .bigdate { animation: heroFade .6s ease .1s both; }
.hero .eyebrow { animation: heroFade .6s ease .05s both; }
@keyframes heroFloat { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes heroFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 統計數字底線掃過 */
.stat { position: relative; overflow: hidden; }
.stat::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
  background: linear-gradient(90deg, transparent, var(--beam), transparent);
  transform: translateX(-100%); }
.stat:hover::after { animation: statSweep .8s ease; }
@keyframes statSweep { to { transform: translateX(100%); } }

/* 訊號帶晶片進場後微微呼吸 */
.signalband .mui-marquee { will-change: transform; }

/* 分頁 icon 在被選中時輕彈 */
.tab[aria-selected="true"] .tab-i { animation: tabIcon .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes tabIcon { 0% { transform: scale(.7) rotate(-8deg); } 60% { transform: scale(1.12); } 100% { transform: none; } }

/* 表格列漣漪：滑鼠移入時左緣出現一道細線 */
/* 表格列 hover 左緣細線。
   注意：偽元素若加在 <tr> 上，在 table 版面會被當成一個匿名儲存格，
   把第一個真正的 <td> 擠到第二欄，造成整列右移、首格空白、末欄溢出。
   所以改加在第一個 sticky <td> 上，那是合法儲存格，不會佔欄位。 */
.card.scrollx tbody td.sticky { position: sticky; }
.card.scrollx tbody tr.clickable td.sticky::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--beam); transform: scaleX(0); transform-origin: left;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1);
}
.card.scrollx tbody tr.clickable:hover td.sticky::before,
.card.scrollx tbody tr.clickable.active td.sticky::before { transform: scaleX(1); }

/* 按鈕通用波紋回饋（點擊時中心微亮） */
.act, .pill { position: relative; overflow: hidden; }
.act::after, .pill::after { content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at center, currentColor 0%, transparent 60%);
  opacity: 0; transition: opacity .3s ease; pointer-events: none; }
.act:active::after, .pill:active::after { opacity: .12; transition: none; }





/* 管理：立即刷新 */
.admin-refresh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
.admin-refresh input { padding: 9px 12px; border: 1px solid var(--rule); background: var(--panel);
  color: var(--ink); border-radius: 6px; min-width: 200px; font: inherit; }
.admin-msg { font-size: calc(13px * var(--rd-fs)); color: var(--muted); }


/* ---------------- 日曆（郵件查詢與翻到某一天共用） ---------------- */
/* 原本 max-width 卡在 460px，在桌機上縮在左邊一小塊，右邊一大片空白。
   改成置中滿版：寬度吃滿容器，格子跟著等比放大，日期數字也才看得清楚。
   同一組樣式現在由兩個分頁共用（郵件查詢、每日總覽的翻到某一天），
   所以任何調整只要改這裡一處，兩邊就一致。 */
.mailcal-wrap { width: 100%; margin-bottom: 18px; display: flex; justify-content: center; }
/* 日曆在特寬時會被拉得很扁，格子高度沒跟著長，看起來像被壓扁。
   給它一個上限，超過就置中留白。 */
.mailcal { max-width: 720px; }
.mailcal {
  border: 1px solid var(--rule); background: var(--panel); padding: 20px 22px;
  width: 100%; max-width: 100%; box-sizing: border-box; border-radius: 12px;
}
.mailcal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.mailcal-title { font-weight: 600; font-size: calc(16px * var(--rd-fs)); font-family: "Noto Sans TC", sans-serif; min-width: 140px; text-align: center; }
.mailcal-nav { width: 34px; height: 34px; border: 1px solid var(--rule); background: var(--panel-2);
  cursor: pointer; font-size: calc(18px * var(--rd-fs)); color: var(--ink); border-radius: 6px; line-height: 1;
  transition: background .15s ease; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.mailcal-nav:hover { background: var(--panel); }
.mailcal-nav:disabled { opacity: .3; cursor: not-allowed; }
.mailcal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-w { text-align: center; font-size: calc(12px * var(--rd-fs)); color: var(--muted); padding: 6px 0; font-weight: 600; }
/* 滿版之後格子會變得很寬。用 aspect-ratio 1 會讓整個日曆高得誇張，
   所以改成固定最小高度、寬度自適應，維持接近方形但不會過高。 */
.cal-c { min-height: 46px; border: none; background: transparent; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
.cal-c.empty { visibility: hidden; }
.cal-c.day { border: 1px solid transparent; border-radius: 8px; cursor: default; }
.cal-n { font-size: calc(14px * var(--rd-fs)); font-variant-numeric: tabular-nums; color: var(--muted); }
.cal-c.has { cursor: pointer; background: color-mix(in srgb, var(--beam) 8%, transparent);
  border-color: color-mix(in srgb, var(--beam) 30%, transparent); transition: all .15s ease; }
.cal-c.has .cal-n { color: var(--ink); font-weight: 600; }
.cal-c.has:hover { background: color-mix(in srgb, var(--beam) 18%, transparent); transform: translateY(-1px); }
.cal-c.has.sel { background: var(--beam); }
.cal-c.has.sel .cal-n { color: #fff; }
/* 沒有紀錄的日期。

   先前是 opacity .35 疊在 --muted 上，算出來與背景的對比不到 1.6:1，
   在稍微反光的螢幕上整排數字幾乎看不見——那不是「不強調」，是看不到。
   改成一個實際的顏色，對比拉到 4.5:1 以上（WCAG AA 的內文標準），
   看得到但仍然明顯比有紀錄的日期弱。 */
.cal-c.none .cal-n { color: color-mix(in srgb, var(--ink) 55%, var(--bg)); }
/* 今天用虛線框標出來，方便定位。有資料時的實線框不受影響。 */
.cal-c.today { border-style: dashed; border-color: var(--muted); }
.cal-c.has.today { border-style: solid; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--beam); margin-top: 3px; }
.cal-c.has.sel .cal-dot { background: #fff; }
.mailcal-legend { margin-top: 14px; font-size: calc(12px * var(--rd-fs)); color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dot-has, .dot-none { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.dot-has { background: color-mix(in srgb, var(--beam) 30%, transparent); }
.dot-none { background: var(--rule); margin-left: 8px; }

/* 窄螢幕：格子再縮一點，避免七欄擠不下 */
@media (max-width: 560px) {
  .mailcal { padding: 14px 12px; }
  .mailcal-grid { gap: 4px; }
  .cal-c { min-height: 38px; }
  .cal-n { font-size: calc(13px * var(--rd-fs)); }
}

/* 導覽列的「後台」是連結不是按鈕，外觀要與其他分頁一致。
   text-decoration 與 color 必須明寫，否則會被瀏覽器的預設連結樣式蓋掉。 */
a.tab.tab-link {
  text-decoration: none; color: inherit;
  display: inline-flex; align-items: center;
}
a.tab.tab-link:hover { color: var(--ink); }

/* 多回合標的的累積報酬。放在本回合報酬下方一行小字，
   兩者意義不同：本回合是現在這一段，累積是同一筆錢滾過每一段的結果。 */
.cumret { display: block; font-size: calc(10.5px * var(--rd-fs)); margin-top: 2px; opacity: .85; }

/* ---------------- 逐字稿 ---------------- */
.txbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; padding: 14px 16px;
  border: 1px solid var(--rule); background: var(--panel-2); margin-bottom: 16px;
}
.txsub { color: var(--muted); font-size: calc(12.5px * var(--rd-fs)); margin-left: 10px; }
.txtag {
  font-size: calc(11.5px * var(--rd-fs)); color: var(--beam); border: 1px solid var(--beam);
  border-radius: 99px; padding: 3px 10px;
}
/* 只有原始稿時用另一個顏色標示，讓人知道這份還沒潤飾過。 */
.txtag.raw { color: var(--wait); border-color: var(--wait); margin-right: 8px; }
.ghostb {
  padding: 8px 16px; border: 1px solid var(--ink); background: transparent;
  color: var(--ink); font-family: inherit; font-size: calc(13px * var(--rd-fs)); cursor: pointer;
  border-radius: 6px; font-weight: 600;
}
.ghostb:hover { background: var(--ink); color: var(--panel); }
.ghostb:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- 閱讀設定 ---------- *
   字級、行寬、行距全部走 CSS 變數，切換時只換變數不動結構。
   預設值分手機與桌機兩套：手機目前的版面是合適的，維持 15px 與滿寬；
   桌機則放大到 18px 並把欄寬拉到 92ch，因為 74ch 在寬螢幕上
   會變成一條又細又長的柱子，每行只有二十幾個字，讀起來很累。
   使用者選過之後，屬性選擇器的優先權高於這裡的預設，兩邊都會被覆蓋。 */
.txbody {
  --tx-fs: 15px;
  --tx-lh: 1.95;
  --tx-w: 100%;
  max-width: var(--tx-w);
}
@media (min-width: 900px) {
  .txbody { --tx-fs: 18px; --tx-w: 92ch; }
}

/* 版面設定改掛在 html 上。

   面板本來夾在逐字稿的內文上方，只有翻到那一頁才看得到，而且很多人
   根本沒發現它是可以調的。現在移到頂列的齒輪，那個位置從任何一頁都按得到，
   所以設定值也要放在一個「任何一頁都讀得到」的地方——html 元素上，
   跟深淺色與手機版用同一個做法。

   欄寬只作用在逐字稿：郵件內容裡有表格，把容器縮窄會讓表格擠成一團。
   字距與行距兩個長文區塊都套用。 */
/* 逐字稿的欄寬。

   預設仍然自己收在 92ch，那是長篇中文舒服的字數上限，也是沒有人動過
   任何設定時該有的樣子。但使用者一旦自己選了欄寬，就以那個為準——
   外層 .wrap 已經照設定收窄了，這裡再收一次會變成兩層縮排，
   選「窄」時字會擠在畫面中間一小條。 */
html[data-w] .txbody { --tx-w: 100%; }

html[data-lh="t"] .txbody { --tx-lh: 1.7; }
html[data-lh="m"] .txbody { --tx-lh: 1.95; }
html[data-lh="l"] .txbody { --tx-lh: 2.35; }

/* 字距。中文本來就沒有詞間空白，一整段密排的繁體字讀久了容易黏在一起，
   把字距拉開一點對長篇逐字稿的幫助比放大字級還明顯。
   數值刻意保守：超過 .09em 之後字會散開成一顆一顆，反而更難讀。 */
.txbody { --tx-ls: 0; }
html[data-ls="m"] .txbody { --tx-ls: 0; }
html[data-ls="w"] .txbody { --tx-ls: .02em; }
html[data-ls="x"] .txbody { --tx-ls: .04em; }

/* 郵件內容也是長文，字距與行距一起套用。 */
html[data-ls="w"] .mail-content { letter-spacing: .02em; }
html[data-ls="x"] .mail-content { letter-spacing: .04em; }
html[data-lh="t"] .mail-content { line-height: 1.62; }
html[data-lh="l"] .mail-content { line-height: 2.1; }

.txh {
  font-size: calc(var(--tx-fs) * 0.86 * var(--rd-fs)); font-weight: 600; margin: 26px 0 8px;
  padding-left: 10px; border-left: 3px solid var(--beam);
  font-family: "Noto Sans TC", sans-serif;
}
.txsec p {
  margin: 0 0 calc(var(--tx-fs) * 0.85);
  line-height: var(--tx-lh); font-size: calc(var(--tx-fs) * var(--rd-fs));
  letter-spacing: var(--tx-ls);
  text-align: justify; overflow-wrap: anywhere;
}
.txsec p:last-child { margin-bottom: 0; }


/* ==================================================================
   版面設定：內容欄寬、字距、行距

   三軸都掛在 html 上（data-w / data-ls / data-lh），由頂列的齒輪切換，
   前台與後台共用同一份 Settings.html，所以兩邊必然一致。

   欄寬動的是 --wrapmax，而 .wrap 是每一個分頁的外層容器，後台的 .acol
   也是收在 .wrap 裡面，所以一改就是全站生效，不必逐頁處理。

   字距與行距只套在「讀的文字」上，不套在整個 body。
   套 body 的話按鈕、分頁列、輸入框、圖表座標都會跟著跑，
   那不是版面設定該做的事——把導覽列的字距拉開只會讓它擠不下。
   ================================================================== */

/* 加 :not([data-view="mobile"]) 是為了不依賴檔案裡的先後順序。

   手機版那一條的權重與這幾條完全一樣（0,1,1），同權重時後面的贏，
   而它們的相對位置會隨著改版飄移——今天手機版在後面，明天插一段就在前面了，
   那時「選了手機版卻被欄寬設定蓋掉」會突然冒出來，而且看不出是誰改壞的。
   寫成互斥就永遠不會有這個問題。

   --acolmax 是後台內容欄的上限。後台是表單頁，用不到前台那種 1440px，
   但欄寬設定既然說「適用所有分頁」，後台也要跟著動。 */
/* --doc-col 是技術說明那種長篇文件的欄寬。它跟著欄寬設定走，但幅度小得多：
   表單頁寬一點只是舒服，長篇文字寬一點會直接變得讀不下去
   （中文一行超過六十個字，讀到行尾就找不到下一行的開頭）。 */
/* 後台的 --acolmax 改成跟著 --wrapmax 走，不再另外收窄。

   原本刻意收窄，理由是「後台是表單頁，一行輸入框拉寬只會更難讀」。
   那個理由只對輸入框成立，而後台上面還有進度條、逐日編輯的表格、
   會員簡訊的清單——那些被壓在 880px 裡，右邊一大片空白，
   進度條的每一格擠成一團，表格則要橫向捲。
   真正該收窄的是輸入框本身，那個在 .field input 上單獨處理就好。 */
html[data-w="n"]:not([data-view="mobile"]) { --wrapmax: 1100px; --acolmax: 1100px; --doc-col: 1100px; }
html[data-w="m"]:not([data-view="mobile"]) { --wrapmax: 1400px; --acolmax: 1400px; --doc-col: 1400px; }
html[data-w="w"]:not([data-view="mobile"]) { --wrapmax: 1700px; --acolmax: 1700px; --doc-col: 1700px; }
html[data-w="x"]:not([data-view="mobile"]) { --wrapmax: 2000px; --acolmax: 2000px; --doc-col: 2000px; }

:root { --rd-fs: 1; --rd-ls: 0; --rd-lh: 1.75; }
html[data-fs="s"] { --rd-fs: .92; }
html[data-fs="m"] { --rd-fs: 1; }
/* v54：字級改成 100／125／150%（Codex 規格 52），字距最多 .04em。 */
html[data-fs="l"] { --rd-fs: 1.25; }
html[data-fs="x"] { --rd-fs: 1.5; }
html[data-ls="m"] { --rd-ls: 0; }
html[data-ls="w"] { --rd-ls: .02em; }
html[data-ls="x"] { --rd-ls: .04em; }
html[data-lh="t"] { --rd-lh: 1.6; }
html[data-lh="m"] { --rd-lh: 1.75; }
html[data-lh="l"] { --rd-lh: 2.05; }

/* 內文。這份清單涵蓋每一個分頁真正在讀的那些字：
   總覽的說明、追蹤與績效的註記、個股面板的逐日與理由、郵件內容、
   技術說明、版本沿革，以及後台每一張卡片的說明與提示。
   刻意不包含表格的數字欄與程式碼——那些要對齊，拉開字距只會更難看。 */
.notice, .kv, .hint, .tip li, .srcnote, .pnote,
.sect > p, .card > p, .card li, .ver-b, .scen-b p,
.tl-t, .mail-content p, .mail-content li, .txset-hint,
.panel p, .panel li, .mprev, .erow-b .e-reason,
td.reason, .rec-r td.reason {
  letter-spacing: var(--rd-ls);
  line-height: var(--rd-lh);
}

/* 標題也跟著字距走，但行距不跟——標題的行距是版面節奏的一部分，
   跟著內文一起放大會讓每一節之間的間隔忽大忽小。 */
h1, h2, h3, h4, .sect-h h2, .card h2 { letter-spacing: var(--rd-ls); }

/* 版面設定面板裡，被停用的那一列（手機版時的欄寬）要看得出來。 */
.txset-row.is-off { opacity: .4; }
.txset-row.is-off .segs button { cursor: not-allowed; }
/* ---------- 版面設定（頂列下拉） ---------- */

/* 頂列的方形圖示按鈕：齒輪（版面設定）、放大鏡（個股查詢）、屋子（回首頁）。

   全部走同一條規則，不是各寫各的。它們並排在同一列，只要有一顆的高度、
   圓角或圖示大小差幾個像素，整排就會看起來像不同時期硬塞進去的東西——
   而尺寸都吃 --ctl-h / --ctl-r / --ctl-i，改一個地方三顆一起動。

   .tbtn 也用在 <a> 上（回首頁是連結不是按鈕），所以要寫 text-decoration。 */
.setbtn, .tbtn {
  width: var(--ctl-h); height: var(--ctl-h);
  border: 1px solid var(--rule); background: var(--panel);
  color: var(--muted); cursor: pointer; border-radius: var(--ctl-r); padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  flex: 0 0 auto; text-decoration: none; box-sizing: border-box;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.setbtn svg, .tbtn svg {
  width: var(--ctl-i); height: var(--ctl-i); fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}
.setbtn:hover, .tbtn:hover { color: var(--ink); border-color: var(--muted); }
.setbtn:focus-visible, .tbtn:focus-visible {
  outline: 2px solid var(--beam); outline-offset: 2px;
}
/* 展開中的齒輪、以及正在看的個股查詢，用同一種「目前就在這裡」的外觀 */
.setbtn[aria-expanded="true"], .tbtn[aria-pressed="true"] {
  color: var(--ink); border-color: var(--beam);
  background: color-mix(in srgb, var(--beam) 10%, transparent);
}

.setwrap { position: relative; }

/* 下拉面板。定位在按鈕正下方靠右，窄螢幕時改成貼齊右邊界，
   否則在手機上會有一半跑到畫面外面。 */
.setmenu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
  width: min(320px, calc(100vw - 24px));
  border: 1px solid var(--rule); background: var(--panel);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .18); border-radius: 10px;
  padding: 14px 16px;
  animation: panelIn .18s cubic-bezier(.22, 1, .36, 1) both;
  /* 六列在矮螢幕（橫放的手機、小筆電）上會超出視窗，而面板是絕對定位，
     超出去的部分沒有任何辦法捲到。給它一個上限與自己的捲動。 */
  max-height: calc(100vh - 80px);
  overflow-y: auto;
}
.setmenu[hidden] { display: none; }
.setmenu-h {
  font-size: calc(12px * var(--rd-fs)); font-weight: 600; color: var(--muted);
  letter-spacing: .08em; margin-bottom: 12px;
  font-family: "Noto Sans TC", sans-serif;
}

/* 面板裡的每一列。原本是內嵌在文章上方的 .txset，樣式沿用，
   只是容器換了——所以兩處的外觀不會各自長歪。 */
.txset { border: 0; background: transparent; padding: 0; margin: 0; }
.txset-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 10px; flex-wrap: wrap;
}
.txset-row:last-child { margin-bottom: 0; }
.txset-l {
  font-size: calc(12.5px * var(--rd-fs)); color: var(--muted); font-weight: 600;
  min-width: 58px; letter-spacing: .05em;
}
.segs { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
/* 下拉面板只有 320px 寬，四個選項一列排不下，讓它自己換行。 */
.setmenu .txset-row { align-items: flex-start; gap: 8px; margin-bottom: 12px; }
.setmenu .txset-l { min-width: 100%; margin-bottom: 2px; }
.setmenu .segs { display: flex; width: 100%; }
.setmenu .segs button { flex: 1 1 0; padding: 7px 6px; text-align: center; }
.segs button {
  padding: 7px 15px; border: none; background: var(--panel); color: var(--muted);
  font-family: inherit; font-size: calc(13px * var(--rd-fs)); cursor: pointer;
  border-right: 1px solid var(--rule); transition: background .15s ease, color .15s ease;
}
.segs button:last-child { border-right: none; }
.segs button:hover { background: var(--panel-2); color: var(--ink); }
.segs button[aria-pressed="true"] {
  background: var(--beam); color: #fff; font-weight: 600;
}
.txset-hint { font-size: calc(11.5px * var(--rd-fs)); color: var(--muted); margin: 10px 0 0; }

/* 出場原因是唯一會有兩句話的欄位（確認期提醒＋期間轉過觀望不碰）。
   兩句擠在一行會變成一片沒有斷點的文字牆，所以拆成兩行，
   第二行以後縮排一格，看得出是同一欄的續行而不是新的一欄。 */
.exl { display: block; }
.exl + .exl { margin-top: 6px; padding-left: 8px; border-left: 2px solid var(--rule); }


/* ---------- 技術說明：情境圖卡 ----------
   每一張是「某個真的出過的錯」：症狀、原因、現在怎麼處理，配一張小圖。
   圖用 inline SVG 而不是圖檔：顏色吃 CSS 變數，深淺色切換不必準備兩份，
   也不會多一次網路請求。 */
.scen { display: grid; gap: 14px; margin: 18px 0 26px; }
@media (min-width: 900px) {
  .scen { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* 第一張跨兩欄當引子，其餘兩兩並排。 */
  .scen-i:first-child { grid-column: 1 / -1; }
}
html[data-view="mobile"] .scen { grid-template-columns: 1fr; }
html[data-view="mobile"] .scen-i:first-child { grid-column: auto; }

.scen-i {
  border: 1px solid var(--rule); background: var(--panel);
  border-radius: 10px; overflow: hidden;
}
.scen-h {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--rule);
  background: var(--panel-2);
}
.scen-h h4 { margin: 0; font-size: calc(14px * var(--rd-fs)); font-weight: 600; font-family: "Noto Sans TC", sans-serif; }
.scen-n {
  font-family: "IBM Plex Mono", monospace; font-size: calc(11px * var(--rd-fs)); font-weight: 500;
  color: var(--beam); border: 1px solid color-mix(in srgb, var(--beam) 40%, transparent);
  border-radius: 5px; padding: 2px 6px; flex: none;
}
.scen-b { padding: 14px 16px; }
.scen-b p { margin: 0 0 8px; font-size: calc(13px * var(--rd-fs)); line-height: 1.75; color: var(--ink); }
.scen-b p:last-child { margin-bottom: 0; }
.scen-b b {
  font-weight: 600; color: var(--muted); font-size: calc(12px * var(--rd-fs));
  margin-right: 6px; letter-spacing: .04em;
}

/* 圖本身。寬度吃滿卡片，高度依 viewBox 比例縮放。 */
.scen-g { width: 100%; height: auto; display: block; margin-bottom: 12px; }
.scen-g .g-l { font-size: calc(9px * var(--rd-fs)); fill: var(--muted); letter-spacing: .06em;
               font-family: "Noto Sans TC", sans-serif; }
.scen-g .g-t { font-size: calc(10.5px * var(--rd-fs)); fill: var(--ink); font-family: "Noto Sans TC", sans-serif; }
.scen-g .g-s { font-size: calc(9px * var(--rd-fs)); fill: var(--muted); font-family: "Noto Sans TC", sans-serif; }
.scen-g .g-box { fill: var(--panel-2); stroke: var(--rule); stroke-width: 1; rx: 5; }
