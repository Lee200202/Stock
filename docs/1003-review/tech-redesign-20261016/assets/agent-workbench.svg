<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">控制程式在原稿、模型和工具之間核對</title><desc id="d">左邊原稿視窗提供證據，中間控制程式保存狀態並驗證，右上模型提出候選，右下工具回覆資料。箭頭表示往返，模型不直接寫入資料庫。</desc><rect width="1200" height="620" rx="30" fill="#e3ece6"/><g fill="#f8fbf7" stroke="#789985" stroke-width="2"><rect x="45" y="175" width="290" height="300" rx="24"/><rect x="430" y="110" width="330" height="390" rx="24"/><rect x="865" y="60" width="290" height="220" rx="24"/><rect x="865" y="340" width="290" height="220" rx="24"/></g><g stroke="#b6cbbd" fill="none"><path d="M45 235h290M430 175h330M865 120h290M865 400h290"/></g><g fill="none" stroke="#0b8b5f" stroke-width="4"><path d="M335 315h95m-14-8 14 8-14 8M760 210c55 0 50-50 105-50m-14-8 14 8-14 8M865 230c-55 0-55 55-105 55m14-8-14 8 14 8M760 370c55 0 55 70 105 70m-14-8 14 8-14 8M865 500c-55 0-55-60-105-60m14-8-14 8 14 8"/></g><g fill="#193d2c" font-family="system-ui,sans-serif"><text x="70" y="216" font-size="25" font-weight="700">原稿視窗</text><text x="70" y="280" font-size="21">甲股今天可以買</text><text x="70" y="325" font-size="19">原句、日期與公司</text><text x="70" y="420" font-size="17">不可變來源與指紋</text><text x="455" y="153" font-size="26" font-weight="700">控制程式 / harness</text><text x="460" y="240" font-size="23">準備本股材料</text><text x="460" y="305" font-size="23">核對引句與語意</text><text x="460" y="370" font-size="23">驗工具結果與權限</text><text x="460" y="455" font-size="19">先核對，再決定是否發布</text><text x="890" y="100" font-size="25" font-weight="700">模型候選</text><text x="890" y="170" font-size="21">整理／推論／提工具請求</text><text x="890" y="225" font-size="18">輸出仍須核對</text><text x="890" y="380" font-size="25" font-weight="700">工具回覆</text><text x="890" y="450" font-size="21">資料與執行結果</text><text x="890" y="505" font-size="18">控制程式檢查後採用</text></g></svg>
