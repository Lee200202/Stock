<script>
/* 純計算核心：日量單位為張，門檻不代表買賣建議；不使用模型或遠端 API。 */
(function (w) {
  'use strict';
  function number(v) { return v !== null && v !== '' && v !== undefined && isFinite(Number(v)) ? Number(v) : null; }
  function day(v) { var m = String(v || '').match(/^(\d{4})[/-](\d{2})[/-](\d{2})/); return m ? m[1] + '/' + m[2] + '/' + m[3] : ''; }
  function cleanPrefs(input) {
    if (w.BattleSettings) return w.BattleSettings.sanitize(input);
    var cfg = w.BATTLE_CONFIG, p = Object.assign({}, cfg.defaults), x = input || {};
    Object.keys(p).forEach(function (k) {
      if (typeof p[k] === 'boolean') { if (typeof x[k] === 'boolean') p[k] = x[k]; }
      else if (cfg.limits[k]) { var v = number(x[k]); if (v !== null && v >= cfg.limits[k][0] && v <= cfg.limits[k][1]) p[k] = v; }
      else if (cfg.periods[k]) { if (cfg.periods[k].indexOf(Number(x[k])) >= 0) p[k] = Number(x[k]); }
      else if (k === 'direction' && ['up', 'down'].indexOf(x[k]) >= 0) p[k] = x[k];
      else if (k === 'logic' && ['all', 'any'].indexOf(x[k]) >= 0) p[k] = x[k];
      else if (k === 'volumeMode' && ['actual', 'estimate'].indexOf(x[k]) >= 0) p[k] = x[k];

  }
  function valid(b) {
    return b && day(b.date) && ['open', 'high', 'low', 'close'].every(function (k) { return number(b[k]) > 0; }) &&
      number(b.volume) !== null && number(b.volume) >= 0 && b.high >= Math.max(b.open, b.close) && b.low <= Math.min(b.open, b.close) && b.high >= b.low;
  }
  function ema(values, n) {

    values.forEach(function (v) { prev = prev === null ? v : v * k + prev * (1 - k); out.push(prev); }); return out;
  }
  function avg(a, field) { return a.reduce(function (s, b) { return s + b[field]; }, 0) / a.length; }
  function evaluate(item, input, context) {
    var p = cleanPrefs(input), ctx = context || {}, date = day(ctx.date), checks = [], issues = [];
    var bars = (item.bars || []).map(function (b) { return Object.assign({}, b, { date: day(b.date) }); }).sort(function (a, b) { return a.date.localeCompare(b.date); });
    var seen = {};
    bars.forEach(function (b) { if (seen[b.date] || !valid(b)) issues.push('日 K 重複或開高低收／量無效'); seen[b.date] = true; });
    if (item.error) issues.push(item.error);
    if (!date || ctx.volumeUnit !== 'lots') issues.push('行情日期或成交量單位未確認');
    var prior = bars.filter(function (b) { return b.date < date; });
    var cur = bars.filter(function (b) { return b.date === date; })[0], complete = !!cur && !!ctx.afterClose;
    var q = item.quote, live = q && day(q.date) === date;
    if (!complete) {
      cur = live ? { date: date, open: number(q.open), high: number(q.high), low: number(q.low), close: number(q.last), volume: number(q.volume) } : null;
      if (live && q.stale) issues.push('報價已過期');

    if (!valid(cur)) issues.push('缺少當日開高低收或成交量');
    var y = prior[prior.length - 1], calendar = (ctx.calendar || []).filter(function (d) { return d < date; });
    function history(n) {
      var list = prior.slice(-n), expected = calendar.slice(-n);

    }
    if (!y || !calendar.length || y.date !== calendar[calendar.length - 1]) issues.push('前一交易日日 K 缺漏');
    if (live && y && number(q.prevClose) > 0 && Math.abs(q.prevClose - y.close) > Math.max(0.02, y.close * 0.003)) issues.push('報價參考價與前日收盤不一致，需核對除權息或資料');
    function check(key, label, pass, value, rule, enabled) {
      checks.push({ key: key, label: label, pass: pass, value: value, rule: rule, enabled: enabled !== false });
    }
    var up = p.direction === 'up', sign = up ? 1 : -1, gapPct = null, ratio = null, volumeMA = null;
    if (valid(cur) && valid(y) && y.date === calendar[calendar.length - 1]) gapPct = (cur.open / y.close - 1) * 100;
    check('gap', up ? '向上開盤缺口' : '向下開盤缺口', gapPct === null ? null : sign * gapPct >= p.gapPct && (up ? cur.open > y.high : cur.open < y.low),
      gapPct, '開盤較昨收' + (up ? '高' : '低') + '至少 ' + p.gapPct + '%，且超出昨日' + (up ? '最高' : '最低') + '價', p.useGap);
    var vh = history(p.volumeDays), estimatedVolume = null, comparisonRatio = null, estimateMinutes = null, estimated = p.volumeMode === 'estimate' && !complete;
    if (vh && valid(cur) && avg(vh, 'volume') > 0) { volumeMA = avg(vh, 'volume'); ratio = cur.volume / volumeMA; }
    comparisonRatio=ratio;
    if(estimated){
      var stamp=String(q&&q.stamp||''), ms=/Z$|[+-]\d{2}:\d{2}$/.test(stamp)?Date.parse(stamp):Date.parse(stamp.replace(/\//g,'-').replace(' ','T')+'+08:00');
      if(isFinite(ms)&&day(new Date(ms+8*3600000).toISOString())===date){var clock=new Date(ms+8*3600000);estimateMinutes=clock.getUTCHours()*60+clock.getUTCMinutes()-540;}
      comparisonRatio=null;

    }
    check('volume', estimated?'盤中估量倍數':'成交量倍數', comparisonRatio === null ? null : comparisonRatio >= p.volumeMultiple && cur.volume >= p.minLots, comparisonRatio,
      (estimated?'簡化估量':'當日量')+' ≥ 前 ' + p.volumeDays + ' 個交易日均量 × ' + p.volumeMultiple + '，且實際量 ≥ ' + p.minLots + ' 張（均量不含當日）'+(estimated?'；累計量＋日均量×剩餘分鐘／270，開盤未滿五分鐘不估量':''), p.useVolume);
    var th = history(p.trendDays - 1), trendMA = th && valid(cur) ? (th.reduce(function (s, b) { return s + b.close; }, 0) + cur.close) / p.trendDays : null;
    check('trend', p.trendDays + ' 日均線', trendMA === null ? null : (up ? cur.close > trendMA : cur.close < trendMA), trendMA,
      '現價／收盤' + (up ? '高於' : '低於') + p.trendDays + ' 日均線', p.useTrend);
    var bh = history(p.breakoutDays), edge = bh ? (up ? Math.max.apply(null, bh.map(function (b) { return b.high; })) : Math.min.apply(null, bh.map(function (b) { return b.low; }))) : null;
    check('breakout', p.breakoutDays + ' 日突破', edge === null || !valid(cur) ? null : (up ? cur.close > edge : cur.close < edge), edge,
      '現價／收盤超出前 ' + p.breakoutDays + ' 日' + (up ? '最高' : '最低') + '（不含當日）', p.useBreakout);
    var position = valid(cur) ? (cur.high === cur.low ? null : (cur.close - cur.low) / (cur.high - cur.low)) : null;
    check('body', up ? '紅 K 與收盤位置' : '黑 K 與收盤位置', position === null ? null : (up ? cur.close > cur.open && position >= p.closePosition : cur.close < cur.open && position <= 1 - p.closePosition), position,
      (up ? '收紅且位於當日區間上方 ' : '收黑且位於當日區間下方 ') + ((1 - p.closePosition) * 100).toFixed(0) + '%', p.useBody);
    var ih = history(Math.min(159, prior.length)), hist = null, kd = null;
    if (ih && valid(cur)) {
      var series = ih.concat([cur]), closes = series.map(function (b) { return b.close; });
      if (series.length >= 26) {
        var a = ema(closes, 12), b = ema(closes, 26), dif = a.map(function (v, i) { return v - b[i]; }), dea = ema(dif, 9);
        hist = (dif[dif.length - 1] - dea[dea.length - 1]) * 2;
      }
      if (series.length >= 9) {
        var k = 50, d = 50;
        for (var j = 8; j < series.length; j++) {
          var win = series.slice(j - 8, j + 1), hi = Math.max.apply(null, win.map(function (r) { return r.high; })), lo = Math.min.apply(null, win.map(function (r) { return r.low; }));
          var rsv = hi === lo ? 50 : (series[j].close - lo) / (hi - lo) * 100;
          k = k * 2 / 3 + rsv / 3; d = d * 2 / 3 + k / 3;
        }
        kd = { k: k, d: d };
      }
    }
    check('macd', 'MACD 柱體', hist === null ? null : sign * hist > 0, hist, '12／26／9，以可用的最近至多 160 根日 K 首筆起算；柱體' + (up ? '大於' : '小於') + ' 0，非交叉訊號', p.useMacd);
    check('kd', 'KD 相對位置', kd === null ? null : (up ? kd.k > kd.d : kd.k < kd.d), kd, '9 日 RSV，K／D 各 1/3 平滑；K ' + (up ? '>' : '<') + ' D，非今日交叉', p.useKD);
    var bollHistory = history(19), bollEdge = null;
    if (bollHistory && valid(cur)) {
      var bollValues = bollHistory.concat([cur]).map(function (b) { return b.close; });

      var sd = Math.sqrt(bollValues.reduce(function (s, v) { return s + Math.pow(v - mean, 2); }, 0) / 20);
      bollEdge = mean + sign * 2 * sd;
    }
    check('boll', '布林通道突破', bollEdge === null ? null : (up ? cur.close > bollEdge : cur.close < bollEdge), bollEdge,
      '20 日收盤（含當日）、母體標準差 2 倍；現價／收盤突破' + (up ? '上' : '下') + '軌', p.useBoll);
    var selected = checks.filter(function (c) { return c.enabled; }), hasTrue = selected.some(function(c){return c.pass === true;}), hasFalse = selected.some(function(c){return c.pass === false;});
    var missing = selected.some(function (c) { return c.pass === null; });

    var pass = !issues.length && !!selected.length && (p.logic === 'any' ? hasTrue : !missing && !hasFalse);
    var gapFilled = valid(cur) && valid(y) && gapPct !== null ? (up ? cur.low <= y.high : cur.high >= y.low) : null;

    var gaps = [];
    bars.forEach(function (event, i) {

      if (base.length !== expected.length || !base.every(function (b, n) { return valid(b) && b.date === expected[n]; }) || !(avg(base, 'volume') > 0)) return;

        status: filled ? '已回補' : covered ? '三個交易日未回補' : '等待／缺少後續日 K',
        boundary: up ? prev.high : prev.low, days: following.length,
        note: '股務事件未完整核對；不推論主力、利多利空或勝率' });
    });

      status: issues.length || pending ? '資料待核對' : pass ? (complete ? '盤後條件符合' : '盤中條件符合') : '未符合設定',

      comparisonRatio: comparisonRatio, estimatedVolume: estimatedVolume, estimated: estimated, estimateMinutes: estimateMinutes, volumeMA: volumeMA, current: cur, previous: y, gapFilled: gapFilled, gaps: gaps.slice(-5),
      quoteTime: live ? q.time || q.stamp || '' : '', phase: complete ? '已落地日 K' : '盤中／盤後待日 K' };
  }

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); }, data = null, universe = [], page = 0, custom = false, loading = false, detailCode = '', detailSeq = 0, detailItem = null, detailContext = null;
  var loadedAt = 0, cache = new Map(), cfg = window.BATTLE_CONFIG, requestedCodes = null;
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(v, n) { return v === null || v === undefined || !isFinite(Number(v)) ? '未提供' : Number(v).toLocaleString('zh-TW', { maximumFractionDigits: n === undefined ? 2 : n }); }
  function prefs() { return window.BattleSettings.get(); }
  function read(codes, done, fail) {
    var key = JSON.stringify(codes || null), hit = cache.get(key);
    if (hit && Date.now() - hit.at < 60000) { done(hit.data); return; }
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { fail(); return; }
      cache.set(key, { at: Date.now(), data: r }); done(r);
    }).withFailureHandler(fail).apiGetBattleData(codes || null);
  }
  function resultCard(item, ctx, detail) {
    var r = window.MarketBattle.evaluate(item, prefs(), ctx), klass = r.status === '資料待核對' ? 'pending' : r.pass ? 'pass' : 'off';
    if (!r.pass && r.status === '資料待核對') return { result: r, html: detail ? '<p class="notice">暫無分析結果。</p>' : '' };
    function value(c) {
      if (c.value === null) return '資料不足';
      if (c.key === 'gap') return fmt(c.value) + '%';
      if (c.key === 'volume') return fmt(c.value) + ' 倍';
      if (c.key === 'body') return fmt(c.value * 100) + '%';
      if (c.key === 'kd') return fmt(c.value.k) + ' / ' + fmt(c.value.d);
      return fmt(c.value);
    }
    var title = detail ? '<h3>' + esc(item.name) + ' ' + esc(item.code) + '</h3>' : '<button type="button" class="battle-name" data-bstock="' + esc(item.code) + '">' + esc(item.name) + '<span>' + esc(item.code) + '</span></button>';
    var selected = r.checks.filter(function (c) { return c.enabled; });
    var details = r.checks.filter(function(c){return c.pass !== null;}).map(function (c) { return '<div class="battle-condition"><b>' + esc(c.label) + '</b><span class="battle-tag ' + (c.pass === null ? 'pending' : c.pass ? 'pass' : 'off') + '">' + (c.pass ? '符合' : '未符合') + (c.enabled ? '' : ' · 未啟用篩選') + '</span><strong>' + esc(value(c)) + '</strong><p>' + esc(c.rule) + '</p></div>'; }).join('');
    var gapState = r.checks[0].pass === null ? '未提供缺口分析' : r.checks[0].pass ? (r.gapFilled ? '當日已回補' : '當日尚未回補') : '開盤缺口未達設定';
    return { result: r, html: '<article class="card battle-card is-' + klass + '"><div class="battle-head">' + title + '<span class="battle-tag ' + klass + '">' + esc(r.status) + '</span></div>' +
      '<p class="battle-date">' + esc(r.date) + ' · ' + esc(r.phase) + (!r.complete && r.quoteTime ? ' · 行情 ' + esc(r.quoteTime) : '') + '</p>' +
      '<div class="battle-metrics"><div><span>開盤較昨收</span><b>' + fmt(r.gapPct) + (r.gapPct === null ? '' : '%') + '</b></div><div><span>'+(r.estimated?'盤中估量倍數':'當日日量倍數')+'</span><b>' + fmt(r.comparisonRatio) + (r.comparisonRatio === null ? '' : '×') + '</b></div><div><span>實際成交量</span><b>' + fmt(r.current && r.current.volume, 0) + ' 張</b></div></div>' +
      (r.estimated?'<p class="notice">簡化估量 '+fmt(r.estimatedVolume,0)+' 張；實際日量倍數 '+fmt(r.volumeRatio)+'×。不是歷史同時段量比。</p>':'')+
      '<p class="battle-evidence">前日 ' + esc(r.previous && r.previous.date || '未提供') + '：高 ' + fmt(r.previous && r.previous.high) + '／低 ' + fmt(r.previous && r.previous.low) + '／收 ' + fmt(r.previous && r.previous.close) + '；前 ' + prefs().volumeDays + ' 日均量 ' + fmt(r.volumeMA, 0) + ' 張。' + esc(gapState) + '。</p>' +
      '<div class="battle-match-strip" data-logic="'+prefs().logic+'"><b>'+(prefs().logic==='all'?'且 · 全部符合':'或 · 任一符合')+'</b>' + selected.filter(function(c){return c.pass !== null;}).map(function(c){return '<span class="battle-match-chip '+(c.pass===true?'pass':c.pass===null?'pending':'off')+'">'+(c.pass===true?'✓ ':c.pass===null?'? ':'− ')+esc(c.label)+'</span>';}).join('')+'</div>' +
      '<details><summary>條件、數值與歷史缺口</summary><div class="battle-conditions">' + details + '</div>' +
      '<h4>最近歷史缺口候選</h4>' + (r.gaps.length ? r.gaps.map(function (g) { return '<p class="battle-gap">' + esc(g.date) + ' · ' + fmt(g.pct) + '% · ' + fmt(g.ratio) + '×<br><b>' + esc(g.status) + '</b> · 回補邊界 ' + fmt(g.boundary) + '</p>'; }).join('') : '<p class="notice">可用歷史資料中沒有符合目前跳空與量能設定的候選。</p>') +
      '<p class="notice">三日為事件後的交易日，資料未到齊不判已守住。除權息與其他股務事件未完整核對；不推論勝率。</p></details></article>' };
  }
  function paint() {
    if (!data) return;
    var p = prefs(), cards = data.items.map(function (item) { return resultCard(item, data, false); });
    var shown = cards.filter(function (c) { return c.result.pass; }), total = shown.length;
    page=Math.min(page,Math.max(0,Math.ceil(total/cfg.pageSize)-1));
    $('battleCards').innerHTML = shown.slice(page*cfg.pageSize,(page+1)*cfg.pageSize).map(function (c) { return c.html; }).join('') || '<div class="battle-empty card"><h3>'+'目前沒有符合條件的股票'+'</h3><p>已核對 '+cards.length+' 檔。未符合者已收起，可調整條件或在個股查看各項數值。</p></div>';
    $('battleSummary').textContent = '資料日 ' + data.date + ' · 已核對 ' + cards.length + (custom?'':'／'+universe.length) + ' 檔 · 符合 ' + cards.filter(function (c) { return c.result.pass; }).length + (loading?' · 其餘行情讀取中':'') + ' · 讀取 ' + data.at + ' · ' + data.quoteCadence;
    var enabled = cards.length ? cards[0].result.checks.filter(function(c){return c.enabled;}).map(function(c){return c.label;}) : [];
    $('battleRule').textContent = (p.logic==='all'?'全部符合（且）':'任一符合（或）')+'：'+(enabled.join(p.logic==='all'?' 且 ':' 或 ')||'尚未加入條件');
    $('battleRule').dataset.logic=p.logic;
    $('battlePage').textContent = '第 ' + (page + 1) + '／' + Math.max(1, Math.ceil(total / cfg.pageSize)) + ' 頁 · '+(custom?'指定代號 · ':'')+'共 ' + total + ' 筆'+'符合';
    $('battlePrev').disabled = page === 0;
    $('battleNext').disabled = (page + 1) * cfg.pageSize >= total;
    $('battleUniverse').hidden = !custom;
    if (window.__fxRiseIn) window.__fxRiseIn($('battleCards'));
  }
  function load(codes) {
    if (loading) return;
    requestedCodes = codes;
    loading = true; $('battleRefresh').disabled = true; $('battlePrev').disabled = true; $('battleNext').disabled = true;
    $('battleSummary').textContent = '正在讀取落地行情…';
    read(codes, function (r) {
      var failed=[]; data = Object.assign({},r,{items:r.items.slice()}); universe = r.universe || []; paint();
      if(custom){finish();return;}
      var present=new Set(r.items.map(function(item){return item.code;})), remaining=universe.filter(function(item){return !present.has(item.code);}), jobs=[];
      for(var n=0;n<remaining.length;n+=cfg.pageSize)jobs.push(remaining.slice(n,n+cfg.pageSize).map(function(item){return item.code;}));
      var active=0;
      function finish(){loading=false;$('battleRefresh').disabled=false;loadedAt=Date.now();paint();if(failed.length)$('battleSummary').textContent+=' · '+failed.length+' 檔未讀取成功，更新資料可重試';}
      function next(){
        if(!jobs.length&&!active){finish();return;}
        while(active<3&&jobs.length){(function(batch){active++;read(batch,function(part){
          if(part.date!==data.date){failed=failed.concat(batch);}else{data.items=data.items.concat(part.items);paint();}
          active--;next();
        },function(){failed=failed.concat(batch);active--;next();});})(jobs.shift());}
      }
      next();
    }, function () {
      loading = false; $('battleRefresh').disabled = false;
      $('battleSummary').textContent = '這次未能取得行情。';
      // 不讓先前日期的卡片混在錯誤狀態下仍被看成目前結果。
      data = null; $('battleCards').innerHTML = '<div class="battle-error card" role="status"><h3>行情暫時沒有回應</h3><p>請稍後重試。這次沒有產生篩選結果，先前的卡片已收起。</p><button type="button" class="act" data-bretry>重新讀取</button></div>'; $('battleRule').textContent = ''; $('battlePage').textContent = '';
    });
  }
  window.__battleLoad = function () { if (!data || Date.now() - loadedAt >= 300000) load(custom ? requestedCodes : null); };
  window.__battleDetail = function (code) {
    if (!$('dBattle')) return;
    var seq = ++detailSeq; detailCode = code; detailItem = null; detailContext = null;
    $('dBattle').textContent = '正在讀取日 K 與量能…';
    read([code], function (r) {
      if (seq !== detailSeq) return;
      detailContext = r; detailItem = r.items[0];
      $('dBattle').innerHTML = detailItem ? resultCard(detailItem, r, true).html : '<p>沒有可判斷的行情。</p>';
    }, function () { if (seq === detailSeq) $('dBattle').textContent = '技術行情讀取失敗，關閉後再開可重試。'; });
  };
  window.__battleQuote = function (code, q) {
    if (!detailItem || code !== detailCode) return;
    if (q.date !== detailContext.date) { cache.clear(); window.__battleDetail(code); return; }
    var text = String(q.stamp || ''), stamp = /Z$|[+-]\d{2}:\d{2}$/.test(text) ? Date.parse(text) : Date.parse(text.replace(/\//g, '-').replace(' ', 'T') + '+08:00');
    detailItem.quote = Object.assign({}, q, { stale: !isFinite(stamp) || Date.now() - stamp > 300000 });
    $('dBattle').innerHTML = resultCard(detailItem, detailContext, true).html;
  };
  $('battleRefresh').addEventListener('click', function () { cache.clear(); load(custom ? requestedCodes : null); });
  $('battlePrev').addEventListener('click', function () { if (page > 0) { page--; paint(); } });
  $('battleNext').addEventListener('click', function () { page++; paint(); });
  $('battleUniverse').addEventListener('click', function () { if(loading)return;custom = false; page = 0; load(null); });
  var searchInput=$('battleCode'), suggestions=$('battleSuggestions'), searchHint=$('battleSearchHint');
  var suggestTimer, suggestSeq=0, suggestItems=[], activeSuggestion=-1, composing=false, searchCache=new Map(), selectedSearch=null;
  function normalizeQuery(s){return String(s||'').replace(/[＊*\s]+/g,'').toUpperCase();}
  function ranked(items,q){
    q=normalizeQuery(q);var seen=new Set();
    function score(i){var c=normalizeQuery(i.code),n=normalizeQuery(i.name);return c===q?0:n===q?1:i.alias&&normalizeQuery(i.alias)===q?2:c.indexOf(q)===0?3:n.indexOf(q)===0?4:n.indexOf(q)>=0?5:99;}
    return items.filter(function(i){if(!i||!i.code||seen.has(String(i.code)))return false;seen.add(String(i.code));return score(i)<99;}).sort(function(a,b){return score(a)-score(b)||String(a.code).localeCompare(String(b.code));}).slice(0,10);
  }
  function closeSuggestions(){suggestions.hidden=true;searchInput.setAttribute('aria-expanded','false');searchInput.removeAttribute('aria-activedescendant');activeSuggestion=-1;}
  function drawSuggestions(items,q){
    suggestItems=ranked(items,q);activeSuggestion=-1;
    suggestions.innerHTML=suggestItems.map(function(i,n){return '<div id="battleSuggestion'+n+'" role="option" aria-selected="false" data-bsuggestion="'+n+'"><b>'+esc(i.name)+'</b><span>'+esc(i.code)+'</span></div>';}).join('');
    suggestions.hidden=!suggestItems.length;searchInput.setAttribute('aria-expanded',String(!!suggestItems.length));searchInput.removeAttribute('aria-activedescendant');
    searchHint.textContent=suggestItems.length?'找到 '+suggestItems.length+' 個相關候選；可用上下鍵選擇，Enter 查看。':'沒有相關候選，請換個股名或代號。';
  }
  function suggest(){
    clearTimeout(suggestTimer);var seq=++suggestSeq,q=searchInput.value.trim();
    if(composing)return;
    if(!q){closeSuggestions();suggestItems=[];searchHint.textContent='輸入中文股名或代號，選擇下方候選。';return;}
    var local=universe.concat(data?data.items:[]),hit=searchCache.get(normalizeQuery(q));drawSuggestions(local.concat(hit||[]),q);
    if(hit)return;
    searchHint.textContent=suggestItems.length?searchHint.textContent:'正在尋找相關股票…';
    suggestTimer=setTimeout(function(){
      google.script.run.withSuccessHandler(function(items){
        if(seq!==suggestSeq||normalizeQuery(searchInput.value)!==normalizeQuery(q))return;
        items=Array.isArray(items)?items:[];searchCache.set(normalizeQuery(q),items);drawSuggestions(local.concat(items),q);
      }).withFailureHandler(function(){if(seq===suggestSeq&&!suggestItems.length)searchHint.textContent='搜尋暫時沒有回應，請重新輸入或使用完整代號。';}).apiSuggestCodes(q);
    },220);
  }
  function choose(item){
    if(loading){searchHint.textContent='行情讀取中，請稍後再查看。';return;}
    ++suggestSeq;clearTimeout(suggestTimer);selectedSearch={item:item,query:normalizeQuery(searchInput.value)};closeSuggestions();searchHint.textContent='查看 '+item.name+'（'+item.code+'）';custom=true;page=0;load([String(item.code)]);
  }
  searchInput.addEventListener('input',function(){selectedSearch=null;suggest();});
  searchInput.addEventListener('compositionstart',function(){composing=true;++suggestSeq;clearTimeout(suggestTimer);closeSuggestions();});
  searchInput.addEventListener('compositionend',function(){composing=false;suggest();});
  searchInput.addEventListener('focus',function(){if(searchInput.value.trim())suggest();});
  searchInput.addEventListener('keydown',function(e){
    if(e.isComposing||composing)return;
    if(e.key==='Escape'){++suggestSeq;clearTimeout(suggestTimer);closeSuggestions();return;}
    if((e.key==='ArrowDown'||e.key==='ArrowUp')&&suggestItems.length){
      e.preventDefault();suggestions.hidden=false;searchInput.setAttribute('aria-expanded','true');activeSuggestion=(activeSuggestion+(e.key==='ArrowDown'?1:-1)+suggestItems.length)%suggestItems.length;
      suggestions.querySelectorAll('[role="option"]').forEach(function(el,n){el.setAttribute('aria-selected',String(n===activeSuggestion));if(n===activeSuggestion)el.scrollIntoView({block:'nearest'});});searchInput.setAttribute('aria-activedescendant','battleSuggestion'+activeSuggestion);
    }else if(e.key==='Enter'&&!suggestions.hidden&&activeSuggestion>=0){e.preventDefault();choose(suggestItems[activeSuggestion]);}
  });
  suggestions.addEventListener('pointerdown',function(e){e.preventDefault();});
  suggestions.addEventListener('click',function(e){var el=e.target.closest('[data-bsuggestion]');if(el)choose(suggestItems[Number(el.dataset.bsuggestion)]);});
  searchInput.addEventListener('blur',function(){++suggestSeq;clearTimeout(suggestTimer);closeSuggestions();});
  $('battleSearch').addEventListener('submit',function(e){
    e.preventDefault();if(composing)return;
    if(selectedSearch&&selectedSearch.query===normalizeQuery(searchInput.value)){choose(selectedSearch.item);return;}
    var q=normalizeQuery(searchInput.value),exact=suggestItems.find(function(i){return normalizeQuery(i.code)===q||normalizeQuery(i.name)===q||normalizeQuery(i.name+' '+i.code)===q;});
    if(exact){choose(exact);return;}
    if(/^(?:00981A|\d{4,6})$/.test(q)){choose({code:q,name:q});return;}
    var saved=(data?data.items:[]).find(function(i){return normalizeQuery(i.name+' '+i.code)===q;});if(saved){choose(saved);return;}
    searchHint.textContent=q?'請從下方候選選擇股票，或輸入完整代號。':'請輸入股名或代號。';if(q)suggest();
  });
  $('battleCards').addEventListener('click', function (e) { if (e.target.closest('[data-bretry]')) { cache.clear(); load(requestedCodes); return; } var b = e.target.closest('[data-bstock]'); if (b && window.__openBattleStock) window.__openBattleStock(b.dataset.bstock); });
  window.addEventListener('battle-settings-change', function () { page=0;paint(); if (detailItem) $('dBattle').innerHTML = resultCard(detailItem, detailContext, true).html; });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !$('p-battle').hidden) window.__battleLoad(); });
  setInterval(function () { if (!document.hidden && !$('p-battle').hidden) window.__battleLoad(); }, 300000);
  if (!$('p-battle').hidden) window.__battleLoad();
})();
</script>
