/* 設定的唯一整理入口：計算核心與設定面板都用這一支。

  Object.keys(cfg.limits).forEach(function (k) {
    p[k] = d[k];

  });
  Object.keys(cfg.periods).forEach(function (k) { p[k] = cfg.periods[k].indexOf(Number(x[k])) >= 0 ? Number(x[k]) : d[k]; });

  // 天數不是預設的 5／20 時一定是自訂；是預設值時照使用者有沒有按「自訂」。
  p.volumeCustom = cfg.presets.volumeDays.indexOf(p.volumeDays) < 0 || x.volumeCustom === true;

    return list.map(function (g) {
      return (Array.isArray(g) ? g : []).filter(function (k, i, a) { return cfg.flags.indexOf(k) >= 0 && a.indexOf(k) === i; });
    }).filter(function (g) { return g.length; }).slice(0, cfg.maxGroups);
  }
  var groups, logic = x.groupLogic === 'allOfAny' ? 'allOfAny' : 'anyOfAll';
  if (Array.isArray(x.groups)) groups = cleanGroups(x.groups);
  else {
    // 舊版設定：每個條件一個開關，加上「全部符合／任一符合」。任一符合等於一組、組內任一成立。
    var on = cfg.legacyFlags.filter(function (k) { return typeof x[k] === 'boolean' ? x[k] : d.groups[0].indexOf(k) >= 0; });
    groups = on.length ? [on] : [];
    logic = x.logic === 'any' ? 'allOfAny' : 'anyOfAll';
  }
  // 進場那一套放在最外層（和 v136 存的格式相同）；出場那一套放在 exit。沒有存過出場設定就用預設。
  p.direction = x.direction === 'down' ? 'down' : 'up';

  p.exit = e && Array.isArray(e.groups)
    ? { direction: e.direction === 'up' ? 'up' : 'down', groupLogic: e.groupLogic === 'allOfAny' ? 'allOfAny' : 'anyOfAll', groups: cleanGroups(e.groups) }
    : { direction: d.exit.direction, groupLogic: d.exit.groupLogic, groups: d.exit.groups.map(function (g) { return g.slice(); }) };
  p.purpose = x.purpose === 'exit' ? 'exit' : 'entry';
  // 每個條件自己的參數：選項必須是登錄表列出的值，數字必須在範圍內；否則用預設。
  p.cond = {};
  cfg.conditions.forEach(function (c) {
    if (!c.params.length) return;
    var src = x.cond && typeof x.cond === 'object' && x.cond[c.id] && typeof x.cond[c.id] === 'object' ? x.cond[c.id] : {}, out = {};
    c.params.forEach(function (q) {
      var v = src[q.key]; out[q.key] = q.def;
      if (v === '' || v === null || v === undefined) return;
      if (q.options) { var hit = q.options.filter(function (o) { return String(o[0]) === String(v); })[0]; if (hit) out[q.key] = hit[0]; }
      else { var n = Number(v); if (isFinite(n) && n >= q.min && n <= q.max) out[q.key] = n; }
    });
    p.cond[c.id] = out;

  p.template = {};

    })[0];

  cfg.flags.forEach(function (k) { p[k] = active.groups.some(function (g) { return g.indexOf(k) >= 0; }); });

    /* 套用範本：換掉這個目的的條件組、組合方式與方向，並把範本用到的條件參數設成範本的值。另一個目的不動。 */
    function useTemplate(id) {
      var t = cfg.templates.filter(function (x) { return x.id === id && x.side === prefs.purpose; })[0]; if (!t) { sync(); return; }
      var next = copy(), s = side(next);
      s.groupLogic = t.groupLogic; s.direction = t.direction; s.groups = t.groups.map(function (g) { return g.slice(); });
      Object.keys(t.params).forEach(function (c) { Object.keys(t.params[c]).forEach(function (k) { next.cond[c][k] = t.params[c][k]; }); });
      target = 0; category = 'used'; apply(next);
      message.textContent = '已套用範本「' + t.name + '」，可以再調整條件與數值。';
    }
    picker.addEventListener('change', function () { if (picker.value) useTemplate(picker.value); else sync(); });
    wrap.addEventListener('click', function (e) {
      // 整個條件組的框都可以點（v137）：點框內任何地方（標籤除外，標籤是移除）就選這一組；「新增一組」的整個虛線框也一樣。
      var el = e.target.closest('[data-bremove], [data-bpick], [data-bnew], [data-bdays], [data-bchoice], [data-bflag], [data-bpurpose], [data-bcat-filter], [data-cparam], .battle-group, .battle-feature-box'); if (!el) return;
      if (el.classList.contains('battle-group')) el = el.querySelector('[data-bpick], [data-bnew]');
      // 整張條件卡片都可以點（v137）：點卡片任何地方就是加入／移除，和點裡面的橢圓按鈕一樣。
      // 卡片裡的設定區與來源連結照常操作；從設定區按下、在卡片上放開（例如拖著選字）也不算點卡片。
      if (el.classList.contains('battle-feature-box')) { if (pressedInside || e.target.closest('[data-bextra], a')) return; el = el.querySelector('[data-bflag]'); }
      if (el.dataset.bremove) { removeFrom(el.dataset.bremove, Number(el.dataset.bfrom)); return; }
      if (el.dataset.bpick !== undefined) { target = Number(el.dataset.bpick); sync(); return; }
      if (el.hasAttribute('data-bnew')) { target = side(prefs).groups.length; sync(); var fresh = board.querySelector('.battle-group.is-target .battle-group-pick'); if (fresh) fresh.focus(); return; }
      if (el.dataset.bcatFilter) { category = el.dataset.bcatFilter; sync(); return; }
      var next = copy();
      if (el.dataset.bpurpose) { if (el.dataset.bpurpose === prefs.purpose) return; next.purpose = el.dataset.bpurpose; target = 0; category = 'used'; apply(next); return; }
      if (el.dataset.cparam) { var id = el.dataset.cparam.split(':'); next.cond[id[0]][id[1]] = el.dataset.value; apply(next); return; }
      if (el.dataset.bdays) {
        if (el.dataset.bdays === 'custom') { next.volumeCustom = true; apply(next); var input = document.querySelector('#battleDaysCustom input'); input.focus(); input.select(); return; }
        next.volumeCustom = false; next.volumeDays = Number(el.dataset.bdays); apply(next); return;
      }
      if (el.dataset.bflag) {
        // 點條件：在目標組裡就拿掉，不在就加進去。
        var k = el.dataset.bflag, g = side(prefs).groups[target];
        if (g && g.indexOf(k) >= 0) removeFrom(k, target); else place(k, Math.min(target, side(prefs).groups.length), -1);
        return;
      }
      var key = el.dataset.bchoice;
      if (key === 'direction' || key === 'groupLogic') side(next)[key] = el.dataset.value; else next[key] = el.dataset.value;
      apply(next);
    });
    wrap.addEventListener('input', updatePreference);
    wrap.addEventListener('change', updatePreference);
    function clearDrag(){dragged='';draggedFrom=-1;wrap.classList.remove('is-dragging');wrap.querySelectorAll('.drag-over, .is-dragged').forEach(function(el){el.classList.remove('drag-over');el.classList.remove('is-dragged');});}
    /* 整張條件卡片都可以拖（v135）。卡片裡的週期按鈕與數值輸入框要能正常點選、選字：從那一區按下時，這一次不啟動拖曳。 */
    var pressedInside = false;                          // 這一次按下是不是從卡片的設定區或連結開始
    wrap.addEventListener('pointerdown', function(e){var box=e.target.closest('.battle-feature-box');pressedInside=!!e.target.closest('[data-bextra], a');if(box)box.draggable=!e.target.closest('[data-bextra]');});
    wrap.addEventListener('dragstart', function(e){var el=e.target.closest('[data-bdrag]');if(!el)return;dragged=el.dataset.bdrag;draggedFrom=el.dataset.bfrom===undefined?-1:Number(el.dataset.bfrom);e.dataTransfer.setData('text/plain',dragged);e.dataTransfer.effectAllowed='move';wrap.classList.add('is-dragging');el.classList.add('is-dragged');});
    wrap.addEventListener('dragover',function(e){var zone=e.target.closest('[data-bdrop]');if(zone&&dragged){e.preventDefault();zone.classList.add('drag-over');}});
    wrap.addEventListener('dragleave',function(e){var zone=e.target.closest('[data-bdrop]');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('drag-over');});
    wrap.addEventListener('drop',function(e){
      var zone=e.target.closest('[data-bdrop]');if(!zone||!labels[dragged])return;e.preventDefault();
      var k=dragged,from=draggedFrom,kind=zone.dataset.bdrop;clearDrag();
      // 拖回條件清單：從組裡的標籤拖來就只拿掉那一組的；拖的是卡片本身就從每一組拿掉。
      if(kind==='pool'){if(prefs[k])removeFrom(k,from);return;}
      place(k,kind==='new'?side(prefs).groups.length:Number(zone.dataset.bgroup),from);
    });
    wrap.addEventListener('dragend',clearDrag);
    document.getElementById('battleReset').addEventListener('click', function () {
      target = 0; category = 'used'; commit({});
      wrap.querySelectorAll('[data-bpref]').forEach(function (el) { el.value = prefs[el.dataset.bpref]; el.removeAttribute('aria-invalid'); });
      sync(); message.classList.remove('is-error'); message.textContent = '已還原預設。';
    });
    function show(on) { wrap.hidden = !on; document.getElementById('battleSettings').setAttribute('aria-expanded', String(on)); if (on) document.getElementById('battleConfigTitle').focus(); else document.getElementById('battleSettings').focus(); }
    document.getElementById('battleSettings').addEventListener('click', function () { show(wrap.hidden); });
    document.getElementById('battleConfigClose').addEventListener('click', function () { show(false); });
    sync();
  });
})();
</script>
