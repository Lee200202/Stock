<!-- 戰情追蹤的版面與篩選預設。使用者設定只存在本機，不改後台分類與寄送。 -->
<script>
/* v136：條件改成「組」。同一組內用一種邏輯、組與組之間用另一種：
     anyOfAll（且→或）：同一組的條件都要成立；任一組成立就符合。例：（開盤跳空 且 爆量）或 均線位置
     allOfAny（或→且）：同一組任一成立；每一組都要成立。例：（開盤跳空 或 前高突破）且 爆量
   同一個條件可以放進不同的組。舊版存的「全部符合／任一符合」會自動換成等價的一組。 */
window.BATTLE_CONFIG = {
  version: 2, pageSize: 24, storageKey: 'zzBattlePrefsV1', maxGroups: 4,
  flags: ['useGap', 'useVolume', 'useTrend', 'useBreakout', 'useBody', 'useMacd', 'useKD', 'useBoll'],
  // 最低日量倍數預設 1 倍（2026/10/06 管理者指定）：當日量不低於均量就算達標；要看爆量再自己調高。
  defaults: { gapPct: 2.5, volumeMultiple: 1, volumeDays: 20, volumeCustom: false, minLots: 1000,
    direction: 'up', volumeMode: 'actual', trendDays: 20, breakoutDays: 20, closePosition: 0.7,
    groupLogic: 'anyOfAll', groups: [['useGap', 'useVolume']] },
  limits: { gapPct: [0.1, 15], volumeMultiple: [1, 10], minLots: [0, 1000000],
    closePosition: [0.5, 1], volumeDays: [2, 120] },
  integers: { volumeDays: true },
  presets: { volumeDays: [5, 20] },
  periods: { trendDays: [5, 10, 20, 60, 120], breakoutDays: [20, 60] }
};
/* 設定的唯一整理入口：計算核心與設定面板都用這一支。回傳的 useGap…useBoll 是「有沒有放進任何一組」，由 groups 推出來。 */
window.BATTLE_CONFIG.sanitize = function (input) {
  var cfg = window.BATTLE_CONFIG, d = cfg.defaults, x = input || {}, p = {};
  Object.keys(cfg.limits).forEach(function (k) {
    p[k] = d[k];
    if (x[k] === '' || x[k] === null || x[k] === undefined) return;
    var v = Number(x[k]), lim = cfg.limits[k];
    if (isFinite(v) && v >= lim[0] && v <= lim[1] && (!cfg.integers[k] || Math.floor(v) === v)) p[k] = v;
  });
  Object.keys(cfg.periods).forEach(function (k) { p[k] = cfg.periods[k].indexOf(Number(x[k])) >= 0 ? Number(x[k]) : d[k]; });
  p.direction = x.direction === 'down' ? 'down' : 'up';
  p.volumeMode = x.volumeMode === 'estimate' ? 'estimate' : 'actual';
  // 天數不是預設的 5／20 時一定是自訂；是預設值時照使用者有沒有按「自訂」。
  p.volumeCustom = cfg.presets.volumeDays.indexOf(p.volumeDays) < 0 || x.volumeCustom === true;
  var groups, logic = x.groupLogic === 'allOfAny' ? 'allOfAny' : 'anyOfAll';
  if (Array.isArray(x.groups)) {
    groups = x.groups.map(function (g) {
      return (Array.isArray(g) ? g : []).filter(function (k, i, a) { return cfg.flags.indexOf(k) >= 0 && a.indexOf(k) === i; });
    }).filter(function (g) { return g.length; }).slice(0, cfg.maxGroups);
  } else {
    // 舊版設定：每個條件一個開關，加上「全部符合／任一符合」。任一符合等於一組、組內任一成立。
    var on = cfg.flags.filter(function (k) { return typeof x[k] === 'boolean' ? x[k] : d.groups[0].indexOf(k) >= 0; });
    groups = on.length ? [on] : [];
    logic = x.logic === 'any' ? 'allOfAny' : 'anyOfAll';
  }
  p.groups = groups; p.groupLogic = logic;
  cfg.flags.forEach(function (k) { p[k] = groups.some(function (g) { return g.indexOf(k) >= 0; }); });
  return p;
};
</script>
<script>

      card('useBody', '向上收紅且靠近高點，向下反向判斷。', numeric('closePosition', '收盤位置門檻', 0.05, '', '0.7 代表收在當日區間上方 30%；向下對稱。')) +

      card('useBoll', '20 日、2 倍標準差；突破上軌或下軌。') + '</div>' +

    function clearDrag(){dragged='';draggedFrom=-1;wrap.classList.remove('is-dragging');wrap.querySelectorAll('.drag-over, .is-dragged').forEach(function(el){el.classList.remove('drag-over');el.classList.remove('is-dragged');});}

    wrap.addEventListener('drop',function(e){
      var zone=e.target.closest('[data-bdrop]');if(!zone||!labels[dragged])return;e.preventDefault();
      var k=dragged,from=draggedFrom,kind=zone.dataset.bdrop;clearDrag();
      // 拖回條件清單：從組裡的標籤拖來就只拿掉那一組的；拖的是卡片本身就從每一組拿掉。
      if(kind==='pool'){if(prefs[k])removeFrom(k,from);return;}
      place(k,kind==='new'?prefs.groups.length:Number(zone.dataset.bgroup),from);
    });
    wrap.addEventListener('dragend',clearDrag);
    document.getElementById('battleReset').addEventListener('click', function () {
      target = 0; commit({});
      wrap.querySelectorAll('[data-bpref]').forEach(function (el) { el.value = prefs[el.dataset.bpref]; el.removeAttribute('aria-invalid'); });
      sync(); message.classList.remove('is-error'); message.textContent = '已還原預設。';
    });
    function show(on) { wrap.hidden = !on; document.getElementById('battleSettings').setAttribute('aria-expanded', String(on)); if (on) document.getElementById('battleConfigTitle').focus(); else document.getElementById('battleSettings').focus(); }
    document.getElementById('battleSettings').addEventListener('click', function () { show(wrap.hidden); });
    document.getElementById('battleConfigClose').addEventListener('click', function () { show(false); });
    sync();
  });
})();
</script>
