<script>
(function(w){
 'use strict';
 function text(v){return String(v==null?'':v);}
 function esc(v){return text(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
 function value(v){return text(v)||'未記錄';}
 function icon(name){var paths={down:'M6 9l6 6 6-6',arrow:'M4 12h16M14 6l6 6-6 6',external:'M14 4h6v6M20 4L10 14M10 4H4v16h16v-6',calendar:'M5 5h14v15H5zM8 3v4M16 3v4M5 10h14',copy:'M8 8h12v12H8zM16 8V4H4v12h4'};return '<svg class="rh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(paths[name]||paths.down)+'"/></svg>';}
 function tone(v){return {'明確錯誤':'error','待確認':'pending','邊界':'boundary','複核錯':'review'}[v]||'neutral';}
 function fixed(e){return ['已修正','已套用','修正完成'].indexOf(text(e.current['處理']).trim())>=0;}
 function count(v){var s=text(v).trim();return /^\d+$/.test(s)?Number(s):null;}
 function total(summaries,key){if(!summaries.length)return null;var numbers=summaries.map(function(s){return count(s[key]);});return numbers.some(function(n){return n===null;})?null:numbers.reduce(function(a,b){return a+b;},0);}
 function seconds(raw){var m=text(raw).match(/(?:^|[ T])([01]\d|2[0-3]):([0-5]\d):([0-5]\d)(?:$|[Z+\s])/);return m?Number(m[1])*3600+Number(m[2])*60+Number(m[3]):null;}
 function spanLabel(n){var h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return (h?h+'時':'')+(m?m+'分':'')+(s||(!h&&!m)?s+'秒':'');}
 function duration(a,b){var da=text(a).match(/^\d{4}[/-]\d{2}[/-]\d{2}/),db=text(b).match(/^\d{4}[/-]\d{2}[/-]\d{2}/);if(da&&db&&da[0].replace(/-/g,'/')!==db[0].replace(/-/g,'/'))return '時間待核';var x=seconds(a),y=seconds(b);return x!==null&&y!==null&&y>=x?spanLabel(y-x):'時間待核';}
 function kpis(summaries,entries,filter){var compared=total(summaries,'比對檔數'),clear=entries.filter(function(e){return e.current['嚴重度']==='明確錯誤';}),cleared=clear.filter(fixed).length;
  var items=[{label:summaries.length===1?'當日比對檔數':'區間比對筆次',n:compared,filter:'全部',tone:'neutral',hint:'每日摘要記錄'},...['明確錯誤','待確認','邊界','複核錯'].map(function(s){return {label:s,n:entries.filter(function(e){return e.current['嚴重度']===s;}).length,filter:s,tone:tone(s),hint:'差異明細筆數'};}),{label:'已標記修正',n:entries.filter(fixed).length,filter:'已修正',tone:'neutral',hint:clear.length?'明確錯誤修正率 '+Math.round(cleared/clear.length*100)+'%':'無明確錯誤，修正率不適用'}];
  return items.map(function(i){return '<button type="button" class="rh-kpi" data-tone="'+i.tone+'" data-kpi-filter="'+esc(i.filter)+'" aria-pressed="'+(filter===i.filter)+'"><span>'+esc(i.label)+'</span><strong class="rh-mono">'+(i.n===null?'未提供':i.n)+'</strong><small>'+esc(i.hint)+'</small></button>';}).join('');
 }
 function summary(s,reports,entries,layout,open){var day=text(s['日期']),start=s['開始時間'],end=s['完成時間'],hash=text(s['判讀雜湊']),events=[],execution=text(s['執行']),matches=execution.match(/\b(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?\b/g)||[];
  if(matches.length===1)events.push({time:matches[0],title:'執行欄標記',source:execution,exact:false});
  if(start)events.push({time:start,title:'複核開始',source:'每日摘要：開始時間',exact:true});
  reports.filter(function(r){return text(r.date)===day;}).forEach(function(r){if(r.createdAt)events.push({time:r.createdAt,title:'日誌建檔',source:'通知分頁：'+text(r.type),exact:true});});
  if(end)events.push({time:end,title:'摘要完成',source:'每日摘要：完成時間',exact:true});
  events.forEach(function(e,i){var prefix=text(e.time).match(/^(\d{4}[/-]\d{2}[/-]\d{2})/);e.order=(prefix&&prefix[1].replace(/-/g,'/')!==day)?null:seconds(e.time);if(e.order===null&&!e.exact&&/^\d{2}:\d{2}$/.test(e.time)){var mark=e.time.split(':');e.order=Number(mark[0])*3600+Number(mark[1])*60;}e.index=i;});
  events.sort(function(a,b){return (a.order===null?86401:a.order)-(b.order===null?86401:b.order)||a.index-b.index;});
  var local=entries.filter(function(e){return e.date===day;}),status=value(s['狀態']),pending=status==='複核中';
  return '<details class="rh-summary" data-summary-date="'+esc(day)+'"'+(open?' open':'')+'><summary><h3>'+esc(day)+' · 每日摘要</h3><span class="rh-chip">'+esc(status)+'</span><span class="rh-chip">比對 '+esc(value(s['比對檔數']))+' 檔</span>'+icon('down')+'</summary><div class="rh-summary-content" data-running="'+pending+'"><p class="rh-muted">以下呈現複核當時的記錄；摘要完成不等同網站、郵件已同步。</p><div class="rh-run-meta"><span class="rh-chip">郵件快照：'+esc(value(s['郵件狀態']))+'</span><span>'+esc(value(execution))+'</span>'+(hash?'<button class="ghost" type="button" data-copy-hash="'+esc(hash)+'">'+icon('copy')+' 複製判讀指紋</button>':'')+'</div><div class="rh-run-banner"><div class="rh-run-time">開始時間<strong>'+esc(value(start))+'</strong></div><div class="rh-run-arrow"><span>記錄間隔 '+esc(duration(start,end))+'</span><svg viewBox="0 0 160 24" aria-hidden="true"><path class="rh-flow-line" d="M2 12h150"/><path d="m144 5 8 7-8 7"/></svg></div><div class="rh-run-time">完成時間<strong>'+esc(value(end))+'</strong></div></div><div class="rh-pipeline"><div>摘要比對<strong>'+esc(value(s['比對檔數']))+' 檔</strong></div><div>差異明細<strong>'+local.length+' 筆</strong></div><div>摘要修正註記<strong>'+esc(value(s['已修正']))+' 筆</strong></div><div>當時郵件狀態<strong>'+esc(value(s['郵件狀態']))+'</strong></div></div><div class="rh-view-tools"><button class="ghost" type="button" data-timeline="horizontal" aria-pressed="'+(layout==='horizontal')+'">橫向時間條</button><button class="ghost" type="button" data-timeline="vertical" aria-pressed="'+(layout==='vertical')+'">縱向時間軸</button></div><p class="rh-muted">依來源欄位列出同日記錄，不推定為同一輪執行。分鐘標記不補成秒數。</p><ol class="rh-timeline" data-layout="'+layout+'">'+events.map(function(e,i){var prev=events[i-1],diff=e.exact&&prev&&prev.exact&&e.order!==null&&prev.order!==null&&e.order>=prev.order?'記錄相隔 '+spanLabel(e.order-prev.order):'';return '<li><time>'+esc(e.time)+(e.exact?'':'（原欄位標記）')+'</time><strong>'+esc(e.title)+'</strong><small>'+esc(e.source)+'</small>'+(diff?'<small>'+esc(diff)+'</small>':'')+'</li>';}).join('')+'</ol><details><summary>查看原始每日摘要</summary><pre class="rh-raw">'+esc(JSON.stringify(s,null,2))+'</pre></details></div></details>';
 }
 function flow(e){var c=e.current;return '<div class="rh-class-flow"><span>'+esc(value(c['網站分類']))+'</span>'+icon('arrow')+'<span>'+esc(value(c['複核分類']))+'</span></div>';}
 function recordHead(e){var c=e.current;return '<div><h3>'+esc(value(c['名稱']))+' <span class="rh-mono">'+esc(c['代號'])+'</span></h3><div class="rh-record-badges"><span class="rh-chip">'+esc(e.date)+'</span><span class="rh-chip rh-severity">'+esc(value(c['嚴重度']))+'</span><span class="rh-chip">'+esc(value(c['處理']))+'</span></div><span class="rh-brief">'+esc(value(c['判斷理由']))+'</span></div>';}
 function records(items,options,detail){var o=options||{},selected=items.filter(function(e){return e.id===o.selected;})[0]||items[0];if(!items.length)return '<div class="rh-empty">這個篩選沒有差異明細。每日摘要、完整日報與區間匯出仍保留。</div>';
  if(o.mode==='split')return '<div class="rh-master-detail"><div class="rh-master" aria-label="差異清單">'+items.map(function(e){return '<button type="button" class="rh-master-row" data-select-review="'+esc(e.id)+'" aria-pressed="'+(e===selected)+'"><strong>'+esc(value(e.current['名稱']))+' '+esc(e.current['代號'])+'</strong><span>'+esc(e.date)+' · '+esc(value(e.current['嚴重度']))+'</span><br><span>'+esc(value(e.current['處理']))+'</span></button>';}).join('')+'</div><section class="rh-detail-side">'+detail(selected)+'</section></div>';
  if(o.mode==='single'){var index=items.indexOf(selected);return '<section class="rh-single"><div class="rh-single-nav"><button class="ghost" type="button" data-review-prev'+(!index?' disabled':'')+'>上一筆</button><span>第 '+(index+1)+' / '+items.length+' 筆</span><button class="ghost" type="button" data-review-next'+(index===items.length-1?' disabled':'')+'>下一筆</button><button class="ghost" type="button" data-view="cards">返回清單</button></div>'+detail(selected)+'</section>';}
  return items.map(function(e){return '<details class="rh-record" data-entry="'+esc(e.id)+'" data-tone="'+tone(e.current['嚴重度'])+'"'+(o.open&&o.open[e.id]?' open':'')+'><summary>'+recordHead(e)+flow(e)+icon('down')+'</summary><div class="rh-record-body">'+detail(e)+'</div></details>';}).join('');
 }
 function reportIndex(entries){var days={};entries.forEach(function(e){(days[e.date]||(days[e.date]=[])).push(e);});return Object.keys(days).sort().reverse().map(function(day){return '<article class="rh-day"><h3>'+esc(day)+' · 日報差異索引</h3><p class="rh-muted">依差異明細整理，點選可定位原始證據；不是從日報猜測其餘個股。完整日報可切到原始文字。</p><div class="rh-report-grid">'+days[day].map(function(e){var c=e.current;return '<button type="button" class="rh-report-case" data-tone="'+tone(c['嚴重度'])+'" data-jump-review="'+esc(e.id)+'"><strong>'+esc(value(c['名稱']))+' '+esc(c['代號'])+'</strong><dl><dt>現象</dt><dd>'+esc(value(c['修正前']||c['網站分類']))+'</dd><dt>複核原因</dt><dd>'+esc(value(c['判斷理由']))+'</dd><dt>處理記錄</dt><dd>'+esc(value(c['修正後']||c['處理']))+'</dd></dl></button>';}).join('')+'</div></article>';}).join('')||'<div class="rh-empty">沒有差異明細可作個股索引，請查看原始日報。</div>';}
 function rawReports(reports){return reports.map(function(r,i){return '<article class="rh-day"><h3>'+esc(r.date)+' · '+esc(value(r.type))+'</h3><p class="rh-muted">'+esc(r.createdAt)+' · '+esc(r.status)+'</p><button type="button" class="ghost" data-copy-report="'+i+'">複製原始日報</button><details'+(reports.length===1?' open':'')+'><summary>'+esc(value(r.subject))+'</summary><pre class="rh-raw">'+esc(r.text)+'</pre></details></article>';}).join('')||'<div class="rh-empty">這個區間尚無原始日報。</div>';}
 w.StockReviewHistoryViews={icon:icon,tone:tone,isFixed:fixed,count:count,total:total,seconds:seconds,duration:duration,kpis:kpis,summary:summary,records:records,reportIndex:reportIndex,rawReports:rawReports};
})(window);
</script>
