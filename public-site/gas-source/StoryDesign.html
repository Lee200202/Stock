<script>
/* v195 技術說明：章節列（Apple 機型列）與步驟進度。只讀現有目錄與章節，不新增內容項目。 */
(function(){'use strict';
var root=document.querySelector('[data-tech-book]');if(!root)return;
var grid=root.querySelector('.book-contents-grid'),tools=root.querySelector('.book-tools');if(!grid||!tools||root.querySelector('.book-strip'))return;
var nav=document.createElement('nav');nav.className='book-strip';nav.setAttribute('aria-label','章節列');
nav.innerHTML='<button type="button" class="book-strip-go" data-dir="-1" aria-label="章節列往前">‹</button><div class="book-strip-row"></div><button type="button" class="book-strip-go" data-dir="1" aria-label="章節列往後">›</button>';
var row=nav.querySelector('.book-strip-row'),go=nav.querySelectorAll('.book-strip-go');
Array.prototype.forEach.call(grid.querySelectorAll('a[href^="#"]'),function(a){var c=a.cloneNode(true);c.removeAttribute('id');row.appendChild(c);});
tools.insertAdjacentElement('afterend',nav);
var links=Array.prototype.slice.call(row.children),reduce=matchMedia('(prefers-reduced-motion: reduce)');
function edges(){var max=row.scrollWidth-row.clientWidth-2;go[0].disabled=row.scrollLeft<=2;go[1].disabled=row.scrollLeft>=max;}
function mark(){var cur=null;Array.prototype.forEach.call(root.querySelectorAll('[data-chapter]'),function(ch){if(!ch.hidden&&!cur)cur=ch;});
  links.forEach(function(a){var on=!!cur&&a.getAttribute('href')==='#'+cur.id;a.setAttribute('aria-current',on?'true':'false');
    if(on&&row.clientWidth){var left=a.offsetLeft-row.offsetLeft-(row.clientWidth-a.offsetWidth)/2;row.scrollTo({left:Math.max(0,left),behavior:reduce.matches?'auto':'smooth'});}});
  edges();}
Array.prototype.forEach.call(go,function(b){b.addEventListener('click',function(){row.scrollBy({left:Number(b.dataset.dir)*row.clientWidth*.8,behavior:reduce.matches?'auto':'smooth'});});});
row.addEventListener('scroll',function(){requestAnimationFrame(edges);},{passive:true});
row.addEventListener('keydown',function(e){if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;var i=links.indexOf(document.activeElement);if(i<0)return;var j=Math.max(0,Math.min(links.length-1,i+(e.key==='ArrowRight'?1:-1)));if(j===i)return;e.preventDefault();links[j].focus();});
document.addEventListener('stock-tech-chapter',function(){requestAnimationFrame(mark);});
new MutationObserver(function(){requestAnimationFrame(mark);}).observe(root,{subtree:true,attributes:true,attributeFilter:['hidden']});
var panel=root.closest('.panel');if(panel)new MutationObserver(function(){if(!panel.hidden)requestAnimationFrame(mark);}).observe(panel,{attributes:true,attributeFilter:['hidden']});
addEventListener('resize',edges);mark();
})();
</script>
