function route(hash,focus){var key;try{key=decodeURIComponent((hash||'').replace(/^#/,''));}catch(e){key='';}if(key==='book-index'){closeDialogs();window.scrollTo(0,root.getBoundingClientRect().top+scrollY-offset());return;}var target=document.getElementById(aliases[key]||key),next=target&&target.closest('[data-chapter]');if(!next)next=active||chapters[0];closeDialogs();if(next.id!=='tech-harness'&&window.__techMap)window.__techMap.pause();active=next;chapters.forEach(function(ch){ch.hidden=ch!==next;});root.dataset.activeChapter=next.id;var num=Number(next.dataset.chapter);side.textContent=String(num).padStart(2,'0')+'／'+chapters.length+'　目錄';side.setAttribute('aria-label','第'+num+'章，開啟章節目錄');contents.querySelectorAll('a').forEach(function(a){if(a.hash==='#'+next.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});if(focus){var heading=next.querySelector('h2');heading.focus({preventScroll:true});var dest=target&&next.contains(target)&&target.getClientRects().length?target:next;window.scrollTo(0,dest.getBoundingClientRect().top+scrollY-offset());}root.dispatchEvent(new CustomEvent('stock-tech-chapter'));window.dispatchEvent(new Event('resize'));sync();}
root.addEventListener('click',function(e){if(e.target.closest('button[data-go]')){history.pushState(null,'','#tech-overview');route('#tech-overview',false);}},true);
root.addEventListener('click',function(e){var a=e.target.closest('a[href^="#"]');if(!a||a.getAttribute('href')==='#')return;var key=a.getAttribute('href').slice(1);if(key!=='book-index'&&!document.getElementById(aliases[key]||key))return;e.preventDefault();e.stopPropagation();history.pushState(null,'','#'+key);route('#'+key,true);});
function fromHistory(){if(routeQueued)return;routeQueued=true;requestAnimationFrame(function(){routeQueued=false;route(location.hash,true);});}addEventListener('popstate',fromHistory);addEventListener('hashchange',fromHistory);
root.addEventListener('keydown',function(e){if(!e.target.closest('.book-pager')||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||modalOpen)return;if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;var n=chapters.indexOf(active)+(e.key==='ArrowLeft'?-1:1);if(n<0||n>=chapters.length)return;e.preventDefault();history.pushState(null,'','#'+chapters[n].id);route('#'+chapters[n].id,true);});
var search=root.querySelector('#bookSearch'),results=root.querySelector('#bookSearchResults');search.addEventListener('input',function(){var q=search.value.trim().toLowerCase();results.replaceChildren();results.hidden=!q;if(!q)return;var found=chapters.filter(function(ch){return ch.textContent.toLowerCase().indexOf(q)>=0;});found.forEach(function(ch){var a=document.createElement('a');a.href='#'+ch.id;a.textContent=ch.dataset.chapter+' · '+ch.querySelector('h2').dataset.toc;results.appendChild(a);});if(!found.length)results.textContent='找不到相關章節，請換一個關鍵字。';});
[['heroPlay','tech-start'],['tlPlay','tech-hold']].forEach(function(pair){var b=root.querySelector('#'+pair[0]),s=states.find(function(x){return x.ch.id===pair[1];});b.addEventListener('click',function(){s.paused=!s.paused;sync();});});
elements('[data-budget]').forEach(function(b){b.addEventListener('click',function(){root.querySelector('#agentEvidence').style.setProperty('--book-budget',b.dataset.budget==='full'?'0.03083':'0.02594');});});elements('.load-row[data-secs]').forEach(function(row){var chart=row.closest('.load-chart'),max=Math.max.apply(null,Array.from(chart.querySelectorAll('[data-secs]')).map(function(r){return Number(r.dataset.secs);}));row.querySelector('i').style.setProperty('--book-scale',String(Number(row.dataset.secs)/max));});
new MutationObserver(function(){sync();if(!panel.hidden)route(location.hash,false);}).observe(panel,{attributes:true,attributeFilter:['hidden']});document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',sync);window.__techBookReveal=function(){route(location.hash,!!location.hash);};
if(chapters.length!==Number(root.dataset.chapterCount)||new Set(chapters.map(function(ch){return ch.id;})).size!==chapters.length)throw new Error('Tech chapter manifest invalid');root.dataset.bookReady='true';route(location.hash,false);
}
function safeInit(){try{initBook();}catch(e){document.querySelectorAll('[data-chapter]').forEach(function(ch){ch.hidden=false;});console.error('Tech book initialization failed',e);}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',safeInit);else safeInit();
})();
