<script id="techAppleScriptV199">
(function(){
  var root=document.getElementById('p-tech');
  if(!root||!root.querySelector('.tech-book'))return;
  var mq=window.matchMedia('(min-width:900px) and (prefers-reduced-motion:no-preference)');
  var pins=[],ticking=false;
  function topOffset(){var bar=document.querySelector('.tabs, header.site, .topbar');var b=bar&&bar.getBoundingClientRect();return Math.max(56,Math.min(120,b&&b.bottom>0?Math.round(b.bottom)+8:72));}
  function wrap(target,extra,atlas){
    var pin=document.createElement('div');pin.className='ap-pin';
    var stage=document.createElement('div');stage.className='ap-stage';
    target.parentNode.insertBefore(pin,target);pin.appendChild(stage);stage.appendChild(target);
    if(extra&&extra.parentNode){stage.appendChild(extra);}
    var bar=document.createElement('div');bar.className='ap-progress';bar.setAttribute('aria-hidden','true');bar.innerHTML='<i></i>';stage.appendChild(bar);
    var track=atlas?target.querySelector('.journey-atlas-track'):target;
    var p={pin:pin,stage:stage,track:track,atlas:atlas,tools:extra,dist:0,on:false,progress:0};
    pins.push(p);
    if(window.ResizeObserver){new ResizeObserver(function(){measure(p);}).observe(stage);}
    if(extra){extra.addEventListener('click',function(e){var btn=e.target.closest('button');if(!btn||!p.on)return;e.preventDefault();e.stopImmediatePropagation();step(p,/上一/.test(btn.getAttribute('aria-label')||'')?-1:1);},true);}
    track.addEventListener('focusin',function(e){if(!p.on)return;var items=[].slice.call(track.children),i=items.indexOf(e.target.closest('#p-tech .ap-pin '+(atlas?'.journey-atlas-track':'.journey-gallery')+'>*'));if(i>=0)goTo(p,i,false);});
    return p;
  }
  function measure(p){
    var on=mq.matches&&p.stage.offsetParent!==null;
    var dist=on?Math.max(0,p.track.scrollWidth-p.stage.clientWidth+8):0;
    // 內容高過可視範圍時保留原生橫滑，避免固定區把卡片下半截藏住。
    if(on&&(dist<40||p.stage.scrollHeight>window.innerHeight-topOffset()-24)){on=false;}
    // v207r3（管理者 10/23）：寬螢幕只有章節地圖左右固定橫移；文字卡片改成鋪滿內容寬度的格狀排版，不再一排四張、每張 460px 把內文擠成窄欄
    if(on&&!p.atlas){on=false;}
    p.on=on;p.dist=dist;p.pin.classList.toggle('is-on',on);
    if(on){p.pin.style.setProperty('--ap-top',topOffset()+'px');p.pin.style.setProperty('--ap-len',(p.stage.offsetHeight+dist*.65)+'px');}
    else{p.pin.style.removeProperty('--ap-len');p.track.style.removeProperty('--ap-x');}
    update(p);
  }
  function update(p){
    if(!p.on)return;
    var r=p.pin.getBoundingClientRect(),span=Math.max(1,r.height-p.stage.offsetHeight);
    var prog=Math.min(1,Math.max(0,-(r.top-parseFloat(p.pin.style.getPropertyValue('--ap-top')||72))/span));
    p.progress=prog;
    p.track.style.setProperty('--ap-x',(-prog*p.dist).toFixed(1)+'px');
    p.stage.querySelector('.ap-progress').style.setProperty('--ap-p',prog.toFixed(3));
    var items=p.track.children,n=items.length,cur=Math.round(prog*(n-1));
    if(p.atlas){for(var i=0;i<n;i++){items[i].classList.toggle('is-lit',i<=cur);}}
    var counter=p.tools&&p.tools.querySelector('span');if(counter){counter.textContent=(cur+1)+' / '+n;}
    if(p.tools){var bs=p.tools.querySelectorAll('button');if(bs[0])bs[0].disabled=cur<=0;if(bs[1])bs[1].disabled=cur>=n-1;}   // 固定橫移時由捲動進度決定能不能再往前／往後
  }
  function goTo(p,i,smooth){
    var n=p.track.children.length,r=p.pin.getBoundingClientRect(),span=Math.max(1,r.height-p.stage.offsetHeight);
    var top=window.scrollY+r.top-parseFloat(p.pin.style.getPropertyValue('--ap-top')||72)+span*(n>1?i/(n-1):0);
    window.scrollTo({top:Math.round(top),behavior:smooth===false?'auto':'smooth'});
  }
  function step(p,dir){var n=p.track.children.length,cur=Math.round(p.progress*(n-1));goTo(p,Math.max(0,Math.min(n-1,cur+dir)));}
  function onScroll(){if(ticking)return;ticking=true;requestAnimationFrame(function(){ticking=false;pins.forEach(update);});}
  // 六步流程與章節卡片列是技術說明的程式在載入後才排好的：內容變動時再掃一次，只包還沒包過的
  var motionOk=!window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var io='IntersectionObserver' in window&&motionOk?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px'}):null;
  function scan(){
    var atlas=root.querySelector('.journey-atlas');
    if(atlas&&atlas.querySelector('.journey-atlas-track')&&!atlas.closest('.ap-pin'))measure(wrap(atlas,null,true));
    root.querySelectorAll('.book-chapter .journey-gallery').forEach(function(g){
      if(g.closest('.ap-pin'))return;
      var tools=g.nextElementSibling&&g.nextElementSibling.classList.contains('journey-gallery-tools')?g.nextElementSibling:null;
      measure(wrap(g,tools,false));
    });
    // 捲入時位移浮出（內容一開始就看得見，只做位移）
    if(io)root.querySelectorAll('.book-heading, .book-chapter figure, .pain-lead').forEach(function(el){
      if(el.dataset.apRise)return;el.dataset.apRise='1';
      if(el.getBoundingClientRect().top>window.innerHeight){el.classList.add('ap-rise');io.observe(el);}
    });
  }
  var scanQueued=false;
  function queueScan(){if(scanQueued)return;scanQueued=true;setTimeout(function(){scanQueued=false;scan();},120);}
  if(window.MutationObserver)new MutationObserver(queueScan).observe(root,{childList:true,subtree:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',queueScan);else queueScan();
  window.addEventListener('load',queueScan);
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',function(){pins.forEach(measure);});
  if(mq.addEventListener)mq.addEventListener('change',function(){pins.forEach(measure);});
  window.techApple199={pins:pins,measure:function(){pins.forEach(measure);},scan:scan};
})();
</script>

    var view=document.createElement('div');view.className='tb-pc-view';view.tabIndex=0;view.setAttribute('role','region');view.setAttribute('aria-roledescription','輪播');view.setAttribute('aria-label',(ul.getAttribute('aria-label')||'看影片的四個痛點')+'，左右方向鍵切換');

    function clone(c){var d=c.cloneNode(true);d.classList.add('tb-pc-clone');d.setAttribute('aria-hidden','true');d.removeAttribute('data-content-id');d.querySelectorAll('[data-content-id]').forEach(function(e){e.removeAttribute('data-content-id');});return d;}
    ul.insertBefore(clone(real[n-1]),real[0]);ul.appendChild(clone(real[0]));
    var track=[].slice.call(ul.children);
    var bar=document.createElement('div');bar.className='tb-pc-bar';
    bar.innerHTML='<span class="tb-pc-meter" aria-hidden="true"><i></i></span><span class="tb-pc-count"></span><button type="button" class="tb-pc-toggle" aria-pressed="false" aria-label="停止輪播" title="停止輪播"></button>';
    box.appendChild(bar);
    var meter=bar.querySelector('.tb-pc-meter>i'),count=bar.querySelector('.tb-pc-count'),btn=bar.querySelector('.tb-pc-toggle');
    var PAUSE='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.4" height="12" rx="1"></rect><rect x="9.6" y="2" width="3.4" height="12" rx="1"></rect></svg>';
    var PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.2v11.6L13.8 8z"></path></svg>';
    var pos=1,stopped=false,hover=false,visible=false,timer=0,snapT=0,swiped=0,ANIM=1800,WAIT=7000;
    function idx(){return (pos-1+n)%n;}
    function render(animate){
      var w=real[0].offsetWidth,gap=parseFloat(getComputedStyle(ul).columnGap)||0,peek=(view.clientWidth-w)/2;
      if(!animate){ul.style.transition='none';track.forEach(function(c){c.style.transition='none';});}
      ul.style.setProperty('--tb-pc-x',(peek-pos*(w+gap)).toFixed(1)+'px');
      track.forEach(function(c,k){var on=k===pos;c.classList.toggle('is-active',on);if(!c.classList.contains('tb-pc-clone')){if(on)c.removeAttribute('aria-hidden');else c.setAttribute('aria-hidden','true');}});
      if(!animate){void ul.offsetWidth;ul.style.transition='';track.forEach(function(c){c.style.transition='';});}
      count.textContent=(idx()+1)+' / '+n;
    }
    function shown(c){var t=c.querySelector('.pc-talk');if(t){t.classList.remove('pc-wait','pc-play');t.classList.add('tb-done');}}
    function talk(){var t=track[pos].querySelector('.pc-talk');if(!t)return;if(reduce.matches){shown(track[pos]);return;}t.classList.remove('tb-done','pc-play');t.classList.add('pc-wait');void t.offsetWidth;t.classList.remove('pc-wait');t.classList.add('pc-play');}
    function running(){return !stopped&&!hover&&visible&&!document.hidden&&!reduce.matches;}
    function meterTo(ms){meter.style.transition='none';meter.style.transform='scaleX(0)';void meter.offsetWidth;if(ms){meter.style.transition='transform '+ms+'ms linear';meter.style.transform='scaleX(1)';}}
    function schedule(){clearTimeout(timer);timer=0;if(!running()){meterTo(0);return;}meterTo(ANIM+WAIT);timer=setTimeout(function(){step(1);},ANIM+WAIT);}
    function snap(){clearTimeout(snapT);snapT=0;if(pos===0||pos===n+1){pos=pos===0?n:1;shown(track[pos]);render(false);}}
    function move(to){snap();if(to===pos)return;pos=to;render(!reduce.matches);talk();schedule();snapT=setTimeout(snap,reduce.matches?0:700);}
    function step(d){snap();move(pos+d);}
    btn.innerHTML=PAUSE;
    btn.addEventListener('click',function(){stopped=!stopped;btn.setAttribute('aria-pressed',String(stopped));var l=stopped?'繼續輪播':'停止輪播';btn.setAttribute('aria-label',l);btn.title=l;btn.innerHTML=stopped?PLAY:PAUSE;schedule();});
    track.forEach(function(c,k){c.addEventListener('click',function(){if(Date.now()-swiped<500||k===pos)return;move(k);});});
    view.addEventListener('mouseenter',function(){hover=true;schedule();});
    view.addEventListener('mouseleave',function(){hover=false;schedule();});
    view.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();step(1);}else if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}});
    var sx=null,sy=null;
    view.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;});
    view.addEventListener('pointerup',function(e){if(sx===null)return;var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){swiped=Date.now();step(dx<0?1:-1);}});
    view.addEventListener('pointercancel',function(){sx=null;});
    if('IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(e){var was=visible;visible=e.isIntersecting;if(visible&&!was)talk();schedule();});},{threshold:.35}).observe(view);}else{visible=true;}
    document.addEventListener('visibilitychange',schedule);
    function motion(){btn.hidden=reduce.matches;if(reduce.matches)track.forEach(shown);schedule();}
    if(reduce.addEventListener)reduce.addEventListener('change',motion);
    if(window.ResizeObserver)new ResizeObserver(function(){render(false);}).observe(view);
    track.forEach(function(c,k){if(k!==pos)shown(c);});
    render(false);motion();
    window.techPain228={step:step,move:move,state:function(){return {index:idx(),pos:pos,stopped:stopped,hover:hover,visible:visible,running:running()};}};
  }

  // 案例與防線：兩排反向等速移動。滑入那一排停住；「暫停滾動」全停；「對調方向」兩排一起反向，不跳位置。
  function stream(){
    var st=root.querySelector('[data-tb-stream]');if(!st||st.dataset.tbReady)return;st.dataset.tbReady='1';
    var ctl=st.querySelector('.tb-stream-ctl'),pause=st.querySelector('[data-tb-pause]'),swap=st.querySelector('[data-tb-swap]');
    var rows=[].map.call(st.querySelectorAll('.tb-row'),function(row){return {row:row,tr:row.querySelector('.tb-track'),dir:Number(row.getAttribute('data-tb-dir'))||1,x:0,half:0,hover:false,cloned:false,started:false};});
    var paused=false,swapped=false,visible=false,manual=false,raf=0,last=0,SPEED=26;
    function live(){return !reduce.matches&&!manual;}
    function measure(r){var kids=r.tr.children,n=r.tr.querySelectorAll(':scope>:not(.tb-clone)').length;r.half=live()&&kids[n]?kids[n].offsetLeft-kids[0].offsetLeft:0;
      if(r.half&&!r.started){r.started=true;r.x=r.dir>0?-r.half*.35:-r.half*.1;}wrapX(r);paint(r);}
    function wrapX(r){if(!r.half)return;while(r.x>0)r.x-=r.half;while(r.x<=-r.half)r.x+=r.half;}
    function paint(r){r.tr.style.transform=live()&&r.half?'translate3d('+r.x.toFixed(1)+'px,0,0)':'';}
    function setup(){
      var on=live();st.classList.toggle('is-live',on);ctl.hidden=!on;
      rows.forEach(function(r){
        if(on&&!r.cloned){var orig=[].slice.call(r.tr.children);for(var k=0;k<2;k++){orig.forEach(function(c){var d=c.cloneNode(true);d.classList.add('tb-clone');d.setAttribute('aria-hidden','true');d.setAttribute('tabindex','-1');r.tr.appendChild(d);});}r.cloned=true;}
        r.tr.querySelectorAll('.tb-clone').forEach(function(d){d.hidden=!on;});
        if(!on)r.row.scrollLeft=0;
        measure(r);
      });
      kick();
    }
    function frame(t){raf=0;if(!running())return;var dt=last?Math.min(t-last,64)/1000:0;last=t;
      rows.forEach(function(r){if(r.hover||!r.half)return;r.x+=r.dir*(swapped?-1:1)*SPEED*dt;wrapX(r);paint(r);});
      raf=requestAnimationFrame(frame);}
    function running(){return live()&&visible&&!paused&&!document.hidden;}
    function kick(){if(running()){if(!raf){last=0;raf=requestAnimationFrame(frame);}}else if(raf){cancelAnimationFrame(raf);raf=0;}}
    rows.forEach(function(r){
      r.row.addEventListener('mouseenter',function(){r.hover=true;});
      r.row.addEventListener('mouseleave',function(){r.hover=false;last=0;});
    });
    // 鍵盤進入卡片時改成可左右捲動的靜態排列，焦點卡片一定看得到；離開後恢復。
    st.addEventListener('focusin',function(e){if(e.target.closest('.tb-row')&&e.target.matches(':focus-visible')&&!manual){manual=true;setup();e.target.scrollIntoView({block:'nearest',inline:'nearest'});}});
    st.addEventListener('focusout',function(e){if(manual&&!(e.relatedTarget&&st.contains(e.relatedTarget))){manual=false;setup();}});
    pause.addEventListener('click',function(){paused=!paused;pause.setAttribute('aria-pressed',String(paused));pause.textContent=paused?'繼續滾動':'暫停滾動';kick();});
    swap.addEventListener('click',function(){swapped=!swapped;swap.setAttribute('aria-pressed',String(swapped));if(paused){paused=false;pause.setAttribute('aria-pressed','false');pause.textContent='暫停滾動';}kick();});
    if('IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(e){visible=e.isIntersecting;});kick();}).observe(st);}else{visible=true;}
    document.addEventListener('visibilitychange',kick);
    if(reduce.addEventListener)reduce.addEventListener('change',setup);
    if(window.ResizeObserver)new ResizeObserver(function(){rows.forEach(measure);}).observe(st);
    window.techBento228={rows:rows,state:function(){return {paused:paused,swapped:swapped,visible:visible,live:live(),running:running(),x:rows.map(function(r){return Math.round(r.x);})};}};
    setup();
  }

  var queued=false;
  function run(){queued=false;plates();carousel();fit();stream();}
  function queue(){if(!queued){queued=true;requestAnimationFrame(run);}}
  if(window.MutationObserver){
    new MutationObserver(queue).observe(root,{childList:true,subtree:true});
    new MutationObserver(queue).observe(document.documentElement,{attributes:true,attributeFilter:['data-w','data-fs']});
  }
  if(window.ResizeObserver)new ResizeObserver(queue).observe(book);
  window.addEventListener('resize',queue);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',queue);else queue();
})();
</script>
