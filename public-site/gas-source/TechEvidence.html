<style>

.tech-book .evidence-svg{display:block;width:100%;height:auto;background:var(--panel);border-radius:22px;color:var(--ink)}
.tech-book .ev-mobile{display:none}

.tech-book .ev-line{stroke:var(--muted);stroke-width:2;fill:none;opacity:.55;stroke-dasharray:6 7}

.tech-book .ev-marker{fill:var(--beam)}

.tech-book .evidence-result{border-left:3px solid var(--beam);padding-left:18px;margin:22px 0 0}
