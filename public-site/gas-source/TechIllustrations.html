var definitions={"boundaries": [["當日買進", "「我今天買進甲股了。」", "當日買入", "依核實部位記錄", "不另猜買點", "已完成的本人／會員當日交易才建立成交事件；影片候選仍要經原句與AI事實覆核。有效當日操作通知可依明確執行指令記錄，但「如果想買者可以買」只是建議。"], ["只有可以買", "「甲股可以買；等回測季線。」", "沒有成交事件", "不憑建議建部位", "觀望注意", "可辨認的買點、條件或向前技術訊號支持注意；不必要求講者已經買入。沒有成交或持有證據，就不建立成本、交易與持有回合。"], ["不要殺低", "「今天賣甲股就是殺低，不要賣。」", "不是當日賣出", "有部位才談續抱", "另看有無買點", "反對賣出不能反讀成禁止買進，也不能推成今天已買。若只是教學例子、沒有本股當下進場立場，可不公開；如另有本股買點，再依證據列注意。"], ["歷史賣出、暫不買回", "「甲股先前高點賣出；現在條件未到，不急買回。」", "今日成交 0", "依剩餘部位判斷", "觀望不碰", "歷史成交不移到今天。現在的暫不買回是獨立立場；若過去只賣部分，剩餘持股仍可保留，兩則說明分別對應持有部位與已賣部分。"], ["今天部分賣出", "「我今天賣出甲股一半，剩下繼續抱。」", "今日部分賣出", "剩餘部位續抱", "不自動推定禁買", "賣出事件與持有狀態可同時成立。只處理被指明的部位；全數出場才關閉整個回合，不能因「賣出」兩字把全檔平倉。"], ["只有歷史回顧", "「甲股上星期已賣，當時漲很多。」", "不新增今日交易", "不憑回顧建持股", "無當下立場則不列", "回顧是時間屬性，不是固定的偏多或偏空分類。今天若另有新的本股買點，仍可列注意；今天明講禁買則列不碰；只有過去績效、行情或類比，保留原稿即可。"], ["否認持有", "「甲股我沒有，只是拿來分析；乙股我有。」", "沒有成交證據", "甲股不建立部位", "甲股看法另判", "「沒有持有」不等於「不能買」。不能把鄰句的乙股部位接到甲股；若甲股另有向前技術條件，仍可列注意，只有報價或比較則不強行收錄。"]], "boundaryArt": ["<svg class=\"book-art\" data-illustration=\"bespoke\" data-mobile-viewbox=\"0 0 480 1440\" viewBox=\"0 0 960 850\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"交易、部位與新進場看法分開：當日買進\"><rect width=\"960\" height=\"850\" rx=\"26\" fill=\"#e6eee7\"/><path data-book-path=\"0\" d=\"M395 140Q180 140 180 320\" data-mobile-d=\"M230 140H450V350Q450 380 330 380\" fill=\"none\" stroke=\"#54836a\" stroke-width=\"3\" stroke-dasharray=\"7 8\"/><path data-book-path=\"1\" d=\"M180 460Q180 620 416 620\" data-mobile-d=\"M240 470H25V680Q25 710 140 710\" fill=\"none\" stroke=\"#54836a\" stroke-width=\"3\" stroke-dasharray=\"7 8\"/><path data-book-path=\"2\" d=\"M565 140Q790 140 790 320\" data-mobile-d=\"M230 140Q470 140 470 1060Q470 1090 330 1090\" fill=\"none\" stroke=\"#54836a\" stroke-width=\"3\" stroke-dasharray=\"7 8\"/><g data-book-node=\"0\" transform=\"translate(480,140)\" data-mobile-transform=\"translate(140,140)\"><path class=\"bk-node-bg\" d=\"M-85-58H85V42H-30L-64 74V42H-85Z\" fill=\"#f9fcf9\" stroke=\"#286947\" stroke-widt
