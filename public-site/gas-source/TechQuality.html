<!-- v192r1：共用關聯圖與受控技能比較，只在前端執行。 -->
<style>
.quality-relationship .tg-jump{display:none!important}.quality-relationship.tg-scrollable .tg-jump{display:grid!important}
.quality-relationship .tg-hint-narrow{display:none!important}.quality-relationship.tg-scrollable .tg-hint-narrow{display:block!important}
.quality-relationship .tg-hint-wide{display:block!important}.quality-relationship.tg-scrollable .tg-hint-wide{display:none!important}
.quality-relationship .tg-scroll{touch-action:pan-x pan-y pinch-zoom}
.quality-relationship .quality-node-copy[hidden]{display:none}
.quality-relationship .quality-detail{padding:clamp(20px,3vw,36px);margin:24px 0;border:1px solid var(--rule);border-radius:24px;background:var(--panel)}
.quality-relationship .quality-node-copy h3{margin-top:0}
.quality-relationship .quality-references,.quality-relationship .quality-ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin:24px 0}
.quality-relationship .quality-references>section,.quality-relationship .quality-ab>section{padding:22px;border:1px solid var(--rule);border-radius:24px;min-width:0}
.quality-relationship .quality-modes{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}
.quality-relationship .quality-modes button{font:inherit;min-height:48px;border:1px solid var(--rule);border-radius:999px;padding:10px 22px;background:var(--panel);color:var(--ink);cursor:pointer}
.quality-relationship .quality-modes button[aria-pressed=true]{background:var(--beam);color:var(--bg)}
.quality-relationship .quality-basis{padding-left:26px}.quality-relationship .quality-basis li{padding:10px 0}.quality-relationship .quality-basis span{display:block;margin-top:8px}
.quality-relationship .quality-arm{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--beam);color:var(--bg);font-weight:800}
.quality-relationship .quality-source-note{color:var(--muted);font-size:calc(14px * var(--rd-fs))}
.quality-relationship .quality-motion{display:flex;gap:12px;justify-content:flex-end;margin:14px 0}
.quality-relationship .tg-lines .is-on{stroke-dasharray:7 6;animation:skills-line-flow 1s linear infinite}
.quality-relationship .tg-lines marker[id$="ArrowOn"] path{fill:var(--beam)}
@keyframes skills-line-flow{to{stroke-dashoffset:-26}}
.quality-relationship [data-playing=false] .tg-lines .is-on{animation-play-state:paused}
@media(max-width:760px){.quality-relationship .quality-references,.quality-relationship .quality-ab{grid-template-columns:1fr}.quality-relationship .tg-jump{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.quality-relationship .tg-lines .is-on{animation:none}}
@media print{.quality-relationship .quality-node-copy[hidden]{display:block!important}.quality-relationship .tg-canvas{min-width:0}.quality-relationship .quality-motion{display:none}}
</style>
<script>
(function(){'use strict';function init(){var ch=document.querySelector('#tech-quality-loop');if(!ch||!window.__initTechRelationshipGraph)return;
var host=ch.querySelector('.quality-relationship'),paused=false,visible=false,step=0,cycles=0,last=0;
var media=matchMedia('(prefers-reduced-motion: reduce)');
var summaries=['參考來源提出評估假說；本站仍須以自己的資料與獨立核對確認結果。','Skills規定程序與邊界；通過驗證後須同步到正式Prompt與程式。','程式先核對來源、身分、日期與部位，再依核定事實決定分類。','A/B固定相同原稿、目標日通知與部位；新稿與歷史稿沿用同一分類依據。','AI處理否定、主體、時間及公司歸屬，每個主張附本股引句。','A與B只改一個變因；同題、同模型、同工具，保存失敗與重試。','獨立覆核分辨失敗層，再決定修Skills描述、程序、Prompt或工作流；未見日回歸後才採用。'];
var edges=[['0','1',1],['1','2',2],['1','5',2],['3','2',1],['2','4',1],['3','4',1],['4','5',1],['5','6',1],['6','1',2]];
function copy(k){ch.querySelectorAll('[data-quality-copy]').forEach(function(n){n.hidden=n.dataset.qualityCopy!==String(k);});}
function status(){var running=!paused&&visible&&!document.hidden&&!media.matches;api.graph.dataset.playing=String(running);host.querySelector('[data-quality-pause]').textContent=paused?'繼續圖解':'暫停圖解';return running;}
var api=window.__initTechRelationshipGraph(host,{graph:'#skillsGraph',scroll:'#skillsScroll',canvas:'#skillsCanvas',lines:'#skillsLines',pop:'#skillsEntityDetail',reset:'#skillsGraphReset',prefix:'skills',reservePopup:true,descriptions:summaries,edges:edges,caption:'用途：',upLabel:'上游依據',downLabel:'下游用途',footer:'<div class="tg-rel"><button type="button" data-relationship-more>查看詳細依據 ↓</button></div>',
onFocus:function(k){paused=true;copy(k);ch.querySelector('[data-quality-current-summary]').textContent=summaries[Number(k)];if(api)status();},
onClear:function(){copy(0);},onMore:function(){host.querySelector('.quality-detail').scrollIntoView({block:'start',behavior:media.matches?'auto':'smooth'});host.querySelector('.quality-detail').focus({preventScroll:true});}});
copy(0);api.graph.dataset.cycles='0';
host.querySelector('[data-quality-pause]').addEventListener('click',function(){paused=!paused;status();});
host.querySelector('[data-quality-replay]').addEventListener('click',function(){api.clear();step=0;last=0;paused=false;status();});
api.scroll.addEventListener('keydown',function(e){if(e.target!==api.scroll)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();api.scroll.scrollBy({left:e.key==='ArrowRight'?180:-180,behavior:media.matches?'auto':'smooth'});}});
new IntersectionObserver(function(entries){visible=entries[0].isIntersecting;status();},{threshold:.15}).observe(api.graph);
document.addEventListener('visibilitychange',status);media.addEventListener('change',status);
function loop(t){if(status()&&t-last>1400){last=t;var e=edges.filter(function(x){return x[2]===1;})[step];api.highlight([e[0],e[1]],'',function(x){return x===e;});step++;if(step===6){step=0;cycles++;api.graph.dataset.cycles=String(cycles);}}requestAnimationFrame(loop);}requestAnimationFrame(loop);
var experiments=[
 ['不提供目標Skill','相同任務、工具與資料，建立基準。','提供目前Skill','只增加目標Skill，記錄是否真的載入及採用。','比較任務完成、證據正確、副作用、呼叫與耗用量；不是只看有沒有提到技能名稱。'],
 ['原觸發描述','技能正文不變，保留既有適用範圍。','改寫觸發描述','只調整何時用與何時不用，正文與其他設定相同。','檢查選錯、漏選與實際啟用。這是維護代理的技能選取評估，不是Python每日分類已自動載入Skill。'],
 ['原分類程序','固定現行Prompt、分類依據與停止條件，保存完整輸出。','候選分類程序','只修改一個已確認缺口，例如先列主體、日期與本股歸屬；其餘設定凍結。','新稿與歷史原稿成對比較，記錄誤收、漏收、事實錯誤及變異，再跑未見日期；不把修好的網站當B組答案。']
];
ch.querySelectorAll('[data-quality-experiment]').forEach(function(b){b.addEventListener('click',function(){var r=experiments[Number(b.dataset.qualityExperiment)];['a','a-detail','b','b-detail','metric'].forEach(function(k,i){ch.querySelector('[data-quality-'+k+']').textContent=r[i];});ch.querySelectorAll('[data-quality-experiment]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();})();
</script>
