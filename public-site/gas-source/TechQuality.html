<!-- v192: evidence roles and controlled Skills comparisons; client-only. -->
<style>
.tech-book .quality-references,.tech-book .quality-ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin:32px 0}
.tech-book .quality-references>section,.tech-book .quality-ab>section,.tech-book .quality-measures>section{padding:28px;border:1px solid var(--rule);border-radius:24px;background:var(--panel);min-width:0}
.tech-book .quality-references h3,.tech-book .quality-ab h4{margin-top:0}
.tech-book .quality-source-note{font-size:calc(14px * var(--rd-fs));color:var(--muted);line-height:1.8}
.tech-book .quality-modes,.tech-book .quality-cases{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}
.tech-book :is(.quality-modes,.quality-cases) button{font:inherit;font-size:calc(15px * var(--rd-fs));min-height:48px;border-radius:999px;padding:10px 22px;border:1px solid var(--rule);color:var(--ink);background:var(--panel);cursor:pointer;line-height:1.6}
.tech-book :is(.quality-modes,.quality-cases) button[aria-pressed=true]{background:var(--beam);border-color:var(--beam);color:var(--bg)}
.tech-book .quality-case{padding:28px;border:1px solid var(--rule);border-radius:24px;background:var(--panel-2);margin:24px 0 48px}
.tech-book .quality-case h4{font-size:calc(21px * var(--rd-fs));margin:0 0 16px}
.tech-book .quality-basis{padding-left:26px;margin:28px 0 48px}.tech-book .quality-basis li{padding:12px 0}.tech-book .quality-basis span{display:block;margin-top:8px}
.tech-book .quality-arm{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--beam);color:var(--bg);font-weight:800;margin-bottom:16px}
.tech-book .quality-check{border-left:3px solid var(--beam);padding-left:20px;margin-bottom:48px}
.tech-book .quality-measures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:28px 0 44px}.tech-book .quality-measures p{margin-bottom:0}
@media(max-width:760px){.tech-book :is(.quality-references,.quality-ab,.quality-measures){grid-template-columns:1fr}.tech-book :is(.quality-references>section,.quality-ab>section,.quality-measures>section,.quality-case){padding:22px}}

.tech-book .quality-stage{align-items:start;grid-template-columns:minmax(0,1fr)}
.tech-book .quality-stage .quality-references,.tech-book .quality-stage .quality-ab,.tech-book .quality-stage .quality-measures{gap:20px;margin:24px 0}
.tech-book .quality-stage .quality-references>section{padding:18px}.tech-book .quality-stage .quality-node-copy h3{font-size:calc(21px * var(--rd-fs));line-height:1.55}
.tech-book .quality-stage [data-quality-node]{cursor:pointer;outline:none}.tech-book .quality-stage [data-quality-cross=true]{display:none}
.tech-book .quality-stage .quality-selected .bk-node-bg,.tech-book .quality-stage [data-quality-node]:focus-visible .bk-node-bg{stroke:#bd5934;stroke-width:5}
.tech-book .quality-stage .quality-upstream .bk-node-bg{stroke:#3e7b9a;stroke-width:4}.tech-book .quality-stage .quality-downstream .bk-node-bg{stroke:#26734d;stroke-width:4}
.tech-book .quality-stage .quality-linked{stroke:#bd5934;stroke-width:4}
.tech-book .quality-neighbors{margin:22px 0}.tech-book .quality-neighbor-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.tech-book .quality-neighbor-row>b{font-size:calc(14px * var(--rd-fs));color:var(--muted)}
.tech-book .quality-neighbor-row button,.tech-book [data-quality-reset]{font:inherit;min-height:44px;padding:8px 16px;border:1px solid var(--rule);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer;line-height:1.5}
.tech-book .quality-node-copy[hidden]{display:none}
@media(max-width:1100px){.tech-book .quality-stage .tech-art-pan .book-art{width:1000px;min-width:1000px;max-width:none}}
</style>
<script>
(function(){'use strict';function init(){var ch=document.querySelector('#tech-quality-loop');if(!ch)return;
var stage=ch.querySelector('.quality-stage'),svg=stage.querySelector('svg.book-art'),labels=['參考網站與影片','Skills維護手冊','程式核對','固定原稿與當時資料','AI語意核對','A/B比較','獨立覆核與回歸'];
var summaries=['參考來源提出評估假說；本站仍須以自己的資料與獨立核對確認結果。','Skills規定程序與邊界；通過驗證後須同步到正式Prompt與程式。','程式先核對來源、身分、日期與部位，再依核定事實決定分類。','A/B固定相同原稿、目標日通知與部位；新稿與歷史稿沿用同一分類依據。','AI處理否定、主體、時間及公司歸屬，每個主張附本股引句。','A與B只改一個變因；同題、同模型、同工具，保存失敗與重試。','獨立覆核分辨失敗層，再決定修Skills描述、程序、Prompt或工作流；未見日回歸後才採用。'];
var edges=Array.from(svg.querySelectorAll('[data-quality-edge]')).map(function(p){var ids=p.dataset.qualityEdge.split('-').map(Number);return {p:p,a:ids[0],b:ids[1],cross:p.dataset.qualityCross==='true'};});
function linkButtons(name,ids){var row=document.createElement('div'),title=document.createElement('b');row.className='quality-neighbor-row';title.textContent=name;row.appendChild(title);if(!ids.length){var t=document.createElement('span');t.textContent='無直接節點';row.appendChild(t);}ids.forEach(function(i){var b=document.createElement('button');b.type='button';b.dataset.qualityJump=i;b.textContent=labels[i];b.addEventListener('click',function(){select(i,true,true);});row.appendChild(b);});return row;}
function select(id,manual,panTo){
 var upstream=id===null?[]:edges.filter(function(e){return e.b===id;}).map(function(e){return e.a;}),downstream=id===null?[]:edges.filter(function(e){return e.a===id;}).map(function(e){return e.b;});
 svg.querySelectorAll('[data-quality-node]').forEach(function(g){var i=Number(g.dataset.qualityNode);g.classList.toggle('quality-selected',i===id);g.classList.toggle('quality-upstream',upstream.indexOf(i)>=0);g.classList.toggle('quality-downstream',downstream.indexOf(i)>=0);g.setAttribute('aria-pressed',String(i===id));});
 edges.forEach(function(e){var active=e.a===id||e.b===id;e.p.style.display=e.cross&&!active?'none':'inline';e.p.classList.toggle('quality-linked',active);e.p.style.opacity=id===null?'.65':active?'1':'.18';});
 ch.querySelectorAll('[data-quality-copy]').forEach(function(n){n.hidden=Number(n.dataset.qualityCopy)!==(id===null?0:id);});
 ch.querySelector('[data-quality-current-summary]').textContent=id===null?'點任一圖卡，查看它的用途、分類依據與直接上游／下游。跨欄關係只在相關節點選取時顯示。':summaries[id];
 var nav=ch.querySelector('[data-quality-neighbors]');nav.replaceChildren();if(id!==null){nav.append(linkButtons('上游',upstream),linkButtons('下游',downstream));}
 if(window.__techBookSelectRoutes)window.__techBookSelectRoutes(stage,manual);
 if(panTo&&id!==null){var g=svg.querySelector('[data-quality-node="'+id+'"]'),pan=stage.querySelector('.tech-art-pan');if(pan){var r=g.getBoundingClientRect(),box=pan.getBoundingClientRect();pan.scrollTo({left:pan.scrollLeft+r.x+r.width/2-box.x-box.width/2,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}}
}
svg.querySelectorAll('[data-quality-node]').forEach(function(g){g.addEventListener('click',function(e){e.stopPropagation();select(Number(g.dataset.qualityNode),true,false);});g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();select(Number(g.dataset.qualityNode),true,false);}});});
ch.querySelector('[data-quality-reset]').addEventListener('click',function(){select(null,true,false);});
stage.querySelector('[data-book-replay]').addEventListener('click',function(){select(null,false,false);});
select(null,false,false);
var experiments=[
 ['不提供目標Skill','相同任務、工具與資料，建立基準。','提供目前Skill','只增加目標Skill，記錄是否真的載入及採用。','比較任務完成、證據正確、副作用、呼叫與耗用量；不是只看有沒有提到技能名稱。'],
 ['原觸發描述','技能正文不變，保留既有適用範圍。','改寫觸發描述','只調整何時用與何時不用，正文與其他設定相同。','檢查選錯、漏選與實際啟用。這是維護代理的技能選取評估，不是Python每日分類已自動載入Skill。'],
 ['原分類程序','固定現行Prompt、分類依據與停止條件，保存完整輸出。','候選分類程序','只修改一個已確認缺口，例如先列主體、日期與本股歸屬；其餘設定凍結。','新稿與歷史原稿成對比較，記錄誤收、漏收、事實錯誤及變異，再跑未見日期；不把修好的網站當B組答案。']
];
ch.querySelectorAll('[data-quality-experiment]').forEach(function(b){b.addEventListener('click',function(){var r=experiments[Number(b.dataset.qualityExperiment)];['a','a-detail','b','b-detail','metric'].forEach(function(k,i){ch.querySelector('[data-quality-'+k+']').textContent=r[i];});ch.querySelectorAll('[data-quality-experiment]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();})();
</script>
