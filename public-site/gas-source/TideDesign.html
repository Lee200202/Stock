<script>
(function(){
  'use strict';
  var root=document.documentElement, reduced=matchMedia('(prefers-reduced-motion: reduce)'), paused=reduced.matches;
  function by(id){return document.getElementById(id);}
  function num(value){return value!==null&&value!==undefined&&value!==''&&Number.isFinite(Number(value))?Number(value):null;}
  function rsi(rows,n){
    var out=[],gain=0,loss=0;
    if(rows.length<=n)return out;
    for(var i=1;i<rows.length;i++){
      var a=num(rows[i-1].close),b=num(rows[i].close);if(a===null||b===null)return [];
      var delta=b-a,g=Math.max(0,delta),l=Math.max(0,-delta);
      if(i<=n){gain+=g/n;loss+=l/n;}else{gain=(gain*(n-1)+g)/n;loss=(loss*(n-1)+l)/n;}
      if(i>=n)out.push({date:rows[i].date,value:gain===0&&loss===0?50:loss===0?100:100-100/(1+gain/loss)});
    }return out;
  }
  window.TideMath={rsi:rsi};
  function motion(){root.classList.toggle('tide-paused',paused);document.dispatchEvent(new CustomEvent('tide:motion',{detail:{paused:paused}}));}
  reduced.addEventListener('change',function(){paused=reduced.matches;motion();});motion();
  var tabs=document.querySelector('.tabs');if(tabs){var thumb=document.createElement('span');thumb.className='tide-tab-thumb';thumb.setAttribute('aria-hidden','true');tabs.classList.add('tide-slide');tabs.prepend(thumb);var slide=function(){var on=tabs.querySelector('.tab[aria-selected=true],.tab.active');if(!on){thumb.hidden=true;return;}thumb.hidden=false;thumb.style.width=on.offsetWidth+'px';thumb.style.height=on.offsetHeight+'px';thumb.style.transform='translate('+on.offsetLeft+'px,'+on.offsetTop+'px)';};new MutationObserver(slide).observe(tabs,{subtree:true,attributes:true,attributeFilter:['aria-selected','class']});new ResizeObserver(slide).observe(tabs);slide();}
  document.querySelectorAll('.card,.stat,.trk-card').forEach(function(el){el.classList.add('tide-surface');});
  document.addEventListener('pointermove',function(e){if(e.pointerType==='touch'||paused)return;var el=e.target.closest('.card,.stat,.trk-card');if(!el)return;el.classList.add('tide-surface');var r=el.getBoundingClientRect();el.style.setProperty('--tide-x',(e.clientX-r.left)+'px');el.style.setProperty('--tide-pointer-y',(e.clientY-r.top)+'px');},{passive:true});
  document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||paused||reduced.matches)return;b.style.position=b.style.position||'relative';b.style.overflow='hidden';var wave=document.createElement('i'),rect=b.getBoundingClientRect();wave.className='tide-click-wave';wave.setAttribute('aria-hidden','true');wave.style.setProperty('--ripple-x',(e.clientX-rect.left)+'px');wave.style.setProperty('--ripple-y',(e.clientY-rect.top)+'px');b.append(wave);setTimeout(function(){wave.remove();},700);});
  var busyObserver=new MutationObserver(function(records){records.forEach(function(r){var el=r.target;if(el.nodeType!==1)return;if(el.matches('button'))el.classList.toggle('tide-busy',el.disabled&&/驗證|處理|同步|儲存|查詢|載入/.test(el.textContent));});});
  busyObserver.observe(document.body,{subtree:true,attributes:true,attributeFilter:['disabled']});
  var visible=new IntersectionObserver(function(entries){entries.forEach(function(e){e.target.style.animationPlayState=e.isIntersecting&&!document.hidden&&!paused?'running':'paused';});});
  document.querySelectorAll('.tide-wave,.step.on').forEach(function(e){visible.observe(e);});
  // 保留數字真值，以位移回饋更新；不將現價暫時改成動畫中間值。
  var entrance=new MutationObserver(function(records){records.forEach(function(r){Array.from(r.addedNodes).forEach(function(node){if(node.nodeType!==1||!node.matches('.card,.stat,.trk-card,.amsg,.empty-block'))return;node.classList.add('tide-enter');});});});entrance.observe(document.body,{childList:true,subtree:true});
  var feature=by('tideFeature');if(!feature)return;
  var latest=null;
  function enableTools(ready){document.querySelectorAll('[data-tide-pane],[data-tide-nav]').forEach(function(b){b.disabled=!ready;});}
  enableTools(false);
  function draw(){
    if(!latest)return;
    feature.dataset.code=latest.code;
    enableTools(!!latest.chart&&!!latest.rows.length);
    var tracker=latest.tracker;
    var list=tracker&&tracker.roundList||[],index=latest.round===undefined?list.length-1:latest.round,selected=list[index];
    var picker=by('tideRounds');picker.replaceChildren();
    list.forEach(function(r,i){var button=document.createElement('button');button.type='button';button.textContent='第 '+(i+1)+' 回合 · '+(r.entryDate||r.open||'日期未說明');button.dataset.roundIndex=String(i);button.setAttribute('aria-pressed',String(i===index));button.addEventListener('click',function(){latest.selectRound(i);var active=picker.querySelector('[data-round-index="'+i+'"]');if(active)active.focus({preventScroll:true});});picker.append(button);});
    document.querySelectorAll('[data-tide-pane]').forEach(function(b){var k=b.dataset.tidePane;b.setAttribute('aria-pressed',String(k==='none'?!Object.values(latest.paneState).some(Boolean):!!latest.paneState[k]));});
  }
  document.addEventListener('tide:chart',function(e){latest=e.detail;draw();});
  document.addEventListener('tide:stock-reset',function(){latest=null;enableTools(false);by('tideRounds').replaceChildren();by('tideRsi').hidden=true;by('tideRsiCap').hidden=true;});
  document.querySelectorAll('[data-tide-pane]').forEach(function(b){b.addEventListener('click',function(){if(latest)latest.setPane(b.dataset.tidePane);});});
  document.querySelectorAll('[data-tide-nav]').forEach(function(b){b.addEventListener('click',function(){window.__kNavAt=Date.now();if(!latest)return;var t=latest.chart.timeScale(),r=t.getVisibleLogicalRange();if(!r)return;var size=r.to-r.from,mid=(r.from+r.to)/2,nav=b.dataset.tideNav;if(nav==='left'||nav==='right'){var shift=size*.25*(nav==='left'?-1:1);t.setVisibleLogicalRange({from:r.from+shift,to:r.to+shift});}else{var next=size*(nav==='in'?.75:1.25);t.setVisibleLogicalRange({from:mid-next/2,to:mid+next/2});}});});
  var legend=by('kLegend');if(legend)by('tideParams').append(legend);
  document.querySelectorAll('[data-tide-evidence-link]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var section=by(a.hash.slice(1));if(section)section.scrollIntoView({behavior:reduced.matches?'instant':'smooth',block:'start'});});});
  var readout=by('readout');if(readout)by('dSecK').insertBefore(readout,document.querySelector('.kchart-box'));
  new MutationObserver(function(){if(latest)draw();}).observe(root,{attributes:true,attributeFilter:['data-theme']});
})();
</script>

<script>
(function(){'use strict';function init(){
 var reduced=matchMedia('(prefers-reduced-motion: reduce)'),waves=[],band=document.querySelector('.signalband');
 function animate(el,frames,duration){if(!el||reduced.matches||document.hidden||typeof el.animate!=='function')return;if(el.__polishAnimation)el.__polishAnimation.cancel();el.__polishAnimation=el.animate(frames,{duration:duration,easing:'cubic-bezier(.22,1,.36,1)'});}
 function replay(el,cls,duration){if(!el||reduced.matches||document.hidden)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);clearTimeout(el.__polishTimer);el.__polishTimer=setTimeout(function(){el.classList.remove(cls);},duration);}
 function sync(){var paused=document.hidden||reduced.matches||!!(band&&(band.classList.contains('is-paused')||band.classList.contains('is-held')));waves.forEach(function(el){el.classList.toggle('polish-paused',paused);});}
 var visible=new IntersectionObserver(function(entries){entries.forEach(function(entry){entry.target.classList.toggle('polish-inview',entry.isIntersecting);});},{threshold:.15});
 document.querySelectorAll('.stats .stat,#dSecHold').forEach(function(card){card.classList.add('polish-wave-card');var wave=document.createElement('div');wave.className='polish-wave';wave.setAttribute('aria-hidden','true');wave.innerHTML='<svg viewBox="0 0 1000 100" preserveAspectRatio="none"><path d="M0 35Q125 0 250 35T500 35T750 35T1000 35V100H0Z"/><path d="M0 55Q125 85 250 55T500 55T750 55T1000 55V100H0Z"/></svg>';card.prepend(wave);waves.push(card);visible.observe(card);});
 if(band)new MutationObserver(sync).observe(band,{attributes:true,attributeFilter:['class']});document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',sync);sync();
 // 真實數字直接保留；以位移呈現跳動，不顯示補間後的虛構股價。
 document.querySelectorAll('#stCount,#stHold,#stAvg,#stPos,#dPrice').forEach(function(el){var prior=el.textContent;new MutationObserver(function(){var text=el.textContent;if(text===prior)return;prior=text;if(!/\d/.test(text))return;animate(el,[{transform:'translateY(7px)'},{transform:'translateY(0)'}],650);}).observe(el,{childList:true,characterData:true,subtree:true});});
 document.addEventListener('polish:range-hint',function(){replay(document.querySelector('#periodNote'),'polish-range-flash',900);});
 document.addEventListener('polish:chart-ready',function(){replay(document.querySelector('.kchart-box'),'polish-chart-enter',250);});
 document.addEventListener('polish:row-saved',function(e){replay(e.detail&&e.detail.element,'polish-row-saved',1200);});
 function sticky(){var top=0;document.querySelectorAll('.topbar,.tabbar').forEach(function(el){var style=getComputedStyle(el);if(style.position==='sticky'||style.position==='fixed')top=Math.max(top,(parseFloat(style.top)||0)+el.getBoundingClientRect().height);});document.documentElement.style.setProperty('--polish-sticky-top',Math.max(0,top)+'px');}window.addEventListener('resize',sticky);sticky();
}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();})();
</script>
