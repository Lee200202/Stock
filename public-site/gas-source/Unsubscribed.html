<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 退訂確認頁（v54）。刻意不載入整站樣式與外部字型：手機 Gmail 內建瀏覽器打開時要馬上看得到按鈕。
       打開這一頁不會改任何東西；按下按鈕才停止（先前 GET 直接取消，信件掃描或預先載入會誤觸）。 -->
  <style>
    :root { --bg:#F3F5F2; --card:#FFFFFF; --ink:#12161A; --muted:#5E6962; --line:#D5DBD6; --beam:#04795C; --warn:#8A6410; --bad:#B42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0E1211; --card:#161C1A; --ink:#E3EAE6; --muted:#9AA8A0; --line:#2A3531; --beam:#21C68C; --warn:#DBA544; --bad:#FF6B6B; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    main { max-width:520px; margin:0 auto; padding:32px 16px 48px; }
    .k { font-size:13px; letter-spacing:.08em; color:var(--muted); font-weight:600; }
    h1 { font-size:24px; line-height:1.35; margin:8px 0 12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 16px; }
    p { margin:0 0 12px; }
    .mail { font-weight:600; overflow-wrap:anywhere; }
    .btns { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
    button, a.btn { display:block; width:100%; min-height:48px; border-radius:12px; font:inherit; font-weight:700; cursor:pointer;
      border:1px solid var(--line); background:var(--card); color:var(--ink); text-align:center; text-decoration:none; padding:12px 14px; }
    button.primary { background:var(--beam); border-color:var(--beam); color:#FFFFFF; }
    button:disabled { opacity:.55; cursor:default; }
    button:focus-visible, a.btn:focus-visible { outline:3px solid var(--beam); outline-offset:2px; }
    .msg { margin-top:14px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); display:none; }
    .msg.ok { display:block; border-color:var(--beam); }
    .msg.err { display:block; border-color:var(--bad); color:var(--bad); }
    .home { margin-top:22px; }
  </style>
</head>
<body>
  <main>
    <div class="k"><?= appTitle ?></div>
    <h1 id="title">取消訂閱</h1>
    <div class="card">
      <? if (email && token) { ?>
        <p>要停止寄到 <span class="mail"><?= email ?></span> 的通知嗎？</p>
        <p style="color:var(--muted);font-size:14px">打開這一頁不會改任何設定，按下按鈕才生效，不需要登入。</p>
        <div class="btns">
          <? if (type) { ?>
            <button type="button" class="primary" data-scope="<?= type ?>">只停止「<?= typeLabel ?>」</button>
            <button type="button" data-scope="all">停止所有通知</button>
          <? } else { ?>
            <button type="button" class="primary" data-scope="all">停止所有通知</button>
          <? } ?>
        </div>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <? } else { ?>
        <p>這個連結不完整。請直接從信件最下方的「取消訂閱」打開，或到網站的「訂閱通知」管理。</p>
      <? } ?>
    </div>
    <? if (homeUrl) { ?>
      <div class="home"><a class="btn" href="<?= homeUrl ?>" target="_top">回到網站</a></div>
    <? } ?>
  </main>
  <script>
    (function () {
      var email = <?= email ?>, token = <?= token ?>;  // Apps Script 在 <script> 裡的 <?= ?> 會輸出成 JS 字串字面值
      var msg = document.getElementById('msg');
      var buttons = Array.prototype.slice.call(document.querySelectorAll('button[data-scope]'));
      function done(r) {
        buttons.forEach(function (b) { b.disabled = !!(r && r.ok); });
        msg.className = 'msg ' + (r && r.ok ? 'ok' : 'err');
        msg.textContent = (r && r.message) || '沒有收到回覆，請再按一次。';
        if (r && r.ok) { document.getElementById('title').textContent = r.state === 'partial' ? '已停止這一類通知' : '已取消訂閱'; }
        else { buttons.forEach(function (b) { b.disabled = false; }); }
      }
      buttons.forEach(function (b) {
        b.addEventListener('click', function () {
          buttons.forEach(function (x) { x.disabled = true; });
          msg.className = 'msg ok'; msg.textContent = '處理中…';
          if (!(window.google && google.script && google.script.run)) { done({ ok: false, message: '這個瀏覽器無法送出，請改用系統瀏覽器（Chrome／Safari）打開這個連結。' }); return; }
          google.script.run.withSuccessHandler(done).withFailureHandler(function (e) {
            done({ ok: false, message: '連線失敗（' + (e && e.message ? e.message : '網路中斷') + '），請再按一次。' });
          }).apiUnsubscribeConfirm(email, token, b.getAttribute('data-scope'));
        });
      });
    })();
  </script>
</body>
</html>
