<style>
.visitor-dialog{position:fixed;inset:0;width:100%;height:100dvh;max-width:none;max-height:none;box-sizing:border-box;margin:0;border:0;border-radius:0;padding:0 clamp(16px,4vw,52px) clamp(18px,4vw,52px);background:var(--panel);color:var(--ink);overflow:auto;overscroll-behavior:contain}
.visitor-dialog::backdrop{background:rgba(8,29,25,.58)}
html:has(.visitor-dialog[open]){overflow:hidden}
#visitorFeedback textarea{min-height:clamp(180px,40vh,420px)}
.visitor-dialog h2,.visitor-dialog h3{margin-top:0}.visitor-dialog p{line-height:1.75}.visitor-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(12px,3vw,28px) 0;background:var(--panel);border-bottom:1px solid var(--rule)}.visitor-head h2{margin:0}.visitor-head .act{flex:none}
.visitor-options,.review-timeline-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.visitor-options button,.review-timeline-steps button{text-align:left;min-width:0;white-space:normal}
.visitor-options button[aria-pressed=true],.review-timeline-steps button[aria-pressed=true]{border-color:var(--beam);box-shadow:inset 0 0 0 1px var(--beam);color:var(--beam)}
.review-timeline-detail{border:1px solid var(--rule);border-radius:20px;background:var(--panel-2);padding:18px;margin-top:12px;overflow-wrap:anywhere}
.visitor-dialog textarea{width:100%;min-height:135px;box-sizing:border-box;padding:14px;border:1px solid var(--rule);border-radius:14px;background:var(--panel-2);color:var(--ink);font:inherit;resize:vertical}
.visitor-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.visitor-trap{position:absolute;left:-10000px}.visitor-tools{padding:8px 0 0;border-top:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap}
.review-timeline{margin:22px 0;padding:clamp(16px,3vw,26px);border:1px solid var(--rule);border-radius:24px;background:var(--panel)}
.review-timeline-steps{grid-template-columns:repeat(6,minmax(0,1fr));position:relative}
.review-timeline-steps button{position:relative;display:flex;align-items:flex-start;flex-direction:column;gap:6px}
.review-timeline-steps svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6}.review-timeline-steps small{color:var(--muted);font-weight:normal}
.visitor-options button,.review-timeline-steps button{transition:transform .16s,box-shadow .16s}.visitor-options button:active,.review-timeline-steps button:active{transform:scale(.97)}
@media(max-width:700px){.visitor-options,.review-timeline-steps{grid-template-columns:1fr}.review-timeline-steps button{display:grid;grid-template-columns:26px 1fr;align-items:center}.review-timeline-steps small{grid-column:2}}
@media(prefers-reduced-motion:reduce){.visitor-options button,.review-timeline-steps button{transition:none;transform:none!important}}
.visitor-tour{position:fixed;inset:0;z-index:190;pointer-events:none}
.visitor-tour svg{position:absolute;inset:0;width:100%;height:100%;fill:rgba(8,29,25,.62)}
.visitor-tour-ring{position:absolute;box-sizing:border-box;border:2px solid #56d6ad;border-radius:12px;box-shadow:0 0 0 4px rgba(86,214,173,.35),0 0 22px rgba(86,214,173,.55);animation:visitor-halo 2.4s ease-in-out infinite alternate}
@keyframes visitor-halo{to{box-shadow:0 0 0 7px rgba(86,214,173,.18),0 0 28px rgba(86,214,173,.48)}}
.visitor-coach{position:absolute;inset:auto 0 0;pointer-events:auto;box-sizing:border-box;width:100%;max-height:42dvh;display:flex;flex-direction:column;overflow:hidden;padding:14px clamp(12px,4vw,56px) max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--rule);border-radius:18px 18px 0 0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.visitor-coach h2{font-size:1.15em;margin:4px 0 0;line-height:1.35}
.visitor-coach-head,.visitor-coach-actions,.visitor-feedback-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.visitor-coach-copy{min-height:0;overflow:auto;overscroll-behavior:contain}
.visitor-coach-copy p{margin:8px 0;line-height:1.55}
.visitor-coach-tip{padding:8px 10px;border-radius:10px;background:var(--panel-2)}
.visitor-coach .act,.visitor-tools .act,.visitor-detail-actions .act{padding:7px 12px;min-height:36px}
.visitor-context,.visitor-stock-choices{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.visitor-coach-jump{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;margin-block:8px}
.visitor-coach-jump label,.visitor-count,.visitor-context{color:var(--muted);font-size:.88em}
.visitor-coach select,#visitorFeedback :is(input,select):not(.visitor-trap input){max-width:100%;padding:7px;border:1px solid var(--rule);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.visitor-coach .visitor-coach-expand{display:none}
body:has(#detail.open) .visitor-tour{visibility:hidden}
.visitor-context span{border:1px solid var(--rule);border-radius:999px;padding:5px 10px;background:var(--panel-2)}
.visitor-feedback-fields{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:12px 0}
.visitor-feedback-fields label{display:grid;gap:4px;flex:1 1 180px;min-width:0}
.visitor-feedback-fields input,.visitor-feedback-fields select{box-sizing:border-box;width:100%}
.visitor-feedback-actions .visitor-actions{margin:0 0 0 auto}
.visitor-feedback-actions p{margin:0}
.visitor-stock-choices{margin-bottom:10px}
#trackerJumpStatus:empty{display:none}
.visitor-detail-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.visitor-coach :focus-visible,.visitor-dialog :focus-visible{outline:2px solid var(--beam);outline-offset:2px}
@media(max-width:900px){body[data-tab] .topbar-in{flex-wrap:nowrap;gap:8px}body[data-tab] .topbar .brand-sub{display:none}}
@media(max-width:900px),(max-height:740px){
  .visitor-coach .visitor-coach-expand{display:inline-block}
  .visitor-coach:not([data-expanded]) .visitor-coach-copy{display:none}
  .visitor-coach-head{flex-wrap:nowrap;align-items:start}
  .visitor-coach-actions{justify-content:flex-start;margin-top:6px}
}
@media(prefers-reduced-motion:reduce){.visitor-tour-ring{animation:none}}
</style>

<div class="visitor-tour" id="visitorTour" hidden>
  <svg aria-hidden="true"><path id="visitorTourShade" fill-rule="evenodd"></path></svg>
  <div class="visitor-tour-ring" id="visitorTourRing" aria-hidden="true"></div>
  <section class="visitor-coach" id="visitorCoach" aria-labelledby="visitorTourTitle">
    <div class="visitor-coach-head">
      <div><span id="visitorTourStep" aria-live="polite"></span><h2 id="visitorTourTitle" tabindex="-1"></h2></div>
      <button type="button" class="act ghost" id="visitorTourClose">關閉</button>
    </div>
    <div class="visitor-coach-copy" id="visitorTourCopy">
      <p id="visitorTourText"></p>
      <p class="visitor-coach-tip" id="visitorTourTip"></p>
      <button type="button" class="act ghost" id="visitorTourFeedback">意見回饋</button>
    </div>
    <div class="visitor-coach-jump">
      <label for="visitorTourJump">直接跳到</label>
      <select id="visitorTourJump" data-native-select="true"></select>
    </div>
    <div class="visitor-coach-actions">
      <button type="button" class="act ghost" id="visitorTourPrev">上一步</button>
      <button type="button" class="act" id="visitorTourNext">下一步</button>
      <button type="button" class="act ghost visitor-coach-expand" id="visitorTourExpand" aria-expanded="false" aria-controls="visitorTourCopy">查看提示</button>
    </div>
  </section>
</div>

<dialog class="visitor-dialog" id="visitorFeedback" aria-labelledby="visitorFeedbackTitle">
  <div class="visitor-head"><h2 id="visitorFeedbackTitle">意見回饋</h2><button type="button" class="act ghost" data-feedback-close>關閉</button></div>
  <p>告訴我們您遇到的問題或想改善的功能。請避免填入信箱、電話或密碼。</p>
  <div class="visitor-context" id="visitorFeedbackContext" aria-label="隨回饋附上的畫面資訊"></div>
  <form id="visitorFeedbackForm">
    <div class="visitor-options" role="group" aria-label="回饋分類">
      <button type="button" class="act ghost" aria-pressed="true" data-feedback-kind="操作問題">操作問題</button>
      <button type="button" class="act ghost" aria-pressed="false" data-feedback-kind="內容更正">內容更正</button>
      <button type="button" class="act ghost" aria-pressed="false" data-feedback-kind="功能建議">功能建議</button>
    </div>
    <div id="visitorCorrection" hidden>
      <div class="visitor-feedback-fields">
        <label for="visitorStockCode">股票代號（選填）
          <input id="visitorStockCode" type="text" maxlength="6" pattern="(?:00981A|[0-9]{4,6})" placeholder="例如 2330">
        </label>
        <label for="visitorIssue">更正項目
          <select id="visitorIssue" data-native-select="true">
            <option value="">請選擇（選填）</option>
            <option>分類方向有誤</option><option>價位或數字有誤</option><option>語音同音錯字</option>
            <option>跨股借句</option><option>其他內容補充</option>
          </select>
        </label>
      </div>
      <div id="visitorStockChoices" class="visitor-stock-choices" role="group" aria-label="該日已列個股"></div>
    </div>
    <label for="visitorFeedbackText">回饋內容</label>
    <span id="visitorFeedbackCount" class="visitor-count">0 / 1,000 字</span>
    <textarea id="visitorFeedbackText" maxlength="1000" aria-describedby="visitorFeedbackCount" placeholder="例如，手機版的持股追蹤找不到日期篩選。"></textarea>
    <div class="visitor-trap" aria-hidden="true"><input id="visitorWebsite" tabindex="-1" autocomplete="off" aria-label="請保留空白"></div>
    <div class="visitor-feedback-actions">
      <p class="visitor-count">附上分頁、畫面日期、主題與視窗尺寸。</p>
      <div class="visitor-actions">
        <button type="button" class="act ghost" data-feedback-close>取消</button>
        <button type="submit" class="act" id="visitorSendFeedback">提交回饋</button>
      </div>
    </div>
    <p id="visitorFeedbackStatus" role="status" aria-live="polite"></p>
  </form>
  <details id="visitorFeedbackHistory" hidden><summary>此瀏覽器的近期收件紀錄</summary><ul></ul></details>
</dialog>

      <button class="act ghost" type="button" data-review-step="5" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM8 9h8m-8 3h5"/></svg><b>管理者裁示回流</b><small>LINE 確認後送雲端</small></button>
    </div>
    <div class="review-timeline-detail" aria-live="polite"><h4></h4><p></p></div>
    <div class="book-motion"><button type="button" class="act ghost" data-review-play>播放流程</button></div>
  </section>
</template>

<script>
(function(){
  'use strict';
  function byId(id) { return document.getElementById(id); }
  var feedback = byId('visitorFeedback');
  var menu = byId('setMenu');
  var gear = byId('setBtn');
  var tour = byId('visitorTour');
  var coach = byId('visitorCoach');
  var jump = byId('visitorTourJump');
  var next = byId('visitorTourNext');
  var previous = byId('visitorTourPrev');
  var expand = byId('visitorTourExpand');
  var compact = matchMedia('(max-width:900px),(max-height:740px)');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)');
  var guideKey = 'zzVisitorGuideSeenV1';
  var route = [
    ['overview','每日總覽','當日日期',['#heroDate','#ledger'],'先確認顯示日期，再看盤勢與教學重點。想回看其他交易日，可以使用每日總覽下方的日曆。'],
    ['overview','每日總覽','個股分類',['#p-overview .sk-row[data-code] .sk-name','#ledger'],'從買賣、持股與觀望分類找到個股。點股名可打開明細，查看追蹤或回報更正。'],
    ['tracker','持股追蹤','切換持有狀態',['#trackerToggle button','button.tab[data-tab=tracker]'],'切換「持有」或「已出場」查看追蹤回合。選擇個股可看進出場紀錄與圖表。'],
    ['perf','績效走勢','選擇績效區間',['#perfRange [aria-pressed=true]','#perfRange'],'切換近 10、30、60 或 120 日等區間。圖上可看平均報酬、正報酬比例或持有檔數。'],
    ['subscribe','訂閱通知','管理訂閱',['#subEmail','#p-subscribe .sect'],'填入收信信箱可訂閱每日總覽。要查看、調整或取消，請使用同頁的訂閱管理。'],
    ['mail','郵件查詢','查閱每日整理',['#calGrid [data-date]:not([disabled])','#calNext'],'點有標記的日期查看當日整理與寄送狀態。'],
    ['tx','逐字稿','查閱逐字稿',['#txCalGrid [data-date]:not([disabled])','#txCalNext'],'選擇有逐字稿的日期。載入後可透過主題目錄找到想查閱的段落。'],
    ['tech','技術說明','查看整理與核對方法',['button.tab[data-tab=tech]'],'在技術說明查找逐字稿、分類、績效與複核規則。'],
    ['overview','版面設定','調整版面或提供意見',['#setBtn'],'點右上角齒輪可調整版面、重開新手教學或提供意見回饋。']
  ];
  var pages = {overview:'每日總覽',tracker:'持股追蹤',perf:'績效走勢',subscribe:'訂閱通知',mail:'郵件查詢',tx:'逐字稿',tech:'技術說明',stock:'個股查詢'};
  var feedbackKind = '操作問題';
  var feedbackContext;
  var feedbackOrigin;
  var tourOrigin;
  var tourIndex = 0;
  var frame = 0;
  var following;
  var tourObserver = new ResizeObserver(queueSpotlight);

  function button(text, action) {
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'act ghost';
    el.textContent = text;
    el.addEventListener('click', action);
    return el;
  }
  function visible(element) {
    return element && element.getClientRects().length && element.getBoundingClientRect().height > 0;
  }
  function selectedPage() {
    return document.querySelector('button.tab[aria-selected=true]')?.dataset.tab ||
      (visible(byId('p-stock')) ? 'stock' : 'overview');
  }
  function closeSettings() {
    if (menu && !menu.hidden) gear.click();
  }
  function returnFocus(origin) {
    (visible(origin) ? origin : gear)?.focus({preventScroll:true});
  }
  function focusSubscription() {
    var target = byId('manage-subscription');
    if (!target) return;
    target.focus({preventScroll:true});
    target.scrollIntoView({block:'center'});
  }

  route.forEach(function (step, index) {
    var item = new Option((index + 1) + '　' + step[1] + ' · ' + step[2], index);
    jump.add(item);
  });

  function targetForStep() {
    var step = route[tourIndex];
    return step[3].map(function (selector) { return document.querySelector(selector); }).find(visible) ||
      document.querySelector('button.tab[data-tab="' + step[0] + '"]');
  }
  function queueSpotlight() {
    if (tour.hidden || frame) return;
    frame = requestAnimationFrame(function () {
      frame = 0;
      if (!tour.hidden) positionSpotlight();
    });
  }
  function fixedHeaderBottom() {
    var bar = document.querySelector('.tabbar');
    return Math.max(0, bar?.getBoundingClientRect().bottom || 0);
  }
  function positionSpotlight() {
    var target = targetForStep();
    if (!visible(target)) return;
    if (following !== target) {
      if (following) tourObserver.unobserve(following);
      following = target;
      tourObserver.observe(target);
      bringTargetIntoView();
    }
    var rect = target.getBoundingClientRect();
    var width = document.documentElement.clientWidth;
    var height = window.innerHeight;
    var topLimit = target.closest('.topbar,.tabbar') ? 0 : fixedHeaderBottom();
    var left = Math.max(0, rect.left - 5);
    var top = Math.max(topLimit, rect.top - 5);
    var right = Math.min(width, rect.right + 5);
    var roomBelow = Math.min(height, coach.getBoundingClientRect().top - 8);
    var bottom = Math.min(roomBelow, rect.bottom + 5);
    var ring = byId('visitorTourRing');
    var shade = 'M0 0H' + width + 'V' + height + 'H0Z';
    ring.hidden = right <= left || bottom <= top;
    if (!ring.hidden) {
      var radius = Math.min(12, (right-left)/2, (bottom-top)/2);
      shade += ' M' + (left+radius) + ' ' + top + 'H' + (right-radius) +
        'Q' + right + ' ' + top + ' ' + right + ' ' + (top+radius) + 'V' + (bottom-radius) +
        'Q' + right + ' ' + bottom + ' ' + (right-radius) + ' ' + bottom + 'H' + (left+radius) +
        'Q' + left + ' ' + bottom + ' ' + left + ' ' + (bottom-radius) + 'V' + (top+radius) +
        'Q' + left + ' ' + top + ' ' + (left+radius) + ' ' + top + 'Z';
      Object.assign(ring.style, {left:left+'px',top:top+'px',width:(right-left)+'px',height:(bottom-top)+'px'});
    }
    byId('visitorTourShade').setAttribute('d', shade);
  }
  function bringTargetIntoView() {
    var target = targetForStep();
    if (!visible(target) || target.closest('.topbar,.tabbar')) return;
    var rect = target.getBoundingClientRect();
    var top = fixedHeaderBottom() + 12;
    var bottom = coach.getBoundingClientRect().top - 12;
    if (bottom <= top || (rect.top >= top && rect.bottom <= bottom)) return;
    var destination = top + Math.max(0,(bottom-top-Math.min(rect.height, bottom-top))/2);
    window.scrollBy({top:rect.top-destination, behavior:compact.matches || reduced.matches ? 'instant' : 'smooth'});
  }
  function showStep(index) {
    tourIndex = index;
    var step = route[index];
    var tab = document.querySelector('button.tab[data-tab="' + step[0] + '"]');
    if (tab && tab.getAttribute('aria-selected') !== 'true') tab.click();
    if (index === route.length-1) window.scrollTo({top:0,behavior:'instant'});
    byId('visitorTourStep').textContent = (index+1) + ' / ' + route.length + '　' + step[1];
    byId('visitorTourTitle').textContent = step[2];
    byId('visitorTourText').textContent = step[4];
    byId('visitorTourTip').textContent = index === route.length-1
      ? '您可以直接點齒輪試試。' : '聚光區內的網站控制項可以直接操作。';
    jump.value = index;
    previous.setAttribute('aria-disabled', String(index === 0));
    next.textContent = index === route.length-1 ? '完成導覽' : '下一步';
    bringTargetIntoView();
    positionSpotlight();
    queueSpotlight();
  }
  function showGuide() {
    tourOrigin = menu && !menu.hidden ? gear : document.activeElement;
    closeSettings();
    try { localStorage.setItem(guideKey,'1'); } catch (error) {}
    tour.hidden = false;
    coach.removeAttribute('data-expanded');
    expand.setAttribute('aria-expanded','false');
    expand.textContent = '查看提示';
    tourObserver.observe(coach);
    tourObserver.observe(document.body);
    showStep(0);
    byId('visitorTourTitle').focus({preventScroll:true});
  }
  function endGuide(restoreFocus) {
    if (tour.hidden) return;
    tour.hidden = true;
    tourObserver.disconnect();
    following = null;
    if (restoreFocus !== false) returnFocus(tourOrigin === document.body ? gear : tourOrigin);
  }
  function advance() {
    if (tourIndex + 1 === route.length) endGuide();
    else showStep(tourIndex + 1);
  }
  previous.addEventListener('click',function () { if (tourIndex) showStep(tourIndex-1); });
  next.addEventListener('click',advance);
  jump.addEventListener('change',function () { showStep(Number(jump.value)); });
  byId('visitorTourClose').addEventListener('click',function () { endGuide(); });
  expand.addEventListener('click',function () {
    var expanded = coach.toggleAttribute('data-expanded');
    expand.setAttribute('aria-expanded',String(expanded));
    expand.textContent = expanded ? '收合提示' : '查看提示';
    requestAnimationFrame(bringTargetIntoView);
  });
  window.addEventListener('resize',queueSpotlight);
  window.addEventListener('scroll',queueSpotlight,{passive:true});
  document.addEventListener('animationend',queueSpotlight);
  document.addEventListener('keydown',function (event) {
    if (tour.hidden || feedback.open || document.querySelector('#detail.open,#p-assistant.open') ||
        (menu && !menu.hidden) || event.defaultPrevented || event.altKey || event.ctrlKey ||
        event.metaKey || event.target.closest?.('input,textarea,select,[contenteditable=true],#setMenu')) return;
    if (event.key === 'Escape') { event.preventDefault(); endGuide(); }
    if (event.key === 'ArrowRight' && tourIndex < route.length-1) { event.preventDefault(); advance(); }
    if (event.key === 'ArrowLeft' && tourIndex) { event.preventDefault(); showStep(tourIndex-1); }
  });
  document.querySelectorAll('button.tab,#stockTabBtn').forEach(function (tab) {
    tab.addEventListener('click',function (event) { if (event.isTrusted) endGuide(false); });
  });

  var formText = byId('visitorFeedbackText');
  var stockInput = byId('visitorStockCode');
  var issueSelect = byId('visitorIssue');
  var status = byId('visitorFeedbackStatus');
  var historyKey = 'zzVisitorFeedbackReceipts';
  var stockCodePattern = /^(?:00981A|\d{4,6})$/;
  var prompts = {
    操作問題:'例如，手機版的持股追蹤找不到日期篩選。',
    內容更正:'請指出要更正的位置，並補上您看到的原文或正確數字。',
    功能建議:'例如，希望從個股紀錄直接跳到逐字稿相關段落。'
  };

  function dateAt(element) {
    return (element?.dataset.feedbackDate || '').replace(/\//g,'-');
  }
  function historicalInView() {
    var result = byId('dateResult');
    if (!dateAt(result)) return false;
    var rect = result.getBoundingClientRect();
    return rect.bottom > fixedHeaderBottom() && rect.top < innerHeight;
  }
  function reportContext(code, date, source) {
    var page = selectedPage();
    var history = source === 'history' || (!source && page === 'overview' && historicalInView());
    var latest = ['tblBuy','tblSell','tblWatchAvoid','tblWatchWatch'].map(byId);
    var scope = page === 'overview' ? (history ? [byId('dateResult')] : latest) : [];
    var dateElements = {overview:history ? byId('dateResult') : byId('heroDate'),mail:byId('mailBody'),tx:byId('txResult')};
    return {page:page,viewingDate:date ? date.replace(/\//g,'-') : dateAt(dateElements[page]),
      theme:document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light',
      viewport:innerWidth + 'x' + innerHeight,
      stockCode:code || '', scope:scope};
  }
  function setFeedbackKind(kind) {
    feedbackKind = kind;
    feedback.querySelectorAll('[data-feedback-kind]').forEach(function (item) {
      item.setAttribute('aria-pressed',String(item.dataset.feedbackKind === kind));
    });
    var correction = kind === '內容更正';
    byId('visitorCorrection').hidden = !correction;
    stockInput.disabled = issueSelect.disabled = !correction;
    formText.placeholder = prompts[kind];
  }
  function showStockChoices(scope) {
    var choices = byId('visitorStockChoices');
    var used = new Set();
    choices.replaceChildren();
    scope.filter(Boolean).forEach(function (section) {
      section.querySelectorAll('.sk-row[data-code]').forEach(function (row) {
        var code = row.dataset.code;
        if (!stockCodePattern.test(code) || used.has(code)) return;
        used.add(code);
        var label = row.querySelector('.sk-name')?.textContent.trim();
        choices.append(button(code + (label ? ' ' + label : ''),function () {
          stockInput.value = code;
          stockInput.focus();
        }));
      });
    });
    choices.hidden = !choices.childElementCount;
  }
  function readHistory() {
    try {
      var values = JSON.parse(localStorage.getItem(historyKey) || '[]');
      return Array.isArray(values) ? values.slice(0,5).filter(function (entry) {
        return entry && typeof entry.receipt === 'string' && typeof entry.at === 'number' &&
          Object.hasOwn(pages,entry.page) && Object.hasOwn(prompts,entry.kind);
      }) : [];
    } catch (error) { return []; }
  }
  function showHistory() {
    var history = byId('visitorFeedbackHistory');
    var list = history.querySelector('ul');
    list.replaceChildren();
    readHistory().forEach(function (entry) {
      var row = document.createElement('li');
      row.textContent = new Date(entry.at).toLocaleString('zh-TW') + '　' + pages[entry.page] +
        '　' + entry.kind + (entry.receipt ? '　' + entry.receipt : '');
      list.append(row);
    });
    history.hidden = !list.childElementCount;
  }
  function showFeedback(code, date, source) {
    if (feedback.open) return;
    feedbackOrigin = !tour.hidden ? tourOrigin : (menu && !menu.hidden ? gear : document.activeElement);
    feedbackContext = reportContext(code,date,source);
    closeSettings();
    endGuide(false);
    var context = byId('visitorFeedbackContext');
    context.replaceChildren();
    [pages[feedbackContext.page], feedbackContext.viewingDate, feedbackContext.theme === 'dark' ? '深色' : '淺色',
      feedbackContext.viewport].filter(Boolean).forEach(function (label) {
      var chip = document.createElement('span');
      chip.textContent = label;
      context.append(chip);
    });
    if (code) {
      stockInput.value = code;
      issueSelect.value = '';
      setFeedbackKind('內容更正');
    } else {
      stockInput.value = '';
      issueSelect.value = '';
      setFeedbackKind('操作問題');
    }
    showStockChoices(feedbackContext.scope);
    showHistory();
    feedback.showModal();
    formText.focus({preventScroll:true});
  }
  if (menu) {
    var tools = document.createElement('div');
    tools.className = 'visitor-tools';
    tools.append(button('新手教學',showGuide),button('意見回饋',function () { showFeedback(); }));
    menu.append(tools);
  }
  byId('visitorTourFeedback').addEventListener('click',function () { showFeedback(); });
  feedback.querySelectorAll('[data-feedback-close]').forEach(function (el) {
    el.addEventListener('click',function () { feedback.close(); });
  });
  feedback.addEventListener('close',function () { returnFocus(feedbackOrigin); });
  feedback.querySelectorAll('[data-feedback-kind]').forEach(function (el) {
    el.addEventListener('click',function () { setFeedbackKind(el.dataset.feedbackKind); });
  });
  function updateCount() { byId('visitorFeedbackCount').textContent = formText.value.length + ' / 1,000 字'; }
  formText.addEventListener('input',updateCount);
  byId('detailFeedback')?.addEventListener('click',function () {
    var detail = byId('detail');
    showFeedback(detail.dataset.code, detail.dataset.feedbackDate,detail.dataset.feedbackSource);
  });
  byId('visitorFeedbackForm').addEventListener('submit',function (event) {
    event.preventDefault();
    var submit = byId('visitorSendFeedback');
    if (submit.disabled) return;
    var message = formText.value.trim();
    if (message.length < 8 || message.length > 1000) {
      status.textContent = '請輸入 8 至 1,000 字。';
      formText.focus();
      return;
    }
    var payload = {kind:feedbackKind,page:feedbackContext.page,message:message,
      website:byId('visitorWebsite').value,viewingDate:feedbackContext.viewingDate,
      theme:feedbackContext.theme,viewport:feedbackContext.viewport};
    if (feedbackKind === '內容更正') {
      payload.stockCode = stockInput.value.trim();
      payload.issue = issueSelect.value;
    }
    submit.disabled = true;
    status.textContent = '正在提交…';
    google.script.run.withSuccessHandler(function (result) {
      submit.disabled = false;
      if (!result?.ok) {
        status.textContent = result?.message || '目前無法提交，內容已保留。';
        return;
      }
      status.textContent = result.receipt ? '已收到回饋。收件編號 ' + result.receipt : '已收到回饋，謝謝您。';
      if (formText.value.trim() === message) { formText.value = ''; updateCount(); }
      if (!result.duplicate) {
        var entries = readHistory();
        entries.unshift({receipt:result.receipt || '',at:Date.now(),page:payload.page,kind:payload.kind});
        try { localStorage.setItem(historyKey,JSON.stringify(entries.slice(0,5))); } catch (error) {}
      }
      showHistory();
    }).withFailureHandler(function () {
      submit.disabled = false;
      status.textContent = '回饋服務暫時無法使用，內容已保留。';
    }).apiSubmitFeedback(payload);
  });

  var chapter = document.getElementById('tech-review-records');
  if (chapter) {
    var fragment = document.getElementById('claudeReviewTimeline').content.cloneNode(true);
    var timeline = fragment.querySelector('.review-timeline');
    chapter.querySelector('.book-heading').after(fragment);
    var steps = Array.from(timeline.querySelectorAll('[data-review-step]'));
    var detail = timeline.querySelector('.review-timeline-detail');
    var play = timeline.querySelector('[data-review-play]');
    var current = 0;
    var timer;
    var copy = [
      ['先產出可供查閱的內容','原流程完成取稿、分類、說明與發布，網站先呈現當日整理。Claude 複核使用當日原稿、當時部位及已上站的內容作為不同來源。'],
      ['啟動後確認當日資料是否齊全','排程設定在台北時間 11:40 啟動。原稿或整理尚未齊全時按流程等候，最多檢查到 12:40。休市或沒有影片則記錄原因。'],
      ['先保存自己的判讀，再找差異','Claude 先依原稿獨立分類並保存結果，再和網站逐檔比較。差異分成明確錯誤、待確認、分類邊界及複核誤判，每項保留原句與處置理由。'],
      ['修正計畫經發布流程核對','有明確證據的項目才產生修正計畫。GitHub 先預覽、核對原文與待修資料是否變動，再套用並讀回。證據不足或資料已變動會留待確認。'],
      ['寄送進度與網站修正分開記錄','整理信依寄送條件與帳本處理。若複核或套用仍在進行，複核暫緩最多到 13:00，其他寄送條件仍照常核對。已寄的信件保留當時內容，後續網站修正另留紀錄。'],
      ['管理者的回覆由雲端核對後套用','複核需要管理者決定的項目會傳到管理者的 LINE。管理者回覆單檔裁示或一般指示，在確認卡按「確認送出」後寫入複核紀錄，觸發雲端排程。Claude 先回原稿逐句核對：可改網站的依發布流程預覽後由 GitHub 套用並讀回，複核判定直接更新紀錄，通用規則留給每週檢討；接手與結果都回報到 LINE。與原稿不符時以原稿為準並說明差異。']
    ];
    function select(index) {
      current = index;
      steps.forEach(function(step,i){step.setAttribute('aria-pressed',String(i === index));});
      detail.querySelector('h4').textContent = copy[index][0];
      detail.querySelector('p').textContent = copy[index][1];
    }
    function stop() { clearInterval(timer); timer = null; play.textContent = '播放流程'; }
    steps.forEach(function(step,index){ step.addEventListener('click',function(){stop();select(index);}); });
    play.addEventListener('click',function(){
      if (timer) {stop();return;}
      select(0);
      play.textContent = '暫停流程';
      timer = setInterval(function(){if (document.hidden || current === steps.length-1) stop();else select(current+1);},2600);
    });
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) play.hidden = true;
    if ('IntersectionObserver' in window) new IntersectionObserver(function(entries){ if (!entries[0].isIntersecting) stop(); }).observe(timeline);
    select(0);
  }
  if (location.hash === '#manage-subscription') requestAnimationFrame(focusSubscription);
  var seen = false;
  try { seen = localStorage.getItem(guideKey) === '1'; } catch (error) {}
  var query = new URLSearchParams(location.search);
  if (query.get('guide') === '1' || (!seen && !document.body.dataset.tab && !location.search && !location.hash)) {
    window.addEventListener('load',showGuide,{once:true});
  }
})();
</script>
